name: Kesim Sayaci render

# KESIM SAYACI: Blender (Cycles CPU) GitHub Actions'ta (Masaustu CLAUDE.md md. 9). Hizli mod (TALIMATLAR md. 1).
# Kareler parcalara serpistirilir (her parca her turdan esit kare -> dengeli sure), yazi katmani her parcada
# paralel calisir, JPEG cikar; birlestir yalniz videoyu kodlar ve artifact'e yalniz video koyar.
# istek.json: {"plan": "...json", "mod": "probe"|"full", "kareler": "61,151", "parca": 20, "ornek": 6, "yuzde": 50}

on:
  push:
    branches: [kesim-sayaci]
    paths: [istek.json]
  workflow_dispatch:

jobs:
  hazirlik:
    runs-on: ubuntu-latest
    outputs:
      matris: ${{ steps.m.outputs.matris }}
      plan: ${{ steps.m.outputs.plan }}
      ornek: ${{ steps.m.outputs.ornek }}
      mod: ${{ steps.m.outputs.mod }}
      yuzde: ${{ steps.m.outputs.yuzde }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          i = json.load(open("istek.json"))
          p = json.load(open(i["plan"]))
          if i["mod"] == "probe":
              mat = [{"ad": "probe", "arg": "--kareler " + i["kareler"]}]
          elif i["mod"] == "kesit":
              n = int(i.get("parca", 20)); b0, b1 = int(i["bas_kare"]), int(i["son_kare"])
              mat = [{"ad": f"k{j:02d}", "arg": f"--bas {b0+j} --son {b1} --adim {n}"} for j in range(n)]
          else:
              n = int(i.get("parca", 20))
              mat = [{"ad": f"p{j:02d}", "arg": f"--bas {j+1} --son {p['kare']} --adim {n}"} for j in range(n)]
          print("matris=" + json.dumps({"include": mat}))
          print("plan=" + i["plan"]); print("ornek=" + str(i.get("ornek", 6))); print("mod=" + i["mod"])
          print("yuzde=" + str(i.get("yuzde", 50)))
          EOF

  render:
    needs: hazirlik
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.hazirlik.outputs.matris) }}
    steps:
      - uses: actions/checkout@v4
      - name: Blender onbellek
        id: bc
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3-linux-x64
      - name: Blender indir (4.2.3 LTS)
        if: steps.bc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender && cd ~/blender
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz --strip-components=1 && rm b.tar.xz
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 && pip install -q pillow
      - name: Render
        run: |
          set -o pipefail
          ~/blender/blender -b --factory-startup -noaudio -P sahne.py -- --plan "${{ needs.hazirlik.outputs.plan }}" \
            --cikti cikti --ornek ${{ needs.hazirlik.outputs.ornek }} --yuzde ${{ needs.hazirlik.outputs.yuzde }} ${{ matrix.arg }} 2>&1 | grep -E "KARE|tur [0-9]|Error|Traceback|rror:" | tail -n 400
          ls cikti | wc -l
      - name: Yazi katmani (paralel)
        run: python3 hud.py --plan "${{ needs.hazirlik.outputs.plan }}" --giris cikti --cikis hud --jpg | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: kare-${{ matrix.ad }}
          path: hud/
          retention-days: 3

  birlestir:
    needs: [hazirlik, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kare-*
          path: hud
          merge-multiple: true
      - name: Video (sessiz)
        if: needs.hazirlik.outputs.mod != 'probe'
        run: |
          sudo apt-get install -y -qq ffmpeg
          mkdir -p video
          B=$(ls hud | sort | head -1 | tr -dc '0-9' | sed 's/^0*//')
          ffmpeg -v error -framerate 30 -start_number $B -i hud/kare_%04d.jpg -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p video/sessiz.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 video/sessiz.mp4
      - name: Probe kareleri
        if: needs.hazirlik.outputs.mod == 'probe'
        run: mkdir -p video && cp hud/*.jpg video/
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ needs.hazirlik.outputs.mod }}
          path: video/
          retention-days: 14
