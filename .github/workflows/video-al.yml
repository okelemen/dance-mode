name: Kesim Sayaci video al
on:
  push:
    branches: [kesim-sayaci]
    paths: [video-al.txt]
jobs:
  al:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: echo "RUN=$(cat video-al.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: sonuc-full
          path: s
          run-id: ${{ env.RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: s/video/sessiz.mp4
