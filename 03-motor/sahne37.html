function yaziK(metin, x, y, px, dolgu, alfa = 1, kontur = KON, isilti = null, ctx = cx) {
  if (alfa <= 0.01) return;
  ctx.save(); ctx.globalAlpha = kisit(alfa, 0, 1);

  ctx.lineWidth = px * 0.2; ctx.strokeStyle = kontur; ctx.strokeText(metin, x, y + px * 0.05);
  if (Array.isArray(dolgu)) {
    const g = ctx.createLinearGradient(0, y - px * 0.5, 0, y + px * 0.5);
    dolgu.forEach((c, i) => g.addColorStop(i / (dolgu.length - 1), c));

}

function karakterCiz(d, u, t) {                               // motor 24: iki karakter ayni genis karede, birlikte ikili poz

  for (let i = 0; i < OY.length; i++) {

    else if (u < Z.kart) isaret = 0;

    const i = isaret > 0 ? 1 : 0, ox = xm + isaret * 170 * k, oy = y0 + px * 0.45;
    cx.save(); cx.fillStyle = RENK[i]; cx.strokeStyle = '#ffffff'; cx.lineWidth = 6 * k; cx.translate(ox + Math.sin(t * 8) * 8 * k * isaret, oy);
    cx.scale(isaret, 1); cx.beginPath(); cx.moveTo(-30 * k, -26 * k); cx.lineTo(30 * k, 0); cx.lineTo(-30 * k, 26 * k); cx.closePath(); cx.fill(); cx.stroke(); cx.restore();
  }
}
