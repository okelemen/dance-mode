<meta charset="utf-8">
<title>TETRIS MODE PVP - motor 4</title>
<style>
  html,body { margin:0; background:#040824; overflow:hidden; }
  canvas { display:block; }
</style>
<canvas id="cikti"></canvas>

<script type="module">
// =====================================================================
// MOTOR 4 — TETRIS MODE PVP (1v1). Kural kaynağı: REF-053 (Glow Motion "HUMAN TETRIS PVP BATTLE #3"),
// Masaüstü/POZ-DUVARI/TALIMATLAR.md, Masaüstü CLAUDE.md md. 22 (referansta ne görülüyorsa o).
// Kullanıcı (17 Eki 2026): "konsept aynı olsun, renkleri değiştir ... benzemesin ... zararlı gördüklerini çıkar".
//
// Referansın yapısı: ekran ikiye bölünmüş, her oyuncunun KENDİ şeridi (jöle yol + kafes kapı); sabit kamera.
// Duvar = parlak jöle panel, poz panelde OYUK (içinden arkası görünür). Döngü ~12 sn:
// PLAYER kartları -> ortada 3-2-1 (duvar kapıda küçük) -> duvar büyüyüp ekranı doldurur -> saydamlaşıp geçer.
// Bizim farkımız: P1 ZÜMRÜT, P2 KEHRİBAR; gökte fener + ışık küreleri; robot/çizgi film/TV görüntüsü YOK.
// Arka plan ve duvar dokuları Blender'da (tetris-pvp/varlik.py, Actions), burada yalnız 2B birleştirme.
// Deterministik: her kare t = kare/fps.
// =====================================================================
const S = await fetch('/spec/sabitler.json').then(r => r.json());
const FPS = S.video.fps;
const SP = new URLSearchParams(location.search);
const W = Number(SP.get('w') || 1920);
const H = Number(SP.get('h') || 1080);
const k = H / 1080;
const BOLUM_YOL = SP.get('bolum');
const BOLUM = BOLUM_YOL ? await fetch(BOLUM_YOL).then(r => r.json()) : {};
const BPM = BOLUM.bpm || 120;
const OLCU = 60 / BPM * 4;
const TOPLAM_OLCU = Number(SP.get('toplam') || BOLUM.toplam_olcu || 16);
const DUVARLAR = BOLUM.duvarlar || [];
const KARTLAR = BOLUM.kartlar || [];
const Z = BOLUM.zaman || { kart: 2.0, say: 3.0, buyu: 5.0, gec: 1.2, sure: 12.0 };
const TOPLAM_DUVAR = BOLUM.toplam_duvar || DUVARLAR.length;

// Tema: varsayılan = 2. video (REF-053, zümrüt/kehribar). Sonraki videolar bölüm JSON'undaki "tema" ile ezer (3. video REF-054: mor/sarı).
const TEMA = Object.assign({
  varlik: '/03-motor/tetris-pvp/varlik/', p1: '#22e07a', p2: '#ff9a1f', altin: '#ffc93a', camgobegi: '#3ff0e0',
  p1koyu: '#0d8a47', p2koyu: '#b85200', p1acik: '#d9ffe9', p2acik: '#fff1d6', p1parlak: '#c8ffe0', p2parlak: '#ffe2b8',
  vsSol: ['#0d6b3d', '#04241a'], vsSag: ['#9a4a00', '#2a1200'], isin: ['#1fb5a0', '#06264a'], wrapIsin: ['#ffb43a', '#3a1200'],
  ovguRenk: ['#fffbe0', '#7dffc0', '#18b8ff'], parca: ['#7dff9c', '#ffd27a', '#7fe7ff'], abone: ['#7dffb4', '#0c8a48'],
  vsAlt: 'TETRIS MODE · PVP BATTLE', wrap: ["THAT'S", 'A WRAP!'], ovgu: ['GREAT!', 'EXCELLENT!', 'PERFECT!', 'AWESOME!'],
}, BOLUM.tema || {});
const VARLIK = TEMA.varlik;
const YER = await fetch(VARLIK + 'yerlesim.json').then(r => r.json());
const P1 = TEMA.p1, P2 = TEMA.p2, ALTIN = TEMA.altin, CAMGOBEGI = TEMA.camgobegi;
const RENK = [P1, P2];

// ------------------------------------------------------------ YÜKLEME
function resim(yol) {
  return new Promise((ok, hata) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => hata(new Error(yol)); i.src = yol; });
}
const font = new FontFace('Titan', 'url(/05-kapak/fontlar/TitanOne.ttf)');
document.fonts.add(await font.load());
const [GOK, SERIT1, SERIT2, PANEL1, PANEL2] = await Promise.all(
  ['gok.png', 'serit-p1.png', 'serit-p2.png', 'panel-p1.png', 'panel-p2.png'].map(a => resim(VARLIK + a)));
const POZ_ADLAR = [...new Set(DUVARLAR.flatMap(d => [d.p1, d.p2]))];
const MASKE = {};
await Promise.all(POZ_ADLAR.map(async a => { MASKE[a] = await resim(VARLIK + 'poz/' + a + '.png'); }));

const cikti = document.getElementById('cikti');
cikti.width = W; cikti.height = H;
const cx = cikti.getContext('2d');
const KAT = document.createElement('canvas'); KAT.width = W; KAT.height = H;
const kc = KAT.getContext('2d');

// ------------------------------------------------------------ YARDIMCI
function rng(t) { let s = t >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const ease = p => p * p * (3 - 2 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const kisit = (v, a, b) => Math.max(a, Math.min(b, v));
function hex(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const F = px => `${Math.round(px)}px Titan, "Arial Black", sans-serif`;

function yazi(metin, x, y, px, dolgu, kontur = '#06122e', alfa = 1, isilti = null, ctx = cx) {
  ctx.save(); ctx.globalAlpha = kisit(alfa, 0, 1);
  ctx.font = F(px); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (isilti) { ctx.shadowColor = isilti; ctx.shadowBlur = px * 0.35; }
  ctx.lineWidth = px * 0.2; ctx.strokeStyle = kontur; ctx.strokeText(metin, x, y + px * 0.06);
  ctx.shadowBlur = 0;
  if (Array.isArray(dolgu)) {
    const g = ctx.createLinearGradient(0, y - px * 0.5, 0, y + px * 0.5);
    dolgu.forEach((c, i) => g.addColorStop(i / (dolgu.length - 1), c));
    ctx.fillStyle = g;
  } else ctx.fillStyle = dolgu;
  ctx.fillText(metin, x, y);
  ctx.globalAlpha *= 0.55; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.save(); ctx.beginPath(); ctx.rect(x - px * 8, y - px * 0.5, px * 16, px * 0.32); ctx.clip();
  ctx.fillText(metin, x, y); ctx.restore();                       // üst parlama bandı
  ctx.restore();
}

// ------------------------------------------------------------ SAHNE (sabit kamera)
const PAR = rng(53);
const PARILTI = Array.from({ length: 70 }, () => ({ x: PAR(), y: PAR() * 0.5, f: PAR() * 6.28, h: 0.6 + PAR() * 1.8, b: 0.8 + PAR() * 1.8 }));
function sahneCiz(t) {
  cx.drawImage(GOK, 0, 0, W, H);
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (const s of PARILTI) {
    const a = Math.max(0, Math.sin(t * s.h + s.f)) ** 3;
    if (a < 0.02) continue;
    const x = s.x * W, y = s.y * H + Math.sin(t * 0.3 + s.f) * 6 * k, r = s.b * k * (2 + 6 * a);
    const g = cx.createRadialGradient(x, y, 0, x, y, r * 3);
    g.addColorStop(0, `rgba(255,240,200,${0.9 * a})`); g.addColorStop(1, 'rgba(255,200,120,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 3, 0, 6.283); cx.fill();
  }
  cx.restore();
  gokHareket(t);
  cx.drawImage(SERIT1, 0, 0, W / 2, H);
  cx.drawImage(SERIT2, W / 2, 0, W / 2, H);
  for (let i = 0; i < 2; i++) { yolOklari(t, i); ampulCiz(t, i); }
}

// ------------------------------------------------------------ GÖKTE HAREKET (kullanıcı 17 Eki: "arkada boş durmasın ... görsel şölen")
// yükselen fenerler, havai fişek, tarayan ışık huzmeleri, kayan yıldız. Hepsi t'den deterministik.
const FR = rng(77);
const FENER = Array.from({ length: 34 }, () => ({ x: FR(), faz: FR(), hiz: 0.025 + FR() * 0.035, b: 0.5 + FR() * 0.9, sal: FR() * 6.28 }));
const FISEK_ARALIK = 1.6;
function gokHareket(t) {
  cx.save(); cx.globalCompositeOperation = 'lighter';
  // tarayan ışık huzmeleri (şeritlerin arkasından)
  for (const [bx, faz, renk] of [[0.08, 0, CAMGOBEGI], [0.5, 2.1, ALTIN], [0.92, 4.2, TEMA.parca[0]], [0.3, 1.0, TEMA.parca[1]], [0.7, 3.3, TEMA.parca[2]]]) {
    const a = Math.sin(t * 0.55 + faz) * 0.5, L = H * 1.1, x0 = W * bx, y0 = H * 0.75;
    const ux = Math.sin(a), uy = -Math.cos(a), gen = 60 * k;
    const g = cx.createLinearGradient(x0, y0, x0 + ux * L, y0 + uy * L);
    g.addColorStop(0, hex(renk, 0.30)); g.addColorStop(1, hex(renk, 0));
    cx.fillStyle = g; cx.beginPath(); cx.moveTo(x0, y0);
    cx.lineTo(x0 + ux * L - uy * gen, y0 + uy * L + ux * gen); cx.lineTo(x0 + ux * L + uy * gen, y0 + uy * L - ux * gen);
    cx.closePath(); cx.fill();
  }
  // yükselen fenerler (sallanarak)
  for (const f of FENER) {
    const p = (f.faz + t * f.hiz) % 1;
    const x = f.x * W + Math.sin(t * 0.8 + f.sal) * 14 * k, y = H * (1.05 - 1.15 * p);
    const s = (16 + 18 * f.b) * k, a = Math.min(1, p * 5) * Math.min(1, (1 - p) * 4);
    const g = cx.createRadialGradient(x, y, 0, x, y, s * 2.6);
    g.addColorStop(0, `rgba(255,190,90,${0.55 * a})`); g.addColorStop(1, 'rgba(255,120,30,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, s * 2.6, 0, 6.283); cx.fill();
    cx.fillStyle = `rgba(255,214,140,${0.9 * a})`;
    cx.beginPath(); cx.roundRect(x - s * 0.42, y - s * 0.6, s * 0.84, s * 1.1, s * 0.25); cx.fill();
  }
  // havai fişek: her FISEK_ARALIK sn'de bir patlama, 1,8 sn yaşar
  const nf = Math.floor(t / FISEK_ARALIK);
  for (let j = nf - 1; j <= nf; j++) {
    if (j < 0) continue;
    const u = t - j * FISEK_ARALIK; if (u > 1.8) continue;
    const r = rng(1000 + j);
    const cx0 = W * (0.06 + 0.88 * r()), cy0 = H * (0.08 + 0.3 * r());
    const renk = [ALTIN, CAMGOBEGI, TEMA.parca[0], '#ffffff', P2][Math.floor(r() * 5)];
    const n = 36, R = (120 + 90 * r()) * k;
    const yay = ease(Math.min(1, u / 0.9)), a = 1 - Math.max(0, (u - 0.5) / 1.3);
    for (let i = 0; i < n; i++) {
      const ang = i / n * 6.283 + r() * 0.1;
      const d = R * yay * (0.85 + 0.3 * r());
      const px = cx0 + Math.cos(ang) * d, py = cy0 + Math.sin(ang) * d + 60 * k * u * u;
      const g = cx.createRadialGradient(px, py, 0, px, py, 9 * k);
      g.addColorStop(0, hex(renk, 0.95 * a)); g.addColorStop(1, hex(renk, 0));
      cx.fillStyle = g; cx.beginPath(); cx.arc(px, py, 9 * k, 0, 6.283); cx.fill();
    }
  }
  // kayan yıldız (her ~3 sn)
  const ky = Math.floor(t / 3.1), ku = t - ky * 3.1;
  if (ku < 0.7) {
    const r = rng(500 + ky), x0 = W * r(), y0 = H * 0.05 + H * 0.2 * r(), q = ku / 0.7;
    const x = x0 + 520 * k * q, y = y0 + 180 * k * q;
    const g = cx.createLinearGradient(x - 220 * k, y - 76 * k, x, y);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${0.9 * (1 - q)})`);
    cx.strokeStyle = g; cx.lineWidth = 3 * k; cx.beginPath(); cx.moveTo(x - 220 * k, y - 76 * k); cx.lineTo(x, y); cx.stroke();
  }
  cx.restore();
}

// şerit kamerası (varlik.py ile aynı): z 2,6 m, 10,5° aşağı, dikey yarı-FOV tan = 12/21,85
const KAM = { z: 2.6, p: 10.5 * Math.PI / 180, tv: 12 / 21.85 };
KAM.th = KAM.tv * 960 / 1080;
function izdus(i, X, Y, Zd) {
  const dz = Zd - KAM.z, cp = Math.cos(KAM.p), sp = Math.sin(KAM.p);
  const zc = Y * cp - dz * sp, yc = Y * sp + dz * cp;
  const sx = 480 + (X / zc) / KAM.th * 480, sy = 540 - (yc / zc) / KAM.tv * 540;
  return [i * W / 2 + sx * (W / 2) / 960, sy * H / 1080];
}
// yolda kameraya akan parlak yön okları (kullanıcı 17 Eki: "yollardaki yön işaretleri olsun zemindeki")
function yolOklari(t, i) {
  cx.save(); cx.beginPath(); cx.rect(i * W / 2, 0, W / 2, H); cx.clip();
  const ARA = 1.25, HIZ_OK = 1.6, N = 7;
  for (let j = 0; j < N; j++) {
    const y = 8.6 - ((j * ARA + t * HIZ_OK) % (ARA * N));
    if (y < 3.0 || y > 8.4) continue;
    const a = Math.min(1, (8.4 - y) / 1.2) * Math.min(1, (y - 3.0) / 0.6);
    const z = 0.04, w = 0.95, d = 0.42, kal = 0.28;
    const pts = [[-w, y + d], [0, y], [w, y + d], [w, y + d + kal], [0, y + kal], [-w, y + d + kal]].map(q => izdus(i, q[0], q[1], z));
    cx.beginPath(); pts.forEach((q, n) => n ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1])); cx.closePath();
    cx.shadowColor = '#ffffff'; cx.shadowBlur = 18 * k;
    cx.fillStyle = `rgba(255,255,240,${0.85 * a})`; cx.fill();
    cx.shadowBlur = 0; cx.lineWidth = 3 * k; cx.strokeStyle = hex(RENK[i], 0.9 * a); cx.stroke();
  }
  cx.restore();
}
// kapı ampulleri: kayan ışık dizisi (marquee)
function ampulCiz(t, i) {
  const L = YER['ampul_p' + (i + 1)]; if (!L) return;
  const sx = (W / 2) / 960, sy = H / 1080;
  cx.save(); cx.globalCompositeOperation = 'lighter';
  L.forEach((q, n) => {
    const a = 0.35 + 0.65 * Math.max(0, Math.sin(t * 7 - n * 0.9)) ** 2;
    const x = i * W / 2 + q[0] * sx, y = q[1] * sy, r = 15 * k;
    const g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,250,220,${a})`); g.addColorStop(0.35, `rgba(255,214,120,${0.7 * a})`); g.addColorStop(1, 'rgba(255,170,60,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill();
  });
  cx.restore();
}

// kapı açıklığı (ekran px): şerit görüntüsü 960x1080 -> ekran yarısı
function aciklik(i) {
  const a = YER['aciklik_p' + (i + 1)];
  const sx = (W / 2) / 960, sy = H / 1080, ox = i * W / 2;
  return { x: ox + a[0] * sx, y: a[1] * sy, w: (a[2] - a[0]) * sx, h: (a[3] - a[1]) * sy };
}
// en yakında duvar kendi yarısını TAMAMEN kaplar (kullanıcı 17 Eki: "tam geldiğinde kapatsın ekranı ... boşluk bırakmasın")
function buyukKutu(i) {
  const ar = 1100 / 904, ox = i * W / 2;
  const w = Math.max(W / 2, H * ar) * 1.04, h = w / ar;
  return { x: ox + (W / 2 - w) / 2, y: H / 2 - h / 2, w, h };
}

// ------------------------------------------------------------ DUVAR (jöle panel + poz oyuğu)
function duvarCiz(i, kutu, maske, alfa) {
  if (alfa <= 0) return;
  const { x, y, w, h } = kutu;
  const panel = i === 0 ? PANEL1 : PANEL2;
  cx.save(); cx.beginPath(); cx.rect(i * W / 2, 0, W / 2, H); cx.clip();
  try { duvarIc(i, x, y, w, h, panel, maske, alfa); } finally { cx.restore(); }
}
function duvarIc(i, x, y, w, h, panel, maske, alfa) {
  if (!maske) { cx.save(); cx.globalAlpha = alfa; cx.drawImage(panel, x, y, w, h); cx.restore(); return; }
  // 1) oyuğun içi: arkası görünür ama koyulaşır (siluet okunur)
  kc.clearRect(0, 0, W, H);
  kc.drawImage(maske, x, y, w, h);
  kc.globalCompositeOperation = 'source-in';
  kc.fillStyle = 'rgba(4,10,28,0.62)'; kc.fillRect(x, y, w, h);
  kc.globalCompositeOperation = 'source-over';
  cx.save(); cx.globalAlpha = alfa; cx.drawImage(KAT, 0, 0); cx.restore();
  // 2) panel, oyuk delinmiş; gölgesi (renkli ışıltı) oyuğun kenarına taşar = parlak kenar
  kc.clearRect(0, 0, W, H);
  kc.drawImage(panel, x, y, w, h);
  kc.globalCompositeOperation = 'destination-out';
  kc.drawImage(maske, x, y, w, h);
  kc.globalCompositeOperation = 'source-over';
  cx.save(); cx.globalAlpha = alfa;
  cx.shadowColor = hex(i === 0 ? TEMA.p1parlak : TEMA.p2parlak, 0.95); cx.shadowBlur = Math.max(4, w * 0.018);
  cx.drawImage(KAT, 0, 0);
  cx.restore();
}

function evre(u) {
  const a = Z.kart, b = a + Z.say, c = b + Z.buyu, d = c + Z.gec;
  if (u < a) return { ad: 'kart', p: u / Z.kart };
  if (u < b) return { ad: 'say', p: (u - a) / Z.say };
  if (u < c) return { ad: 'buyu', p: (u - b) / Z.buyu };
  if (u < d) return { ad: 'gec', p: (u - c) / Z.gec };
  return { ad: 'bos', p: (u - d) / Math.max(0.01, Z.sure - d) };
}

function kutuLerp(A, B, q) { return { x: lerp(A.x, B.x, q), y: lerp(A.y, B.y, q), w: lerp(A.w, B.w, q), h: lerp(A.h, B.h, q) }; }
function olcekle(K, s) { return { x: K.x + K.w / 2 - K.w * s / 2, y: K.y + K.h / 2 - K.h * s / 2, w: K.w * s, h: K.h * s }; }

function oyuncuKarti(i, p) {
  const A = aciklik(i);
  const giris = ease(kisit(p / 0.18, 0, 1)), cikis = ease(kisit((1 - p) / 0.12, 0, 1));
  const s = 0.7 + 0.3 * giris, a = Math.min(giris, cikis);
  const w = A.w * 0.62 * s, h = A.h * 0.78 * s, x = A.x + A.w / 2 - w / 2, y = A.y + A.h / 2 - h / 2;
  cx.save(); cx.globalAlpha = a;
  cx.shadowColor = RENK[i]; cx.shadowBlur = 30 * k;
  cx.fillStyle = '#07163a'; cx.beginPath(); cx.roundRect(x, y, w, h, 26 * k); cx.fill();
  cx.shadowBlur = 0;
  cx.lineWidth = 9 * k; cx.strokeStyle = RENK[i]; cx.stroke();
  cx.lineWidth = 3 * k; cx.strokeStyle = 'rgba(255,255,255,0.7)';
  cx.beginPath(); cx.roundRect(x + 12 * k, y + 12 * k, w - 24 * k, h - 24 * k, 18 * k); cx.stroke();
  // ızgara doku
  cx.save(); cx.beginPath(); cx.roundRect(x + 12 * k, y + 12 * k, w - 24 * k, h - 24 * k, 18 * k); cx.clip();
  cx.strokeStyle = hex(RENK[i], 0.18); cx.lineWidth = 2 * k;
  for (let gx = x; gx < x + w; gx += 28 * k) { cx.beginPath(); cx.moveTo(gx, y); cx.lineTo(gx, y + h); cx.stroke(); }
  for (let gy = y; gy < y + h; gy += 28 * k) { cx.beginPath(); cx.moveTo(x, gy); cx.lineTo(x + w, gy); cx.stroke(); }
  cx.restore();
  cx.restore();
  yazi(i === 0 ? 'PLAYER 1' : 'PLAYER 2', x + w / 2, y + h * 0.17, h * 0.11, '#ffffff', '#06122e', a);
  yazi(i === 0 ? 'P1' : 'P2', x + w / 2, y + h * 0.58, h * 0.42, i === 0 ? [TEMA.p1acik, P1, TEMA.p1koyu] : [TEMA.p2acik, P2, TEMA.p2koyu], '#06122e', a, RENK[i]);
}

function kapiKutusu(i) {
  const A = aciklik(i), ar = 1100 / 904;
  let aw = A.w, ah = A.w / ar; if (ah > A.h) { ah = A.h; aw = ah * ar; }
  return { x: A.x + (A.w - aw) / 2, y: A.y + A.h - ah, w: aw, h: ah };
}
function bosPaneller(alfa = 1) { for (let i = 0; i < 2; i++) duvarCiz(i, kapiKutusu(i), null, alfa); }

function duvarlarCiz(d, u) {
  const e = evre(u);
  if (e.ad === 'kart') { bosPaneller(); oyuncuKarti(0, e.p); oyuncuKarti(1, e.p); return e; }
  if (e.ad === 'bos') bosPaneller(ease(Math.min(1, e.p * 2)));
  for (let i = 0; i < 2; i++) {
    const maske = MASKE[i === 0 ? d.p1 : d.p2];
    const A = aciklik(i), B = buyukKutu(i);
    // panel kapı açıklığını doldurur (oran korunur, ortalanır)
    const ar = 1100 / 904;
    let aw = A.w, ah = A.w / ar; if (ah > A.h) { ah = A.h; aw = ah * ar; }
    const A2 = { x: A.x + (A.w - aw) / 2, y: A.y + A.h - ah, w: aw, h: ah };
    if (e.ad === 'say') {
      const fl = kisit(1 - e.p * Z.say / 0.25, 0, 1);
      duvarCiz(i, A2, maske, ease(kisit(e.p * Z.say / 0.2, 0, 1)));
      if (fl > 0) { cx.fillStyle = `rgba(255,255,255,${0.7 * fl})`; cx.fillRect(A2.x, A2.y, A2.w, A2.h); }
    } else if (e.ad === 'buyu') {
      const q = Math.pow(e.p, 2.1);                 // perspektif: önce yavaş, sonra hızlanır
      duvarCiz(i, kutuLerp(A2, B, q), maske, 1);
    } else if (e.ad === 'gec') {
      const q = ease(e.p);
      duvarCiz(i, olcekle(B, 1 + 0.45 * q), maske, 1 - q);
    }
  }
  return e;
}

function sayimCiz(e) {
  if (e.ad !== 'say') return;
  const n = 3 - Math.min(2, Math.floor(e.p * 3));
  const q = (e.p * 3) % 1;
  const A = aciklik(0);
  const s = 1.25 - 0.25 * ease(Math.min(1, q / 0.25));
  const px = 210 * k * s;
  yazi(String(n), W / 2, A.y + A.h * 0.5, px, ['#ffffff', ALTIN, '#ff7a00'], '#2a0a46', 1, ALTIN);
}

const OVGU = TEMA.ovgu;
function ovguCiz(d, e) {
  if (!(e.ad === 'gec' && e.p > 0.35) && e.ad !== 'bos') return;
  const p = e.ad === 'gec' ? (e.p - 0.35) / 0.65 * 0.6 : 0.6 + 0.4 * e.p;
  const a = Math.min(1, p / 0.15) * Math.min(1, (1 - p) / 0.2);
  const s = 0.8 + 0.2 * ease(Math.min(1, p / 0.2));
  const metin = d.ovgu || OVGU[(d.no - 1) % OVGU.length];
  yazi(metin, W / 2, H * 0.42, 150 * k * s, TEMA.ovguRenk, '#06122e', a, CAMGOBEGI);
}

// ------------------------------------------------------------ HUD (üst bant)
function hudCiz(t, tur, ilerleme) {
  const y = 34 * k, h = 34 * k;
  const x0 = 120 * k, x1 = W - 120 * k;
  cx.save();
  cx.fillStyle = 'rgba(4,12,36,0.72)'; cx.beginPath(); cx.roundRect(x0 - 70 * k, y - 10 * k, x1 - x0 + 140 * k, h + 20 * k, 26 * k); cx.fill();
  for (let i = 0; i < 2; i++) {
    const bx0 = i === 0 ? x0 : W / 2 + 170 * k, bx1 = i === 0 ? W / 2 - 170 * k : x1;
    cx.fillStyle = 'rgba(255,255,255,0.12)'; cx.beginPath(); cx.roundRect(bx0, y, bx1 - bx0, h, h / 2); cx.fill();
    const L = (bx1 - bx0) * kisit(ilerleme, 0.03, 1);
    const g = cx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, hex(RENK[i], 1)); g.addColorStop(1, i === 0 ? TEMA.p1koyu : TEMA.p2koyu);
    cx.fillStyle = g; cx.shadowColor = RENK[i]; cx.shadowBlur = 16 * k;
    cx.beginPath(); if (i === 0) cx.roundRect(bx1 - L, y, L, h, h / 2); else cx.roundRect(bx0, y, L, h, h / 2); cx.fill();
    cx.shadowBlur = 0;
    // rozet P1 / P2 uçlarda
    const rx = i === 0 ? x0 - 40 * k : x1 + 40 * k;
    cx.fillStyle = RENK[i]; cx.beginPath(); cx.arc(rx, y + h / 2, 30 * k, 0, 6.283); cx.fill();
    cx.lineWidth = 4 * k; cx.strokeStyle = '#ffffff'; cx.stroke();
    yazi(i === 0 ? 'P1' : 'P2', rx, y + h / 2, 30 * k, '#ffffff', '#06122e');
  }
  cx.restore();
  yazi(`ROUND ${tur}`, W / 2, y + h / 2, 46 * k, ['#ffffff', '#fff1a8', ALTIN], '#06122e', 1, ALTIN);
}

// ------------------------------------------------------------ KARTLAR
function isinPatlamasi(t, renkA, renkB) {
  const g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.7);
  g.addColorStop(0, renkA); g.addColorStop(1, renkB);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  cx.save(); cx.translate(W / 2, H / 2); cx.rotate(t * 0.25);
  cx.globalCompositeOperation = 'lighter';
  const n = 28;
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.283, da = 6.283 / n * (0.18 + 0.22 * ((i * 7) % 5) / 5);
    cx.fillStyle = `rgba(255,255,255,${0.10 + 0.08 * (i % 3)})`;
    cx.beginPath(); cx.moveTo(0, 0); cx.arc(0, 0, W, a, a + da); cx.closePath(); cx.fill();
  }
  const c = cx.createRadialGradient(0, 0, 0, 0, 0, H * 0.45);
  c.addColorStop(0, 'rgba(255,255,255,0.85)'); c.addColorStop(1, 'rgba(255,255,255,0)');
  cx.fillStyle = c; cx.beginPath(); cx.arc(0, 0, H * 0.45, 0, 6.283); cx.fill();
  cx.restore();
}

function kartCiz(kart, u, t) {
  // art arda gelen kartlar arasında ve videonun ilk karesinde solma yok (kesit 2: arada sahne bir an görünüyordu)
  const once = kart.t === 0 || KARTLAR.some(kk => kk !== kart && Math.abs(kk.t + kk.sure - kart.t) < 0.01);
  const sonra = KARTLAR.some(kk => kk !== kart && Math.abs(kart.t + kart.sure - kk.t) < 0.01);
  const a = kisit(Math.min(once ? 1 : u / 0.2, sonra ? 1 : (kart.sure - u) / 0.2), 0, 1);
  const s = 1 + 0.15 * (1 - ease(Math.min(1, u / 0.35)));
  cx.save(); cx.globalAlpha = a;
  if (kart.tip === 'vs') {
    // iki renkli bölünmüş ekran, ortada şimşek çizgisi + VS rozeti (kendi tasarımımız, karakter yok)
    const ek = Math.sin(u * 3) * 10 * k;
    const sol = cx.createLinearGradient(0, 0, W / 2, H); sol.addColorStop(0, TEMA.vsSol[0]); sol.addColorStop(1, TEMA.vsSol[1]);
    const sag = cx.createLinearGradient(W, 0, W / 2, H); sag.addColorStop(0, TEMA.vsSag[0]); sag.addColorStop(1, TEMA.vsSag[1]);
    const zig = [[W * 0.56 + ek, 0], [W * 0.47, H * 0.38], [W * 0.54, H * 0.42], [W * 0.44 - ek, H]];
    cx.fillStyle = sol; cx.beginPath(); cx.moveTo(0, 0); zig.forEach(p => cx.lineTo(p[0], p[1])); cx.lineTo(0, H); cx.closePath(); cx.fill();
    cx.fillStyle = sag; cx.beginPath(); cx.moveTo(W, 0); zig.forEach(p => cx.lineTo(p[0], p[1])); cx.lineTo(W, H); cx.closePath(); cx.fill();
    cx.save(); cx.shadowColor = '#ffffff'; cx.shadowBlur = 40 * k; cx.strokeStyle = '#fffbe8'; cx.lineWidth = 10 * k;
    cx.beginPath(); zig.forEach((p, j) => j ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1])); cx.stroke(); cx.restore();
    const gir = ease(kisit(u / 0.5, 0, 1));
    yazi('P1', lerp(-W * 0.2, W * 0.25, gir), H * 0.5, 330 * k, [TEMA.p1acik, P1, TEMA.p1koyu], '#03140c', 1, P1);
    yazi('P2', lerp(W * 1.2, W * 0.75, gir), H * 0.5, 330 * k, [TEMA.p2acik, P2, TEMA.p2koyu], '#1a0b00', 1, P2);
    const vs = 1 + 0.08 * Math.sin(u * 9);
    yazi('VS', W / 2, H * 0.47, 230 * k * vs * gir + 1, ['#ffffff', '#fff27a', ALTIN, '#ff6a00'], '#2a0a46', 1, ALTIN);
    yazi(TEMA.vsAlt, W / 2, H * 0.84, 84 * k, '#ffffff', '#06122e', gir);
  } else if (kart.tip === 'basla') {
    // başlangıç geri sayımı 3-2-1-GO! (sahnenin üstünde, perde yok)
    const ad = kart.sure / 4, adim = Math.min(3, Math.floor(u / ad)), q = (u - adim * ad) / ad;   // 4 adım kartı eşit böler (müziğe kilitli)
    const metin = ['3', '2', '1', 'GO!'][adim];
    const s2 = 1.35 - 0.35 * ease(Math.min(1, q / 0.3)), a2 = Math.min(1, (1 - q) / 0.25);
    cx.globalAlpha = a * a2;
    const renk = adim === 3 ? ['#ffffff', TEMA.p1acik, P1, TEMA.p1koyu] : ['#ffffff', ALTIN, '#ff7a00'];
    yazi(metin, W / 2, H * 0.47, (adim === 3 ? 300 : 340) * k * s2, renk, '#2a0a46', 1, adim === 3 ? P1 : ALTIN);
    if (adim === 0 && q < 0.6) yazi('GET READY!', W / 2, H * 0.2, 110 * k, '#ffffff', '#06122e', 1 - q / 0.6);
  } else if (kart.tip === 'tur') {
    isinPatlamasi(t, TEMA.isin[0], TEMA.isin[1]);
    yazi(kart.metin, W / 2, H * (kart.alt ? 0.40 : 0.5), 200 * k * s, ['#ffffff', '#fff1a8', ALTIN], '#06122e', 1, ALTIN);
    if (kart.alt) yazi(kart.alt, W / 2, H * 0.62, 150 * k * s, ['#ffffff', TEMA.p1acik, P1], '#06122e', 1, P1);
  } else if (kart.tip === 'wrap') {
    isinPatlamasi(t, TEMA.wrapIsin[0], TEMA.wrapIsin[1]);
    const harf = TEMA.wrap;
    harf.forEach((m, j) => {
      const g = ease(kisit((u - j * 0.25) / 0.4, 0, 1));
      yazi(m, W / 2, H * (0.38 + j * 0.24), 190 * k * (0.6 + 0.4 * g), ['#ffffff', '#fff1a8', ALTIN], '#2a0a00', g, '#ffffff');
    });
  } else if (kart.tip === 'abone') {
    isinPatlamasi(t, TEMA.isin[0], TEMA.isin[1]);
    const g = ease(kisit(u / 0.4, 0, 1)), pul = 1 + 0.05 * Math.sin(u * 8);
    const bw = 820 * k * g * pul, bh = 190 * k * g * pul;
    cx.save(); cx.shadowColor = '#ff1f3d'; cx.shadowBlur = 50 * k;
    cx.fillStyle = '#e11d2e'; cx.beginPath(); cx.roundRect(W / 2 - bw / 2, H * 0.48 - bh / 2, bw, bh, bh / 2); cx.fill(); cx.restore();
    if (g > 0.6) yazi('SUBSCRIBE', W / 2, H * 0.48, 120 * k * pul, '#ffffff', '#5a0010');
    yazi('NEW BATTLE EVERY WEEK', W / 2, H * 0.68, 70 * k * g + 1, ['#ffffff', TEMA.p1acik], '#06122e', g);
  }
  cx.restore();
}

// ------------------------------------------------------------ KARE
function turBul(t) {
  let tur = 1;
  for (const kart of KARTLAR) if (kart.tip === 'tur' && kart.t <= t) tur = kart.tur || tur;
  return tur;
}

function kareKur(n) {
  const t = n / FPS;
  sahneCiz(t);
  const d = DUVARLAR.find(x => t >= x.t0 && t < x.t0 + Z.sure);
  let e = null;
  if (d) e = duvarlarCiz(d, t - d.t0); else bosPaneller();
  if (e) sayimCiz(e);
  const bitti = DUVARLAR.filter(x => t >= x.t0 + Z.kart + Z.say + Z.buyu).length;
  const kartVar = KARTLAR.some(kk => t >= kk.t && t < kk.t + kk.sure && kk.tip !== 'basla');
  if (!kartVar) hudCiz(t, turBul(t), bitti / Math.max(1, TOPLAM_DUVAR));
  if (d && e) ovguCiz(d, e);
  for (const kart of KARTLAR) if (t >= kart.t && t < kart.t + kart.sure) kartCiz(kart, t - kart.t, t);
  if (!kartVar) aboneCiz(t);
}

// ------------------------------------------------------------ ABONE HATIRLATMASI
// Kullanıcı (18 Eki 2026): "subscribe yazısı belirgin şekilde gözüksün ... ortada ... üstteki ROUND ile ortadaki
// 3-2-1 sayımının ARASINDA ... konsepte uygun ... 15 saniyelik aralıklarla". Zamanlar bölüm JSON'unda `abone`
// (efekt.py pop + tık sesini aynı listeden koyar). Tam ekran kartlar sırasında çizilmez.
const ABONE = BOLUM.abone || [], ABONE_SURE = BOLUM.abone_sure || 3.2;
function aboneCiz(t) {
  const a0 = ABONE.find(x => t >= x && t < x + ABONE_SURE);
  if (a0 === undefined) return;
  const u = t - a0;
  const gir = kisit(u / 0.35, 0, 1), cik = ease(kisit((ABONE_SURE - u) / 0.3, 0, 1));
  const zip = gir < 1 ? 1 + 0.25 * Math.sin(gir * Math.PI) : 1;       // jöle gibi zıplayarak girer
  const TIK = 1.3, abone = u >= TIK;
  const bas = u >= TIK && u < TIK + 0.12 ? 0.9 : 1;
  const pul = abone ? 1 : 1 + 0.045 * Math.sin(u * 11);
  const s = ease(gir) * zip * bas * pul * cik;
  if (s <= 0.01) return;
  const yM = 190 * k, bw = 600 * k * s, bh = 118 * k * s, x0 = W / 2 - bw / 2;
  cx.save();
  // dış ışıltı + altın çerçeve + jöle kırmızı gövde
  cx.shadowColor = abone ? P1 : '#ff2d4a'; cx.shadowBlur = 50 * k;
  cx.fillStyle = ALTIN; cx.beginPath(); cx.roundRect(x0 - 8 * k * s, yM - bh / 2 - 8 * k * s, bw + 16 * k * s, bh + 16 * k * s, (bh + 16 * k * s) / 2); cx.fill();
  cx.shadowBlur = 0;
  const g = cx.createLinearGradient(0, yM - bh / 2, 0, yM + bh / 2);
  if (abone) { g.addColorStop(0, TEMA.abone[0]); g.addColorStop(1, TEMA.abone[1]); } else { g.addColorStop(0, '#ff6a7a'); g.addColorStop(1, '#c4001c'); }
  cx.fillStyle = g; cx.beginPath(); cx.roundRect(x0, yM - bh / 2, bw, bh, bh / 2); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,0.35)';                                // üst parlama
  cx.beginPath(); cx.roundRect(x0 + bh * 0.3, yM - bh / 2 + 7 * k * s, bw - bh * 0.6, bh * 0.3, bh * 0.15); cx.fill();
  cx.restore();
  // oynat rozeti
  const ix = x0 + bh * 0.62;
  cx.fillStyle = '#ffffff'; cx.beginPath(); cx.roundRect(ix - 34 * k * s, yM - 25 * k * s, 68 * k * s, 50 * k * s, 14 * k * s); cx.fill();
  cx.fillStyle = abone ? TEMA.abone[1] : '#e0102c';
  cx.beginPath(); cx.moveTo(ix - 10 * k * s, yM - 14 * k * s); cx.lineTo(ix + 15 * k * s, yM); cx.lineTo(ix - 10 * k * s, yM + 14 * k * s); cx.closePath(); cx.fill();
  yazi(abone ? 'SUBSCRIBED!' : 'SUBSCRIBE', x0 + bw / 2 + bh * 0.3, yM, 62 * k * s, '#ffffff', '#5a0010');
  // zil (sağda, abone olunca sallanır)
  const zx = x0 + bw + 62 * k * s, zy = yM;
  const sal = abone ? Math.sin((u - TIK) * 28) * Math.exp(-(u - TIK) * 2.5) * 0.55 : Math.sin(u * 6) * 0.08;
  cx.save(); cx.translate(zx, zy - 26 * k * s); cx.rotate(sal); cx.scale(s, s);
  cx.fillStyle = ALTIN; cx.shadowColor = ALTIN; cx.shadowBlur = 24 * k;
  // turuncu P2 duvarının üstünde kaybolmasın: koyu kontur + beyaz parlama (kesit 3 kontrolü)
  cx.lineWidth = 6 * k; cx.strokeStyle = '#3a1400'; cx.lineJoin = 'round';
  cx.beginPath(); cx.moveTo(-30 * k, 44 * k); cx.quadraticCurveTo(-28 * k, 0, 0, -6 * k); cx.quadraticCurveTo(28 * k, 0, 30 * k, 44 * k); cx.closePath();
  cx.stroke(); cx.fill();
  cx.shadowBlur = 0;
  cx.beginPath(); cx.arc(0, 52 * k, 9 * k, 0, 6.283); cx.stroke(); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,0.75)'; cx.beginPath(); cx.ellipse(-10 * k, 14 * k, 5 * k, 14 * k, 0.3, 0, 6.283); cx.fill();
  cx.restore();
  // el imleci gelir ve tıklar
  if (u > 0.5 && u < ABONE_SURE - 0.35) {
    const q = ease(kisit((u - 0.5) / (TIK - 0.5), 0, 1));
    const hx = lerp(x0 + bw + 200 * k, x0 + bw * 0.62, q), hy = lerp(yM + 150 * k, yM + 22 * k, q);
    const sc = (u >= TIK && u < TIK + 0.15) ? 0.85 : 1;
    cx.save(); cx.translate(hx, hy); cx.scale(sc, sc);
    cx.fillStyle = '#ffffff'; cx.strokeStyle = '#111827'; cx.lineWidth = 3.5 * k;
    cx.beginPath();
    cx.moveTo(0, 0); cx.lineTo(0, 54 * k); cx.lineTo(13 * k, 41 * k); cx.lineTo(23 * k, 63 * k);
    cx.lineTo(32 * k, 59 * k); cx.lineTo(22 * k, 37 * k); cx.lineTo(40 * k, 37 * k); cx.closePath();
    cx.fill(); cx.stroke();
    if (u >= TIK && u < TIK + 0.4) {
      const r2 = (u - TIK) / 0.4;
      cx.strokeStyle = `rgba(255,255,255,${(1 - r2).toFixed(3)})`; cx.lineWidth = 5 * k;
      cx.beginPath(); cx.arc(0, 0, 16 * k + 50 * k * r2, 0, 6.283); cx.stroke();
    }
    cx.restore();
  }
  // tıklamada pırıltı
  if (abone && u < TIK + 0.7) {
    const r3 = (u - TIK) / 0.7;
    cx.save(); cx.globalCompositeOperation = 'lighter';
    for (let j = 0; j < 14; j++) {
      const ang = j / 14 * 6.283, d = (60 + 260 * r3) * k;
      const px = W / 2 + Math.cos(ang) * d * 1.6, py = yM + Math.sin(ang) * d * 0.6;
      cx.fillStyle = hex(j % 2 ? ALTIN : P1, 1 - r3); cx.beginPath(); cx.arc(px, py, 7 * k, 0, 6.283); cx.fill();
    }
    cx.restore();
  }
}

window.kareKur = kareKur;
window.kareAl = (bicim, kalite) => {
  if (bicim === 'png') return cikti.toDataURL('image/png');
  if (bicim === 'jpeg') return cikti.toDataURL('image/jpeg', kalite || 1);
  return cikti.toDataURL('image/webp', kalite || 1);
};
window.SURE_OLCU = TOPLAM_OLCU;
window.TOPLAM_KARE = Math.round(TOPLAM_OLCU * OLCU * FPS);
window.NOTA_SAYISI = DUVARLAR.length;
window.KLIP_SAYISI = POZ_ADLAR.length;
window.SILUET_VAR = POZ_ADLAR.every(a => MASKE[a]);
kareKur(0);
window.HAZIR = true;
</script>
