function kirp(im) {
  const c = Object.assign(document.createElement('canvas'), { width: im.width, height: im.height }), g = c.getContext('2d');
  g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, im.width, im.height).data;
  let x0 = im.width, y0 = im.height, x1 = -1, y1 = -1;
  for (let y = 0; y < im.height; y++) for (let x = 0; x < im.width; x++) if (d[(y * im.width + x) * 4 + 3] > 40) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return im;
  const o = Object.assign(document.createElement('canvas'), { width: x1 - x0 + 1, height: y1 - y0 + 1 });
  o.getContext('2d').drawImage(c, -x0, -y0);
  return o;
}

// ------------------------------------------------------------ YARDIMCI
function rng(t) { let s = t >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const ease = p => p * p * (3 - 2 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const kisit = (v, a, b) => Math.max(a, Math.min(b, v));
function hex(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const F = px => `${Math.round(px)}px Titan, "Arial Black", sans-serif`;

// md. 28: iki katli kontur - dista beyaz, icte kalin mor; dolgu acik / renkli. Koyu gokte beyaz, pastel / beyaz zeminde mor ayirir.
function yaziK(metin, x, y, px, dolgu, alfa = 1, kontur = KON, isilti = null, ctx = cx) {
  if (alfa <= 0.01) return;
  ctx.save(); ctx.globalAlpha = kisit(alfa, 0, 1);
  ctx.font = F(px); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (isilti) { ctx.shadowColor = isilti; ctx.shadowBlur = px * 0.4; }
  ctx.lineWidth = px * 0.34; ctx.strokeStyle = '#ffffff'; ctx.strokeText(metin, x, y + px * 0.05);
  ctx.shadowBlur = 0;
  ctx.lineWidth = px * 0.2; ctx.strokeStyle = kontur; ctx.strokeText(metin, x, y + px * 0.05);
  if (Array.isArray(dolgu)) {
    const g = ctx.createLinearGradient(0, y - px * 0.5, 0, y + px * 0.5);
    dolgu.forEach((c, i) => g.addColorStop(i / (dolgu.length - 1), c));
    ctx.fillStyle = g;
  } else ctx.fillStyle = dolgu;
  ctx.fillText(metin, x, y);
  ctx.globalAlpha *= 0.5; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.save(); ctx.beginPath(); ctx.rect(x - px * 8, y - px * 0.5, px * 16, px * 0.3); ctx.clip();
  ctx.fillText(metin, x, y); ctx.restore();                       // ust parlama bandi (baloncuk)
  ctx.restore();
}
// motor 16'dan gelen acilis kodu icin: yazi(m, x, y, px, dolgu, kontur, alfa, isilti) -> yaziK
const yazi = (m, x, y, px, dolgu, kontur, alfa, isilti) => yaziK(m, x, y, px, dolgu, alfa, kontur || KON, isilti);
// cok parcali satir: [[metin, dolgu], ...] ortalanmis (renk adi kendi renginde)
function satir(parcalar, xm, y, px, alfa = 1) {
  cx.save(); cx.font = F(px);
  const gen = parcalar.map(([m]) => cx.measureText(m).width); const top = gen.reduce((a, b) => a + b, 0);
  cx.restore();
  let x = xm - top / 2;
  parcalar.forEach(([m, d], i) => { yaziK(m, x + gen[i] / 2, y, px, d, alfa); x += gen[i]; });
}
function yildiz5(x, y, r, renk, t = 0, kontur = null) {
  cx.save(); cx.translate(x, y); cx.rotate(0.15 * Math.sin(t * 3 + x));
  cx.beginPath();
  for (let q = 0; q <= 10; q++) { const a = -Math.PI / 2 + q * Math.PI / 5, rr = q % 2 ? r * 0.45 : r; q ? cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : cx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  cx.closePath(); cx.fillStyle = renk; cx.fill();
  if (kontur) { cx.lineWidth = Math.max(2, r * 0.18); cx.strokeStyle = kontur; cx.lineJoin = 'round'; cx.stroke(); }
  cx.restore();
}
function parilti4(x, y, r, a, renk = '#ffffff') {
  if (a <= 0.01) return;
  cx.save(); cx.globalAlpha = a; cx.fillStyle = renk; cx.beginPath();
  cx.moveTo(x, y - r); cx.quadraticCurveTo(x, y, x + r * 0.3, y); cx.quadraticCurveTo(x, y, x, y + r);
  cx.quadraticCurveTo(x, y, x - r * 0.3, y); cx.quadraticCurveTo(x, y, x, y - r); cx.fill();
  cx.beginPath(); cx.moveTo(x - r, y); cx.quadraticCurveTo(x, y, x, y + r * 0.3); cx.quadraticCurveTo(x, y, x + r, y);
  cx.quadraticCurveTo(x, y, x, y - r * 0.3); cx.quadraticCurveTo(x, y, x - r, y); cx.fill(); cx.restore();
}

function gezegenCiz(x, y, r, renk, renk2, t = 0) {
  cx.save(); cx.translate(x, y);

  cx.restore();
}
function balikCiz(x, y, r, t) {                              // motor 28: penguenin elinde kucuk sari balik (kuyruk sallanir)
  cx.save(); cx.translate(x, y); cx.rotate(-0.5 + 0.15 * Math.sin(t * 4));

  cx.fillStyle = g; cx.strokeStyle = '#7a3a00'; cx.lineWidth = r * 0.12;
  cx.beginPath(); cx.ellipse(0, 0, r * 1.2, r * 0.62, 0, 0, 6.283); cx.fill(); cx.stroke();

function kristalCiz(x, y, r, t) {                             // motor 28: alti kollu kar kristali (camgobegi, beyaz kenarli, doner)

  cx.fillStyle = '#2fc44a'; cx.strokeStyle = '#14601e'; cx.lineWidth = r * 0.08;
  for (const s of [-1, 1]) { cx.beginPath(); cx.ellipse(s * r * 0.42, r * 1.6, r * 0.28, r * 0.85, s * 0.45, 0, 6.283); cx.fill(); cx.stroke(); }

  cx.fillStyle = 'rgba(255,255,255,0.45)'; cx.beginPath(); cx.ellipse(-r * 0.3, r * 0.2, r * 0.12, r * 0.3, -0.3, 0, 6.283); cx.fill();

    kc.globalCompositeOperation = 'source-over';

  kc.globalCompositeOperation = 'source-atop';
  const TMP = siluet.tmp || (siluet.tmp = Object.assign(document.createElement('canvas'), { width: W, height: H }));
  const tc = TMP.getContext('2d'); tc.clearRect(0, 0, W, H); tc.drawImage(m, mx, my, mw, mh);

function duvarCiz(d, u, t) {
  const Z = ZD(d), a = Z.kart, b = a + Z.say, c = b + Z.buyu, T = Z.tut || 0;
  if (u >= c + T) { tamEkran(d, u - c - T, t); return null; }
  for (let i = 0; i < OY.length; i++) {
    const K = aciklik(i);
    let s = 1, alfa = 1, kar = 0, acik = 1;
    if (u < a) { const q = kisit(u / a, 0, 1); alfa = ease(kisit(q / 0.3, 0, 1)); acik = ease(kisit((q - 0.15) / 0.85, 0, 1)); }
    else if (u >= b) { const q = (u - b) / Z.buyu; s = 1 + 0.55 * ease(kisit(q / 0.75, 0, 1)); kar = kisit((q - 0.65) / 0.3, 0, 1); }
    else s = 1 + 0.015 * Math.sin((u - a) * 5);
    if (d.boss) s *= 1.12;                                     // BOSS WALL: buyuk duvar
    const w = K.w * s, h = K.h * s, x = K.x + K.w / 2 - w / 2, y = K.y + K.h / 2 - h / 2 - (s - 1) * K.h * 0.12;
    if (kar < 1) {
      kartZemin(i, x, y, w, h, t, alfa * (1 - kar));
      siluet(d[OY[i]], x, y, w, h, alfa * (1 - kar));
    }
    if (d.boss && kar < 1) {                                   // BOSS WALL: kirmizi nabiz cerceve
      cx.save(); cx.globalAlpha = (0.6 + 0.4 * Math.sin(t * 12)) * (1 - kar); cx.strokeStyle = '#ff2a3a'; cx.lineWidth = 14 * k;
      cx.shadowColor = '#ff2a3a'; cx.shadowBlur = 30 * k; cx.strokeRect(x - 8 * k, y - 8 * k, w + 16 * k, h + 16 * k); cx.restore();
    }
    if (u < a) kepenk(i, K, acik, t);
    if (kar > 0) {                                             // kapi kararir: duvar gecti
      cx.save(); cx.globalAlpha = kar * 0.88; cx.fillStyle = '#0a0618'; cx.fillRect(K.x, K.y, K.w, K.h); cx.restore();
    }
    oyuncuEtiket(i, K, (1 - kar) * (i === 1 && u >= a - 0.15 && u < b ? 0 : 1));   // motor 29: 3-2-1 sayilirken ortadaki etiket gizli (ust uste binme)
  }
  karakterCiz(d, u, t);
  if (d.ayna && u < b) {                                         // motor 23 MIRROR ROUND: ustte MIRROR! (gumus-camgobegi), kapi gelirken parlar
    // tam render 1: SUBSCRIBE dugmesi ayni yere geliyordu -> dugme gorunurken MIRROR! soner (ust uste binme yok)
    const ab = ABONE.reduce((m, x) => Math.max(m, kisit(1 - Math.max(x - t, t - x - ABONE_SURE, 0) / 0.3, 0, 1)), 0);
    const gir = ease(kisit(u / 0.4, 0, 1)) * (1 - ab), p = 1 + 0.06 * Math.sin(t * 6);
    if (gir > 0.01) yaziK('MIRROR!', W / 2, H * 0.165, 96 * k * ease(kisit(u / 0.4, 0, 1)) * p, ['#ffffff', '#c8f4ff', '#3ab8ff'], gir, '#06306a', '#ffffff');
  }
  if (d.hiz && u < b) {                                          // motor 26 SPEED ROUND: hizlanan duvarda ustte FASTER! (abone dugmesiyle ust uste binmez)
    const ab = ABONE.reduce((m, x) => Math.max(m, kisit(1 - Math.max(x - t, t - x - ABONE_SURE, 0) / 0.3, 0, 1)), 0);
    const gir = ease(kisit(u / 0.3, 0, 1)) * (1 - ab), p = 1 + 0.08 * Math.sin(t * 14);
    if (gir > 0.01) yaziK('FASTER!', W / 2, H * 0.12, 104 * k * ease(kisit(u / 0.3, 0, 1)) * p, ['#fff6a0', '#ffd23a', '#ff6a1a'], gir, '#4a1400', '#ffffff');
  }
  if (T && u >= c) freezeCiz(u - c, T, t);
