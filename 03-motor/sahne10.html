<script type="module">
// =====================================================================
// MOTOR 9 — HUMAN TETRIS 1 OYUNCU (REF-063 HumanWarmUp, kullanıcı 30 Eki 2026). sahne8.html'den türedi; temada neonYildiz: gökte renk döngülü
// MOTOR 10 — HUMAN TETRIS 13 (REF-064, CO-OP): sahne9.html'den; isikTunel (renk değiştiren, akan neon tünel), ovguTam (tam ekran kırmızı övgü).
// lazer yıldız + ışık topları, pembe yol okları, sağ altta "Next Challenge" ikonu, övgü yıldızlı sahne üstünde hız çizgili.
// Aşağısı motor 8 notu:
// MOTOR 8 — HUMAN TETRIS CO-OP 2 OYUNCU (REF-062 HumanWarmUp, kullanıcı 29 Eki 2026). sahne7.html'den türedi; döngü aynı
// (tabela -> "!" -> 3-2-1 -> düz renkli duvar), maske iki kişilik grup (grup/<ad>.png). REF-062 farkları (tema bayrakları):
// havaiFisek: gece göğünde yükselen fişek izleri + patlamalar, kapı üstünde neon P1 (yeşil) / P2 (pembe) VR gözlüklü oyuncu ikonları;
// sayimKose: 3-2-1 ekranı kaplamaz, sağ üstte renkli (3 yeşil, 2 sarı, 1 pembe); ovguSahne: övgü siyah kart değil, sahnenin üstünde
// renkli eğik yazı ("Keep it up!" gibi, metinler bizim); sayacRenk: "Mission n/N" altın.
// Aşağısı motor 7 notu:
// MOTOR 7 — HUMAN TETRIS 1 OYUNCU (REF-061 HumanWarmUp, kullanıcı 28 Eki 2026). sahne6.html'den türedi.
// REF-061 döngüsü (~10 sn): kafes kapıda neon "Coming Soon" tabelası -> kırmızı "!" uyarısı -> ekranı kaplayan yarı saydam dev 3-2-1
// (duvar kapıda küçük) -> düz renkli duvar büyür, ekranı kaplar -> geçer. Poz duvarda OYUK, içinden tünel görünür. Sol altta "Mission n/N".
// Birkaç duvarda bir siyah zemin + hız çizgili övgü kartı. Tur kartı/ROUND yok. Açılış: kullanıcı kararıyla VS/boksör kalır (YOU vs WALL).
// Aşağısı motor 6 notu:
// MOTOR 6 — HUMAN TETRIS CO-OP (kullanıcı 23 Eki 2026: ekranda/başlıkta/kapakta "TETRIS MODE" yok, yalnız HUMAN TETRIS) (2 oyuncu, TEK duvar + iki kişilik ORTAK delik). sahne4.html'den türedi (açılış, kartlar,
// abone aynı). Kural kaynağı: REF-058 (Glow Motion "Can You Two Fit? | HUMAN TETRIS x 2 player"), kullanıcı 23 Eki 2026:
// "Referanstaki gibi CO-OP olsun (tek duvar, iki kişilik ortak delik), ~5 dk, 24 duvar."
// REF-058 düzeni: tek geniş yol, ortada kırmızı kafes kapı; döngü ~11 sn: kapıda boş panel + neon yıldız -> poz panelde ->
// sağda dev pembe 3-2-1 -> panel büyüyüp ekranı kaplar -> geçer. Üstte START -> kalp bayrak ilerleme çubuğu + "WALLS : n/N".
// Motor 4 notu: REF-053 (Glow Motion "HUMAN TETRIS PVP BATTLE #3"),
// Masaüstü/POZ-DUVARI/TALIMATLAR.md, Masaüstü CLAUDE.md md. 22 (referansta ne görülüyorsa o).
// Kullanıcı (17 Eki 2026): "konsept aynı olsun, renkleri değiştir ... benzemesin ... zararlı gördüklerini çıkar".
//
// Referansın yapısı: ekran ikiye bölünmüş, her oyuncunun KENDİ şeridi (jöle yol + kafes kapı); sabit kamera.
// Duvar = parlak jöle panel, poz panelde OYUK (içinden arkası görünür). Döngü ~12 sn:
// PLAYER kartları -> ortada 3-2-1 (duvar kapıda küçük) -> duvar büyüyüp ekranı doldurur -> saydamlaşıp geçer.
// Bizim farkımız: P1 ZÜMRÜT, P2 KEHRİBAR; gökte fener + ışık küreleri; robot/çizgi film/TV görüntüsü YOK.
// Arka plan ve duvar dokuları Blender'da (tetris-pvp/varlik.py, Actions), burada yalnız 2B birleştirme.
// Deterministik: her kare t = kare/fps.
// =====================================================================
const S = await fetch('/spec/sabitler.json').then(r => r.json());
const FPS = S.video.fps;
const SP = new URLSearchParams(location.search);
const W = Number(SP.get('w') || 1920);
const H = Number(SP.get('h') || 1080);
const k = H / 1080;
const BOLUM_YOL = SP.get('bolum');
const BOLUM = BOLUM_YOL ? await fetch(BOLUM_YOL).then(r => r.json()) : {};
const BPM = BOLUM.bpm || 120;
const OLCU = 60 / BPM * 4;
const TOPLAM_OLCU = Number(SP.get('toplam') || BOLUM.toplam_olcu || 16);
const DUVARLAR = BOLUM.duvarlar || [];
const KARTLAR = BOLUM.kartlar || [];
const Z = BOLUM.zaman || { kart: 2.0, say: 3.0, buyu: 5.0, gec: 1.2, sure: 12.0 };
const TOPLAM_DUVAR = BOLUM.toplam_duvar || DUVARLAR.length;

// Tema: varsayılan = 2. video (REF-053, zümrüt/kehribar). Sonraki videolar bölüm JSON'undaki "tema" ile ezer (3. video REF-054: mor/sarı).
const TEMA = Object.assign({
  varlik: '/03-motor/tetris-pvp/varlik/', p1: '#22e07a', p2: '#ff9a1f', altin: '#ffc93a', camgobegi: '#3ff0e0',
  p1koyu: '#0d8a47', p2koyu: '#b85200', p1acik: '#d9ffe9', p2acik: '#fff1d6', p1parlak: '#c8ffe0', p2parlak: '#ffe2b8',
  vsSol: ['#0d6b3d', '#04241a'], vsSag: ['#9a4a00', '#2a1200'], isin: ['#1fb5a0', '#06264a'], wrapIsin: ['#ffb43a', '#3a1200'],
  ovguRenk: ['#fffbe0', '#7dffc0', '#18b8ff'], parca: ['#7dff9c', '#ffd27a', '#7fe7ff'], abone: ['#7dffb4', '#0c8a48'],
  fener: true, kuzeyIsigi: false,
  // 6. video (REF-057) açılışı: mavi ışınlı zemin + pembe neon yazı (kullanıcı 20 Eki 2026)
  acilisZemin: ['#3d8bff', '#071a6e'], acilisYazi: ['#ffffff', '#ffc2ec', '#ff3ea5', '#c4167a'], acilisKontur: '#2a0638', acilisIsilti: '#ff4fc8',
  vsAlt: 'HUMAN TETRIS · CO-OP', aboneAlt: 'NEW HUMAN TETRIS EVERY DAY', wrap: ["THAT'S", 'A WRAP!'], ovgu: ['GREAT!', 'EXCELLENT!', 'PERFECT!', 'AWESOME!'],
}, BOLUM.tema || {});
const VARLIK = TEMA.varlik;
const YER = await fetch(VARLIK + 'yerlesim.json').then(r => r.json());
const P1 = TEMA.p1, P2 = TEMA.p2, ALTIN = TEMA.altin, CAMGOBEGI = TEMA.camgobegi;
const RENK = [P1, P2];

// ------------------------------------------------------------ YÜKLEME
function resim(yol) {
  return new Promise((ok, hata) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => hata(new Error(yol)); i.src = yol; });
}
const font = new FontFace('Titan', 'url(/05-kapak/fontlar/TitanOne.ttf)');
document.fonts.add(await font.load());
// panel A camgöbeği->mavi, B sarı->yeşil (REF-058); duvarlar sırayla
const [GOK, SERIT] = await Promise.all(['gok.png', 'serit.png'].map(a => resim(VARLIK + a)));
const PAR_ORAN = 16 / 9;                                   // REF-061 duvarı 16:9 düz renk panel
const DUVAR_RENK = TEMA.duvarRenk || ['#22d36a', '#ff7a3a', '#5ff0f0', '#ff2fb8'];
// 6. video açılış boksörleri (boksor.py, Blender/Actions): yalnız bölümde 'acilis' kartı varsa yüklenir
const BOKSOR = { p1: { gard: [], jab: [] }, p2: { gard: [], jab: [] } };
if (KARTLAR.some(kk => kk.tip === 'acilis')) {
  const BY = TEMA.boksorVarlik || VARLIK;
  const BS = (await fetch(BY + 'yerlesim.json').then(r => r.json())).boksor;
  await Promise.all(['p1', 'p2'].flatMap(o => ['gard', 'jab'].flatMap(tr =>
    Array.from({ length: BS[o + '-' + tr] }, (_, j) => resim(BY + 'boksor/' + o + '-' + tr + '-' + String(j).padStart(2, '0') + '.png')
      .then(im => { BOKSOR[o][tr][j] = im; })))));
}
// her duvarda TEK iki kişilik maske (d.grup) -> <maskeVarlik>/grup/<ad>.png
const POZ_ADLAR = [...new Set(DUVARLAR.map(d => d.grup || d.p1))];
const MASKE = {};
const MV = TEMA.maskeVarlik || VARLIK;
await Promise.all(POZ_ADLAR.map(async a => { MASKE[a] = await resim(MV + (TEMA.maskeKlasor || 'grup/') + a + '.png'); }));

const cikti = document.getElementById('cikti');
cikti.width = W; cikti.height = H;
const cx = cikti.getContext('2d');
const KAT = document.createElement('canvas'); KAT.width = W; KAT.height = H;
const kc = KAT.getContext('2d');

// ------------------------------------------------------------ YARDIMCI
function rng(t) { let s = t >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const ease = p => p * p * (3 - 2 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const kisit = (v, a, b) => Math.max(a, Math.min(b, v));
function hex(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const F = px => `${Math.round(px)}px Titan, "Arial Black", sans-serif`;

function yazi(metin, x, y, px, dolgu, kontur = '#06122e', alfa = 1, isilti = null, ctx = cx) {
  ctx.save(); ctx.globalAlpha = kisit(alfa, 0, 1);
  ctx.font = F(px); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (isilti) { ctx.shadowColor = isilti; ctx.shadowBlur = px * 0.35; }
  ctx.lineWidth = px * 0.2; ctx.strokeStyle = kontur; ctx.strokeText(metin, x, y + px * 0.06);
  ctx.shadowBlur = 0;
  if (Array.isArray(dolgu)) {
    const g = ctx.createLinearGradient(0, y - px * 0.5, 0, y + px * 0.5);
    dolgu.forEach((c, i) => g.addColorStop(i / (dolgu.length - 1), c));
    ctx.fillStyle = g;
  } else ctx.fillStyle = dolgu;
  ctx.fillText(metin, x, y);
  ctx.globalAlpha *= 0.55; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.save(); ctx.beginPath(); ctx.rect(x - px * 8, y - px * 0.5, px * 16, px * 0.32); ctx.clip();
  ctx.fillText(metin, x, y); ctx.restore();                       // üst parlama bandı
  ctx.restore();
}

// ------------------------------------------------------------ SAHNE (sabit kamera)
const PAR = rng(53);
const PARILTI = Array.from({ length: 70 }, () => ({ x: PAR(), y: PAR() * 0.5, f: PAR() * 6.28, h: 0.6 + PAR() * 1.8, b: 0.8 + PAR() * 1.8 }));
// REF-064: tünelin rengi ~3,5 sn'de bir akarak değişir (yeşil, kırmızı, sarı, pembe) ve ışık derinlikten kameraya doğru akar. t'den deterministik.
const TUNEL_TON = [0, 70, -35, 300, 130, -60];
function isikTunel(t) {
  const f = t / 3.5, n = Math.floor(f), q = ease(kisit((f - n) / 0.35, 0, 1));
  const ton = lerp(TUNEL_TON[n % TUNEL_TON.length], TUNEL_TON[(n + 1) % TUNEL_TON.length], q);
  cx.save(); cx.filter = `hue-rotate(${ton}deg) saturate(1.3) brightness(0.82)`;
  cx.drawImage(GOK, 0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  for (const faz of [0, 0.5]) {
    const u = (t * 0.45 + faz) % 1, s = 1 + 0.32 * u;
    cx.globalAlpha = 0.10 * Math.sin(u * Math.PI);                  // kesit 1: 0,34 tüneli soluk pastele yaktı, REF-064 doygun
    cx.drawImage(GOK, W / 2 - W * s / 2, H * 0.42 - H * 0.42 * s, W * s, H * s);
  }
  cx.restore();
}
function sahneCiz(t) {
  cx.drawImage(GOK, 0, 0, W, H);
  if (TEMA.isikTunel) { isikTunel(t); cx.drawImage(SERIT, 0, 0, W, H); yolOklari(t); if (!ABONE.some(a => t >= a && t < a + ABONE_SURE)) oyuncuIkon(t); return; }   // SUBSCRIBE ikonların üstüne binmesin
  if (TEMA.neonYildiz) { yildizGece(t); cx.drawImage(SERIT, 0, 0, W, H); yolOklari(t); ampulCiz(t); neonTabela(t); return; }
  if (TEMA.havaiFisek) { fisekGece(t); cx.drawImage(SERIT, 0, 0, W, H); yolOklari(t); oyuncuIkon(t); return; }
  if (TEMA.tekOyuncu) { tunelHareket(t); cx.drawImage(SERIT, 0, 0, W, H); yolOklari(t); return; }
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (const s of PARILTI) {
    const a = Math.max(0, Math.sin(t * s.h + s.f)) ** 3;
    if (a < 0.02) continue;
    const x = s.x * W, y = s.y * H + Math.sin(t * 0.3 + s.f) * 6 * k, r = s.b * k * (2 + 6 * a);
    const g = cx.createRadialGradient(x, y, 0, x, y, r * 3);
    g.addColorStop(0, `rgba(255,240,200,${0.9 * a})`); g.addColorStop(1, 'rgba(255,200,120,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 3, 0, 6.283); cx.fill();
  }
  cx.restore();
  gokHareket(t);
  cx.drawImage(SERIT, 0, 0, W, H);
  yolOklari(t); ampulCiz(t);
}

// REF-063: gökte ~3,5 sn'de bir renk değiştiren dev lazer yıldız çizgileri + ışık topları. t'den deterministik.
const YILDIZ_RENK = ['#ff2a4a', '#ff3fd0', '#19e0d0', '#7a4dff', '#ff8a2a', '#ff3fd0'];
function yildizCiz(x, y, R, don, renk, a, kal) {
  cx.beginPath();
  for (let i = 0; i <= 10; i++) { const q = don + i * Math.PI / 5, r = i % 2 ? R * 0.42 : R; const px = x + Math.cos(q) * r, py = y + Math.sin(q) * r; i ? cx.lineTo(px, py) : cx.moveTo(px, py); }
  cx.strokeStyle = hex(renk, a); cx.lineWidth = kal; cx.shadowColor = renk; cx.shadowBlur = 26 * k; cx.stroke();
}
// Kapı üstünde neon seri tabelası (tabela kuralı, TALIMATLAR §4)
function neonTabela(t) {
  if (ABONE.some(a => t >= a && t < a + ABONE_SURE)) return;   // SUBSCRIBE aynı bölgede, üst üste binmesin
  const A = aciklik(), nab = 0.86 + 0.14 * Math.sin(t * 5);
  yazi('HUMAN TETRIS', A.x + A.w / 2, A.y - 100 * k, 62 * k, ['#ffffff', '#ffd6f0', '#ff3fb0'], '#2a0638', nab, '#ff3fb0');
}
function yildizGece(t) {
  const n = Math.floor(t / 3.5), q = t / 3.5 - n, ren = YILDIZ_RENK[n % YILDIZ_RENK.length], ren2 = YILDIZ_RENK[(n + 2) % YILDIZ_RENK.length];
  const r = rng(9000 + n * 17), gir = Math.min(1, q / 0.12), cik = Math.min(1, (1 - q) / 0.12);
  cx.save(); cx.globalCompositeOperation = 'lighter'; cx.lineJoin = 'round';
  const g = cx.createRadialGradient(W / 2, H * 0.3, 0, W / 2, H * 0.3, W * 0.62);
  g.addColorStop(0, hex(ren, 0.32 * gir * cik)); g.addColorStop(1, hex(ren, 0));
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) {                        // gök tozu: ekranın üstü boş kalmaz
    const r3 = rng(1500 + i * 53), x = W * r3(), y = H * 0.62 * r3(), f = r3() * 6.28, h = 1 + r3() * 3, a = 0.25 + 0.75 * Math.max(0, Math.sin(t * h + f));
    cx.fillStyle = hex(i % 4 ? '#ffffff' : ren, a); cx.beginPath(); cx.arc(x, y, (1 + r3() * 2.2) * k, 0, 6.283); cx.fill();
  }
  for (let i = 0; i < 8; i++) {                         // sahne kulelerinden göğe tarayan spot huzmeleri
    const s = i < 4 ? -1 : 1, x0 = W / 2 + s * W * (0.20 + (i % 4) * 0.09), y0 = H * 0.50, ac = s * 0.28 + Math.sin(t * (0.5 + i * 0.07) + i * 1.9) * 0.42;
    const L = H * 0.95, ux = Math.sin(ac), uy = -Math.cos(ac), gen = 46 * k, rk = YILDIZ_RENK[(n + i) % YILDIZ_RENK.length];
    const gb = cx.createLinearGradient(x0, y0, x0 + ux * L, y0 + uy * L);
    gb.addColorStop(0, hex(rk, 0.42)); gb.addColorStop(1, hex(rk, 0));
    cx.fillStyle = gb; cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(x0 + ux * L - uy * gen, y0 + uy * L + ux * gen); cx.lineTo(x0 + ux * L + uy * gen, y0 + uy * L - ux * gen); cx.closePath(); cx.fill();
  }
  yildizCiz(W * (0.12 + 0.76 * r()), H * 0.14, H * 0.2, r() * 6.28 + t * 0.3, ren2, 0.7 * gir * cik, 3 * k);
  yildizCiz(W * (0.25 + 0.5 * r()), H * (0.18 + 0.18 * r()), H * (0.42 + q * 0.2), r() * 6.28 + t * 0.12, ren, 0.95 * gir * cik, 7 * k);
  yildizCiz(W * (0.5 + (r() - 0.5) * 0.3), H * 0.32, H * (0.14 + q * 0.1), r() * 6.28 - t * 0.5, ren2, 0.85 * gir * cik, 4 * k);
  cx.shadowBlur = 0;
  for (let i = 0; i < 26; i++) {
    const r2 = rng(4000 + i * 31), x = W * r2(), y = H * 0.46 * r2(), h = 0.8 + r2() * 1.6, f = r2() * 6.28, a = 0.35 + 0.65 * Math.max(0, Math.sin(t * h + f));
    const R = (8 + 16 * r2()) * k, gg = cx.createRadialGradient(x, y, 0, x, y, R * 2.4);
    gg.addColorStop(0, hex(i % 3 ? ren : '#ffffff', a)); gg.addColorStop(1, hex(ren, 0));
    cx.fillStyle = gg; cx.beginPath(); cx.arc(x, y, R * 2.4, 0, 6.283); cx.fill();
  }
  cx.restore();
}

// REF-062: gece boyunca durmayan havai fişek. Her ~0,55 sn'de bir roket: alttan pırıltı iziyle yükselir (0,9 sn), tepede
// patlar (çok renkli çiçek, yerçekimiyle düşen kuyruklu kıvılcımlar, 2 sn). Hepsi t ve roket numarasından deterministik.
const FISEK_RENK = ['#ff4a5a', '#ffd84a', '#7dff6a', '#4ad8ff', '#ff6ad8', '#ffffff', '#ff9a3a', '#b98aff'];
function fisekGece(t) {
  const ARA = 0.55, YUK = 0.9, OMUR = 2.1;
  const n1 = Math.floor(t / ARA);
  cx.save(); cx.globalCompositeOperation = 'lighter'; cx.lineCap = 'round';
  for (let j = n1 - Math.ceil((YUK + OMUR) / ARA); j <= n1; j++) {
    if (j < 0) continue;
    const u = t - j * ARA; if (u < 0 || u > YUK + OMUR) continue;
    const r = rng(7000 + j * 13);
    const x0 = W * (0.04 + 0.92 * r()), xb = x0 + (r() - 0.5) * W * 0.12;
    const yb = H * (0.06 + 0.30 * r()), y0 = H * 0.62;
    const renk = FISEK_RENK[Math.floor(r() * FISEK_RENK.length)], renk2 = FISEK_RENK[Math.floor(r() * FISEK_RENK.length)];
    const R = (150 + 140 * r()) * k, np = 54 + Math.floor(r() * 30);
    if (u < YUK) {                                         // yükselen roket: pırıltılı beyaz iz
      const q = ease(u / YUK), x = lerp(x0, xb, q), y = lerp(y0, yb, q);
      for (let i = 0; i < 18; i++) {
        const qq = Math.max(0, q - i * 0.025), px = lerp(x0, xb, qq) + (r() - 0.5) * 6 * k, py = lerp(y0, yb, qq) + i * 2 * k;
        cx.fillStyle = `rgba(255,245,225,${(0.85 * (1 - i / 18)).toFixed(3)})`;
        cx.beginPath(); cx.arc(px, py, (2.6 - i * 0.1) * k, 0, 6.283); cx.fill();
      }
      const g = cx.createRadialGradient(x, y, 0, x, y, 16 * k);
      g.addColorStop(0, 'rgba(255,250,235,0.95)'); g.addColorStop(1, 'rgba(255,220,160,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, 16 * k, 0, 6.283); cx.fill();
      continue;
    }
    const v = u - YUK, yay = 1 - Math.exp(-v * 3.2), a = Math.max(0, 1 - v / OMUR) ** 1.4, dus = 70 * k * v * v;
    if (v < 0.18) {                                        // patlama anı parlaması
      const g = cx.createRadialGradient(xb, yb, 0, xb, yb, R * 0.6);
      g.addColorStop(0, `rgba(255,255,240,${(0.7 * (1 - v / 0.18)).toFixed(3)})`); g.addColorStop(1, 'rgba(255,255,240,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(xb, yb, R * 0.6, 0, 6.283); cx.fill();
    }
    for (let i = 0; i < np; i++) {
      const ang = i / np * 6.283 + r() * 0.08, hiz = 0.75 + 0.35 * r(), rk = i % 3 ? renk : renk2;
      const d = R * yay * hiz, d0 = R * Math.max(0, yay - 0.16) * hiz;
      const px = xb + Math.cos(ang) * d, py = yb + Math.sin(ang) * d + dus;
      const qx = xb + Math.cos(ang) * d0, qy = yb + Math.sin(ang) * d0 + dus * 0.8;
      const sim = 0.6 + 0.4 * Math.sin(t * 40 + i);       // kıvılcım parıltısı
      cx.strokeStyle = hex(rk, 0.85 * a * sim); cx.lineWidth = 2.6 * k;
      cx.beginPath(); cx.moveTo(qx, qy); cx.lineTo(px, py); cx.stroke();
      cx.fillStyle = hex('#ffffff', 0.8 * a * sim); cx.beginPath(); cx.arc(px, py, 2.2 * k, 0, 6.283); cx.fill();
    }
  }
  cx.restore();
}

// REF-062: kapının üstünde neon çizgi oyuncu ikonları (VR gözlüklü büst) + P1 yeşil / P2 pembe yazı
function oyuncuIkon(t) {

      const h = cx.createRadialGradient(x, yI + s * 0.2, s * 0.2, x, yI + s * 0.2, s * 1.35);

    g.addColorStop(0, hex('#7fe7ff', nab)); g.addColorStop(1, hex('#ff7ae6', nab));

    cx.beginPath(); cx.arc(x, yI - s * 0.15, s * 0.42, Math.PI * 1.05, Math.PI * 1.95); cx.stroke();          // kafa (kask)
    cx.beginPath(); cx.roundRect(x - s * 0.5, yI - s * 0.18, s, s * 0.3, s * 0.12); cx.stroke();               // VR gözlük
    cx.beginPath(); cx.moveTo(x - s * 0.3, yI + s * 0.18); cx.quadraticCurveTo(x, yI + s * 0.48, x + s * 0.3, yI + s * 0.18); cx.stroke();  // çene
    cx.beginPath(); cx.moveTo(x - s * 0.85, yI + s * 0.95); cx.quadraticCurveTo(x - s * 0.8, yI + s * 0.5, x - s * 0.2, yI + s * 0.48);
    cx.moveTo(x + s * 0.2, yI + s * 0.48); cx.quadraticCurveTo(x + s * 0.8, yI + s * 0.5, x + s * 0.85, yI + s * 0.95); cx.stroke();   // omuzlar
    cx.beginPath(); cx.moveTo(x - s * 0.2, yI + s * 0.48); cx.lineTo(x, yI + s * 0.72); cx.lineTo(x + s * 0.2, yI + s * 0.48); cx.stroke(); // yaka
    cx.restore();

// REF-061 tüneli: kameraya akan neon altıgen halkalar + küp ışıklarında pırıltı (Blender tünelinin üstünde, hareket hissi)
const TP = rng(61);
const TPIR = Array.from({ length: 35 }, () => ({ a: TP() * 6.283, r: 0.55 + TP() * 0.45, f: TP() * 6.28, h: 0.8 + TP() * 2 }));
function tunelHareket(t) {
  const ox = W / 2, oy = H * 0.47;

    const p = ((t * 0.18 + j / 5) % 1), s = 0.08 + p * p * 1.9, a = Math.min(1, p * 4) * Math.min(1, (1 - p) * 3) * 0.35;
    const R = H * 0.62 * s;

    for (let i = 0; i <= 6; i++) { const q = -Math.PI / 2 + i * Math.PI / 3; const x = ox + Math.cos(q) * R * 1.12, y = oy + Math.sin(q) * R; i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
    const rk = j % 2 ? '#ff4fd8' : '#9b5bff';

}

// ------------------------------------------------------------ GÖKTE HAREKET (kullanıcı 17 Eki: "arkada boş durmasın ... görsel şölen")
// yükselen fenerler, havai fişek, tarayan ışık huzmeleri, kayan yıldız. Hepsi t'den deterministik.
const FR = rng(77);
const FENER = Array.from({ length: 34 }, () => ({ x: FR(), faz: FR(), hiz: 0.025 + FR() * 0.035, b: 0.5 + FR() * 0.9, sal: FR() * 6.28 }));
const FISEK_ARALIK = 1.6;
function gokHareket(t) {
  cx.save(); cx.globalCompositeOperation = 'lighter';
  // tarayan ışık huzmeleri (şeritlerin arkasından)
  for (const [bx, faz, renk] of [[0.08, 0, CAMGOBEGI], [0.5, 2.1, ALTIN], [0.92, 4.2, TEMA.parca[0]], [0.3, 1.0, TEMA.parca[1]], [0.7, 3.3, TEMA.parca[2]]]) {
    const a = Math.sin(t * 0.55 + faz) * 0.5, L = H * 1.1, x0 = W * bx, y0 = H * 0.75;
    const ux = Math.sin(a), uy = -Math.cos(a), gen = 60 * k;
    const g = cx.createLinearGradient(x0, y0, x0 + ux * L, y0 + uy * L);
    g.addColorStop(0, hex(renk, 0.30)); g.addColorStop(1, hex(renk, 0));
    cx.fillStyle = g; cx.beginPath(); cx.moveTo(x0, y0);
    cx.lineTo(x0 + ux * L - uy * gen, y0 + uy * L + ux * gen); cx.lineTo(x0 + ux * L + uy * gen, y0 + uy * L - ux * gen);
    cx.closePath(); cx.fill();
  }
  // 6. video (REF-057): gökte dalgalanan kuzey ışığı perdeleri (Blender göğünün üstüne hafif, hareketli)
  if (TEMA.kuzeyIsigi) for (let j = 0; j < 4; j++) {
    const renk = ['#ff5ad8', '#3fe0ff', '#9b6bff', '#7dffd8'][j], y0 = H * (0.10 + 0.07 * j);
    cx.beginPath();
    for (let x = 0; x <= W; x += 24 * k) {
      const y = y0 + Math.sin(x / W * 6.283 * (1.2 + 0.3 * j) + t * (0.35 + 0.1 * j) + j) * 40 * k;
      x ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    for (let x = W; x >= 0; x -= 24 * k) {
      const y = y0 + 150 * k + Math.sin(x / W * 6.283 * (1.0 + 0.2 * j) + t * (0.3 + 0.08 * j) + j * 2) * 55 * k;
      cx.lineTo(x, y);
    }
    cx.closePath();
    const g = cx.createLinearGradient(0, y0 - 40 * k, 0, y0 + 210 * k);
    g.addColorStop(0, hex(renk, 0)); g.addColorStop(0.55, hex(renk, 0.10 + 0.05 * Math.sin(t * 0.8 + j))); g.addColorStop(1, hex(renk, 0));
    cx.fillStyle = g; cx.fill();
  }
  // yükselen fenerler (sallanarak)
  if (TEMA.fener) for (const f of FENER) {
    const p = (f.faz + t * f.hiz) % 1;
    const x = f.x * W + Math.sin(t * 0.8 + f.sal) * 14 * k, y = H * (1.05 - 1.15 * p);
    const s = (16 + 18 * f.b) * k, a = Math.min(1, p * 5) * Math.min(1, (1 - p) * 4);
    const g = cx.createRadialGradient(x, y, 0, x, y, s * 2.6);
    g.addColorStop(0, `rgba(255,190,90,${0.55 * a})`); g.addColorStop(1, 'rgba(255,120,30,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, s * 2.6, 0, 6.283); cx.fill();
    cx.fillStyle = `rgba(255,214,140,${0.9 * a})`;
    cx.beginPath(); cx.roundRect(x - s * 0.42, y - s * 0.6, s * 0.84, s * 1.1, s * 0.25); cx.fill();
  }
  // havai fişek: her FISEK_ARALIK sn'de bir patlama, 1,8 sn yaşar
  const nf = Math.floor(t / FISEK_ARALIK);
  for (let j = nf - 1; j <= nf; j++) {
    if (j < 0) continue;
    const u = t - j * FISEK_ARALIK; if (u > 1.8) continue;
    const r = rng(1000 + j);
    const cx0 = W * (0.06 + 0.88 * r()), cy0 = H * (0.08 + 0.3 * r());
    const renk = [ALTIN, CAMGOBEGI, TEMA.parca[0], '#ffffff', P2][Math.floor(r() * 5)];
    const n = 36, R = (120 + 90 * r()) * k;
    const yay = ease(Math.min(1, u / 0.9)), a = 1 - Math.max(0, (u - 0.5) / 1.3);
    for (let i = 0; i < n; i++) {
      const ang = i / n * 6.283 + r() * 0.1;
      const d = R * yay * (0.85 + 0.3 * r());
      const px = cx0 + Math.cos(ang) * d, py = cy0 + Math.sin(ang) * d + 60 * k * u * u;
      const g = cx.createRadialGradient(px, py, 0, px, py, 9 * k);
      g.addColorStop(0, hex(renk, 0.95 * a)); g.addColorStop(1, hex(renk, 0));
      cx.fillStyle = g; cx.beginPath(); cx.arc(px, py, 9 * k, 0, 6.283); cx.fill();
    }
  }
  // kayan yıldız (her ~3 sn)
  const ky = Math.floor(t / 3.1), ku = t - ky * 3.1;
  if (ku < 0.7) {
    const r = rng(500 + ky), x0 = W * r(), y0 = H * 0.05 + H * 0.2 * r(), q = ku / 0.7;
    const x = x0 + 520 * k * q, y = y0 + 180 * k * q;
    const g = cx.createLinearGradient(x - 220 * k, y - 76 * k, x, y);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${0.9 * (1 - q)})`);
    cx.strokeStyle = g; cx.lineWidth = 3 * k; cx.beginPath(); cx.moveTo(x - 220 * k, y - 76 * k); cx.lineTo(x, y); cx.stroke();
  }
  cx.restore();
}

// şerit kamerası (varlik-gunbatimi.py ile aynı): z 2,6 m, 10,5° aşağı, dikey yarı-FOV tan = 12/21,85, görüntü 1920x1080
// motor 7: kamera varlik yerlesiminden (REF-061 tüneli yatay kamera, egim -3, lens 18)
const KY = (YER.yol && YER.yol.kam) || { z: 2.6, egim: 10.5, lens: 21.85, sensor: 24 };
const KAM = { z: KY.z, p: KY.egim * Math.PI / 180, tv: (KY.sensor / 2) / KY.lens };
KAM.th = KAM.tv * 1920 / 1080;
function izdus(X, Y, Zd) {
  const dz = Zd - KAM.z, cp = Math.cos(KAM.p), sp = Math.sin(KAM.p);
  const zc = Y * cp - dz * sp, yc = Y * sp + dz * cp;
  const sx = 960 + (X / zc) / KAM.th * 960, sy = 540 - (yc / zc) / KAM.tv * 540;
  return [sx * W / 1920, sy * H / 1080];
}
const YK = (YER.yol && YER.yol.y_kapi) || 12;
// yolda kameraya akan parlak yön okları (kullanıcı 17 Eki: "yollardaki yön işaretleri olsun zemindeki")
// REF-058 yolunda chevron basamaklar zaten parlak (Blender) -> akan oklar ince ve yarı saydam (seri kuralı: yolda akan ok)
function yolOklari(t) {
  cx.save();
  const ARA = 1.5, HIZ_OK = 1.8, N = 8, UZ = YK - 1.2;
  for (let j = 0; j < N; j++) {
    const y = UZ + 0.2 - ((j * ARA + t * HIZ_OK) % (ARA * N));
    if (y < 2.6 || y > UZ) continue;
    const a = Math.min(1, (UZ - y) / 1.5) * Math.min(1, (y - 2.6) / 0.6);
    const z = 0.06, w = 0.9, d = 0.42, kal = 0.18;
    const pts = [[-w, y + d], [0, y], [w, y + d], [w, y + d + kal], [0, y + kal], [-w, y + d + kal]].map(q => izdus(q[0], q[1], z));
    cx.beginPath(); pts.forEach((q, n) => n ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1])); cx.closePath();
    cx.shadowColor = TEMA.okRenk || '#ffffff'; cx.shadowBlur = 16 * k;
    cx.fillStyle = TEMA.okRenk ? hex(TEMA.okRenk, 0.7 * a) : `rgba(255,245,252,${0.55 * a})`; cx.fill();
  }
  cx.restore();
}
// kapı ampulleri: kayan ışık dizisi (marquee)
function ampulCiz(t) {
  const L = YER.ampul_p1; if (!L) return;
  const sx = W / 1920, sy = H / 1080;
  cx.save(); cx.globalCompositeOperation = 'lighter';
  L.forEach((q, n) => {
    const a = 0.35 + 0.65 * Math.max(0, Math.sin(t * 7 - n * 0.9)) ** 2;
    const x = q[0] * sx, y = q[1] * sy, r = 13 * k;
    const g = cx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,250,220,${a})`); g.addColorStop(0.35, `rgba(255,214,120,${0.7 * a})`); g.addColorStop(1, 'rgba(255,170,60,0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r, 0, 6.283); cx.fill();
  });
  cx.restore();
}

// kapı açıklığı (ekran px): şerit görüntüsü 1920x1080
function aciklik() {
  const a = YER.aciklik_p1, sx = W / 1920, sy = H / 1080;
  return { x: a[0] * sx, y: a[1] * sy, w: (a[2] - a[0]) * sx, h: (a[3] - a[1]) * sy };
}
// en yakında duvar ekranı TAMAMEN kaplar (seri kuralı: boşluk bırakmasın)
function buyukKutu() {
  const w = Math.max(W, H * PAR_ORAN) * 1.04, h = w / PAR_ORAN;
  return { x: (W - w) / 2, y: H / 2 - h / 2, w, h };
}

// ------------------------------------------------------------ DUVAR (jöle panel + poz oyuğu)
// i = panel türü (0 = A camgöbeği/mavi, 1 = B sarı/yeşil)
function duvarCiz(i, kutu, maske, alfa) {
  if (alfa <= 0) return;
  const { x, y, w, h } = kutu;
  duvarIc(i, x, y, w, h, DUVAR_RENK[i % DUVAR_RENK.length], maske, alfa);
}
// tek kişilik maske panele oranı korunarak oturur: boy panelin %90'ı, tabanı panelin altına yakın, yatayda ortalı
function maskeKutu(m, x, y, w, h) {
  let mh = h * 0.9, mw = mh * m.width / m.height;
  if (mw > w * 0.94) { mw = w * 0.94; mh = mw * m.height / m.width; }
  return [x + (w - mw) / 2, y + h * 0.97 - mh, mw, mh];
}
function duvarIc(i, x, y, w, h, panel, maske, alfa) {
  if (!maske) { cx.save(); cx.globalAlpha = alfa; cx.fillStyle = panel; cx.fillRect(x, y, w, h); cx.restore(); return; }
  const MK = maskeKutu(maske, x, y, w, h);
  // 1) oyuğun içi: arkası görünür ama koyulaşır (siluet okunur)
  kc.clearRect(0, 0, W, H);
  kc.drawImage(maske, ...MK);
  kc.globalCompositeOperation = 'source-in';
  kc.fillStyle = 'rgba(20,6,50,0.28)'; kc.fillRect(x, y, w, h);        // REF-061: oyukta tünel görünür (kesit 1: uzak parlama oyuğu beyaz gösteriyordu)
  kc.globalCompositeOperation = 'source-over';
  cx.save(); cx.globalAlpha = alfa; cx.drawImage(KAT, 0, 0); cx.restore();
  // 2) panel, oyuk delinmiş; gölgesi (renkli ışıltı) oyuğun kenarına taşar = parlak kenar
  kc.clearRect(0, 0, W, H);
  kc.fillStyle = panel; kc.fillRect(x, y, w, h);
  kc.globalCompositeOperation = 'destination-out';
  kc.drawImage(maske, ...MK);
  kc.globalCompositeOperation = 'source-over';
  cx.save(); cx.globalAlpha = alfa;
  cx.shadowColor = 'rgba(255,255,255,0.5)'; cx.shadowBlur = Math.max(3, w * 0.006);
  cx.drawImage(KAT, 0, 0);
  cx.restore();
}

function evre(u) {
  const a = Z.kart, b = a + Z.say, c = b + Z.buyu, d = c + Z.gec;
  if (u < a) return { ad: 'kart', p: u / Z.kart };
  if (u < b) return { ad: 'say', p: (u - a) / Z.say };
  if (u < c) return { ad: 'buyu', p: (u - b) / Z.buyu };
  if (u < d) return { ad: 'gec', p: (u - c) / Z.gec };
  return { ad: 'bos', p: (u - d) / Math.max(0.01, Z.sure - d) };
}

function kutuLerp(A, B, q) { return { x: lerp(A.x, B.x, q), y: lerp(A.y, B.y, q), w: lerp(A.w, B.w, q), h: lerp(A.h, B.h, q) }; }
function olcekle(K, s) { return { x: K.x + K.w / 2 - K.w * s / 2, y: K.y + K.h / 2 - K.h * s / 2, w: K.w * s, h: K.h * s }; }

// boş kapı paneli: koyu cam + ortada neon pırıltı yıldızı (REF-058: duvar gelmeden kapıda yıldız)
function kapiKutusu() {
  const A = aciklik();
  let aw = A.w, ah = A.w / PAR_ORAN; if (ah > A.h) { ah = A.h; aw = ah * PAR_ORAN; }
  return { x: A.x + (A.w - aw) / 2, y: A.y + A.h - ah, w: aw, h: ah };
}
// REF-061: duvar gelmeden kapının kirişinden asılı neon "Coming Soon" tabelası (yazı stili bizim: Titan, pembe/camgöbeği neon)
function bosPanel(t, alfa = 1) {
  const A = aciklik(), tw = A.w * 0.64, th = tw * 0.5, x = A.x + A.w / 2 - tw / 2, y = A.y + A.h * 0.1;   // kesit 1: tabela küçüktü
  cx.save(); cx.globalAlpha = alfa;
  cx.strokeStyle = 'rgba(230,225,255,0.9)'; cx.lineWidth = 2 * k;                   // askı telleri
  cx.beginPath(); cx.moveTo(x + tw * 0.2, A.y); cx.lineTo(x + tw * 0.2, y); cx.moveTo(x + tw * 0.8, A.y); cx.lineTo(x + tw * 0.8, y); cx.stroke();
  cx.fillStyle = 'rgba(14,6,30,0.94)'; cx.beginPath(); cx.roundRect(x, y, tw, th, 8 * k); cx.fill();
  const tit = 0.85 + 0.15 * Math.sin(t * 13) * Math.sin(t * 3.1);                 // neon titreşimi
  cx.shadowColor = '#ff4fd8'; cx.shadowBlur = 18 * k; cx.strokeStyle = hex('#ff7ae6', tit); cx.lineWidth = 3 * k;
  cx.beginPath(); cx.roundRect(x + 4 * k, y + 4 * k, tw - 8 * k, th - 8 * k, 6 * k); cx.stroke();
  cx.shadowBlur = 0;
  cx.save(); cx.translate(x + tw / 2, y + th * 0.36); cx.transform(1, 0, -0.18, 1, 0, 0);
  yazi('Coming', 0, 0, th * 0.34, ['#ffffff', '#bff6ff', '#3fe8ff'], '#06122e', tit, '#3fe8ff');
  cx.restore();
  cx.save(); cx.translate(x + tw / 2, y + th * 0.72); cx.transform(1, 0, -0.18, 1, 0, 0);
  yazi('Soon', 0, 0, th * 0.36, ['#ffffff', '#ffc2ec', '#ff3ea5'], '#3a0640', tit, '#ff4fc8');
  cx.restore();
  cx.restore();
}
// REF-061: tabela üstünde yanıp sönen kırmızı üçgen "!" + ekran kenarlarında kırmızı nabız
function uyariCiz(t, p) {
  const A = aciklik(), nab = 0.5 + 0.5 * Math.sin(p * Math.PI * 6);
  cx.save();
  const g = cx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75);
  g.addColorStop(0, 'rgba(255,20,60,0)'); g.addColorStop(1, `rgba(255,20,60,${0.35 * nab})`);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  const cx0 = A.x + A.w / 2, cy0 = A.y + A.h * 0.42, R = A.h * 0.55 * (1 + 0.06 * nab);

    const q = ease(kisit((u - 0.5) / (TIK - 0.5), 0, 1));
    const hx = lerp(x0 + bw + 200 * k, x0 + bw * 0.62, q), hy = lerp(yM + 150 * k, yM + 22 * k, q);
    const sc = (u >= TIK && u < TIK + 0.15) ? 0.85 : 1;
    cx.save(); cx.translate(hx, hy); cx.scale(sc, sc);
    cx.fillStyle = '#ffffff'; cx.strokeStyle = '#111827'; cx.lineWidth = 3.5 * k;
    cx.beginPath();
    cx.moveTo(0, 0); cx.lineTo(0, 54 * k); cx.lineTo(13 * k, 41 * k); cx.lineTo(23 * k, 63 * k);
    cx.lineTo(32 * k, 59 * k); cx.lineTo(22 * k, 37 * k); cx.lineTo(40 * k, 37 * k); cx.closePath();
    cx.fill(); cx.stroke();
    if (u >= TIK && u < TIK + 0.4) {
      const r2 = (u - TIK) / 0.4;
      cx.strokeStyle = `rgba(255,255,255,${(1 - r2).toFixed(3)})`; cx.lineWidth = 5 * k;
      cx.beginPath(); cx.arc(0, 0, 16 * k + 50 * k * r2, 0, 6.283); cx.stroke();
    }
    cx.restore();
  }
  // tıklamada pırıltı
  if (abone && u < TIK + 0.7) {
    const r3 = (u - TIK) / 0.7;
    cx.save(); cx.globalCompositeOperation = 'lighter';
    for (let j = 0; j < 14; j++) {
      const ang = j / 14 * 6.283, d = (60 + 260 * r3) * k;
      const px = W / 2 + Math.cos(ang) * d * 1.6, py = yM + Math.sin(ang) * d * 0.6;
      cx.fillStyle = hex(j % 2 ? ALTIN : P1, 1 - r3); cx.beginPath(); cx.arc(px, py, 7 * k, 0, 6.283); cx.fill();
    }
    cx.restore();
  }
}

window.kareKur = kareKur;
window.kareAl = (bicim, kalite) => {
  if (bicim === 'png') return cikti.toDataURL('image/png');
  if (bicim === 'jpeg') return cikti.toDataURL('image/jpeg', kalite || 1);
  return cikti.toDataURL('image/webp', kalite || 1);
};
window.SURE_OLCU = TOPLAM_OLCU;
window.TOPLAM_KARE = Math.round(TOPLAM_OLCU * OLCU * FPS);
window.NOTA_SAYISI = DUVARLAR.length;
window.KLIP_SAYISI = POZ_ADLAR.length;
window.SILUET_VAR = POZ_ADLAR.every(a => MASKE[a]);
kareKur(0);
window.HAZIR = true;
</script>
