<meta charset="utf-8">
<title>HUMAN TETRIS 20 - motor 17 (uc serit balon pist)</title>
<style>
  html,body { margin:0; background:#1a0848; overflow:hidden; }
  canvas { display:block; }
</style>
<canvas id="cikti"></canvas>

<script type="module">
// =====================================================================
// MOTOR 17 — HUMAN TETRIS 20 (REF-072 TetrisBounce "3 PLAYER BATTLE", 1v1v1, 4 tur x 3 duvar = 12 duvar / 36 poz).
// Bagimsiz motor (motor 16 zincirinden degil): ekran uce bolunur, her oyuncunun kendi seridi (P1 pembe sol / P2 mavi orta / P3 sari sag);
// arka plan Blender'da (tetris-pvp/varlik-balonpist.py: gok.png + serit-p1..p3.png), burada 2B birlestirme. Yardimcilar (yazi, maskot,
// abone + LIKE/COMMENT/SHARE) motor 16'dan.
// REF-072 duvar dongusu (~20 sn, Z bolum JSON'undan):
//   kart  : kapida pastel kart (serit renginde, parilti) belirir, icine siyah siluet oturur
//   say   : sag ustte buyuk 3-2-1 (siluet kapida bekler)
//   buyu  : kapida PLAYER 1/2/3 plakasi + kart yaklasip buyur, sonda kapi kararir (duvar gecer)
//   gec   : tam ekran uc renkli panel, her panelde ayni pozun dev silueti (beyaz kontur + serit renginde isilti) + ovgu yazisi
// Ustte Start -> kupa ilerleme cubugu (uzerinde kosan mini maskot) + ROUND n; sol ustte KENDI maskotumuz yildizin ustunde, video boyunca.
// Yazi okunurlugu (Masaustu md. 28, 6 Kas 2026): her yazi mor kalin kontur + disinda beyaz ikinci kontur (yaziK); pastel zemin ustune pastel yazi yok.
// Renk adi kendi renginde (TALIMATLAR §4): PINK pembe, BLUE mavi, YELLOW sari, PLAYER n kendi renginde.
// Telif: referanstaki anime kiz maskot / oyuncu kartlarindaki anime karakterler alinmaz.
// Deterministik: her kare t = kare/fps.
// =====================================================================
const S = await fetch('/spec/sabitler.json').then(r => r.json());
const FPS = S.video.fps;
const SP = new URLSearchParams(location.search);
const W = Number(SP.get('w') || 1920);
const H = Number(SP.get('h') || 1080);
const k = H / 1080;
const BOLUM_YOL = SP.get('bolum');
const BOLUM = BOLUM_YOL ? await fetch(BOLUM_YOL).then(r => r.json()) : {};
const BPM = BOLUM.bpm || 120;
const OLCU = 60 / BPM * 4;
const TOPLAM_OLCU = Number(SP.get('toplam') || BOLUM.toplam_olcu || 16);
const DUVARLAR = BOLUM.duvarlar || [];
const KARTLAR = BOLUM.kartlar || [];
const Z = BOLUM.zaman || { kart: 1.6, say: 8.0, buyu: 4.8, gec: 6.4, sure: 20.8 };
const TOPLAM_DUVAR = BOLUM.toplam_duvar || DUVARLAR.length;
const TEMA = Object.assign({
  varlik: '/03-motor/tetris-pvp/varlik-20/', maskeKlasor: 'poz/',
  renk: ['#ff3fbf', '#1fa8ff', '#ffbf00'], acik: ['#ffd0f0', '#cdeeff', '#fff2b8'], koyu: ['#a0106e', '#0a5ab0', '#a06a00'],
  ad: ['PINK', 'BLUE', 'YELLOW'], kontur: '#3a1478', altin: '#ffd23a',
  ovgu: ['PERFECT!', 'NICE POSE!', 'GREAT!', 'AMAZING!'], aboneAlt: 'NEW BATTLE EVERY DAY', abone: ['#7dffb4', '#0c8a48'],
}, BOLUM.tema || {});
const VARLIK = TEMA.varlik;
const YER = await fetch(VARLIK + 'yerlesim.json').then(r => r.json());
const OY = ['p1', 'p2', 'p3'];
const RENK = TEMA.renk, ACIK = TEMA.acik, KOYU = TEMA.koyu, KON = TEMA.kontur, ALTIN = TEMA.altin;
const SW = W / 3;

function resim(yol) {
  return new Promise((ok, hata) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => hata(new Error(yol)); i.src = yol; });
}
const font = new FontFace('Titan', 'url(/05-kapak/fontlar/TitanOne.ttf)');
document.fonts.add(await font.load());
const [GOK, ...SERIT] = await Promise.all(['gok.png', ...OY.map(o => 'serit-' + o + '.png')].map(a => resim(VARLIK + a)));
const POZ_ADLAR = [...new Set(DUVARLAR.flatMap(d => OY.map(o => d[o])).filter(Boolean))];
const MASKE = {};
const MV = TEMA.maskeVarlik || VARLIK;
await Promise.all(POZ_ADLAR.map(async a => { MASKE[a] = await resim(MV + TEMA.maskeKlasor + a + '.png'); }));

const cikti = document.getElementById('cikti');
cikti.width = W; cikti.height = H;
const cx = cikti.getContext('2d');
// renkli siluet icin ara tuval (maske + kaynak-ici boyama)
const KAT = document.createElement('canvas'); KAT.width = W; KAT.height = H;
const kc = KAT.getContext('2d');

// ------------------------------------------------------------ YARDIMCI
function rng(t) { let s = t >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const ease = p => p * p * (3 - 2 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const kisit = (v, a, b) => Math.max(a, Math.min(b, v));
function hex(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const F = px => `${Math.round(px)}px Titan, "Arial Black", sans-serif`;

// md. 28: iki katli kontur - dista beyaz, icte kalin mor; dolgu acik / renkli. Koyu gokte beyaz, pastel / beyaz zeminde mor ayirir.
function yaziK(metin, x, y, px, dolgu, alfa = 1, kontur = KON, isilti = null, ctx = cx) {
  if (alfa <= 0.01) return;
  ctx.save(); ctx.globalAlpha = kisit(alfa, 0, 1);
  ctx.font = F(px); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (isilti) { ctx.shadowColor = isilti; ctx.shadowBlur = px * 0.4; }
  ctx.lineWidth = px * 0.34; ctx.strokeStyle = '#ffffff'; ctx.strokeText(metin, x, y + px * 0.05);
  ctx.shadowBlur = 0;
  ctx.lineWidth = px * 0.2; ctx.strokeStyle = kontur; ctx.strokeText(metin, x, y + px * 0.05);
  if (Array.isArray(dolgu)) {
    const g = ctx.createLinearGradient(0, y - px * 0.5, 0, y + px * 0.5);
    dolgu.forEach((c, i) => g.addColorStop(i / (dolgu.length - 1), c));
    ctx.fillStyle = g;
  } else ctx.fillStyle = dolgu;
  ctx.fillText(metin, x, y);
  ctx.globalAlpha *= 0.5; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.save(); ctx.beginPath(); ctx.rect(x - px * 8, y - px * 0.5, px * 16, px * 0.3); ctx.clip();
  ctx.fillText(metin, x, y); ctx.restore();                       // ust parlama bandi (baloncuk)
  ctx.restore();
}
// cok parcali satir: [[metin, dolgu], ...] ortalanmis (renk adi kendi renginde)
function satir(parcalar, xm, y, px, alfa = 1) {
  cx.save(); cx.font = F(px);
  const gen = parcalar.map(([m]) => cx.measureText(m).width); const top = gen.reduce((a, b) => a + b, 0);
  cx.restore();
  let x = xm - top / 2;
  parcalar.forEach(([m, d], i) => { yaziK(m, x + gen[i] / 2, y, px, d, alfa); x += gen[i]; });
}
function yildiz5(x, y, r, renk, t = 0, kontur = null) {
  cx.save(); cx.translate(x, y); cx.rotate(0.15 * Math.sin(t * 3 + x));
  cx.beginPath();
  for (let q = 0; q <= 10; q++) { const a = -Math.PI / 2 + q * Math.PI / 5, rr = q % 2 ? r * 0.45 : r; q ? cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : cx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  cx.closePath(); cx.fillStyle = renk; cx.fill();
  if (kontur) { cx.lineWidth = Math.max(2, r * 0.18); cx.strokeStyle = kontur; cx.lineJoin = 'round'; cx.stroke(); }
  cx.restore();
}
function parilti4(x, y, r, a, renk = '#ffffff') {
  if (a <= 0.01) return;
  cx.save(); cx.globalAlpha = a; cx.fillStyle = renk; cx.beginPath();
  cx.moveTo(x, y - r); cx.quadraticCurveTo(x, y, x + r * 0.3, y); cx.quadraticCurveTo(x, y, x, y + r);
  cx.quadraticCurveTo(x, y, x - r * 0.3, y); cx.quadraticCurveTo(x, y, x, y - r); cx.fill();
  cx.beginPath(); cx.moveTo(x - r, y); cx.quadraticCurveTo(x, y, x, y + r * 0.3); cx.quadraticCurveTo(x, y, x + r, y);
  cx.quadraticCurveTo(x, y, x, y - r * 0.3); cx.quadraticCurveTo(x, y, x - r, y); cx.fill(); cx.restore();
}

// ------------------------------------------------------------ MASKOT (seri ogesi, TALIMATLAR §4): kendi maskotumuz, video boyunca
// REF-072'de sol ustte yildizin ustunde duran karakter -> bizim maskot ayni yerde, balon pist dunyasinda: basinda kucuk yildiz tokasi, elinde balon
function maskotCiz(x, y, s, t, alfa = 1) {
  if (alfa <= 0.01) return;
  cx.save(); cx.globalAlpha *= alfa; cx.translate(x, y); cx.scale(s * k, s * k);
  const KN = '#5a1f86';
  cx.lineJoin = 'round'; cx.lineWidth = 5; cx.strokeStyle = KN;
  // balon (sag elde, ipli) - REF-072 balon dunyasi
  const bs = Math.sin(t * 2.2) * 4;
  cx.strokeStyle = '#ffffff'; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(60, 0); cx.quadraticCurveTo(80, -40, 88 + bs, -78); cx.stroke();
  const bg = cx.createRadialGradient(80 + bs, -104, 4, 88 + bs, -96, 30); bg.addColorStop(0, '#d8f6ff'); bg.addColorStop(1, '#1fa8ff');
  cx.fillStyle = bg; cx.strokeStyle = KN; cx.lineWidth = 4; cx.beginPath(); cx.ellipse(88 + bs, -100, 22, 27, 0.15, 0, 6.283); cx.fill(); cx.stroke();
  cx.lineWidth = 5;
  for (const sx of [-1, 1]) {                                   // yaprak kulaklar
    cx.save(); cx.translate(sx * 34, -48); cx.rotate(sx * (0.5 + 0.06 * Math.sin(t * 5)));
    cx.fillStyle = '#ff9ad8'; cx.beginPath(); cx.ellipse(0, -18, 15, 26, 0, 0, 6.283); cx.fill(); cx.stroke();
    cx.fillStyle = '#ffd6f2'; cx.beginPath(); cx.ellipse(0, -16, 6, 15, 0, 0, 6.283); cx.fill(); cx.restore();
  }
  const gv = cx.createRadialGradient(-14, -20, 6, 0, 0, 70); gv.addColorStop(0, '#fff0fa'); gv.addColorStop(1, '#ffb4e4');
  cx.fillStyle = gv; cx.beginPath(); cx.ellipse(0, 0, 62, 56, 0, 0, 6.283); cx.fill(); cx.stroke();
  for (const sx of [-1, 1]) {
    cx.fillStyle = '#ffc6ea'; cx.beginPath(); cx.ellipse(sx * 58, -6 + Math.sin(t * 6 + sx) * 4, 13, 17, sx * 0.4, 0, 6.283); cx.fill(); cx.stroke();
  }
  for (const sx of [-1, 1]) {                                   // gozler
    cx.fillStyle = '#2a0a4a'; cx.beginPath(); cx.ellipse(sx * 20, -8, 8, 11, 0, 0, 6.283); cx.fill();
    cx.fillStyle = '#ffffff'; cx.beginPath(); cx.arc(sx * 20 - 3, -12, 3.5, 0, 6.283); cx.fill();
    cx.fillStyle = 'rgba(255,90,170,0.45)'; cx.beginPath(); cx.ellipse(sx * 38, 14, 10, 6, 0, 0, 6.283); cx.fill();
  }
  cx.strokeStyle = KN; cx.lineWidth = 4; cx.beginPath(); cx.arc(0, 12, 9, 0.2, Math.PI - 0.2); cx.stroke();
  cx.save(); cx.translate(-26, -50);                            // yildiz tokasi (sari, uc oyuncu renginin ucuncusu)
  cx.rotate(-0.3); cx.beginPath();
  for (let q = 0; q <= 10; q++) { const a = -Math.PI / 2 + q * Math.PI / 5, rr = q % 2 ? 6 : 14; q ? cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : cx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  cx.closePath(); cx.fillStyle = '#ffd23a'; cx.fill(); cx.lineWidth = 3; cx.stroke(); cx.restore();
  cx.save(); cx.translate(0, -58);                              // basta cicek (seri tanirligi)
  for (let i = 0; i < 5; i++) { cx.save(); cx.rotate(i * 1.2566 + t * 0.6); cx.fillStyle = '#ffffff'; cx.beginPath(); cx.ellipse(0, -11, 7, 11, 0, 0, 6.283); cx.fill(); cx.lineWidth = 2.5; cx.stroke(); cx.restore(); }
  cx.fillStyle = '#ffd94a'; cx.beginPath(); cx.arc(0, 0, 6, 0, 6.283); cx.fill(); cx.restore();
  cx.restore();
}
// sol ust: sari yildizin ustunde (REF-072 yeri); vurusa hafif ziplar
function maskotKose(t) {
  const v = (t * BPM / 60) % 1, zip = Math.abs(Math.sin(v * Math.PI)) * 10 * k;
  yildiz5(96 * k, 150 * k, 62 * k, ALTIN, t, '#ffffff');
  maskotCiz(90 * k, 98 * k - zip, 0.62, t);
}

// ------------------------------------------------------------ SAHNE
const PR = rng(72);
const PARILTI = Array.from({ length: 90 }, () => ({ x: PR(), y: PR() * 0.62, f: PR() * 6.28, h: 0.6 + PR() * 2.2, b: 0.7 + PR() * 1.8 }));
const YOL_P = Array.from({ length: 60 }, () => ({ s: Math.floor(PR() * 3), x: PR(), y: 0.66 + PR() * 0.34, f: PR() * 6.28, h: 1 + PR() * 2 }));
function sahneCiz(t) {
  cx.drawImage(GOK, 0, 0, W, H);
  SERIT.forEach((im, i) => cx.drawImage(im, i * SW, 0, SW, H));
  for (const p of PARILTI) {                                   // gokte goz kirpan yildizlar (hareketli gok)
    const a = 0.25 + 0.75 * Math.max(0, Math.sin(t * p.h + p.f));
    parilti4(p.x * W, p.y * H, (5 + 5 * p.b) * k * a, a * 0.9);
  }
  for (const p of YOL_P) {                                     // yolda parilti (REF-072 basamaklarda isiltilar)
    const a = Math.max(0, Math.sin(t * p.h * 1.6 + p.f));
    parilti4(p.s * SW + p.x * SW, p.y * H, 9 * k * a, a * 0.85);
  }
}
function aciklik(i) {                                          // kapi acikligi (serit koordinati -> ekran)
  const a = YER['aciklik_' + OY[i]], sx = SW / 640, sy = H / 1080;
  return { x: i * SW + a[0] * sx, y: a[1] * sy, w: (a[2] - a[0]) * sx, h: (a[3] - a[1]) * sy };
}

// ------------------------------------------------------------ DUVAR KARTI: pastel serit rengi + parilti + siyah siluet
function kartZemin(i, x, y, w, h, t, alfa = 1) {
  cx.save(); cx.globalAlpha *= alfa;
  const g = cx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, ACIK[i]); g.addColorStop(1, ACIK[i]);
  cx.fillStyle = g; cx.beginPath(); cx.roundRect(x, y, w, h, Math.min(w, h) * 0.06); cx.fill();
  cx.lineWidth = 4 * k; cx.strokeStyle = 'rgba(255,255,255,0.9)'; cx.stroke();
  const R = rng(1000 + i * 77);
  for (let j = 0; j < 26; j++) {                               // kartin icinde parilti (REF-072 pastel kart)
    const px = x + R() * w, py = y + R() * h, ff = R() * 6.28, a = 0.35 + 0.65 * Math.max(0, Math.sin(t * 2.5 + ff));
    parilti4(px, py, (4 + R() * 7) * k * (Math.min(w, 900 * k) / (300 * k)) ** 0.5, a * 0.9);
  }
  cx.restore();
}
function siluet(ad, x, y, w, h, alfa = 1, renk = '#000000', kontur = 0, isilti = null) {
  const m = MASKE[ad]; if (!m || alfa <= 0.01) return;
  const o = Math.min(w * 0.86 / m.width, h * 0.84 / m.height);
  const mw = m.width * o, mh = m.height * o, mx = x + (w - mw) / 2, my = y + h * 0.93 - mh;
  if (renk === '#000000' && !kontur && !isilti) { cx.save(); cx.globalAlpha *= alfa; cx.drawImage(m, mx, my, mw, mh); cx.restore(); return; }
  // beyaz kontur / isilti: maskeyi ara tuvalde boya
  kc.clearRect(0, 0, W, H);
  const pad = kontur + 2;
  if (kontur) {
    for (let a = 0; a < 16; a++) { const q = a / 16 * 6.283; kc.drawImage(m, mx + Math.cos(q) * kontur, my + Math.sin(q) * kontur, mw, mh); }
    kc.globalCompositeOperation = 'source-in'; kc.fillStyle = '#ffffff'; kc.fillRect(mx - pad, my - pad, mw + 2 * pad, mh + 2 * pad);
    kc.globalCompositeOperation = 'source-over';
  }
  kc.save(); kc.drawImage(m, mx, my, mw, mh); kc.restore();
  // ic boyama: once siyah siluet alani (kontur korunur)
  kc.globalCompositeOperation = 'source-atop';
  const TMP = siluet.tmp || (siluet.tmp = Object.assign(document.createElement('canvas'), { width: W, height: H }));
  const tc = TMP.getContext('2d'); tc.clearRect(0, 0, W, H); tc.drawImage(m, mx, my, mw, mh);
  tc.globalCompositeOperation = 'source-in'; tc.fillStyle = renk; tc.fillRect(mx, my, mw, mh); tc.globalCompositeOperation = 'source-over';
  kc.drawImage(TMP, 0, 0); kc.globalCompositeOperation = 'source-over';
  cx.save(); cx.globalAlpha *= alfa;
  if (isilti) { cx.shadowColor = isilti; cx.shadowBlur = 40 * k; }
  cx.drawImage(KAT, 0, 0); cx.restore();
}
function plaka(i, x, y, w, alfa = 1) {                         // PLAYER n plakasi, kendi renginde (renk adi kuralı)
  if (alfa <= 0.01) return;
  const h = w * 0.3;
  cx.save(); cx.globalAlpha *= alfa;
  const g = cx.createLinearGradient(0, y - h / 2, 0, y + h / 2); g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, RENK[i]); g.addColorStop(1, KOYU[i]);
  cx.shadowColor = RENK[i]; cx.shadowBlur = 30 * k;
  cx.fillStyle = g; cx.beginPath(); cx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); cx.fill();
  cx.shadowBlur = 0; cx.lineWidth = 6 * k; cx.strokeStyle = '#ffffff'; cx.stroke();
  cx.restore();
  yaziK('PLAYER ' + (i + 1), x, y + 2 * k, h * 0.5, '#ffffff', alfa, KOYU[i]);
}

function duvarCiz(d, u, t) {
  const a = Z.kart, b = a + Z.say, c = b + Z.buyu;
  if (u >= c) { tamEkran(d, u - c, t); return null; }
  for (let i = 0; i < 3; i++) {
    const K = aciklik(i);
    let s = 1, alfa = 1, sil = 1, kar = 0;
    if (u < a) { const q = kisit(u / a, 0, 1); s = 0.4 + 0.6 * ease(q) + 0.08 * Math.sin(q * Math.PI); alfa = ease(q); sil = kisit((u - a * 0.5) / (a * 0.5), 0, 1); }
    else if (u >= b) { const q = (u - b) / Z.buyu; s = 1 + 0.55 * ease(kisit(q / 0.7, 0, 1)); kar = kisit((q - 0.62) / 0.3, 0, 1); }
    else s = 1 + 0.015 * Math.sin((u - a) * 5);
    const w = K.w * s, h = K.h * s, x = K.x + K.w / 2 - w / 2, y = K.y + K.h / 2 - h / 2 - (s - 1) * K.h * 0.12;
    if (kar < 1) {
      kartZemin(i, x, y, w, h, t, alfa * (1 - kar));
      siluet(d[OY[i]], x, y, w, h, alfa * sil * (1 - kar));
    }
    if (kar > 0) {                                             // kapi kararir: duvar gecti (REF-072 karanlik kapi)
      cx.save(); cx.globalAlpha = kar * 0.88; cx.fillStyle = '#12082e'; cx.beginPath(); cx.roundRect(K.x, K.y, K.w, K.h, 10 * k); cx.fill(); cx.restore();
    }
    if (u >= b) {                                              // PLAYER plakasi kapinin altinda
      const q = (u - b) / Z.buyu, pa = ease(kisit(q / 0.15, 0, 1)) * (1 - kisit((q - 0.85) / 0.15, 0, 1));
      plaka(i, K.x + K.w / 2, K.y + K.h + 58 * k, Math.min(K.w * 1.05, 300 * k), pa);
    }
  }
  return u >= a && u < b ? (u - a) / Z.say : null;
}
// tam ekran acilis: uc pastel panel, her panelde pozun dev silueti + ovgu (REF-072 tam ekran poz karesi)
function tamEkran(d, u, t) {
  const gir = ease(kisit(u / 0.35, 0, 1)), cik = 1 - ease(kisit((u - (Z.gec - 0.35)) / 0.35, 0, 1)), a = gir * cik;
  for (let i = 0; i < 3; i++) {
    const x = i * SW;
    cx.save(); cx.globalAlpha = a;
    const g = cx.createLinearGradient(x, 0, x, H); g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, ACIK[i]); g.addColorStop(1, ACIK[i]);
    cx.fillStyle = g; cx.fillRect(x, 0, SW, H);
    cx.fillStyle = hex(RENK[i], 0.35); cx.fillRect(x, 0, 8 * k, H); cx.fillRect(x + SW - 8 * k, 0, 8 * k, H);
    cx.restore();
    const R = rng(5000 + i * 31 + d.no);
    for (let j = 0; j < 40; j++) {
      const ff = R() * 6.28, aa = Math.max(0, Math.sin(t * 2.4 + ff));
      parilti4(x + R() * SW, R() * H, (6 + R() * 10) * k * aa, aa * a * 0.9, j % 3 ? '#ffffff' : RENK[i]);
    }
    const zip = 1 + 0.04 * Math.sin(kisit(u / 0.5, 0, 1) * Math.PI);
    const sw = SW * zip, sh = H * 0.86 * zip;
    siluet(d[OY[i]], x + SW / 2 - sw / 2, H * 0.12 + (H * 0.86 - sh), sw, sh, a, '#000000', 7 * k, RENK[i]);
  }
  const m = d.ovgu || TEMA.ovgu[(d.no - 1) % TEMA.ovgu.length];
  const pop = kisit((u - 0.25) / 0.3, 0, 1), s = ease(pop) * (1 + 0.12 * Math.sin(pop * Math.PI));
  yaziK(m, W / 2, H * 0.5, 150 * k * s, ['#fff6a0', '#ffd23a', '#ff8a1a'], a * pop, KON, '#ffffff');
}

// sag ustte 3-2-1 (REF-072: pembe kalin rakam, ilerleme cubugunun sag ucunda)

function ikon(tur, x, y, r, renk) {

    cx.quadraticCurveTo(r * 1.05, -r * 0.1, r * 0.95, r * 0.2); cx.lineTo(r * 0.75, r * 0.85); cx.quadraticCurveTo(r * 0.68, r * 0.98, r * 0.5, r * 0.98); cx.closePath(); cx.fill();

  } else {

const ABONE = BOLUM.abone || [], ABONE_SURE = BOLUM.abone_sure || 3.2;

    cx.lineTo(32 * k, 59 * k); cx.lineTo(22 * k, 37 * k); cx.lineTo(40 * k, 37 * k); cx.closePath(); cx.fill(); cx.stroke();

// uc serit duzeninde ROUND ile kapilar arasinda yer yok (kapi kartlari y 0,25-0,62 H, uc seridi kapliyor): abone yol ustunde, PLAYER
// plakalarinin (y ~0,67 H) altinda -> kartlarin ve 3-2-1'in onunu kapatmaz (TALIMATLAR §4)

function aboneCiz(t, ust = false) {
  const a0 = ABONE.find(x => t >= x && t < x + ABONE_SURE);
  if (a0 === undefined) return;
  const u = t - a0;
  const gir = kisit(u / 0.35, 0, 1), cik = ease(kisit((ABONE_SURE - u) / 0.3, 0, 1));

function turBul(t) {
  let tur = 1;
  for (const kart of KARTLAR) if (kart.tip === 'tur' && kart.t <= t) tur = kart.tur || tur;
  for (const d of DUVARLAR) if (d.t0 <= t) tur = d.tur;
  return tur;
}
function kareKur(n) {
  const t = n / FPS;
  sahneCiz(t);
  const kart = KARTLAR.find(kk => t >= kk.t && t < kk.t + kk.sure);
  if (kart) {
    kartCiz(kart, t - kart.t, t);
    if (kart.tip !== 'abone') maskotKose(t);
    return;

  const d = DUVARLAR.find(x => t >= x.t0 && t < x.t0 + Z.sure);

  if (d) { tam = t - d.t0 >= Z.kart + Z.say + Z.buyu; e = duvarCiz(d, t - d.t0, t); }

  maskotKose(t);
}
