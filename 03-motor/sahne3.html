<meta charset="utf-8">
<title>POSE WALL - motor 3 (poz duvari)</title>
<style>
  html,body { margin:0; background:#0b1230; overflow:hidden; }
  canvas { display:block; }
</style>
<canvas id="cikti"></canvas>

<script type="module">
// =====================================================================
// MOTOR 3 — POZ DUVARI / POSE WALL. Kural kaynağı:
//   Masaüstü/POZ-DUVARI/TALIMATLAR.md (§10 kesit 1 geri bildirimi), REF-051.
// sahne.html ve sahne2.html'den AYRI; Dance Mode kuralları bu sayfaya taşınmaz.
// Arayüz aynı (kareKur / kareAl / HAZIR ...) -> render.js --sayfa sahne3.html
//
// Kesit 2 (16 Eki 2026, kullanıcı): her oyuncunun KENDİ duvarı — solda P1
// (pembe panel), sağda P2 (mavi panel), ikisi birlikte arkadan öne gelir.
// Mekân dolu ve göz alıcı: aurora + gezegen + ufukta neon şehir + ışık
// huzmeleri, yolun üstünden geçen neon kemerler, yanlarda ışık direkleri,
// kameraya akan parıltılar. Tempo ~7 sn/duvar.
// Tamamı 2B canvas, deterministik (her kare t = kare/fps'ten).
// =====================================================================
import { POZLAR, cift, dikisX, KALINLIK, BOY } from './poz-duvari/pozlar.js';

const S = await fetch('/spec/sabitler.json').then(r => r.json());
const FPS = S.video.fps;
const SP = new URLSearchParams(location.search);
const W = Number(SP.get('w') || 1280);
const H = Number(SP.get('h') || 720);
const k = H / 1080;                          // tasarım 1080p'de yapıldı

const BOLUM_YOL = SP.get('bolum');
const BOLUM = BOLUM_YOL ? await fetch(BOLUM_YOL).then(r => r.json()) : {};
const BPM = BOLUM.bpm || 120;
const VURUS = 60 / BPM, OLCU = VURUS * 4;
const TOPLAM_OLCU = Number(SP.get('toplam') || BOLUM.toplam_olcu || 16);
const DUVARLAR = BOLUM.duvarlar || [];
const KARTLAR = BOLUM.kartlar || [];
const TURLAR = BOLUM.turlar || [{ no: 1, ad: 'EASY', renk: '#22d3ee' }];
const TOPLAM_DUVAR = BOLUM.toplam_duvar || DUVARLAR.length;
const Z = BOLUM.zaman || { yaklas: 5.2, goster: 0.3, tut: 1.2, gec: 0.4, say: [2.8, 3.6, 4.4] };

const FONT = '900 1px "Arial Black", "DejaVu Sans", sans-serif';
const font = px => FONT.replace('1px', `${Math.round(px)}px`);
const P1_RENK = '#ff4fa3', P2_RENK = '#38bdf8', MOR = '#a855f7', MAGENTA = '#f0abfc';
const SILUET = '#12162b';

const cikti = document.getElementById('cikti');
cikti.width = W; cikti.height = H;
let cx = cikti.getContext('2d');
// Saydam geçiş katmanı: panel önce burada TAM OPAK çizilir, sonra tek parça
// saydamlaştırılır. Doğrudan globalAlpha ile çizilince üst üste binen uzuv
// çizgileri eklem yerlerinde koyu leke bırakıyordu (17 Eki 2026, tam bölüm kontrolü).
const KAT = document.createElement('canvas'); KAT.width = W; KAT.height = H;
const KAT_CX = KAT.getContext('2d');

// ------------------------------------------------------------ YARDIMCI
function rng(t) { let s = t >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const ease = p => p * p * (3 - 2 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const kisit = (v, a, b) => Math.max(a, Math.min(b, v));
function hex(h, a) {
  const n = parseInt(h.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function acik(h, m) {
  const n = parseInt(h.slice(1), 16);
  const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v + (255 - v) * m));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function koyu(h, m) {
  const n = parseInt(h.slice(1), 16);
  const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v * (1 - m)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function turBul(t) {
  // en son BAŞLAYAN olay belirler (17 Eki 2026: tur kartı sırasında rozet önceki turun son duvarını gösteriyordu)
  let aktif = TURLAR[0], son = -Infinity;
  for (const kart of KARTLAR) if (kart.tur && kart.t <= t && kart.t >= son) { son = kart.t; aktif = TURLAR.find(x => x.no === kart.tur) || aktif; }
  for (const d of DUVARLAR) if (d.t0 <= t && d.t0 >= son) { son = d.t0; aktif = TURLAR.find(x => x.no === d.tur) || aktif; }
  return aktif;
}

// ------------------------------------------------------------ GEOMETRİ
const UFUK = 0.47 * H;                       // ufuk çizgisi
const YOL_ALT = 0.47 * W, YOL_UST = 0.03 * W;
const yolX = (y, kenar) => {
  const p = (y - UFUK) / (H - UFUK);
  return W / 2 + kenar * (YOL_UST + (YOL_ALT - YOL_UST) * p);
};
// derinlik d: 0 ufuk -> 1 kamera. Ekran ölçeği p = d^2.4 (perspektif sıkışması)
const derin = d => Math.pow(d, 2.4);
const HIZ = 0.62;                            // dünya akış hızı (döngü/sn), her katman bundan türer

// ------------------------------------------------------------ SABİT DEKOR (tohumlu)
const r = rng(51);
const YILDIZ = Array.from({ length: 360 }, () => ({ x: r(), y: r() * 0.44, b: 0.5 + r() * 1.5, f: r() * 6.28, h: 0.4 + r() * 1.4 }));
const SEHIR = [];
for (const [kat, n, hMin, hMax, wMin, wMax] of [[0, 46, 40, 150, 28, 70], [1, 60, 22, 90, 22, 55]]) {
  let x = -20 * k;
  for (let i = 0; i < n && x < W + 40 * k; i++) {
    const w = lerp(wMin, wMax, r()) * k, h = lerp(hMin, hMax, Math.pow(r(), 1.6)) * k;
    const pencere = [];
    for (let py = 8 * k; py < h - 8 * k; py += 11 * k)
      for (let px = 5 * k; px < w - 7 * k; px += 9 * k) if (r() < 0.42) pencere.push([px, py, r()]);
    SEHIR.push({ kat, x, w, h, pencere, neon: r() < 0.35, renk: [P1_RENK, P2_RENK, MOR, '#22d3ee', '#facc15'][Math.floor(r() * 5)], anten: r() < 0.25 });
    x += w + lerp(2, 14, r()) * k;
  }
}
const PARILTI = Array.from({ length: 140 }, () => ({ x: (r() * 2 - 1), y: r(), faz: r(), b: 0.6 + r() * 1.4, renk: [P1_RENK, P2_RENK, '#ffffff', MAGENTA][Math.floor(r() * 4)] }));

// ------------------------------------------------------------ GÖK
function gokCiz(t, renk) {
  const g = cx.createLinearGradient(0, 0, 0, UFUK);
  g.addColorStop(0, '#07041a'); g.addColorStop(0.55, '#1a0b3d'); g.addColorStop(1, '#3a1460');
  cx.fillStyle = g; cx.fillRect(0, 0, W, UFUK + 2);
  for (const s of YILDIZ) {
    const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.h + s.f));
    cx.fillStyle = `rgba(230,235,255,${a.toFixed(3)})`;
    cx.fillRect(s.x * W, s.y * H, s.b * k * 1.7, s.b * k * 1.7);
  }
  // aurora şeritleri
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (const [renkA, yuk, frek, faz, kal] of [[renk, 0.14, 2.2, 0, 0.09], [MAGENTA, 0.22, 1.6, 2.1, 0.07], ['#22d3ee', 0.30, 2.8, 4.2, 0.05]]) {
    for (let j = 0; j < 3; j++) {
      cx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = H * (yuk + 0.035 * Math.sin(x / W * frek * 6.28 + faz + t * 0.35) + 0.015 * Math.sin(x / W * 13 + t * 0.9 + j));
        x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
      }
      cx.strokeStyle = hex(renkA.startsWith('#') ? renkA : '#ffffff', 0.10 - j * 0.025);
      cx.lineWidth = H * kal * (1 - j * 0.3);
      cx.stroke();
    }
  }
  cx.restore();
  // gezegen + halka
  const gx = W * 0.83, gy = H * 0.16, gr = H * 0.085;
  const gg = cx.createRadialGradient(gx - gr * 0.35, gy - gr * 0.35, gr * 0.1, gx, gy, gr);
  gg.addColorStop(0, '#ffd1f2'); gg.addColorStop(0.5, '#e05cc4'); gg.addColorStop(1, '#4b1a6e');
  cx.save();
  cx.shadowColor = '#f472b6'; cx.shadowBlur = 50 * k;
  cx.fillStyle = gg; cx.beginPath(); cx.arc(gx, gy, gr, 0, 6.283); cx.fill();
  cx.restore();
  cx.save(); cx.translate(gx, gy); cx.rotate(-0.35);
  cx.strokeStyle = 'rgba(253,186,255,0.75)'; cx.lineWidth = 6 * k;
  cx.beginPath(); cx.ellipse(0, 0, gr * 1.9, gr * 0.42, 0, Math.PI * 1.04, Math.PI * 1.96 + 6.283, false); cx.stroke();
  cx.restore();
  // ufuk ışık huzmeleri (iki projektör, yavaş tarama)
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (const [bx, faz, renkH] of [[0.24, 0, renk], [0.70, 2.4, P2_RENK], [0.46, 4.1, P1_RENK]]) {
    const a = Math.sin(t * 0.45 + faz) * 0.42;
    const L = H * 0.9;
    const x0 = W * bx, y0 = UFUK - 40 * k;
    const ux = Math.sin(a), uy = -Math.cos(a);
    const gH = cx.createLinearGradient(x0, y0, x0 + ux * L, y0 + uy * L);
    gH.addColorStop(0, hex(renkH, 0.22)); gH.addColorStop(1, hex(renkH, 0));
    cx.fillStyle = gH;
    cx.beginPath(); cx.moveTo(x0, y0);
    cx.lineTo(x0 + (ux * L) - uy * 70 * k, y0 + uy * L + ux * 70 * k);
    cx.lineTo(x0 + (ux * L) + uy * 70 * k, y0 + uy * L - ux * 70 * k);
    cx.closePath(); cx.fill();
  }
  cx.restore();
}

// ------------------------------------------------------------ ŞEHİR
function sehirCiz(t, renk) {
  for (const kat of [0, 1]) {
    for (const b of SEHIR) {
      if (b.kat !== kat) continue;
      const y0 = UFUK - b.h;
      cx.fillStyle = kat === 0 ? '#1b1140' : '#120b2e';
      cx.fillRect(b.x, y0, b.w, b.h + 2);
      // pencereler (yavaş yanıp sönen)
      for (const [px, py, f] of b.pencere) {
        const on = Math.sin(t * 0.6 + f * 40) > -0.6;
        if (!on) continue;
        cx.fillStyle = f < 0.33 ? 'rgba(255,214,120,0.85)' : f < 0.66 ? 'rgba(125,211,252,0.8)' : 'rgba(244,114,182,0.75)';
        cx.fillRect(b.x + px, y0 + py, 4 * k, 5 * k);
      }
      if (b.neon) {
        cx.save(); cx.shadowColor = b.renk; cx.shadowBlur = 14 * k;
        cx.strokeStyle = b.renk; cx.lineWidth = 2.5 * k;
        cx.strokeRect(b.x + 1, y0 + 1, b.w - 2, b.h);
        cx.restore();
      }
      if (b.anten) {
        cx.strokeStyle = '#3b2a6b'; cx.lineWidth = 2 * k;
        cx.beginPath(); cx.moveTo(b.x + b.w / 2, y0); cx.lineTo(b.x + b.w / 2, y0 - 26 * k); cx.stroke();
        if (Math.sin(t * 3 + b.x) > 0) { cx.fillStyle = '#ff3b6b'; cx.beginPath(); cx.arc(b.x + b.w / 2, y0 - 27 * k, 3.2 * k, 0, 6.283); cx.fill(); }
      }
    }
  }
  // ufuk parlaması
  const g = cx.createLinearGradient(0, UFUK - 60 * k, 0, UFUK + 10 * k);
  g.addColorStop(0, hex(renk, 0)); g.addColorStop(1, hex(renk, 0.35));
  cx.fillStyle = g; cx.fillRect(0, UFUK - 60 * k, W, 70 * k);
}

// ------------------------------------------------------------ ZEMİN, YOL, DİREKLER, KEMERLER
function zeminCiz(t, renk) {
  const g = cx.createLinearGradient(0, UFUK, 0, H);
  g.addColorStop(0, '#1a0b3d'); g.addColorStop(1, '#0a0618');
  cx.fillStyle = g; cx.fillRect(0, UFUK, W, H - UFUK);
  // neon ızgara zemin: ufka koşan çizgiler + kameraya akan yatay çizgiler
  cx.strokeStyle = hex(MOR, 0.35); cx.lineWidth = Math.max(1, 1.6 * k);
  for (let i = -22; i <= 22; i++) {
    cx.beginPath(); cx.moveTo(W / 2 + i * W * 0.012, UFUK); cx.lineTo(W / 2 + i * W * 0.2, H); cx.stroke();
  }
  for (let i = 0; i < 14; i++) {
    const p = derin(((i + t * HIZ * 14 / 9) / 14) % 1);
    const y = UFUK + (H - UFUK) * p;
    cx.strokeStyle = hex(MOR, 0.15 + 0.45 * p); cx.lineWidth = Math.max(1, 3 * k * p);
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }
  // yol gövdesi + orta parlama
  const gy = cx.createLinearGradient(0, UFUK, 0, H);
  gy.addColorStop(0, '#221a44'); gy.addColorStop(1, '#141028');
  cx.fillStyle = gy;
  cx.beginPath(); cx.moveTo(yolX(UFUK, -1), UFUK); cx.lineTo(yolX(UFUK, 1), UFUK);
  cx.lineTo(yolX(H, 1), H); cx.lineTo(yolX(H, -1), H); cx.closePath(); cx.fill();
  // V çizgileri
  for (let i = 0; i < 9; i++) {
    const p = derin(((i + t * HIZ) / 9) % 1);
    const y = UFUK + (H - UFUK) * p;
    const yw = (yolX(y, 1) - W / 2) * 0.62, yh = 40 * k * p;
    cx.strokeStyle = hex(renk, 0.3 + 0.6 * p); cx.lineWidth = Math.max(1, 9 * k * p);
    cx.beginPath(); cx.moveTo(W / 2 - yw, y); cx.lineTo(W / 2, y + yh); cx.lineTo(W / 2 + yw, y); cx.stroke();
  }
  // kenar neonları
  for (const kenar of [-1, 1]) {
    cx.save(); cx.shadowColor = renk; cx.shadowBlur = 20 * k;
    cx.strokeStyle = hex(renk, 0.95); cx.lineWidth = 7 * k;
    cx.beginPath(); cx.moveTo(yolX(UFUK, kenar), UFUK); cx.lineTo(yolX(H, kenar), H); cx.stroke();
    cx.restore();
  }
}

// derinliğe göre sıralı çizilecek yakın nesneler: direkler + kemerler (+ parıltılar)
function yakinCiz(t, renk) {
  const nesne = [];
  for (let i = 0; i < 10; i++) {                 // ışık direkleri (iki yanda)
    const d = ((i + t * HIZ * 10 / 9) / 10) % 1;
    nesne.push({ tip: 'direk', d });
  }
  for (let i = 0; i < 3; i++) {                  // neon kemerler (yolun üstünden geçer)
    const d = ((i + t * HIZ * 3 / 9 * 0.6) / 3) % 1;
    nesne.push({ tip: 'kemer', d, renk: [renk, P1_RENK, P2_RENK][i] });
  }
  nesne.sort((a, b) => a.d - b.d);
  for (const n of nesne) {
    const p = derin(n.d);
    const y = UFUK + (H - UFUK) * p;
    if (n.tip === 'direk') {
      for (const kenar of [-1, 1]) {
        const x = yolX(y, kenar) + kenar * 0.07 * W * p;
        const h = 0.75 * H * p;
        cx.strokeStyle = '#2a2350'; cx.lineWidth = Math.max(1, 12 * k * p);
        cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x, y - h); cx.lineTo(x - kenar * 0.05 * W * p, y - h); cx.stroke();
        cx.save(); cx.globalCompositeOperation = 'lighter';
        const lx = x - kenar * 0.05 * W * p, ly = y - h;
        const rg = cx.createRadialGradient(lx, ly, 0, lx, ly, 70 * k * p + 2);
        rg.addColorStop(0, 'rgba(255,255,255,0.95)'); rg.addColorStop(0.25, hex(kenar < 0 ? P1_RENK : P2_RENK, 0.7)); rg.addColorStop(1, 'rgba(0,0,0,0)');
        cx.fillStyle = rg; cx.beginPath(); cx.arc(lx, ly, 70 * k * p + 2, 0, 6.283); cx.fill();
        cx.restore();
      }
    } else {
      const xl = yolX(y, -1) - 0.10 * W * p, xr = yolX(y, 1) + 0.10 * W * p;
      const h = 1.05 * H * p;
      const a = kisit(n.d * 4, 0, 1) * kisit((1 - n.d) * 6, 0, 1);   // uzakta ve en yakında söner
      if (a <= 0) continue;
      cx.save(); cx.globalAlpha = a;
      cx.shadowColor = n.renk; cx.shadowBlur = 30 * k * p + 4;
      cx.strokeStyle = n.renk; cx.lineWidth = Math.max(1.5, 16 * k * p);
      cx.beginPath();
      cx.moveTo(xl, y); cx.lineTo(xl, y - h * 0.62);
      cx.quadraticCurveTo(xl, y - h, (xl + xr) / 2, y - h);
      cx.quadraticCurveTo(xr, y - h, xr, y - h * 0.62);
      cx.lineTo(xr, y); cx.stroke();
      cx.strokeStyle = 'rgba(255,255,255,0.8)'; cx.lineWidth = Math.max(1, 4 * k * p); cx.shadowBlur = 0;
      cx.stroke();
      cx.restore();
    }
  }
  // kameraya akan parıltılar
  cx.save(); cx.globalCompositeOperation = 'lighter';
  for (const s of PARILTI) {
    const d = (s.faz + t * 0.22) % 1, p = d * d;
    const x = W / 2 + s.x * W * (0.08 + 0.9 * p);
    const y = UFUK - (0.05 + s.y * 0.5) * H * p * 1.2 + (H - UFUK) * p * 0.15;
    if (Math.abs(x - W / 2) < 0.05 * W && d > 0.6) continue;     // panel önüne düşmesin
    const b = s.b * k * (1 + 5 * p);
    cx.fillStyle = hex(s.renk, 0.35 + 0.6 * p);
    cx.beginPath(); cx.arc(x, y, b, 0, 6.283); cx.fill();
  }
  cx.restore();
}

// ------------------------------------------------------------ SİLUET
function figurCiz(n, olc, ox, oy) {
  const P = q => [ox + q[0] * olc, oy - q[1] * olc];
  const parca = [
    ['kalca', 'boyun', KALINLIK.govde],
    ['omuzSol', 'omuzSag', KALINLIK.kol], ['kalcaSol', 'kalcaSag', KALINLIK.bacak],
    ['omuzSol', 'solDir', KALINLIK.kol], ['solDir', 'solEl', KALINLIK.kol],
    ['omuzSag', 'sagDir', KALINLIK.kol], ['sagDir', 'sagEl', KALINLIK.kol],
    ['kalcaSol', 'solDiz', KALINLIK.bacak], ['solDiz', 'solAyak', KALINLIK.bacak],
    ['kalcaSag', 'sagDiz', KALINLIK.bacak], ['sagDiz', 'sagAyak', KALINLIK.bacak],
    ['solAyak', 'solUc', KALINLIK.ayak], ['sagAyak', 'sagUc', KALINLIK.ayak],
  ];
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  for (const [kat, ek] of [['#ffffff', 8], [SILUET, 0]]) {      // beyaz kontur, koyu gövde
    cx.strokeStyle = kat; cx.fillStyle = kat;
    for (const [a, b, kal] of parca) {
      const A = P(n[a]), B = P(n[b]);
      cx.lineWidth = (kal + ek) * olc;
      cx.beginPath(); cx.moveTo(A[0], A[1]); cx.lineTo(B[0], B[1]); cx.stroke();
    }
    const B = P(n.bas);
    cx.beginPath(); cx.arc(B[0], B[1], (BOY.bas + ek / 2) * olc, 0, Math.PI * 2); cx.fill();
  }
}

const kutu = n => {
  const xs = Object.values(n).map(q => q[0]);
  return [Math.min(...xs), Math.max(...xs)];
};
const CIFT = {};
for (const no of Object.keys(POZLAR)) CIFT[no] = cift(POZLAR[no]);

// ------------------------------------------------------------ PANELLER (P1 sol, P2 sağ)
const PW1 = 0.355 * W, PH1 = 0.60 * H, ARA = 0.018 * W;
function panelOlcek(u) {
  if (u < Z.yaklas) {
    const p = u / Z.yaklas;
    return { olc: 1 / (1 + 3.2 * (1 - ease(p))), alfa: 1, ayril: 0 };
  }
  if (u < Z.yaklas + Z.tut) return { olc: 1 + 0.01 * Math.sin((u - Z.yaklas) * 10), alfa: 1, ayril: 0 };
  const p = kisit((u - Z.yaklas - Z.tut) / Z.gec, 0, 1);
  return { olc: 1 + 1.4 * p * p, alfa: 1 - p, ayril: p };
}

function cerceve(x0, y0, w, h, f, renk) {
  cx.save();
  cx.shadowColor = renk; cx.shadowBlur = f * 1.2;
  cx.fillStyle = '#2b2550'; cx.fillRect(x0 - f, y0 - f, w + 2 * f, h + 2 * f);
  cx.restore();
  cx.strokeStyle = renk; cx.lineWidth = Math.max(1, f * 0.22);
  cx.strokeRect(x0 - f * 0.55, y0 - f * 0.55, w + f * 1.1, h + f * 1.1);
  cx.strokeStyle = 'rgba(255,255,255,0.55)'; cx.lineWidth = Math.max(1, f * 0.08);
  cx.strokeRect(x0 - f * 0.9, y0 - f * 0.9, w + f * 1.8, h + f * 1.8);
}

function panelCiz(d, u, renk, katta = false) {
  const { olc, alfa: alfaG, ayril } = panelOlcek(u);
  if (alfaG <= 0) return;
  if (alfaG < 1 && !katta) {
    const ana = cx;
    cx = KAT_CX; cx.clearRect(0, 0, W, H);
    try { panelCiz(d, u, renk, true); } finally { cx = ana; }
    cx.save(); cx.globalAlpha = alfaG; cx.drawImage(KAT, 0, 0); cx.restore();
    return;
  }
  const alfa = katta ? 1 : alfaG;
  const w = PW1 * olc, h = PH1 * olc, ara = ARA * olc;
  const altY = lerp(UFUK + 25 * k, H * 0.965, kisit((olc - 1 / 4.2) / (1 - 1 / 4.2), 0, 1.5));
  const y0 = altY - h;
  const c = CIFT[d.poz], poz = POZLAR[d.poz];
  const acildi = u >= Z.goster;
  const f = Math.max(3, 16 * k * olc);
  const olcF = h / 290;                       // panel iç yüksekliği 290 figür birimi
  const zemin = y0 + h - 16 * olcF;
  const panelX = [W / 2 - ara / 2 - w - ayril * W * 0.5, W / 2 + ara / 2 + ayril * W * 0.5];
  cx.save(); cx.globalAlpha = alfa;
  for (let i = 0; i < 2; i++) {
    const x0 = panelX[i];
    const oyRenk = i === 0 ? P1_RENK : P2_RENK;
    cerceve(x0, y0, w, h, f, renk);
    if (!acildi) {
      cx.fillStyle = '#0d0a24'; cx.fillRect(x0, y0, w, h);
      cx.fillStyle = oyRenk; cx.font = font(h * 0.2); cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.fillText(i === 0 ? 'P1' : 'P2', x0 + w / 2, y0 + h / 2);
      continue;
    }
    const g = cx.createLinearGradient(0, y0, 0, y0 + h);
    g.addColorStop(0, acik(oyRenk, 0.55)); g.addColorStop(1, oyRenk);
    cx.fillStyle = g; cx.fillRect(x0, y0, w, h);
    // panel içi ince ızgara (doku)
    cx.strokeStyle = 'rgba(255,255,255,0.13)'; cx.lineWidth = Math.max(1, 1.5 * k * olc);
    for (let gx = x0 + w / 10; gx < x0 + w; gx += w / 10) { cx.beginPath(); cx.moveTo(gx, y0); cx.lineTo(gx, y0 + h); cx.stroke(); }
    for (let gy2 = y0 + h / 8; gy2 < y0 + h; gy2 += h / 8) { cx.beginPath(); cx.moveTo(x0, gy2); cx.lineTo(x0 + w, gy2); cx.stroke(); }
    const n = i === 0 ? c.p1 : c.p2;
    let ox;
    if (poz.temas) {
      // temaslı poz: temas noktası panellerin birleşim çizgisinde
      ox = (i === 0 ? x0 + w : x0) - dikisX(poz, c) * olcF;
    } else {
      const [a, b] = kutu(n);
      ox = x0 + w / 2 - (a + b) / 2 * olcF;
    }
    cx.save(); cx.beginPath(); cx.rect(x0, y0, w, h); cx.clip();
    figurCiz(n, olcF, ox, zemin);
    cx.restore();
    // oyuncu etiketi panelin üst köşesinde
    cx.font = font(34 * olcF); cx.textAlign = i === 0 ? 'left' : 'right'; cx.textBaseline = 'top';
    cx.lineWidth = 7 * olcF; cx.strokeStyle = '#1a0b3d'; cx.lineJoin = 'round';
    const lx = i === 0 ? x0 + 14 * olcF : x0 + w - 14 * olcF;
    cx.strokeText(i === 0 ? 'P1' : 'P2', lx, y0 + 10 * olcF);
    cx.fillStyle = '#ffffff'; cx.fillText(i === 0 ? 'P1' : 'P2', lx, y0 + 10 * olcF);
    const fl = 1 - (u - Z.goster) / 0.22;
    if (fl > 0) { cx.fillStyle = `rgba(255,255,255,${(0.85 * fl).toFixed(3)})`; cx.fillRect(x0, y0, w, h); }
  }
  // temas kıvılcımı (birleşim çizgisinde)
  if (acildi && poz.temas && ayril === 0) {
    const ty = zemin - (c.p1[poz.temas[0]][1] + c.p2[poz.temas[1]][1]) / 2 * olcF;
    const pul = 0.6 + 0.4 * Math.sin(u * 14);
    cx.save(); cx.globalCompositeOperation = 'lighter';
    const rg = cx.createRadialGradient(W / 2, ty, 0, W / 2, ty, 60 * olcF * pul);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.35, 'rgba(255,230,120,0.9)'); rg.addColorStop(1, 'rgba(255,200,80,0)');
    cx.fillStyle = rg; cx.beginPath(); cx.arc(W / 2, ty, 60 * olcF * pul, 0, 6.283); cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,0.9)'; cx.lineWidth = 3 * olcF;
    for (let j = 0; j < 8; j++) {
      const a = j / 8 * 6.283 + u * 2;
      cx.beginPath(); cx.moveTo(W / 2 + Math.cos(a) * 14 * olcF, ty + Math.sin(a) * 14 * olcF);
      cx.lineTo(W / 2 + Math.cos(a) * 44 * olcF * pul, ty + Math.sin(a) * 44 * olcF * pul); cx.stroke();
    }
    cx.restore();
  }
  cx.restore();
}

// ------------------------------------------------------------ YAZILAR
function yazi(metin, x, y, px, renk, alfa = 1, golge = true) {
  cx.save(); cx.globalAlpha = kisit(alfa, 0, 1);
  cx.font = font(px); cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.lineJoin = 'round';
  if (golge) { cx.shadowColor = renk; cx.shadowBlur = px * 0.35; }
  cx.lineWidth = px * 0.14; cx.strokeStyle = '#120626'; cx.strokeText(metin, x, y);
  cx.fillStyle = renk; cx.fillText(metin, x, y);
  cx.restore();
}

function kartCiz(kart, u, renk) {
  const a = kisit(Math.min(u / 0.25, (kart.sure - u) / 0.25), 0, 1);
  const s = 1 + 0.08 * (1 - ease(Math.min(1, u / 0.35)));
  const y = H * 0.30;
  if (kart.tip === 'buyuk') {
    yazi(kart.metin, W / 2, y, 150 * k * s, kart.renk || renk, a);
    if (kart.alt) yazi(kart.alt, W / 2, y + 130 * k, 64 * k, '#ffffff', a, false);
  } else if (kart.tip === 'nasil') {
    yazi('HOW TO PLAY', W / 2, H * 0.14, 90 * k, renk, a);
    yazi('MATCH YOUR POSE', W / 2, H * 0.27, 74 * k, '#ffffff', a, false);
    yazi('before the wall reaches you', W / 2, H * 0.35, 46 * k, '#e9d5ff', a, false);
    yazi('P1 = PINK', W * 0.33, H * 0.46, 60 * k, P1_RENK, a);
    yazi('P2 = BLUE', W * 0.67, H * 0.46, 60 * k, P2_RENK, a);
  } else if (kart.tip === 'son') {
    yazi(kart.metin, W / 2, H * 0.24, 140 * k * s, '#ffffff', a);
    yazi(kart.alt, W / 2, H * 0.38, 120 * k * s, '#facc15', a);
    // abone ol düğmesi (3. sn'den sonra, nabızlı)
    if (u > 3.0) {
      const q = ease(kisit((u - 3.0) / 0.4, 0, 1)), pul = 1 + 0.04 * Math.sin(u * 8);
      const bw = 520 * k * q * pul, bh = 120 * k * q * pul;
      cx.save(); cx.globalAlpha = a;
      cx.shadowColor = '#ff2d2d'; cx.shadowBlur = 40 * k;
      cx.fillStyle = '#e11d2e'; cx.beginPath(); cx.roundRect(W / 2 - bw / 2, H * 0.58 - bh / 2, bw, bh, bh / 2); cx.fill();
      cx.restore();
      if (q > 0.6) yazi('SUBSCRIBE', W / 2, H * 0.58, 64 * k * pul, '#ffffff', a, false);
    }
  } else if (kart.tip === 'tur') {
    const tur = TURLAR.find(x => x.no === kart.tur);
    yazi(kart.metin, W / 2, y - 20 * k, 150 * k * s, '#ffffff', a);
    yazi(tur.ad, W / 2, y + 120 * k, 110 * k, tur.renk, a);
  }
}

function rozet(metin, x, y, renk, sag) {
  const px = 34 * k, pad = 22 * k;
  cx.font = font(px);
  const tw = cx.measureText(metin).width, bw = tw + pad * 2, bh = px + pad * 1.1;
  const bx = sag ? x - bw : x;
  cx.fillStyle = 'rgba(18,6,38,0.78)'; cx.strokeStyle = renk; cx.lineWidth = 3 * k;
  cx.beginPath(); cx.roundRect(bx, y, bw, bh, bh / 2); cx.fill(); cx.stroke();
  cx.fillStyle = renk; cx.textAlign = 'left'; cx.textBaseline = 'middle';
  cx.fillText(metin, bx + pad, y + bh / 2 + 2 * k);
}

function hudCiz(t, tur, duvar) {
  rozet(`ROUND ${tur.no} · ${tur.ad}`, 40 * k, 36 * k, tur.renk, false);
  if (duvar) rozet(`WALL ${duvar.no} / ${TOPLAM_DUVAR}`, W - 40 * k, 36 * k, '#ffffff', true);
}

function sayimCiz(d, u, renk) {
  const say = Z.say;
  for (let i = 0; i < say.length; i++) {
    const a0 = say[i], a1 = say[i + 1] ?? Z.yaklas;
    if (u >= a0 && u < a1) {
      const q = (u - a0) / (a1 - a0);
      yazi(String(say.length - i), W / 2, H * 0.17, (180 - 40 * q) * k, ['#facc15', '#fb923c', '#ff4fa3'][i], 1);
    }
  }
  if (u >= Z.yaklas && u < Z.yaklas + Z.tut) {
    const q = (u - Z.yaklas) / Z.tut;
    yazi('MATCH!', W / 2, H * 0.17, (120 + 16 * Math.sin(q * 3.14)) * k, '#ffffff', 1);
  }
  const g0 = Z.yaklas + Z.tut + Z.gec * 0.3;
  if (u >= g0 && u < d.sure) {
    const q = (u - g0) / (d.sure - g0);
    yazi(d.ovgu || 'NICE!', W / 2, H * 0.30 - 30 * k * q, 110 * k, renk, 1 - q);
  }
}

// ------------------------------------------------------------ ABONE HATIRLATMASI
// Kullanıcı (16 Eki 2026): "subscribe yazısını her 15 saniyede bir ... insanların fark edeceği şekilde".
// Zamanlar bölüm JSON'undaki "abone" listesinden (her 2 duvarda bir, poz açıldıktan sonra) — efekt.py
// tık sesini aynı listeden koyar. Sol üst bantta: paneller, sayım ve MATCH! ortada, önleri kapanmaz.
const ABONE = BOLUM.abone || [], ABONE_SURE = BOLUM.abone_sure || 3.0;
function aboneCiz(t) {
  const a0 = ABONE.find(x => t >= x && t < x + ABONE_SURE);
  if (a0 === undefined) return;
  const u = t - a0;
  const gir = ease(kisit(u / 0.35, 0, 1)), cik = ease(kisit((ABONE_SURE - u) / 0.35, 0, 1));
  const kay = (1 - Math.min(gir, cik)) * -560 * k;
  const tik = 1.15, abone = u >= tik;
  const bas = u >= tik && u < tik + 0.15 ? 0.92 : 1;              // tıklama anında içe basma
  const pul = abone ? 1 : 1 + 0.05 * Math.sin(u * 12);
  const bw = 430 * k * bas * pul, bh = 104 * k * bas * pul;
  const x0 = 40 * k + kay, yM = H * 0.215;
  cx.save();
  cx.shadowColor = abone ? '#94a3b8' : '#ff1f3d'; cx.shadowBlur = 36 * k;
  cx.fillStyle = abone ? '#3f3f52' : '#e11d2e';
  cx.beginPath(); cx.roundRect(x0, yM - bh / 2, bw, bh, bh / 2); cx.fill();
  cx.restore();
  // oynat üçgeni rozeti
  const ix = x0 + bh * 0.62, iy = yM;
  cx.fillStyle = '#ffffff'; cx.beginPath(); cx.roundRect(ix - 30 * k, iy - 22 * k, 60 * k, 44 * k, 12 * k); cx.fill();
  cx.fillStyle = abone ? '#3f3f52' : '#e11d2e';
  cx.beginPath(); cx.moveTo(ix - 9 * k, iy - 12 * k); cx.lineTo(ix + 13 * k, iy); cx.lineTo(ix - 9 * k, iy + 12 * k); cx.closePath(); cx.fill();
  cx.font = font(40 * k * bas); cx.textAlign = 'left'; cx.textBaseline = 'middle'; cx.fillStyle = '#ffffff';
  cx.fillText(abone ? 'SUBSCRIBED' : 'SUBSCRIBE', ix + 44 * k, yM + 2 * k);
  // zil (abone olunca sallanır)
  const zx = x0 + bw + 46 * k, zy = yM;
  const sal = abone ? Math.sin((u - tik) * 30) * Math.exp(-(u - tik) * 3) * 0.5 : 0;
  cx.save(); cx.translate(zx, zy - 20 * k); cx.rotate(sal);
  cx.fillStyle = '#facc15'; cx.shadowColor = '#facc15'; cx.shadowBlur = 20 * k;
  cx.beginPath(); cx.moveTo(-24 * k, 34 * k); cx.quadraticCurveTo(-22 * k, 0, 0, -4 * k); cx.quadraticCurveTo(22 * k, 0, 24 * k, 34 * k); cx.closePath(); cx.fill();
  cx.beginPath(); cx.arc(0, 40 * k, 7 * k, 0, 6.283); cx.fill();
  cx.restore();
  // el imleci: düğmeye gelir, tıklar
  if (u > 0.45 && u < ABONE_SURE - 0.3) {
    const q = ease(kisit((u - 0.45) / (tik - 0.45), 0, 1));
    const hx = lerp(x0 + bw + 160 * k, x0 + bw * 0.7, q), hy = lerp(yM + 120 * k, yM + 18 * k, q);
    const s = (u >= tik && u < tik + 0.15) ? 0.85 : 1;
    cx.save(); cx.translate(hx, hy); cx.scale(s, s);
    cx.fillStyle = '#ffffff'; cx.strokeStyle = '#111827'; cx.lineWidth = 3 * k;
    cx.beginPath();
    cx.moveTo(0, 0); cx.lineTo(0, 46 * k); cx.lineTo(11 * k, 35 * k); cx.lineTo(20 * k, 54 * k);
    cx.lineTo(28 * k, 50 * k); cx.lineTo(19 * k, 32 * k); cx.lineTo(34 * k, 32 * k); cx.closePath();
    cx.fill(); cx.stroke();
    if (u >= tik && u < tik + 0.35) {                           // tık halkası
      const r2 = (u - tik) / 0.35;
      cx.strokeStyle = `rgba(255,255,255,${(1 - r2).toFixed(3)})`; cx.lineWidth = 4 * k;
      cx.beginPath(); cx.arc(0, 0, 14 * k + 40 * k * r2, 0, 6.283); cx.stroke();
    }
    cx.restore();
  }
}

// ------------------------------------------------------------ KATALOG (kontrol karesi)
// bolum JSON'unda "katalog": true -> 80 poz tek karede ızgara (P1 | P2), numaralı.
function katalogCiz() {
  cx.fillStyle = '#1a0b3d'; cx.fillRect(0, 0, W, H);
  const nolar = Object.keys(POZLAR).map(Number).sort((a, b) => a - b);
  const SUT = 10, SAT = Math.ceil(nolar.length / SUT);
  const cw = W / SUT, ch = H / SAT;
  nolar.forEach((no, j) => {
    const x0 = (j % SUT) * cw, y0 = Math.floor(j / SUT) * ch;
    const poz = POZLAR[no], c = CIFT[no];
    const olcF = ch * 0.78 / 290, zemin = y0 + ch * 0.93;
    for (let i = 0; i < 2; i++) {
      const px = x0 + (i === 0 ? 2 : cw / 2 + 1), pw = cw / 2 - 3;
      cx.fillStyle = i === 0 ? '#ff8cc6' : '#8fd8ff'; cx.fillRect(px, y0 + 2, pw, ch - 4);
      const n = i === 0 ? c.p1 : c.p2;
      let ox;
      if (poz.temas) ox = x0 + cw / 2 - dikisX(poz, c) * olcF;
      else { const [a, b] = kutu(n); ox = px + pw / 2 - (a + b) / 2 * olcF; }
      cx.save(); cx.beginPath(); cx.rect(px, y0 + 2, pw, ch - 4); cx.clip();
      figurCiz(n, olcF, ox, zemin); cx.restore();
    }
    cx.fillStyle = '#000'; cx.font = font(ch * 0.13); cx.textAlign = 'left'; cx.textBaseline = 'top';
    cx.fillText(String(no), x0 + 5, y0 + 4);
  });
}

// ------------------------------------------------------------ KARE
function kareKur(n) {
  if (BOLUM.katalog) { katalogCiz(); return; }
  const t = n / FPS;                         // DETERMINISTIK: duvar saati yok
  const tur = turBul(t);
  const renk = tur.renk;
  gokCiz(t, renk);
  sehirCiz(t, renk);
  zeminCiz(t, renk);
  yakinCiz(t, renk);
  const duvar = DUVARLAR.find(d => t >= d.t0 && t < d.t0 + d.sure);
  if (duvar) panelCiz(duvar, t - duvar.t0, renk);
  for (const kart of KARTLAR) if (t >= kart.t && t < kart.t + kart.sure) kartCiz(kart, t - kart.t, renk);
  const sonDuvar = duvar || [...DUVARLAR].reverse().find(d => d.t0 <= t);
  hudCiz(t, tur, sonDuvar);
  if (duvar) sayimCiz(duvar, t - duvar.t0, renk);
  aboneCiz(t);
}

window.kareKur = kareKur;
window.kareAl = (bicim, kalite) => {
  if (bicim === 'png')  return cikti.toDataURL('image/png');
  if (bicim === 'jpeg') return cikti.toDataURL('image/jpeg', kalite || 1);
  return cikti.toDataURL('image/webp', kalite || 1);
};
window.SURE_OLCU = TOPLAM_OLCU;
window.TOPLAM_KARE = Math.round(TOPLAM_OLCU * OLCU * FPS);
window.NOTA_SAYISI = DUVARLAR.length;
window.KLIP_SAYISI = Object.keys(POZLAR).length;
window.SILUET_VAR = DUVARLAR.every(d => CIFT[d.poz]);
window.__K = { POZLAR, CIFT, DUVARLAR, KARTLAR };
kareKur(0);
window.HAZIR = true;
</script>
