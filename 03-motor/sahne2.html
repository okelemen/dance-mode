  canvas { display:block; }

<canvas id="cikti"></canvas>

<script type="importmap">
{ "imports": {
    "three": "/03-motor/node_modules/three/build/three.module.js",
    "three/addons/": "/03-motor/node_modules/three/examples/jsm/"

<script type="module">
// =====================================================================
// MOTOR 2 — TEL KAFES (23 Eyl 2026). Kural kaynağı:
//   REFERANSLAR/REF-NOT-2-mekan.md (REF-046), Masaüstü/CLAUDE.md madde 14.
// sahne.html'den AYRI: bu videoda normal referans kuralları askıda.
// Arayüz sahne.html ile aynı (kareKur / kareAl / HAZIR ...) -> render.js
// ve render-bolum.yml değişmeden sürer (render.js --sayfa sahne2.html).
//
// Sahne: sabit kamera, siyah boşlukta camgöbeği tel kafes kutu şehri
// (altta zeminden, üstte tavandan; ekran kenarından başlar, boşluk yok).
// Kutular vuruşa kilitli büyüyüp küçülür. Çağrı anında magenta siluet
// (normal motor siluet stili: dolu gövde + parlak kontur) bir kutunun
// üstünde belirir, hareketi yapar, kaybolur; o kutu hareket boyunca sabit.
// Hareket engeli YOK. HUD: sol üst LEVEL 1-5, sağ üst COMBO, SUBSCRIBE.
// =====================================================================
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const S = await fetch('/spec/sabitler.json').then(r => r.json());
const FPS = S.video.fps;
const SP = new URLSearchParams(location.search);
const W = Number(SP.get('w') || 1280);
const H = Number(SP.get('h') || 720);
const k = H / 1080;                         // tasarım 1080p'de yapıldı

// ------------------------------------------------------------ BOLUM
const BOLUM_YOL = SP.get('bolum');
const BOLUM = BOLUM_YOL ? await fetch(BOLUM_YOL).then(r => r.json()) : {};
const BPM = BOLUM.bpm || 140;
const VURUS = 60 / BPM;
const OLCU = VURUS * 4;
// muzigin ilk vurusu (sn). Negatifse parca vurustan az once baslıyor.
const ILK_VURUS = BOLUM.ilk_vurus || 0;
// render uzunlugu (render.js --toplam) ile bolumun GERCEK uzunlugu ayri:
// LEVEL dagilimi hep tam bolume gore (kisa kesitte de LEVEL dogru kalir).
const TOPLAM_OLCU = Number(SP.get('toplam') || BOLUM.toplam_olcu || 16);
const BOLUM_OLCU = BOLUM.bolum_olcu || TOPLAM_OLCU;
const SEVIYE_SAYI = 5;

// CUE'LAR: { olcu, vurus (0-3, ondalik olabilir), hareket, kutu }
const HAREKET_KLIP = { 'bob-and-weave':'bob-weave', 'lateral-lunge':'lateral-lunge-k',
                       'jump-reach':'jump-reach-k', 'tuck-jump':'tuck-jump' };
const CUELAR = (BOLUM.cuelar || []).map((c, i) => ({
  ...c, i,
  t: ILK_VURUS + (c.olcu * 4 + (c.vurus || 0)) * VURUS,
  klip: HAREKET_KLIP[c.hareket] || c.hareket,
})).sort((a, b) => a.t - b.t);
// lateral lunge sirayla sola ve saga (ayni yone ust uste iki hamle yok)
{ let n = 0; for (const c of CUELAR) if (c.hareket === 'lateral-lunge') c.klip = (n++ % 2) ? 'lunge-R-k' : 'lunge-L-k'; }

// ------------------------------------------------------------ RASTGELE (deterministik)
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ------------------------------------------------------------ PROJEKSIYON
const F = 1000 * k, CX = W / 2, CY = H * 0.47;
const ZEMIN = -2.6, TAVAN = 3.4, HUCRE = 0.95;
const px = (x, z) => CX + F * x / z;
const py = (y, z) => CY - F * y / z;

// Siluet kutulari (kaide): ekranin rahat gorulen bandinda, sol-orta-sag.
const KAIDE = [
  { x:-3.0, z:8.4 }, { x:-1.5, z:7.4 }, { x:0.0, z:8.8 }, { x:1.5, z:7.4 }, { x:3.0, z:8.4 },
].map(o => ({ ...o, w:1.5, top:-1.25 }));
const KAIDE_SIRA = [3, 1, 2, 4, 0, 2, 1, 3];   // cue'da kutu verilmezse bu sirayla

// ------------------------------------------------------------ SEHIR
// kutu: [z, x0, gen, y0, boy, derin, alt?, genlik, grup]
const KUTULAR = [];
{
  const r = rng(11);
  const kaideCakisir = (x, z) => KAIDE.some(p => Math.abs(x + HUCRE / 2 - p.x) < 1.05 && Math.abs(z + HUCRE / 2 - p.z) < 1.05);
  for (const alt of [true, false]) {
    for (let z = 2.2; z < 21; z += HUCRE) {
      const yarim = z * CX / F + 1.5;
      for (let x = -yarim; x < yarim; x += HUCRE) {
        if (alt && kaideCakisir(x, z)) continue;
        if (r() >= 0.9) continue;
        const ic = Math.abs(x) < 3.9 && z < 16;          // kaidelerin onunde alcak kal
        const h = ic ? 0.12 + r() * (alt ? 0.38 : 0.48) : 0.2 + r() * ((z < 12 ? 1.3 : 2.0));
        KUTULAR.push({ z, x, g: HUCRE * 0.86, h, d: HUCRE * 0.86, alt,
                       a: 0.10 + r() * 0.22, grup: r() < 0.5 ? 0 : 1, kaide: -1 });
      }
    }
  }
  for (let i = 0; i < 140; i++) {                        // uzak duvar dokusu
    const z = 24 + r() * 66, x = -50 + r() * 100, w = 0.8 + r() * 1.4;
    const alt = r() < 0.5;
    const y = alt ? ZEMIN + r() * 5 : TAVAN - 6 + r() * 6;
    KUTULAR.push({ z, x, g: w, h: 0.8 + r() * 1.7, d: w, alt: null, y, a: 0.06, grup: i & 1, kaide: -1 });
  }
  KAIDE.forEach((p, j) => KUTULAR.push({ z: p.z, x: p.x - p.w / 2, g: p.w, h: p.top - ZEMIN, d: p.w,
                                         alt: true, a: 0.12, grup: j & 1, kaide: j }));
  KUTULAR.sort((a, b) => b.z - a.z);
}

// ------------------------------------------------------------ KATMANLAR
const cikti = document.getElementById('cikti');
cikti.width = W; cikti.height = H;
const cx = cikti.getContext('2d', { alpha: false });
const cizgiCv = document.createElement('canvas'); cizgiCv.width = W; cizgiCv.height = H;
const lx = cizgiCv.getContext('2d');
const parCv = document.createElement('canvas'); parCv.width = W >> 1; parCv.height = H >> 1;
const gx = parCv.getContext('2d');

const PARLAKLIK_KOVA = 7;
// LEVEL RENKLERI (24 Eyl 2026, kullanici): sehir her levelde renk degistirir,
// magenta siluetle UYUMLU. Magentanin yanina oturan bes ton: camgobegi ->
// elektrik mavisi -> mor -> altin -> neon yesil (tamamlayici). Gecis LEVEL UP
// aninda baslar, bir olcude yumusakca tamamlanir.
const LEVEL_RENK = [[70, 235, 210], [70, 150, 255], [160, 110, 255], [255, 190, 70], [110, 255, 140]];
function sehirRengi(t) {
  const olcuNo = (t - ILK_VURUS) / OLCU;
  const dilim = BOLUM_OLCU / SEVIYE_SAYI;
  const sv = Math.min(SEVIYE_SAYI - 1, Math.max(0, Math.floor(olcuNo / dilim)));
  const w = sv > 0 ? Math.min(1, (olcuNo - sv * dilim) / 1) : 1;
  const a = LEVEL_RENK[Math.max(0, sv - 1)], b = LEVEL_RENK[sv];
  const e = w * w * (3 - 2 * w);
  return a.map((x, i) => Math.round(x + (b[i] - x) * e));
}
function sehirCiz(t, aktifKaideler) {
  const [R, G, Bm] = sehirRengi(t);
  // vurus nabzi: her vurusta hizli buyume, yavas sonme; olcu basi daha guclu
  const vf = (t - ILK_VURUS) / VURUS;
  const vno = Math.floor(vf), vfaz = vf - vno;
  const nabiz = Math.exp(-5.5 * Math.max(0, vfaz)) * ((((vno % 4) + 4) % 4) === 0 ? 1.25 : 1.0);
  const kovalar = Array.from({ length: PARLAKLIK_KOVA }, () => []);
  const kaideCizgi = [];
  for (const b of KUTULAR) {
    const sabit = b.kaide >= 0 && aktifKaideler.includes(b.kaide);
    const esle = (((vno % 2) + 2) % 2) === b.grup ? 1 : 0.35;
    const s = sabit ? 1 : 1 + b.a * (nabiz * esle * 1.6 - 0.35);
    const g = b.g * Math.min(s, 1.10), gx0 = b.x + (b.g - g) / 2;
    let y0, y1;
    if (b.alt === true)       { y0 = ZEMIN; y1 = ZEMIN + b.h * s; }
    else if (b.alt === false) { y1 = TAVAN; y0 = TAVAN - b.h * s; }
    else                      { y0 = b.y;  y1 = b.y + b.h * s; }
    const z0 = b.z, z1 = b.z + b.d;
    const X0 = px(gx0, z0), X1 = px(gx0 + g, z0);
    if (Math.max(X0, X1, px(gx0, z1), px(gx0 + g, z1)) < -40 || Math.min(X0, X1, px(gx0, z1), px(gx0 + g, z1)) > W + 40) continue;
    const kova = sabit ? null
      : kovalar[Math.min(PARLAKLIK_KOVA - 1, Math.floor((1 - Math.max(0.1, Math.min(1, Math.pow(7.5 / b.z, 1.3)))) * PARLAKLIK_KOVA))];
    const hedef = sabit ? kaideCizgi : kova;
    const v = [];
    for (const xx of [gx0, gx0 + g]) for (const yy of [y0, y1]) for (const zz of [z0, z1]) v.push([px(xx, zz), py(yy, zz)]);
    // 12 kenar: bir eksende farkli olan kose ciftleri
    const E = [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
    for (const [i, j] of E) hedef.push(v[i][0], v[i][1], v[j][0], v[j][1]);
  }
  lx.clearRect(0, 0, W, H);
  lx.lineCap = 'round';
  for (let q = 0; q < PARLAKLIK_KOVA; q++) {
    const L = kovalar[q]; if (!L.length) continue;
    const a = 1 - q / PARLAKLIK_KOVA;
    lx.strokeStyle = `rgba(${R},${G},${Bm},${Math.max(0.12, a)})`;
    lx.lineWidth = Math.max(1, (q < 3 ? 2 : 1) * k);
    lx.beginPath();
    for (let i = 0; i < L.length; i += 4) { lx.moveTo(L[i], L[i+1]); lx.lineTo(L[i+2], L[i+3]); }
    lx.stroke();
  }
  if (kaideCizgi.length) {
    lx.strokeStyle = `rgb(${Math.round(R + (255 - R) * 0.6)},${Math.round(G + (255 - G) * 0.6)},${Math.round(Bm + (255 - Bm) * 0.6)})`; lx.lineWidth = 4 * k;
    lx.beginPath();
    for (let i = 0; i < kaideCizgi.length; i += 4) { lx.moveTo(kaideCizgi[i], kaideCizgi[i+1]); lx.lineTo(kaideCizgi[i+2], kaideCizgi[i+3]); }
    lx.stroke();
  }
  // parlama: yarim cozunurlukte bulaniklastir, uzerine topla
  gx.clearRect(0, 0, parCv.width, parCv.height);
  gx.filter = `blur(${Math.max(2, Math.round(3 * k))}px)`;
  gx.drawImage(cizgiCv, 0, 0, parCv.width, parCv.height);
  gx.filter = 'none';
  cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  cx.globalAlpha = 0.95; cx.drawImage(parCv, 0, 0, W, H);
  cx.globalAlpha = 1;    cx.drawImage(cizgiCv, 0, 0);
  cx.globalCompositeOperation = 'source-over';
}

// ------------------------------------------------------------ SILUET (3B -> maske)
const MW = Math.round(0.64 * H), MH = Math.round(0.90 * H);
const glCv = document.createElement('canvas'); glCv.width = MW; glCv.height = MH;
const renderer = new THREE.WebGLRenderer({ canvas: glCv, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(MW, MH, false);
renderer.setClearColor(0x000000, 0);
const sahneS = new THREE.Scene();
const kamS = new THREE.PerspectiveCamera(26, MW / MH, 0.1, 60);
kamS.position.set(0, 1.05, 13.8); kamS.lookAt(0, 1.05, 0);
// zemin (y=0) maskede hangi satirda: merkez 1,05 yukarida, yarim gorus yuksekligi 13,8*tan(13)
// ZEMIN_SATIR asagida idle maskesinden OLCULUR (kalibrasyon).

const yukleyici = new FBXLoader();
const yukle = ad => new Promise(res => yukleyici.load(`/02-hareketler/${ad}.fbx`, o => res(o), undefined, () => res(null)));
const KLIP_ADLARI = ['idle', 'bob-weave', 'lateral-lunge', 'jump-reach', 'tuck-jump', 'walk', 'box-jump', 'turn180-L', 'turn180-R', 'lunge-pose-L', 'lunge-pose-R'];
const klipler = {};
let siluet = null, mixer = null, kokKemik = null, kokBaslangic = null;
const govde = await yukle('siluet-govde');
if (govde) {
  govde.scale.setScalar(0.0125);
  govde.traverse(o => { if (o.isMesh || o.isSkinnedMesh) { o.material = new THREE.MeshBasicMaterial({ color: '#ffffff' }); o.frustumCulled = false; } });
  // AYAKKABI KAPALI (24 Eyl 2026): "Shoes" mesh'i diz bukulunce ayaktan ayrilip
  // sivri parcalar halinde yelpazeleniyor (mesh tek tek gizlenerek olculdu:
  // yalniz Shoes kapaninca temiz). Siluet dolu renk; Body'nin ayagi yeterli.
  govde.traverse(o => { if (o.name === 'Shoes') o.visible = false; });
  sahneS.add(govde); siluet = govde;
  mixer = new THREE.AnimationMixer(govde);
  govde.traverse(o => { if (o.isBone && /hips/i.test(o.name) && !kokKemik) kokKemik = o; });
  if (kokKemik) kokBaslangic = kokKemik.position.clone();
  for (const ad of KLIP_ADLARI) {
    const o = await yukle(ad); const kl = o && o.animations[0];
    if (kl && kl.tracks.length) klipler[ad] = kl;
  }
  // REMY HIZALAMASI (sahne.html ile ayni): kalca Y'si idle'in ilk karesine
  if (klipler.idle) {
    const iz0 = klipler.idle.tracks.find(t => /Hips\.position$/.test(t.name));
    for (const ad of KLIP_ADLARI.slice(1)) {
      if (/pose/.test(ad)) continue;
      const kl = klipler[ad]; if (!kl || !iz0) continue;
      const iz = kl.tracks.find(t => /Hips\.position$/.test(t.name)); if (!iz) continue;
      const dy = iz.values[1] - iz0.values[1];
      for (let j = 1; j < iz.values.length; j += 3) iz.values[j] -= dy;
    }
  }
}
// BOX-JUMP SICRAMA YAYI: klip kendi alcak kutusu icin kalcayi 73 cm sicratiyor
// (tepe 176 cm, kutuya inis ~128 cm). Bizim kaide boyunda siluet kutunun bir
// kutu boyu USTUNE cikip oradan dusuyordu - "havada kaliyor". Ucus araliginda
// inis seviyesinin ustundeki kisim %45'e indirilir: kutunun hemen ustunden
// gecip dogrudan iner. Comelme ve inis pozlari degismez.
if (klipler['box-jump']) {
  const iz = klipler['box-jump'].tracks.find(t => /Hips\.position$/.test(t.name));
  if (iz) for (let i = 0; i < iz.times.length; i++) {
    const y = iz.values[i * 3 + 1];
    if (iz.times[i] > 0.9 && iz.times[i] < 1.7 && y > 128) iz.values[i * 3 + 1] = 128 + (y - 128) * 0.45;
  }
}
// JUMP REACH: "Jump And Catch With One Hand" topu yakaladiktan sonra YERE
// DUSUYOR (kalca 102 cm -> -62 cm, olculdu). Sicramanin tepesinden sonra
// ayakta inis anina (kalca tekrar ~105 cm alti) +0,20 sn kadari alinir.
if (klipler['jump-reach']) {
  const kl = klipler['jump-reach'];
  const iz = kl.tracks.find(t => /Hips\.position$/.test(t.name));
  let tp = 0, m = -1e9, son = kl.duration;
  if (iz) {
    for (let i = 0; i < iz.times.length; i++) if (iz.values[i * 3 + 1] > m) { m = iz.values[i * 3 + 1]; tp = iz.times[i]; }
    for (let i = 0; i < iz.times.length; i++) if (iz.times[i] > tp && iz.values[i * 3 + 1] < 105) { son = Math.min(kl.duration, iz.times[i] + 0.20); break; }
  }
  klipler['jump-reach-k'] = THREE.AnimationUtils.subclip(kl, 'jump-reach-k', 0, Math.max(2, Math.round(son * 30)), 30);
}
const aksiyon = {};
if (mixer) for (const [ad, kl] of Object.entries(klipler)) {
  const a = mixer.clipAction(kl); a.setLoop(THREE.LoopRepeat, Infinity);
  aksiyon[ad] = { a, kl };
}

// ------------------------------------------------------------ MASKE / KALIBRASYON
const maskeCv = document.createElement('canvas'); maskeCv.width = MW; maskeCv.height = MH;
const mx = maskeCv.getContext('2d', { willReadFrequently: true });
const renkCv = document.createElement('canvas'); renkCv.width = MW; renkCv.height = MH;
const rx = renkCv.getContext('2d');
const icCv = document.createElement('canvas'); icCv.width = MW; icCv.height = MH;
const ix = icCv.getContext('2d');
const MAG = '#ff3aeb';

// TUCK JUMP: "Jumping In Place" klibinde dizler gogse cekilmiyor. Havadayken
// (kalca ayakta durustan yuksekken) uyluk one, diz arkaya bukulur; agirlik
// sicramanin yuksekligiyle orantili -> kalkista ve iniste kendiliginden sifir.
const kemik = {};
if (siluet) siluet.traverse(o => { if (o.isBone) {
  const ad = o.name.replace(/^mixamorig:?/, '');
  if (['LeftUpLeg', 'RightUpLeg', 'LeftLeg', 'RightLeg', 'LeftFoot', 'RightFoot', 'LeftToeBase', 'RightToeBase'].includes(ad)) kemik[ad] = o;
} });
let TUCK_TEPE = 150;
if (klipler['tuck-jump']) {
  const iz = klipler['tuck-jump'].tracks.find(t => /Hips\.position$/.test(t.name));
  if (iz) { TUCK_TEPE = -1e9; for (let i = 0; i < iz.times.length; i++) TUCK_TEPE = Math.max(TUCK_TEPE, iz.values[i * 3 + 1]); }
}
// Hedef poz MUTLAK: kemigin dinlenme (bind) yonelimi x eksen donusu. Onceki
// deneme klibin kendi bukumune EKLIYORDU; klip zaten dizleri buktugu anlarda
// toplam aci 150 dereceyi asiyor, deri kemikten kopup bacak sivri seritlere
// donusuyordu (yandan olculdu). Artik klibin pozundan hedefe slerp -> toplam
// bukum hedefle sinirli.
const TUCK_UYLUK = -1.35, TUCK_DIZ = 1.75;     // radyan (yerel X ekseni)
const _q = new THREE.Quaternion(), _x = new THREE.Vector3(1, 0, 0);
const tuckHedef = {};
for (const [ad, aci] of [['LeftUpLeg', TUCK_UYLUK], ['RightUpLeg', TUCK_UYLUK], ['LeftLeg', TUCK_DIZ], ['RightLeg', TUCK_DIZ]]) {
  const b = kemik[ad]; if (!b) continue;
  tuckHedef[ad] = b.quaternion.clone().multiply(new THREE.Quaternion().setFromAxisAngle(_x, aci));
}
// ayaklar havadayken notr aciya: ayak ucu asagi uzaninca siluette igne gibi gorunuyordu
for (const ad of ['LeftFoot', 'RightFoot', 'LeftToeBase', 'RightToeBase']) if (kemik[ad]) tuckHedef[ad] = kemik[ad].quaternion.clone();
function tuckUygula() {
  if (!kokKemik) return;
  const y = kokKemik.position.y;
  let w = (y - 118) / Math.max(1, TUCK_TEPE - 8 - 118);
  w = Math.max(0, Math.min(1, w)); w = w * w * (3 - 2 * w);
  if (w <= 0) return;
  for (const ad of Object.keys(tuckHedef)) kemik[ad].quaternion.slerp(tuckHedef[ad], w);
}
// AYAK KOPMASI (24 Eyl 2026, kullanici: "ayaklari kopuyor"): tuckUygula ayak
// ve ayak ucu kemiklerini dogrudan bukuyor; bazi klipler bu kemiklere iz
// tasimadigi icin mixer onlari sifirlamiyordu -> bozuk aci sonraki BUTUN
// hareketlere tasiniyor, ayaklar sivri parcalar gibi gorunuyordu (ilk
// tuck-jump'tan sonra her karede, olculdu). Her pozdan once dinlenme acisina.
const ikizler = {};
function ikiz(ad) {
  if (!aksiyon[ad]) return null;
  if (!ikizler[ad]) {
    const kl = aksiyon[ad].kl.clone(); kl.name = ad + '#ikiz';
    const a = mixer.clipAction(kl); a.setLoop(THREE.LoopRepeat, Infinity);
    ikizler[ad] = { a, kl };
  }
  return ikizler[ad];
}
const kemikDinlenme = {};
for (const [ad, b] of Object.entries(kemik)) kemikDinlenme[ad] = b.quaternion.clone();
function pozKur(ad, zaman, yaw, harman) {
  for (const [kad, q] of Object.entries(kemikDinlenme)) kemik[kad].quaternion.copy(q);
  for (const v of Object.values(aksiyon)) v.a.enabled = false;
  for (const v of Object.values(ikizler)) v.a.enabled = false;
  const A = aksiyon[ad];
  if (A) {
    // ayni hareket art arda: ayni aksiyon iki zamanda olamaz -> klibin ikizi
    const B = !harman ? null : harman.ad !== ad ? aksiyon[harman.ad] : ikiz(harman.ad);
    const wB = B ? harman.w : 0;
    A.a.enabled = true; A.a.play(); A.a.setEffectiveWeight(1 - wB); A.a.timeScale = 1;
    if (B) { B.a.enabled = true; B.a.play(); B.a.setEffectiveWeight(wB); B.a.timeScale = 1; }
    mixer.setTime(0);
    A.a.time = Math.max(0, Math.min(A.kl.duration - 1e-3, zaman));
    if (B) B.a.time = Math.max(0, Math.min(B.kl.duration - 1e-3, harman.zaman));
    mixer.update(0);
    if (ad === 'tuck-jump') tuckUygula();
    if (kokKemik && kokBaslangic) { kokKemik.position.x = kokBaslangic.x; kokKemik.position.z = kokBaslangic.z; }
  }
  siluet.rotation.y = yaw;
  renderer.render(sahneS, kamS);
  mx.clearRect(0, 0, MW, MH); mx.drawImage(glCv, 0, 0);
}
// ZEMIN SATIRI OLCULUR (ilk kesit: ayaklar hesaplanan satirin altindaydi,
// siluet kutunun icine gomulu gorunuyordu). idle pozunun maskesindeki en alt
// ve en ust dolu satir -> ayak cizgisi ve figur boyu.
let ZEMIN_SATIR = MH * 0.665, FIGUR_PX = MH * 0.738;
if (siluet) {
  pozKur('idle', 0, 0);
  const d = mx.getImageData(0, 0, MW, MH).data;
  let ust = -1, alt = -1;
  for (let y = 0; y < MH; y++) {
    let dolu = false;
    for (let x = 0; x < MW; x++) if (d[(y * MW + x) * 4 + 3] > 40) { dolu = true; break; }
    if (dolu) { if (ust < 0) ust = y; alt = y; }
  }
  if (alt > 0) { ZEMIN_SATIR = alt + 1; FIGUR_PX = alt - ust + 1; }
}

// LATERAL LUNGE: "Goalkeeper Left Sidestep" 0,53 sn ve yana 2,5 m kayiyor.
// push-it / HAR-005 yontemi: idle -> klibin OLCULEN tepe pozu -> tutus -> idle.
// Tepe pozu = maskede siluetin EN GENIS oldugu an (bacaklar en acik).
function pozKlipKur(ad, kaynak, oran) {
  const I = klipler['idle'], P = klipler[kaynak];
  if (!I || !P) return;
  const tp = oran * P.duration;
  const T = [0.00, 0.14, 0.28, 0.42, 0.80, 1.18, 1.32, 1.46, 1.60];
  const W8 = [0.00, 0.16, 0.62, 1.00, 1.00, 1.00, 0.62, 0.16, 0.00];
  const qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), qo = new THREE.Quaternion();
  const izler = [];
  for (const iz of P.tracks) {
    const ti = I.tracks.find(t => t.name === iz.name);
    if (!ti) continue;
    const n = iz.getValueSize();
    const va = ti.values.slice(0, n);
    const vb = Array.from(iz.createInterpolant().evaluate(tp)).slice(0, n);
    const quat = /quaternion/.test(iz.name);
    const deger = [];
    for (const w of W8) {
      if (quat) { qa.fromArray(va); qb.fromArray(vb); qo.slerpQuaternions(qa, qb, w); deger.push(qo.x, qo.y, qo.z, qo.w); }
      else for (let j = 0; j < n; j++) deger.push(va[j] + (vb[j] - va[j]) * w);
    }
    izler.push(new (quat ? THREE.QuaternionKeyframeTrack : THREE.VectorKeyframeTrack)(iz.name, T, deger));
  }
  klipler[ad] = new THREE.AnimationClip(ad, 1.60, izler);
  const a = mixer.clipAction(klipler[ad]); a.setLoop(THREE.LoopRepeat, Infinity);
  aksiyon[ad] = { a, kl: klipler[ad] };
}
function maskeGenislik() {
  const d = mx.getImageData(0, 0, MW, MH).data;
  let x0 = MW, x1 = -1;
  for (let y = 0; y < MH; y += 2) for (let x = 0; x < MW; x++) if (d[(y * MW + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; }
  return x1 - x0;
}
// LATERAL LUNGE (24 Eyl 2026): kaleci klibi olculdu, yana SICRIYOR (kalca
// 103 -> 122 cm), icinde lunge pozu yok. Yerine Mixamo "Male Dance Pose -
// Legs Spread Leaning Left/Right" durgun pozu: bacaklar acik, govde bir yana
// yuklenmis. push-it yontemiyle harekete cevrilir (idle -> poz -> tutus -> idle).
const LUNGE_ORAN = 0.5;
pozKlipKur('lunge-L-k', 'lunge-pose-L', LUNGE_ORAN);
pozKlipKur('lunge-R-k', 'lunge-pose-R', LUNGE_ORAN);
if (mixer && klipler['jump-reach-k'] && !aksiyon['jump-reach-k']) {
  const a = mixer.clipAction(klipler['jump-reach-k']); a.setLoop(THREE.LoopRepeat, Infinity);
  aksiyon['jump-reach-k'] = { a, kl: klipler['jump-reach-k'] };
}

// ------------------------------------------------------------ KOREOGRAFI (TEK SILUET)
// Kullanici (23 Eyl 2026): muzik baslayinca siluet ONDE belirir, arkasini
// donup geriye yurur, secilen kutunun ustune cikar, ilk hareketi orada yapar.
// Sonra her cagrida kaybolup bir sonraki kutuda belirir. Ekranda HEP TEK siluet.
const HF = 3.36;                         // siluet boyu (dunya birimi) - kaide ~1,35
const ZEMIN_YUR = ZEMIN + 0.25;          // yuruyus zemini (alcak kutularin ustu)
const BAS_POZ = { x: 0, z: 4.9 };        // onde belirme noktasi
const YUR_HIZ = 2.3;                     // birim/sn - walk klibinin adim boyuna yakin
const GIR = 0.18, CIK = 0.18;            // kutular arasi belirme/kaybolma
const DON = 2 * VURUS;                   // donus suresi
const yon = (dx, dz) => Math.atan2(dx, -dz);   // dunya yonu -> maske yaw (model +z'ye bakar)
const ss = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const aciKar = (a, b, w) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * w; };

// KUTUYA ZIPLAMA (23 Eyl 2026 duzeltme). "Jump Up On Box" klibinin kalca
// yuksekligi olculdu: 0,8 sn comelme (70 cm) -> 1,3 sn tepe (176) -> 1,6-2,0 sn
// KENDI kutusuna iniyor (124-135) -> sonra kutudan geri iniyor. Onceki surum
// klibin kendi kutu yuksekligine bizim kaide yuksekligini EKLIYORDU -> siluet
// havada kaliyordu. Artik pencere comelmeden (0,55) klibin kutuda dogruldugu
// ana (2,0) kadar; klibin kutu yuksekligi MASKEDEN olculup yalniz FARK eklenir.
const TIRMAN_BAS = 0.55, TIRMAN_SON = 2.0, TIRMAN = TIRMAN_SON - TIRMAN_BAS;
const UCUS_BAS = 1.00, UCUS_SON = 1.55;          // ayaklarin yerden kesildigi / kutuya degdigi an
let KLIP_KUTU = 0;                               // klibin kendi kutusu (dunya birimi)
if (siluet && klipler['box-jump']) {
  pozKur('box-jump', 1.95, 0);
  const d = mx.getImageData(0, 0, MW, MH).data;
  let alt = -1;
  for (let y = MH - 1; y >= 0 && alt < 0; y--) for (let x = 0; x < MW; x++) if (d[(y * MW + x) * 4 + 3] > 40) { alt = y; break; }
  if (alt > 0) KLIP_KUTU = (ZEMIN_SATIR - (alt + 1)) / FIGUR_PX * HF;
}
// DONUS (23 Eyl 2026): govdeyi yerinde dondurmek "makine" gibi duruyordu.
// Mixamo "Standing 180 Left/Right Turn": insan adim atarak doner, kalca
// 1,63 sn'de 176-180 derece doner. Klip kendi dondurur; model yonu yalniz
// hedef yondeki farki donus boyunca yayar.
const DON_L = klipler['turn180-L'] ? klipler['turn180-L'].duration : 1.63;
const DON_R = klipler['turn180-R'] ? klipler['turn180-R'].duration : 1.63;
const YUR_DONGU = klipler['walk'] ? klipler['walk'].duration : 1.17;

for (let i = 0; i < CUELAR.length; i++) {
  const c = CUELAR[i], sonraki = CUELAR[i + 1];
  c.kaide = (c.kutu !== undefined) ? c.kutu : KAIDE_SIRA[i % KAIDE_SIRA.length];
  const A = aksiyon[c.klip];
  const dogal = A ? A.kl.duration : 2 * VURUS;
  const bosluk = sonraki ? sonraki.t - c.t : 1e9;
  // AYNI KUTUDA ART ARDA (24 Eyl 2026, her olcude cagri): siluet kaybolmaz,
  // hareket bir sonraki cagriya kadar surer, sonraki hareket GECIS kadar
  // harmanlanarak baslar. Kutu degisiyorsa eski duzen: bitir, kaybol, belir.
  const sonrakiKutu = sonraki ? (sonraki.kutu !== undefined ? sonraki.kutu : KAIDE_SIRA[(i + 1) % KAIDE_SIRA.length]) : -1;
  c.zincir = !!sonraki && sonrakiKutu === c.kaide && bosluk < 4 * OLCU;
  c.sure = c.zincir ? bosluk
         : Math.min(Math.max(2, Math.round(dogal / VURUS)) * VURUS, bosluk - GIR - CIK - 0.05);
  // klip en fazla 1,4x hizlanir (bob-weave 2,33 sn -> bir olcu 1,71 sn); sigmazsa
  // klibin basindan o kadari oynar
  c.hiz = Math.min(1.4, Math.max(0.8, dogal / c.sure));
  c.bitis = c.t + c.sure;
}
const GECIS = 0.12;                      // zincirde onceki hareketin son pozundan harman
// giris plani (ilk cagridan geriye dogru kurulur)
const PLAN = {};
if (CUELAR.length) {
  const c0 = CUELAR[0], p0 = KAIDE[c0.kaide];
  const onu = { x: p0.x, z: p0.z - 0.60 }, ust = { x: p0.x, z: p0.z + p0.w / 2 };
  const mesafe = Math.hypot(onu.x - BAS_POZ.x, onu.z - BAS_POZ.z);
  // yuruyus TAM adim dongusu: ayaklar bitiste yan yana -> ziplamaya dikissiz gecis
  const dongu = Math.max(1, Math.round(mesafe / (YUR_HIZ * YUR_DONGU)));
  PLAN.yurSure    = dongu * YUR_DONGU;
  PLAN.donGeriBit = c0.t - 0.05;
  PLAN.donGeriBas = PLAN.donGeriBit - DON_R;
  PLAN.tirmanBas  = PLAN.donGeriBas - TIRMAN;
  PLAN.yurBas     = PLAN.tirmanBas - PLAN.yurSure;
  PLAN.donBas     = PLAN.yurBas - DON_L;
  PLAN.belir      = Math.max(0, ILK_VURUS) + 0.15;
  PLAN.onu = onu; PLAN.ust = ust; PLAN.p0 = p0; PLAN.mesafe = mesafe;
  PLAN.yurYaw = yon(onu.x - BAS_POZ.x, onu.z - BAS_POZ.z);      // ~pi: arkaya
  PLAN.tirYaw = yon(ust.x - onu.x, ust.z - onu.z);
  PLAN.kaideH = p0.top - ZEMIN_YUR;
}

// t anindaki siluet durumu: { ad, zaman, yaw, x, y, z, alfa } ya da null
function durum(t) {
  if (!CUELAR.length) return null;
  const P = PLAN, c0 = CUELAR[0];
  if (t < c0.t) {
    if (t < P.belir) return null;
    const alfa = ss((t - P.belir) / 0.35);
    const B = { x: BAS_POZ.x, y: ZEMIN_YUR, z: BAS_POZ.z };
    if (t < P.donBas) return { ad: 'idle', zaman: t - P.belir, yaw: 0, ...B, alfa };
    if (t < P.yurBas) {
      // klip ~180 derece dondurur; yuruyus yonune kalan fark donus boyunca yayilir
      const w = (t - P.donBas) / DON_L;
      return { ad: 'turn180-L', zaman: t - P.donBas, yaw: (P.yurYaw - Math.PI) * ss(w), ...B, alfa };
    }
    if (t < P.tirmanBas) {
      const w = (t - P.yurBas) / P.yurSure;
      return { ad: 'walk', zaman: (t - P.yurBas) % YUR_DONGU, yaw: P.yurYaw,
               x: BAS_POZ.x + (P.onu.x - BAS_POZ.x) * w, y: ZEMIN_YUR,
               z: BAS_POZ.z + (P.onu.z - BAS_POZ.z) * w, alfa };
    }
    if (t < P.donGeriBas) {
      const tk = TIRMAN_BAS + (t - P.tirmanBas);
      const w = ss((tk - UCUS_BAS) / (UCUS_SON - UCUS_BAS));   // havadayken ilerle
      // klip kendi kutusuna KLIP_KUTU kadar cikiyor; bizim kaideye kalan fark eklenir
      return { ad: 'box-jump', zaman: tk, yaw: aciKar(P.yurYaw, P.tirYaw, ss((t - P.tirmanBas) / 0.3)),
               x: P.onu.x + (P.ust.x - P.onu.x) * w, y: ZEMIN_YUR + (P.kaideH - KLIP_KUTU) * w,
               z: P.onu.z + (P.ust.z - P.onu.z) * w, alfa };
    }
    // kutunun ustunde izleyiciye don (klip -180 derece dondurur)
    const w = (t - P.donGeriBas) / DON_R;
    if (t < P.donGeriBas + DON_R)
      return { ad: 'turn180-R', zaman: t - P.donGeriBas, yaw: aciKar(P.tirYaw, Math.PI, ss(w)),
               x: P.ust.x, y: P.p0.top, z: P.ust.z, alfa };
    return { ad: 'idle', zaman: t - P.donGeriBit, yaw: 0, x: P.ust.x, y: P.p0.top, z: P.ust.z, alfa };
  }
  for (let i = 0; i < CUELAR.length; i++) {
    const c = CUELAR[i], sonraki = CUELAR[i + 1];
    const p = KAIDE[c.kaide], ust = { x: p.x, y: p.top, z: p.z + p.w / 2 };
    const pencereSon = sonraki ? sonraki.t : c.bitis + CIK + 0.01;
    if (t >= c.t && t < pencereSon) {
      if (t < c.bitis) {
        const d = { ad: c.klip, zaman: (t - c.t) * c.hiz, yaw: 0, ...ust, alfa: 1 };
        const once = CUELAR[i - 1];
        if (once && once.zincir && t < c.t + GECIS) {
          const tO = Math.min(once.sure * once.hiz, aksiyon[once.klip] ? aksiyon[once.klip].kl.duration - 1e-3 : 0);
          d.harman = { ad: once.klip, zaman: tO, w: 1 - ss((t - c.t) / GECIS) };
        }
        return d;
      }
      if (sonraki && t >= sonraki.t - GIR) {                  // bir sonraki kutuda belir
        const q = KAIDE[sonraki.kaide];
        return { ad: 'idle', zaman: t, yaw: 0, x: q.x, y: q.top, z: q.z + q.w / 2,
                 alfa: ss((t - (sonraki.t - GIR)) / GIR) };
      }
      const kay = ss(1 - (t - c.bitis) / CIK);               // kaybol
      if (kay <= 0) return null;
      return { ad: c.klip, zaman: c.sure * c.hiz, yaw: 0, ...ust, alfa: kay };
    }
  }
  return null;
}

const siluetCv = document.createElement('canvas');
siluetCv.width = Math.ceil(MW * 1.25 + 80 * k); siluetCv.height = Math.ceil(MH * 1.25 + 80 * k);
const sx = siluetCv.getContext('2d');

// YERE KILIT (24 Eyl 2026): yerde duran hareketlerde ayak cizgisi HER KAREDE
// maskeden olculur ve kutu yuzeyine oturtulur. Poz dosyalarinin (lunge) kalca
// yuksekligi kliplerden farkli; sabit ZEMIN_SATIR ile siluet kutunun ustunde
// havada kaliyordu. Sicrama hareketleri (box-jump, jump-reach, tuck-jump)
// kilitlenmez - havalanmalari gerekiyor.
const YERE_KILIT = new Set(['idle', 'walk', 'turn180-L', 'turn180-R', 'bob-weave', 'lunge-L-k', 'lunge-R-k']);
function ayakSatiri() {
  const d = mx.getImageData(0, 0, MW, MH).data;
  for (let y = MH - 1; y >= 0; y--) for (let x = 0; x < MW; x += 2) if (d[(y * MW + x) * 4 + 3] > 40) return y + 1;
  return ZEMIN_SATIR;
}
function siluetCiz(d) {
  if (!siluet || !d || d.alfa <= 0.001) return;
  pozKur(d.ad, d.zaman, d.yaw, d.harman);
  const ayak = YERE_KILIT.has(d.ad) ? ayakSatiri() : ZEMIN_SATIR;
  // olcek: dunya boyu HF'nin bu derinlikteki piksel boyu / maskedeki figur boyu
  const sc = (F * HF / d.z) / FIGUR_PX;
  const dw = MW * sc, dh = MH * sc;
  const ax = px(d.x, d.z), ay = py(d.y, d.z);
  const x0 = ax - dw / 2, y0 = ay - ayak * sc;

  rx.globalCompositeOperation = 'source-over'; rx.clearRect(0, 0, MW, MH);
  rx.drawImage(maskeCv, 0, 0); rx.globalCompositeOperation = 'source-in';
  rx.fillStyle = MAG; rx.fillRect(0, 0, MW, MH); rx.globalCompositeOperation = 'source-over';
  ix.globalCompositeOperation = 'source-over'; ix.clearRect(0, 0, MW, MH);
  ix.drawImage(maskeCv, 0, 0); ix.globalCompositeOperation = 'source-in';
  ix.fillStyle = '#16021c'; ix.fillRect(0, 0, MW, MH); ix.globalCompositeOperation = 'source-over';

  // Siluet once TAM OPAK kurulur, sonra tek parca saydamlikla basilir
  // (katmanlar ayri saydam cizilince belirme aninda govde pembe doluyordu).
  const pad = Math.round(40 * k);
  sx.clearRect(0, 0, siluetCv.width, siluetCv.height);
  sx.filter = `blur(${Math.round(12 * k)}px)`;
  sx.globalAlpha = 0.85;
  sx.drawImage(renkCv, pad, pad, dw, dh);
  sx.filter = 'none'; sx.globalAlpha = 1;
  const kk = Math.max(2, 4.5 * k);
  for (let a = 0; a < 8; a++) { const q = a * Math.PI / 4; sx.drawImage(renkCv, pad + Math.cos(q) * kk, pad + Math.sin(q) * kk, dw, dh); }
  sx.drawImage(icCv, pad, pad, dw, dh);
  cx.save();
  cx.globalAlpha = d.alfa;
  cx.drawImage(siluetCv, 0, 0, dw + 2 * pad, dh + 2 * pad, x0 - pad, y0 - pad, dw + 2 * pad, dh + 2 * pad);
  cx.restore();
}

// hangi kaide su an sabit (siluet ustunde / ustune cikiyor)
function aktifKaide(t, d) {
  if (!d) return [];
  let en = -1, ed = 1e9;
  KAIDE.forEach((p, j) => { const m = Math.hypot(d.x - p.x, d.z - (p.z + p.w / 2)); if (m < ed) { ed = m; en = j; } });
  return (ed < 1.2 && (d.ad === 'box-jump' || d.y > ZEMIN_YUR + 0.05)) || ed < 0.3 ? [en] : [];
}

// ------------------------------------------------------------ HUD
const FONT_B = 'Impact, Arial Black, sans-serif', FONT = 'Arial Black, sans-serif';
function yaziParla(yazi, x, y, font, hiza, parla) {
  cx.save();
  cx.font = font; cx.textAlign = hiza; cx.textBaseline = 'top';
  // arkadaki cizgilerden ayirmak icin koyu hale
  cx.shadowColor = 'rgba(0,0,0,0.95)'; cx.shadowBlur = 26 * k;
  cx.fillStyle = 'rgba(0,0,0,0.9)'; cx.fillText(yazi, x, y);
  cx.shadowColor = parla; cx.shadowBlur = 22 * k;
  cx.fillStyle = '#ffffff'; cx.fillText(yazi, x, y);
  cx.restore();
}
function hudCiz(t, olcuNo) {
  const dilim = BOLUM_OLCU / SEVIYE_SAYI;
  const seviye = Math.min(SEVIYE_SAYI, Math.floor(Math.max(0, olcuNo) / dilim) + 1);
  const seviyeBas = (seviye - 1) * dilim;
  // LEVEL UP: seviye degistiginde 1 olcu parlama
  const yeni = seviye > 1 && olcuNo - seviyeBas < 1 ? 1 - (olcuNo - seviyeBas) : 0;
  yaziParla(`LEVEL ${seviye}`, 70 * k, 50 * k, `700 ${Math.round((64 + 24 * yeni) * k)}px ${FONT}`, 'left', MAG);
  if (yeni > 0) yaziParla('LEVEL UP!', W / 2, H * 0.40, `700 ${Math.round(120 * k)}px ${FONT_B}`, 'center', MAG);

  let combo = 0, sonT = -99;
  for (const c of CUELAR) if (c.t <= t) { combo++; sonT = c.t; }
  const pop = Math.max(0, 1 - (t - sonT) / 0.25);
  yaziParla(String(combo), W - 70 * k, 20 * k, `700 ${Math.round((150 + 30 * pop) * k)}px ${FONT_B}`, 'right', MAG);
  yaziParla('COMBO', W - 70 * k, 195 * k, `700 ${Math.round(50 * k)}px ${FONT}`, 'right', MAG);

  // SUBSCRIBE: her 8 olcude bir, 2,6 sn (abone cagrisi kurali), alt orta
  const AB_ARA = 8 * OLCU, AB_SURE = 2.6;
  const tt = t - ILK_VURUS - 2 * OLCU;
  const abT = ((tt % AB_ARA) + AB_ARA) % AB_ARA;
  if (tt > 0 && abT < AB_SURE) {
    const q = abT / AB_SURE;
    const alfa = Math.min(1, q / 0.18, q > 0.82 ? 1 - (q - 0.82) / 0.18 : 1);
    const vn = Math.max(0, 1 - (((t - ILK_VURUS) % VURUS + VURUS) % VURUS) / 0.18);
    const o = 1 + 0.05 * vn;
    const bw = 460 * k * o, bh = 80 * k * o, bx = W / 2 - bw / 2, by = H - 40 * k - bh;
    cx.save(); cx.globalAlpha = alfa;
    cx.shadowColor = '#ff1a2a'; cx.shadowBlur = 30 * k;
    cx.fillStyle = '#e6141e'; cx.beginPath(); cx.roundRect(bx, by, bw, bh, bh / 2); cx.fill();
    cx.shadowBlur = 0; cx.fillStyle = '#fff';
    cx.font = `700 ${Math.round(46 * k * o)}px ${FONT}`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText('SUBSCRIBE', W / 2, by + bh / 2 + 2 * k);
    cx.restore();
  }
}

// ------------------------------------------------------------ KARE
function kareKur(n) {
  const t = n / FPS;                                  // DETERMINISTIK: duvar saati yok
  const d = durum(t);
  sehirCiz(t, aktifKaide(t, d));
  siluetCiz(d);
  hudCiz(t, (t - ILK_VURUS) / OLCU);
}

window.kareKur = kareKur;
window.kareAl = (bicim, kalite) => {
  if (bicim === 'png')  return cikti.toDataURL('image/png');
  if (bicim === 'jpeg') return cikti.toDataURL('image/jpeg', kalite || 1);
  return cikti.toDataURL('image/webp', kalite || 1);
};
window.SURE_OLCU = TOPLAM_OLCU;
window.TOPLAM_KARE = Math.round(TOPLAM_OLCU * OLCU * FPS);
window.NOTA_SAYISI = CUELAR.length;
window.KLIP_SAYISI = Object.keys(klipler).length;
window.SILUET_VAR = !!siluet;
window.__CUELAR = CUELAR;
window.__K = { klipler, THREE, siluet, PLAN, durum, sehirRengi, pozKur, maskeCv, kalib: () => ({ ZEMIN_SATIR, FIGUR_PX, MW, MH, KLIP_KUTU, TIRMAN, DON_L, DON_R, LUNGE_ORAN, TUCK_TEPE, kemik: Object.keys(kemik) }) };
kareKur(0);
window.HAZIR = true;
</script>
