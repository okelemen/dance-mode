  // turuncuya cekiyordu (parlaklik 0,28 / turuncu %67). Burada duvar
  // neredeyse beyaz, renk kimligi turkuaz aksanlardan geliyor.
  // Hedef: parlaklik ~0,50, baskin ton cyan. Bkz 07-mekan/OLCUM-17-VIDEO.md
  acik4: { duvar:'#dff0f4', duvarKoyu:'#b3d2dc', silme:'#c9e3ea', nis:'#8fb8c4',
           direk:'#2fb8c4', direkUst:'#1b8e9c', kaide:'#4fc9d4',
           tel:'#a9bcc4', yesil:'#79bd7a', yesilKoyu:'#4f8f55' },
};

// --- SEHIR: iki yandan akan gokdelen duvarlari
// Yolun disini dolduruyor ve paralaksla hiz hissini artiriyor.
const binalar = [];
if (TB && !SADE) {
  // DEKOR: yolun disini dolduran yan duvarlar. Onceki halde tek tip vardi
  // (sehir) ve alti ortamin hepsinde ayni duvar akiyordu - palet degisse de
  // her yer ayni mekan gibi okunuyordu. Artik her ortamin kendi dekoru var.
  function dekorDoku(tip, tohum){
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    const kar = (n) => { const v = Math.sin((n + tohum * 37.7) * 127.1) * 43758.5453;
                         return v - Math.floor(v); };
    g.fillStyle = '#020206'; g.fillRect(0, 0, 512, 512);

    if (tip === 'yildiz') {
      // derin uzay: seyrek yildizlar + yumusak nebula lekeleri
      for (let i = 0; i < 3; i++) {
        const gx = kar(i)*512, gy = kar(i+5)*512, r = 90 + kar(i+9)*150;
        const gr = g.createRadialGradient(gx, gy, 0, gx, gy, r);
        const renk = i % 2 ? '120,60,255' : '40,160,255';
        gr.addColorStop(0, `rgba(${renk},0.22)`); gr.addColorStop(1, `rgba(${renk},0)`);
        g.fillStyle = gr; g.fillRect(gx-r, gy-r, r*2, r*2);
      }
      for (let i = 0; i < 190; i++) {
        const x = kar(i)*512, y = kar(i+31)*512, r = kar(i+77);
        g.fillStyle = r > 0.9 ? 'rgba(180,240,255,0.95)' : `rgba(220,230,255,${0.2+r*0.5})`;
        const b = r > 0.9 ? 2.6 : 1.5;
        g.fillRect(x, y, b, b);
      }
    }
    else if (tip === 'devre') {
      // devre karti: dik acili izler + lehim noktalari
      g.lineCap = 'square';
      for (let i = 0; i < 26; i++) {
        let x = kar(i)*512, y = kar(i+13)*512;
        g.strokeStyle = i % 3 === 0 ? 'rgba(0,255,200,0.55)' : 'rgba(90,120,255,0.35)';
        g.lineWidth = 2 + (i % 2);
        g.beginPath(); g.moveTo(x, y);
        for (let k = 0; k < 4; k++) {
          if (k % 2) y += (kar(i*7+k) - 0.5) * 190; else x += (kar(i*5+k) - 0.5) * 190;
          g.lineTo(x, y);
        }
        g.stroke();
        g.fillStyle = 'rgba(0,255,200,0.8)';
        g.beginPath(); g.arc(x, y, 4, 0, 6.2832); g.fill();
      }
    }
    else if (tip === 'sutun') {
      // plazma: dikey isik sutunlari, aralarinda karanlik
      for (let i = 0; i < 14; i++) {
        const x = kar(i)*512, w = 8 + kar(i+3)*22, h = 200 + kar(i+7)*312;
        const gr = g.createLinearGradient(0, 512-h, 0, 512);
        gr.addColorStop(0, 'rgba(255,110,60,0)');
        gr.addColorStop(0.4, `rgba(255,${60+kar(i)*90|0},140,0.55)`);
        gr.addColorStop(1, 'rgba(160,32,255,0.75)');
        g.fillStyle = gr; g.fillRect(x, 512-h, w, h);
      }
    }
    else if (tip === 'ray') {
      // METRO TUNELI: beton panel duvar, kablo demeti, aralikli servis
      // lambalari ve seyrek graffiti lekesi. Referansta bu dekorun isi
      // koridoru KAPATMAK - acik gokyuzu yok, dar ve bogucu olmali.
      g.fillStyle = '#0a0a10'; g.fillRect(0, 0, 512, 512);
      // beton panel derzleri
      g.strokeStyle = 'rgba(120,130,160,0.16)'; g.lineWidth = 2;
      for (let y = 0; y < 512; y += 64) {
        g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke();
      }
      for (let x = 0; x < 512; x += 128) {
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 512); g.stroke();
      }
      // kablo demeti - duvar boyunca yatay
      for (let i = 0; i < 4; i++) {
        const y = 150 + i * 13 + kar(i) * 6;
        g.strokeStyle = `rgba(${60 + i * 20},${70 + i * 15},110,0.5)`;
        g.lineWidth = 3 + (i % 2);
        g.beginPath(); g.moveTo(0, y); g.lineTo(512, y + (kar(i + 9) - 0.5) * 10); g.stroke();
      }
      // servis lambalari
      for (let i = 0; i < 5; i++) {
        const x = 40 + i * 104, y = 96;
        const gr = g.createRadialGradient(x, y, 0, x, y, 54);
        gr.addColorStop(0, 'rgba(255,214,140,0.85)');
        gr.addColorStop(1, 'rgba(255,180,90,0)');
        g.fillStyle = gr; g.fillRect(x - 54, y - 54, 108, 108);
        g.fillStyle = 'rgba(255,236,190,0.95)';
        g.fillRect(x - 9, y - 4, 18, 8);
      }
      // graffiti lekeleri - seyrek renk vurusu
      for (let i = 0; i < 3; i++) {
        const x = kar(i + 3) * 430, y = 250 + kar(i + 7) * 180;
        g.fillStyle = `rgba(${[255,90,255][i % 3]},${[60,220,90][i % 3]},${[140,255,60][i % 3]},0.28)`;
        g.beginPath();
        g.ellipse(x, y, 34 + kar(i) * 40, 16 + kar(i + 1) * 18, kar(i) * 3, 0, 6.2832);
        g.fill();
      }
    }
    else if (tip.startsWith('acik')) {
      // ============================================ ACIK ALAN: VIYADUK ARKADI
      // Referans olcumu: 07-mekan/acik-alan/ANALIZ.md
      // Duvar KAPATMIYOR - ritim veriyor ve isik siziyor. Kemerlerin arkasi
      // saydam: gokyuzu ve agac oradan gorunuyor. Ust %38 tamamen bos.
      // Dikey metronom: duzenli aralikli direk + kaide blogu. Referansta
      // direkler 0,73 sn'de bir geciyor; hiz hissini veren sey bu.
      //
      // Yuksek doygunluk BURADA KULLANILMAZ. Referansta sari-siyah serit ve
      // yuksek doygunluk yalnizca TEPKI VERILECEK nesnelerde; duvar ve zemin
      // notayla parlaklik yarisina hic girmiyor.
      const P = ACIK_PALET[tip];
      g.clearRect(0, 0, 512, 512);                 // ust: saydam = gokyuzu
      const UST = 150;                             // duvarin ust kenari
      // --- agac/cali seridi: kemer bosluklarindan gorunen sey
      g.fillStyle = P.yesil;
      for (let i = 0; i < 14; i++) {
        const x = i * 40 + kar(i) * 22, r = 26 + kar(i + 9) * 20;
        g.beginPath(); g.arc(x, 402 - kar(i + 3) * 26, r, 0, 6.2832); g.fill();
      }
      g.fillStyle = P.yesilKoyu;
      for (let i = 0; i < 10; i++) {
        const x = i * 56 + kar(i + 21) * 30;
        g.beginPath(); g.arc(x, 420, 20 + kar(i + 7) * 16, 0, 6.2832); g.fill();
      }
      // --- duvar govdesi
      g.fillStyle = P.duvar; g.fillRect(0, UST, 512, 512 - UST);
      // tas siralari: yatay derzler. Duz renk duvar karton gibi okunuyordu -
      // referansta duvarin dokusu var ve isik onun uzerinde kiriliyor.
      g.strokeStyle = 'rgba(0,0,0,0.10)'; g.lineWidth = 2;
      for (let y = UST + 26; y < 512; y += 26) {
        g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke();
      }
      g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 1;
      for (let y = UST + 26; y < 512; y += 26) {
        g.beginPath(); g.moveTo(0, y + 2); g.lineTo(512, y + 2); g.stroke();
      }
      // ustten alta hafif isik dusumu: duvar dibi biraz koyu
      const dg = g.createLinearGradient(0, UST, 0, 512);
      dg.addColorStop(0, 'rgba(255,255,255,0.10)');
      dg.addColorStop(0.55, 'rgba(0,0,0,0)');
      dg.addColorStop(1, 'rgba(0,0,0,0.18)');
      g.fillStyle = dg; g.fillRect(0, UST, 512, 512 - UST);
      // ust silme (korniş): duvarin ust kenarina koyu bir cizgi - siluet netlesir
      g.fillStyle = P.silme; g.fillRect(0, UST, 512, 16);
      g.fillStyle = P.duvarKoyu; g.fillRect(0, UST + 16, 512, 5);
      // --- kemerli nisler: 4 aciklik. Ikisi ACIK (saydam), ikisi KAPALI koyu.
      // Hepsi acik olsaydi duvar cit gibi okunur ve mekan kaybolurdu.
      // Modul basina IKI kemer. Dort kemer denendi ve referansin yaninda
      // pencere gibi kaldi: orada kemer kosucu boyunun 2-3 kati.
      const KEM_SAY = 2, adim = 512 / KEM_SAY;
      for (let i = 0; i < KEM_SAY; i++) {
        const cx = adim * (i + 0.5), gen = adim * 0.60, alt = 470, tepe = 250;
        const yol = () => {
          g.beginPath();
          g.moveTo(cx - gen / 2, alt);
          g.lineTo(cx - gen / 2, tepe + gen / 2);
          g.arc(cx, tepe + gen / 2, gen / 2, Math.PI, 0);
          g.lineTo(cx + gen / 2, alt);
          g.closePath();
        };
        if (i % 2 === 0) {                          // ACIK nis: duvari deler
          g.save(); g.globalCompositeOperation = 'destination-out';
          yol(); g.fill(); g.restore();
        } else {                                    // KAPALI nis: koyu girinti
          g.fillStyle = P.nis; yol(); g.fill();
          // girintinin ust ic kenarinda golge - nis DERINLIK kazaniyor
          g.save(); yol(); g.clip();
          const ng = g.createLinearGradient(0, tepe, 0, alt);
          ng.addColorStop(0, 'rgba(0,0,0,0.45)');
          ng.addColorStop(1, 'rgba(0,0,0,0.05)');
          g.fillStyle = ng; g.fillRect(0, tepe - 40, 512, alt - tepe + 40);
          g.restore();
        }
        g.strokeStyle = P.duvarKoyu; g.lineWidth = 7; yol(); g.stroke();
      }
      // --- bordur: duvarin OTURDUGU seddi. Yoksa duvar dibi boslukta bitiyor
      // ve butun yapi havada duruyormus gibi okunuyor - ilk denemenin en
      // rahatsiz edici tarafi buydu.
      g.fillStyle = P.duvarKoyu; g.fillRect(0, 476, 512, 36);
      g.fillStyle = P.silme;     g.fillRect(0, 476, 512, 7);
      // --- direk + kaide: dikey metronom
      for (let i = 0; i < 2; i++) {
        const x = i * 256 + 128;
        g.fillStyle = P.direk;  g.fillRect(x - 8, 64, 16, 448);
        g.fillStyle = P.kaide;  g.fillRect(x - 14, 452, 28, 60);
        g.fillStyle = P.direkUst; g.fillRect(x - 24, 64, 48, 11);   // konsol kolu
      }
      // --- teller: direk tepelerini birlestiren hafif sarkma
      g.strokeStyle = P.tel; g.lineWidth = 3;
      for (let k = 0; k < 3; k++) {
        g.beginPath(); g.moveTo(0, 104 + k * 9);
        g.quadraticCurveTo(256, 132 + k * 9, 512, 104 + k * 9); g.stroke();
      }
    }
    else if (tip === 'kristal') {
      // buz: acili kirilmis parcalar
      for (let i = 0; i < 22; i++) {
        const x = kar(i)*512, y = kar(i+17)*512, r = 26 + kar(i+41)*82;
        g.beginPath();
        g.moveTo(x, y - r);
        g.lineTo(x + r*0.45, y + r*0.25);
        g.lineTo(x - r*0.30, y + r*0.75);
        g.closePath();
        g.fillStyle = `rgba(${140+kar(i)*80|0},240,255,${0.10 + kar(i+2)*0.22})`;
        g.fill();
        g.strokeStyle = 'rgba(190,250,255,0.55)'; g.lineWidth = 1.6; g.stroke();
      }
    }
    else {
      return binaDoku(tohum);          // 'sehir'
    }
    return new THREE.CanvasTexture(c);
  }

  function binaDoku(tohum){
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const g = c.getContext('2d');
    // deterministik sozde-rastgele: indeksten turetiliyor, duvar saati yok
    const kar = (n) => { const v = Math.sin((n + tohum * 37.7) * 127.1) * 43758.5453;
                         return v - Math.floor(v); };
    g.fillStyle = '#020206'; g.fillRect(0, 0, 512, 512);
    let x = 0, i = 0;
    while (x < 512) {
      const gen = 42 + kar(i) * 58;
      const yuk = 150 + kar(i + 9) * 340;
      const y0 = 512 - yuk;
      g.fillStyle = '#050411';                       // bina govdesi
      g.fillRect(x + 3, y0, gen - 6, yuk);
      // pencere isiklari - seyrek, iki renk
      for (let py = y0 + 14; py < 500; py += 22) {
        for (let px = x + 12; px < x + gen - 12; px += 18) {
          const r = kar(px * 3 + py);
          if (r > 0.80) {                            // seyrek pencere
            g.fillStyle = r > 0.93 ? 'rgba(120,240,255,0.80)'
                        : r > 0.87 ? 'rgba(255,110,200,0.65)'
                                   : 'rgba(150,170,255,0.34)';
            g.fillRect(px, py, 7, 10);
          }
        }
      }
      x += gen; i++;
    }
    return new THREE.CanvasTexture(c);
  }
  // her dekor tipi icin 14 doku onceden uretiliyor - kare basina uretim yok
  window.__DEKOR = {};
  for (const tip of ['sehir','yildiz','devre','sutun','kristal','ray',
                     'acik1','acik2','acik3'])
    window.__DEKOR[tip] = Array.from({length:14}, (_,i) => dekorDoku(tip, i));
  const DEKOR_DOKULARI = window.__DEKOR;
  const BINA_ARA = 26, BINA_SAY = 7;
  for (let i = 0; i < BINA_SAY * 2; i++) {
    const sag = i % 2 === 1;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(26, 17),
      new THREE.MeshBasicMaterial({ map: DEKOR_DOKULARI.sehir[i], transparent:true,
        depthWrite:false, fog:true }));
    m.position.set(sag ? 15.5 : -15.5, 6.2, 0);
    m.rotation.y = sag ? -Math.PI/2 : Math.PI/2;
    m.userData = { i: Math.floor(i / 2), di: i, sag, ara: BINA_ARA, say: BINA_SAY };
    scene.add(m); binalar.push(m);
  }
}

// --- nota havuzu
// nota dokusu: yuvarlak kose + yumusak kenar parlamasi
// (duz PlaneGeometry keskin dikdortgen verir; sekli dokudan aliyoruz)
// renk parametresi SADECE B'de kullanilir.
// Sebep: MeshBasicMaterial.color butun dokuyu carpar - beyaz dis kenar da
// lane rengine boyanirdi ve nota, ayni renkteki yolun uzerinde kayboluyordu.
// B'de renk dokunun ICINE gomuluyor, materyal rengi beyaz kaliyor; boylece
// beyaz kenar her zaman beyaz, koyu kontur her zaman koyu.
// ============================================================ INSAN PIKTOGRAMI
// Her cue tipinin KENDI simgesi olmali ve simge INSAN olmali. Onceki halde
// iki ayri hata vardi:
//   1) Dikey kartlarda 'tip' hic okunmuyordu (yalnizca aynalama icin) - yedi
//      hareketin hepsi ayni ayak izini gosteriyordu.
//   2) Nota fayanslarinda 'jump' ile 'arms_up' birebir ayni cift yukari
//      sevrondu; iki farkli hareket, tek simge.
// Ayak izi ayrica hayvan patisi gibi okunuyordu. Artik yedi hareketin yedi
// ayri INSAN pozu var; yon oklari poza eslik ediyor, onun yerine gecmiyor.
//
// g merkeze otelenmis, stroke/fill rengi cagiran tarafindan ayarlanmis olmali.
function insanSimge(g, tip, S, kal){
  g.lineWidth = kal; g.lineCap = 'round'; g.lineJoin = 'round';
  const P = (x, y) => [x, y];
  const hat = (...n) => {
    g.beginPath();
    n.forEach(([x, y], i) => i ? g.lineTo(x * S, y * S) : g.moveTo(x * S, y * S));
    g.stroke();
  };
  const bas = (x, y, r) => {
    g.beginPath(); g.arc(x * S, y * S, r * S, 0, 6.2832); g.fill();
  };
  const ok = (x, y, dx, dy, b) => {
    b = b || 15;
    g.beginPath();
    g.moveTo((x + dx*b) * S, (y + dy*b) * S);
    g.lineTo((x - dy*b*0.85 - dx*b*0.5) * S, (y + dx*b*0.85 - dy*b*0.5) * S);
    g.lineTo((x + dy*b*0.85 - dx*b*0.5) * S, (y - dx*b*0.85 - dy*b*0.5) * S);
    g.closePath(); g.fill();
  };

  if (tip === 'step_L' || tip === 'step_R') {
    g.save(); if (tip === 'step_L') g.scale(-1, 1);
    bas(0, -48, 14);
    hat(P(0,-32), P(0,6));
    hat(P(0,-24), P(-26,-12));
    hat(P(0,-24), P(30,-34));
    hat(P(0,6), P(-8,28), P(-10,48));
    hat(P(0,6), P(24,26), P(40,44));
    ok(58, -6, 1, 0);
    g.restore();
  }
  else if (tip === 'dodge_R' || tip === 'dodge_L') {
    g.save(); if (tip === 'dodge_L') g.scale(-1, 1);
    g.rotate(0.26);
    bas(0, -48, 14);
    hat(P(0,-32), P(0,6));
    hat(P(0,-26), P(-32,-18));
    hat(P(0,-26), P(32,-32));
    hat(P(0,6), P(-16,28), P(-22,48));
    hat(P(0,6), P(20,26), P(30,44));
    g.rotate(-0.26);
    ok(50, -6, 1, 0, 13); ok(72, -6, 1, 0, 13);
    g.restore();
  }
  else if (tip === 'jump') {
    bas(0, -50, 14);
    hat(P(0,-34), P(0,2));
    hat(P(0,-28), P(-26,-58));
    hat(P(0,-28), P(26,-58));
    hat(P(0,2), P(-20,20), P(-12,40));
    hat(P(0,2), P(20,20), P(12,40));
    ok(0, -94, 0, -1);
  }
  else if (tip === 'duck') {
    bas(0, -26, 14);
    hat(P(0,-10), P(0,10));
    hat(P(0,-6), P(26,-4), P(38,-12));
    hat(P(0,-6), P(-22,2));
    hat(P(0,10), P(-26,18), P(-24,46));
    hat(P(0,10), P(24,18), P(26,46));
    ok(0, -74, 0, 1);
  }
  else if (tip === 'punch') {
    bas(-6, -48, 14);
    hat(P(-6,-32), P(-6,6));
    hat(P(-6,-26), P(-26,-14), P(-14,-2));
    hat(P(-6,-26), P(30,-26));
    g.beginPath(); g.arc(44*S, -26*S, 13*S, 0, 6.2832); g.fill();
    hat(P(-6,6), P(-26,26), P(-32,48));
    hat(P(-6,6), P(14,28), P(18,48));
  }
  else if (tip === 'charleston') {
    // Dizler ICERDE birbirine yakin, eller dizlerde CAPRAZ - Charleston'un
    // imzasi bu. Ayaklar disa donuk.
    bas(0, -48, 14);
    hat(P(0,-32), P(0,4));
    hat(P(0,-24), P(-22,0), P(10,22));        // sol kol capraz, sag dize
    hat(P(0,-24), P(22,0), P(-10,22));        // sag kol capraz, sol dize
    hat(P(0,4), P(-8,26), P(-24,48));         // dizler icerde, ayaklar disa
    hat(P(0,4), P(8,26), P(24,48));
  }
  else if (tip === 'jacks') {
    // YILDIZ: kollar ve bacaklar disa acik. Tek bakista "acilma".
    bas(0, -52, 13);
    hat(P(0,-38), P(0,8));
    hat(P(0,-30), P(-40,-56));
    hat(P(0,-30), P(40,-56));
    hat(P(0,8), P(-30,30), P(-40,50));
    hat(P(0,8), P(30,30), P(40,50));
  }
  else if (tip === 'kick_L' || tip === 'kick_R') {
    // ONE TEKME: bir bacak one uzanmis, govde hafif geride.
    g.save(); if (tip === 'kick_L') g.scale(-1, 1);
    bas(-6, -48, 14);
    hat(P(-6,-32), P(-4,6));
    hat(P(-6,-26), P(-28,-8));
    hat(P(-6,-26), P(16,-14));
    hat(P(-4,6), P(-18,28), P(-20,48));       // basma bacagi
    hat(P(-4,6), P(26,14), P(46,8));          // tekme atan bacak - one/yukari
    ok(66, 6, 1, 0, 12);
    g.restore();
  }
  else if (tip === 'neck_roll') {
    // BOYUN: bas yana egik, omuzlar SABIT. Basin yaninda kucuk yay.
    bas(-12, -50, 14);
    hat(P(-6,-36), P(0,6));
    hat(P(-4,-28), P(-24,-10), P(-22,6));
    hat(P(-4,-28), P(24,-10), P(22,6));
    hat(P(0,6), P(-14,28), P(-14,48));
    hat(P(0,6), P(14,28), P(14,48));
    g.save(); g.lineWidth = kal * 0.7;
    g.beginPath(); g.arc(-12*S, -50*S, 26*S, -2.6, -0.5); g.stroke();
    g.restore();
  }
  else if (tip === 'running') {
    // KOSU: bir diz yukari, kollar dirsekten kirik ve zit yonde.
    bas(4, -50, 14);
    hat(P(4,-34), P(0,4));
    hat(P(2,-28), P(-26,-20), P(-18,-2));     // arka kol
    hat(P(2,-28), P(26,-34), P(34,-16));      // on kol
    hat(P(0,4), P(-16,24), P(-24,46));        // arka bacak
    hat(P(0,4), P(22,12), P(14,34));          // on diz YUKARI
  }
  else if (tip === 'roof') {
    // IKI KOL YUKARI ITIYOR: eller acik, dirsekler kirik, yukari ok.
    bas(0, -48, 14);
    hat(P(0,-32), P(0,6));
    hat(P(0,-26), P(-26,-34), P(-22,-62));
    hat(P(0,-26), P(26,-34), P(22,-62));
    hat(P(0,6), P(-16,28), P(-18,48));
    hat(P(0,6), P(16,28), P(18,48));
    ok(0, -84, 0, -1, 13);
  }
  else if (tip === 'side_L' || tip === 'side_R') {
    // YANA KAYMA: govde bir yana kaymis, ayaklar ACIK, yer degistirmiyor.
    g.save(); if (tip === 'side_L') g.scale(-1, 1);
    bas(14, -48, 14);
    hat(P(12,-32), P(2,6));
    hat(P(10,-26), P(-16,-16), P(-24,0));
    hat(P(10,-26), P(32,-18), P(36,-2));
    hat(P(2,6), P(-18,28), P(-26,48));        // ayaklar genis
    hat(P(2,6), P(22,28), P(30,48));
    ok(56, -24, 1, 0, 12);
    g.restore();
  }
  else if (tip === 'twist_L' || tip === 'twist_R') {
    // GOVDE DONUSU: omuz hatti donmus (bir omuz one), ayaklar SABIT.
    g.save(); if (tip === 'twist_L') g.scale(-1, 1);
    bas(0, -48, 14);
    hat(P(0,-32), P(0,6));
    hat(P(-4,-26), P(-30,-14), P(-34,4));     // geri giden omuz/kol
    hat(P(4,-26), P(24,-20), P(18,-2));       // one gelen omuz/kol - kisa
    hat(P(0,6), P(-14,28), P(-14,48));
    hat(P(0,6), P(14,28), P(14,48));
    g.save(); g.lineWidth = kal * 0.7;
    g.beginPath(); g.arc(0, -14*S, 44*S, -0.9, 0.9); g.stroke();
    g.restore();
    g.restore();
  }
  else if (tip === 'shimmy') {
    // OMUZ TITRESIMI: govde ustu kaymis, ayaklar SABIT (altta zemin cizgisi).
    // Kollar dirsekten kirik ve asagida - uzanma (reach) ile karismasin.
    bas(6, -48, 14);
    hat(P(6,-32), P(-2,6));                   // govde egik: omuz hatti kaymis
    hat(P(4,-26), P(-24,-18), P(-20,-2));     // sol kol, dirsekten kirik
    hat(P(4,-26), P(28,-20), P(24,-4));       // sag kol, dirsekten kirik
    hat(P(-2,6), P(-14,28), P(-14,48));       // bacaklar dik ve bitisik
    hat(P(-2,6), P(12,28), P(14,48));
    ok(-52, -24, -1, 0, 12); ok(52, -24, 1, 0, 12);   // iki yana kucuk ok
    g.save(); g.lineWidth = kal * 0.8;
    hat(P(-30,54), P(30,54));                 // zemin: ayak yer degistirmiyor
    g.restore();
  }
  else if (tip === 'reach_L' || tip === 'reach_R') {
    // esneme: bir kol basin uzerinden karsi yona uzaniyor
    g.save(); if (tip === 'reach_L') g.scale(-1, 1);
    bas(0, -48, 14);
    hat(P(0,-32), P(2,6));
    hat(P(0,-26), P(-18,-6), P(-10,10));
    hat(P(0,-28), P(18,-56), P(40,-64));      // uzanan kol
    hat(P(2,6), P(-14,28), P(-18,48));
    hat(P(2,6), P(18,28), P(22,48));
    g.restore();
  }
  else if (tip === 'hold') {
    // tutma notasi: iki kol yukarida SABIT. Altina cizgi - "burada kal".
    bas(0, -50, 14);
    hat(P(0,-34), P(0,6));
    hat(P(0,-30), P(-20,-70));
    hat(P(0,-30), P(20,-70));
    hat(P(0,6), P(-16,28), P(-18,48));
    hat(P(0,6), P(16,28), P(18,48));
    g.save(); g.lineWidth = kal * 0.8;
    hat(P(-40,62), P(40,62));                 // tutma cizgisi
    g.restore();
  }
  else if (tip === 'arms_up') {
    bas(0, -50, 14);
    hat(P(0,-34), P(0,6));
    hat(P(0,-30), P(-15,-74));
    hat(P(0,-30), P(15,-74));
    hat(P(0,6), P(-18,28), P(-22,48));
    hat(P(0,6), P(18,28), P(22,48));
  }
  else if (tip === 'hop') {
    // YERINDE sicrama. 'jump'tan farki: dizler govdeye toplanmis ve altta
    // zemin cizgisi var - "ileri gitme, ayni yerde zipla".
    bas(0, -50, 14);
    hat(P(0,-34), P(0,0));
    hat(P(0,-26), P(-24,-10));
    hat(P(0,-26), P(24,-10));
    hat(P(0,0), P(-22,10), P(-14,32));        // diz yukari toplanmis
    hat(P(0,0), P(22,10), P(14,32));
    ok(0, -86, 0, -1, 13);
    g.save(); g.lineWidth = kal * 0.8;
    hat(P(-34,54), P(34,54));                 // zemin - yer degistirme yok
    g.restore();
  }
  else if (tip === 'wave_L' || tip === 'wave_R') {
    // yana uzanan kol. Tek YATAY siluet; digerlerinin hepsi dikey.
    g.save(); if (tip === 'wave_L') g.scale(-1, 1);
    bas(0, -48, 14);
    hat(P(0,-32), P(0,6));
    hat(P(0,-26), P(-30,-16), P(-42,-30));    // karsi kol asagi-yana
    hat(P(0,-26), P(34,-34), P(56,-30));      // uzanan kol - yatay
    hat(P(0,6), P(-18,28), P(-22,48));
    hat(P(0,6), P(18,28), P(22,48));
    ok(76, -30, 1, 0, 13);
    g.restore();
  }
  else {
    bas(0, -48, 14);
    hat(P(0,-32), P(0,6));
    hat(P(0,-24), P(-22,-6));
    hat(P(0,-24), P(22,-6));
    hat(P(0,6), P(-14,28), P(-16,48));
    hat(P(0,6), P(14,28), P(16,48));
  }
}

const NOTA_SIMGE = !(BOLUM && BOLUM.nota_simge === false);
// AKIS HARMANI (15 Eyl 2026, olculdu). Cue penceresi bitince siluet, o anda
// calmasi gereken ADIM/EGZERSIZ klibine KESILEREK geciyordu: siluet kutusunda
// yatay merkez tek karede medyanin 6-10 kati siciyordu (olc-siluet-akis.js).
// 'akis: "harman2"' diyen bolumde cue klibi, taban katmani (adim/egzersiz) ile
// harmanlaniyor - notr klip yerine GERCEKTEN bir sonra oynayacak klip ile.
// Varsayilan kapali: yayinlanmis bolumlerin harmani degismiyor.
const AKIS2 = !!(BOLUM && BOLUM.akis === 'harman2');
function notaDoku(tip, renk, uzun){
  const c = document.createElement('canvas'); c.width = 320;
  // B'de ust yuz neredeyse kare (2.05 x 2.45) - doku da ona yakin olmali,
  // yoksa simge yatay eziliyor. Tutma notasi uzun oldugu icin tuvali de uzuyor.
  c.height = TB ? Math.round(300 * (uzun || 1)) : 128;
  const g = c.getContext('2d');
  const ciz = (x,y,w,h,r) => { g.beginPath(); g.roundRect(x,y,w,h,r); g.fill(); };
  const yuk = c.height;

  if (TB) {
    // B: hale yok, KATI FAYANS.
    // beyaz kenar -> koyu kontur -> renkli govde -> acik ust yuz
    // Referans olcumu: nota PARLAMIYOR. Duz doygun fayans, ince beyaz kenar,
    // uzerinde koyu simge. Parlama sahnede; notada degil.
    g.shadowColor = renk || '#ffffff'; g.shadowBlur = 26;
    g.fillStyle = 'rgba(255,255,255,0.92)';
    ciz(14, 14, 292, yuk - 28, 34);         // ince beyaz kenar
    g.shadowBlur = 0;
    g.fillStyle = renk || '#ffffff';
    ciz(22, 22, 276, yuk - 44, 28);         // tam doygun govde
    g.fillStyle = 'rgba(255,255,255,0.14)';
    ciz(22, 22, 276, (yuk - 44) * 0.34, 16); // ust kenar parlamasi
  } else {
  g.shadowColor = 'rgba(255,255,255,0.85)'; g.shadowBlur = 26;
  g.fillStyle = 'rgba(255,255,255,0.55)';
  ciz(26, 26, 268, 76, 38);                 // dis hale

  g.shadowBlur = 12;
  g.fillStyle = 'rgba(255,255,255,0.92)';
  ciz(34, 34, 252, 60, 30);                 // govde

  g.shadowBlur = 0;
  g.fillStyle = '#ffffff';
  ciz(46, 46, 228, 36, 18);                 // parlak cekirdek
  }

  // --- HAREKET SIMGESI: izleyici hangi hareketi yapacagini notadan okusun.
  //     Cekirdegin uzerine koyu oyularak ciziliyor -> her renkte okunur.
  if (!TB) g.globalCompositeOperation = 'destination-out';
  g.lineWidth = TB ? 30 : 20; g.lineCap = 'round'; g.lineJoin = 'round';
  // B'de oyma yapilmaz: delik acilirsa altindaki yol gorunur ve simge kaybolur.
  // Referansta simge SIYAH ve dolu - fayansin uzerine ciziliyor.
  g.strokeStyle = TB ? 'rgba(8,4,22,0.95)' : '#000';
  g.fillStyle   = TB ? 'rgba(8,4,22,0.95)' : '#000';
  const cx = 160, cy = yuk / 2;
  // Fayans yolun uzerinde yatik duruyor ve perspektifte dikeyde kisaliyor;
  // figur o yuzden dikeyde gerilmis ciziliyor, ekranda normal oranli gorunsun.
  // NOTA_SIMGE (13 Eyl 2026 aksami, kullanici: "fayanslar olsun sadece,
  // uzerinde simgeler olmasin"). Bolum dosyasinda "nota_simge": false ise
  // fayans cizilir, piktogram cizilmez - cue'yu fayansin RENGI ve seridi
  // tasir. Varsayilan true: yayinlanmis bolumlerin dokusu degismez.
  if (NOTA_SIMGE) {
    g.save();
    g.translate(cx, cy + (TB ? 8 : 0));
    if (TB) g.scale(1.0, 1.24);
    insanSimge(g, tip, TB ? 1.58 : 0.74, TB ? 20 : 11);
    g.restore();
  }
  g.globalCompositeOperation = 'source-over';
  return new THREE.CanvasTexture(c);
}

// ================================================== YERDE DURAN ENGEL (GUNDUZ)
// Kullanici (3 Eyl 2026): "yerde engel olmasini istiyorum".
// Referansta engel havada suzulen bir kart degil, traverslerin uzerinde
// OTURAN hacimli bir cisim: sari-siyah serit bloklar, kirmizi-beyaz sevron
// bariyer. Yuksek doygunluk sadece bunlarda - duvar ve zemin sakin.
// Kullanici "birebir ayni olmak zorunda degilsin, yapisi ayni olsun,
// renkleri farkli olsun, uzerinde hareket gostermek zorunda degilsin" dedi:
// bu yuzden simge YOK, renk paleti bizim.
function engelDoku(a1, a2){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = a1; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = a2; g.lineWidth = 17;
  for (let i = -128; i < 256; i += 34) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 128, 128); g.stroke();
  }
  const d = new THREE.CanvasTexture(c);
  d.wrapS = d.wrapT = THREE.RepeatWrapping;
  return d;
}
// uc lane, uc engel kimligi. Ortam paletinden bagimsiz: tepki verilecek
// nesne her ortamda AYNI okunmali, yoksa izleyici her mekan degisiminde
// yeniden ogrenmek zorunda kalir.
// ==================================================== OBBY UCUSAN NESNELER
// Referans (imnH2PtT5-o) karelerinde gokte surekli kucuk cisimler suzuluyor:
// renkli ince cubuklar, toplar, ic ice halkalar. Serit disindaki alani
// dolduran TEK sey bunlar; olmadiklarinda kare duz bir renk duvarina
// donuyor ve hiz hissi kayboluyor (referansta serit disinda baska hicbir
// geometri yok - duvar da yok, zemin de yok).
// Konum ve donus indeksten turetiliyor: deterministik, kare basina rastgele
// yok, tek kare yakalama bozulmuyor.
let gokCop = null;
{
  gokCop = new THREE.Group();
  gokCop.visible = false;
  const RENK = ['#ff2f4d','#ffd23f','#2fd8ff','#4dff88','#ff5ec4','#ffffff'];
  const cubukGeo = new THREE.BoxGeometry(0.22, 0.22, 2.4);
  const topGeo   = new THREE.SphereGeometry(0.60, 12, 10);
  const halkaGeo = new THREE.TorusGeometry(0.95, 0.11, 8, 20);
  const crnd = (n) => { const x = Math.sin(n * 57.31) * 43758.5453; return x - Math.floor(x); };
  for (let i = 0; i < 300; i++) {
    const tip = i % 5;                       // 3 cubuk : 1 top : 1 halka
    const geo = tip < 3 ? cubukGeo : (tip === 3 ? topGeo : halkaGeo);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: RENK[i % RENK.length], fog: true }));
    const yan = crnd(i) < 0.5 ? -1 : 1;
    m.userData = {
      // Referansta cisimler ufukta kumelenmiyor, kameranin YANINDAN da
      // geciyorlar. Onceki aralik (7,5-24,5) yakin planda kadraj disinda
      // kaliyordu; alt sinir seridin hemen kenarina indirildi.
      x:  yan * (4.2 + crnd(i + 11) * 34),
      y: -6.0 + crnd(i + 23) * 26,
      // z KAREKOKLU dagitiliyor: duz dagitimda cisimlerin cogu uzakta
      // kaliyor ve ufukta konfeti bulutu gibi kumeleniyordu. Karekok yakina
      // daha cok cisim koyuyor - ekranda esit doluluk boyle cikiyor.
      z0: Math.pow(crnd(i + 37), 0.55) * 220,
      dx: 0.3 + crnd(i + 51) * 0.9,
      dy: 0.3 + crnd(i + 67) * 1.3,
    };
    gokCop.add(m);
  }
  scene.add(gokCop);
}

// ==================================================== SERIT DOSEMESI
// Referansta serit duz renk degil, kare kare DOSELI - hiz hissinin buyuk
// kismi o cizgilerin akmasindan geliyor. Doku beyaz/griton; rengi
// materyalin color alani veriyor, boylece ayni doku her serit renginde
// calisiyor.
let seritDoku = null;
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 5;
  for (let i = 0; i <= 128; i += 32) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 128); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(128, i); g.stroke();
  }
  // her karenin ust-sol kenarinda ince acik pah: dosemeyi kabartiyor
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 3;
  for (let y = 0; y < 128; y += 32) for (let x = 0; x < 128; x += 32) {
    g.beginPath(); g.moveTo(x + 3, y + 30); g.lineTo(x + 3, y + 3);
    g.lineTo(x + 30, y + 3); g.stroke();
  }
  seritDoku = new THREE.CanvasTexture(c);
  seritDoku.wrapS = seritDoku.wrapT = THREE.RepeatWrapping;
  seritDoku.repeat.set(4, 60);
}

// ==================================================== OBBY BULUTLARI
// Referansin parlak bolumunde (k0045, k0079) gokte beyaz, yumusak, YATAY
// bulut serileri var. Duz mavi fon tek basina bos duruyor; bulutlar hem
// bosu dolduruyor hem de seritten BAGIMSIZ hizda aktiklari icin derinlik
// veriyor (paralaks). Karanlik dunyada bulut YOK - orada yildiz var, o
// yuzden ortam 'bulut: true' demedikce cizilmiyorlar.
let bulutKok = null;
{
  const bc = document.createElement('canvas'); bc.width = 256; bc.height = 128;
  const bg2 = bc.getContext('2d');
  const brnd = (n) => { const x = Math.sin(n * 33.77) * 43758.5453; return x - Math.floor(x); };
  bg2.clearRect(0, 0, 256, 128);
  // yumusak, alcak kontrastli yigin: ust ust binen daireler
  for (let k = 0; k < 26; k++) {
    const cx = 20 + brnd(k) * 216;
    const cy = 46 + brnd(k + 31) * 42;
    const r  = 14 + brnd(k + 57) * 30;
    const gr = bg2.createRadialGradient(cx, cy, 0, cx, cy, r);
    gr.addColorStop(0.0, 'rgba(255,255,255,0.80)');
    gr.addColorStop(0.6, 'rgba(255,255,255,0.34)');
    gr.addColorStop(1.0, 'rgba(255,255,255,0)');
    bg2.fillStyle = gr;
    bg2.beginPath(); bg2.arc(cx, cy, r, 0, 6.2832); bg2.fill();
  }
  const bDoku = new THREE.CanvasTexture(bc);
  bulutKok = new THREE.Group();
  bulutKok.visible = false;
  const KAPB = 320;
  // Deniz dunyasinda gok, karakterlerin onune gecmemeli. Ilk surumde 24
  // dev bulut ufku kapatip acik deniz hissini siliyordu. Daha az, daha
  // yuksek ve daha saydam bulut: hava var, ama gorus hatti acik.
  for (let i = 0; i < 14; i++) {
    const gen = 30 + brnd(i + 3) * 44, yuk = gen * 0.25;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(gen, yuk),
      new THREE.MeshBasicMaterial({ map: bDoku, transparent: true,
        depthWrite: false, fog: false, opacity: 0.22 + brnd(i + 9) * 0.18 }));
    m.userData = {
      x: (brnd(i + 11) - 0.5) * 210,
      y: 18 + brnd(i + 23) * 27,
      z0: brnd(i + 37) * KAPB,
      KAPB,
    };
    m.renderOrder = -2;                 // her seyin ARKASINDA
    bulutKok.add(m);
  }
  scene.add(bulutKok);
}

// ==================================================== DENIZ MEKANI (5 Eyl 2026)
// Karar: 07-mekan/MEKAN-KARARI.md. Referans olcumu:
// 07-mekan/REFERANS-15-VIDEO-NOTLARI.md (wbE_CGGB76c, 4:54, 640x360, sessiz).
// Yapi referanstan, RENK bizden - kullanici "daha ilgi cekici renkler" dedi,
// referansin acik zeminli kirmizi/cyan/beyazi kopyalanmiyor.
//
// Referansta OLCULEN ve buraya tasinan dort sey:
//   1. Koridor DUVARDAN degil BORDURDEN. Iki kenarda kabarik kaide; kacis
//      noktasina giden iki cizgi onlar.
//   2. Zemin sevron deseni ileri akiyor - hiz duygusunu taban veriyor.
//   3. Kacis noktasi HIC bos kalmiyor: her an ileride bir kule silueti.
//   4. Tehlike tek renk; o renk mekanda baska hicbir yerde gecmiyor.
// Referanstan AYRILDIGIMIZ yer: orada guverte acik ve parlak, HUD ustunde
// eriyor. Bizde guverte KOYU - doygunluk nota ve cue katmaninda kaliyor
// (UYGULAMA.md'de acik duran madde).
//
// Ortam 'deniz: true' dedigi zaman aciliyor. Demeyen ortamlar icin hicbir
// sey degismiyor: gar dunyasi da obby dunyasi da oldugu gibi duruyor.
// Su yuzeyi. Ilk deger -5,2 idi: guverte suyun 4,35 birim USTUNDE
// yuzuyordu. Bosluk kadrajda dogrudan gorunmuyordu ama su ile guvertenin
// TEMASI da yoktu - kopuk serisi koyacak yer kalmiyordu. Guverte alti
// -0,85; su onun hemen altina alindi. Ufuk konumu su yuksekliginden
// BAGIMSIZ (yalnizca kamera egimi belirliyor), o yuzden cerceveleme
// degismiyor; degisen, suyun kadrajda daha genis okunmasi.
const DENIZ_Y = -1.15;
let denizKok = null, denizMat = null, guverteMesh = null, guverteDoku = null;
let bordurKok = null, kuleKok = null, halkaKok = null;
{
  // --- SU YUZEYI
  // Tek buyuk duzlem + shader. Sis KAPALI: ufuk cizgisi keskin kalmali,
  // sahne sisi onu grilestirince deniz ve gok tek lekeye donuyor. Ufka
  // karisma shader'in kendi icinde, mesafeye gore.
  denizMat = new THREE.ShaderMaterial({
    uniforms: {
      uYakin:   { value: new THREE.Color('#0a2f4a') },
      uUzak:    { value: new THREE.Color('#1a1040') },
      uGok:     { value: new THREE.Color('#2a1060') },
      uParlama: { value: new THREE.Color('#ff7a3c') },
      uT:       { value: 0 },
      uGunesX:  { value: -0.16 },     // referansta gunes ufkun HAFIF SOLUNDA
      uGuc:     { value: 1.0 },
      uGece:    { value: 0.0 },       // gece bloguna ayri kimlik
    },
    vertexShader: [
      'varying vec3 vW;',
      'void main(){',
      '  vW = (modelMatrix * vec4(position,1.0)).xyz;',
      '  gl_Position = projectionMatrix * viewMatrix * vec4(vW,1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'precision highp float;',
      'varying vec3 vW;',
      'uniform vec3 uYakin,uUzak,uGok,uParlama;',
      'uniform float uT,uGunesX,uGuc,uGece;',
      'void main(){',
      '  float d = clamp((-vW.z)/900.0, 0.0, 1.0);',
      '  vec3 c = mix(uYakin, uUzak, pow(d, 0.55));',
      // dalga: uc farkli frekans, ucu de yavas. Referansta deniz neredeyse
      // durgun - bulut hizli akiyor, su degil. Derinlik o hiz farkindan.
      '  float w = sin(vW.x*0.35 + uT*0.55)',
      '          + sin(vW.z*0.21 - uT*0.80)',
      '          + sin((vW.x+vW.z)*0.11 + uT*0.38);',
      // Dalga TOPLAMA degil CARPMA ile. Toplama sabit bir miktar ekliyordu;
      // karanlik ortamlarda (safak, gece) suyun kendi degeri kucuk oldugu
      // icin o sabit fark goze carpmiyor ve deniz duz bir levha gibi
      // okunuyordu. Carpma her parlaklikta ayni ORANDA kabartma veriyor.
      '  c *= (1.0 + 0.30 * w * (1.0 - d*0.55));',
      // Ikinci katman: ufka paralel ince kabarti sirasi. Suyun yuzeyi
      // oldugunu soyleyen sey bu - tek basina genis dalga yetmedi.
      '  float r = sin((-vW.z)*0.85 + uT*1.15);',
      '  c += uParlama * 0.06 * smoothstep(0.72, 1.0, r) * (1.0 - d*0.5);',
      // gunes parlama yolu: kameraya dogru inen huzme. Kadrajin tek sicak
      // noktasi bu; referansta isik capasi gorevini o goruyor.
      // Huzme, ufuktaki gunesten kameraya dogru ACILARAK iniyor: uzakta dar
      // (gunesin kendisi), yakinda genis. Ilk surumde hem darkti hem zayifti,
      // render'da hic okunmuyordu.
      '  float ekx = uGunesX * (40.0 + d*560.0);',
      '  float gen = 13.0 + d*74.0;',
      '  float g = exp(-pow((vW.x - ekx)/gen, 2.0));',
      '  float kip = 0.5 + 0.5*sin(vW.z*2.10 + uT*2.30)*sin(vW.x*1.65 - uT*1.70);',
      // Huzme UZAKTA guclu, yakinda zayif. Ilk surumde tersiydi ve kurulus
      // cekiminde su yuzeyi kameraya yakin yerde noktali kirmizi bir hali
      // gibi okunuyordu (yuksek frekansli kip, siyirma acisinda ortusme).
      // Referansta da parlama ufka yakin toplaniyor, ayaklarin dibinde degil.
      '  c += uParlama * uGuc * g * (0.34 + 0.66*kip) * (0.22 + 0.78*d);',
      // Su gogun rengini ALIR. Ilk surumde almiyordu: gun batiminda gok
      // turuncu, deniz gri-mavi kaliyor ve ufukta sert bir renk siniri
      // olusuyordu. Iki katman: her yerde hafif gok yansimasi, ufka dogru
      // artan sicaklik.
      // Gok yansimasi ve ufuk sicakligi KISILDI. Kullanici (5 Eyl 2026):
      // "deniz mavi renkte olacak". Onceki degerlerde (0,07 + 0,24) gun
      // batimi ve gece bloklarinda su kirmiziya/mora kayiyordu; sicaklik
      // artik yalnizca ufka degen ince bir bantta.
      '  c = mix(c, uGok, 0.04);',
      '  c += uParlama * 0.09 * smoothstep(0.68, 1.0, d);',
      // CANLILIK: gok yansimasi ve ufuk karisimi denizi grilestiriyordu.
      // Doygunluk geri veriliyor - luminanstan UZAKLASTIRARAK, parlakligi
      // bozmadan. Kullanici istegi (5 Eyl 2026): "canli renkler".
      '  float lum = dot(c, vec3(0.299, 0.587, 0.114));',
      '  c = mix(vec3(lum), c, 1.42);',
      // ufka dogru goge karis - duzlemin uzak kenari dikis vermesin
      '  c = mix(c, uGok, smoothstep(0.72, 1.0, d));',
      // Taban deger: referansta siyah piksel orani %0,0. Ilk surumde gece ve
      // safak ortamlarinda deniz siyaha dusuyor, kare %21-26 siyah cikiyordu.
      // Su hicbir zaman tamamen sonmez - ay/safak isigini her zaman tutar.
      // GECE KIMLIGI: uc blok ust uste 159 saniye gece suruyor ve deniz
      // orada duz bir levha gibi kaliyordu. Suyun uzerinde seyrek soguk
      // parildamalar - yildiz yansimasi. Yalnizca gece ortamlarinda.
      '  if (uGece > 0.01) {',
      '    vec2 hu = floor(vec2(vW.x*0.55, vW.z*0.55 + uT*0.35));',
      '    float r1 = fract(sin(dot(hu, vec2(12.9898, 78.233))) * 43758.5453);',
      '    float r2 = fract(sin(dot(hu, vec2(39.3467, 11.135))) * 24634.6345);',
      '    float pr = smoothstep(0.972, 1.0, r1) * (0.55 + 0.45*sin(uT*2.4 + r2*6.28));',
      '    c += vec3(0.42, 0.60, 0.85) * pr * uGece * (1.0 - d*0.55);',
      '  }',
      '  c = max(c, vec3(0.055, 0.062, 0.105));',
      // RENK UZAYI - olculdu, tahmin degil. Ham ShaderMaterial three.js'in
      // colorspace chunk'ini icermiyor; THREE.Color hex'i Linear-sRGB'ye
      // cevirdigi icin deger sRGB tampona OLDUGU GIBI yaziliyordu ve deniz
      // koyuluyordu: OGLE'de beklenen (10,111,158) yerine karede (0,20,70)
      // olcduk. Cikista sRGB'ye geri cevriliyor.
      '  c = pow(clamp(c, 0.0, 1.0), vec3(0.4545));',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n'),
    fog: false, depthWrite: true,
  });
  denizKok = new THREE.Mesh(new THREE.PlaneGeometry(2600, 2600), denizMat);
  denizKok.rotation.x = -Math.PI/2;
  denizKok.position.set(0, DENIZ_Y, -1050);
  denizKok.renderOrder = -3;           // gokten sonra, her seyden once
  denizKok.visible = false;
  scene.add(denizKok);

  // --- GUVERTE UST YUZU: sevron deseni
  // Referansta desen yol boyunca ILERI akiyor ve hiz duygusunu tasiyan sey o.
  // Doku dikey tekrarli; kaydirma HIZ ile ayni, yoksa zemin kayarken nota
  // duruyor gibi bir kayma hissi olusuyor (3. turda olculmus hata).
  {
    const gc = document.createElement('canvas'); gc.width = 128; gc.height = 128;
    const g2 = gc.getContext('2d');
    // OLCUM DUZELTMESI: ilk surumde sevronlar tam doygun cyan/magenta ve
    // kalindi; render olculdugunde S>0,5 piksel orani %48-64 cikti, hedef
    // %30 (MEKAN-KARARI.md). Yani doygunluk mekanda birikiyordu, oysa kural
    // "doygunluk yalnizca tepki verilecek nesnelerde". Sevronlar inceltildi
    // ve kirildi; guverte govdesi de saf siyaha yaklasmasin diye bir tik
    // acildi (siyah piksel orani %14-26 idi, hedef %0).
    // IKINCI DUZELTME: siyah piksel orani ilk olcumde %14-26 cikmisti ve
    // govdeyi acmistim - YANLIS TESHIS. Olcumu tekrarlayinca siyahin
    // kaynagi guverte degil SILUET KUTUSU cikti (sol HUD paneli, saf siyah
    // dikdortgen). Referansta siluet kutusu YOK, o yuzden oradaki %0 hedefi
    // bizim kadrajimiza dogrudan uymuyor. Govde geri koyulastirildi: deniz
    // ile guverte ayni degerdeydi, ikisi tek kutle gibi okunuyordu.
    g2.fillStyle = '#0e1030'; g2.fillRect(0,0,128,128);          // koyu indigo govde
    const sevron = (y, renk, kal) => {
      g2.strokeStyle = renk; g2.lineWidth = kal; g2.lineCap = 'butt';
      g2.beginPath(); g2.moveTo(4, y+22); g2.lineTo(64, y); g2.lineTo(124, y+22); g2.stroke();
    };
    // UCUNCU TUR - kullanici hatirlatmasi (5 Eyl 2026): "canli renkler
    // istemistim". Ikinci turda sevronlari referans olcumune (S>0,5 %30)
    // uydurmak icin kismistim; o hedef referanstan turemis bir sayi,
    // kullanicinin acik istegi ise onun ustunde. Sevronlar tam doygun ve
    // kalin geri geldi. Nota okunurlugu govdenin KOYU olmasindan geliyor
    // (#0e1030), sevronun sonmesinden degil - ikisi ayri kaldirac.
    sevron(18, '#22e0ff', 9);
    sevron(50, '#ff2fb0', 5);
    sevron(82, '#22e0ff', 9);
    sevron(114,'#ff2fb0', 5);
    guverteDoku = new THREE.CanvasTexture(gc);
    guverteDoku.wrapS = guverteDoku.wrapT = THREE.RepeatWrapping;
    guverteDoku.repeat.set(1, 26);
    guverteMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(YOL_GEN, 220),
      new THREE.MeshBasicMaterial({ map: guverteDoku, fog: true }));
    guverteMesh.rotation.x = -Math.PI/2;
    guverteMesh.position.set(0, 0.012, -95);
    guverteMesh.visible = false;
    scene.add(guverteMesh);
  }

  // --- BORDUR: koridorun iki cizgisi
  // Duvar yok. Kabarik kaide var. Ust yuzu isik aliyor, yan yuzu koyu -
  // hacmi o fark veriyor; duz renk birakinca yere cizilmis serit oluyor.
  bordurKok = new THREE.Group();
  bordurKok.visible = false;
  for (const yon of [-1, 1]) {
    const ust = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.46, 220),
      new THREE.MeshLambertMaterial({ color:'#ff4d2e', fog:true }));
    ust.position.set(yon * (YOL_GEN/2 + 0.31), 0.23, -95);
    ust.userData.rol = 'ust';
    const yan = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.86, 220),
      new THREE.MeshLambertMaterial({ color:'#7a1408', fog:true }));
    yan.position.set(yon * (YOL_GEN/2 + 0.62), -0.20, -95);
    yan.userData.rol = 'golge';
    bordurKok.add(ust, yan);
  }
  scene.add(bordurKok);

  // --- KULE METRONOMU
  // Referansta kacis noktasi hic bos degil: her an ileride bir kule ya da
  // kapi silueti duruyor, goz ileriye cekiliyor. Ama SEYREK - olay basina
  // bir tane. 4 olcu araligi (130 BPM'de 7,4 sn) bunu veriyor.
  // Kule oyun alanina girmiyor: ayaklar guverte disinda, kiris nota
  // koridorunun USTUNDE. Referansta da oyle - engel degil, dekor.
  kuleKok = new THREE.Group();
  kuleKok.visible = false;
  // Hedef kapilari her 4 olcude bir gelince yan yapilarin onune geciyordu.
  // Artik 8 olcude bir: metronom var, ama dunya ana karakter.
  const KULE_ARA = 27.7 * 8;
  const KULE_SAY = 6;
  kuleKok.userData = { ARA: KULE_ARA, SAY: KULE_SAY, KAP: KULE_ARA * KULE_SAY };
  for (let i = 0; i < KULE_SAY; i++) {
    const g = new THREE.Group();
    const govdeM = new THREE.MeshLambertMaterial({ color:'#0d0f2e', fog:true });
    const neonM  = new THREE.MeshBasicMaterial({ color:'#22e0ff', fog:true });
    for (const yon of [-1, 1]) {
      // Ilk metronom kapisi kalin siyah ayaklarla kadraji boguyordu.
      // Artik ince isikli direkler: hedefi isaret ediyor, gorus hattini
      // kapatmiyor.
      const ayak = new THREE.Mesh(new THREE.BoxGeometry(0.68, 6.6, 0.68), govdeM);
      ayak.position.set(yon * (YOL_GEN/2 + 1.45), 3.3, 0);
      const tup = new THREE.Mesh(new THREE.BoxGeometry(0.18, 5.5, 0.18), neonM);
      tup.position.set(yon * (YOL_GEN/2 + 1.15), 3.45, 0);
      g.add(ayak, tup);
    }
    const kiris = new THREE.Mesh(new THREE.BoxGeometry(YOL_GEN + 3.8, 0.42, 0.72), govdeM);
    kiris.position.set(0, 6.35, 0);
    const seritK = new THREE.Mesh(new THREE.BoxGeometry(YOL_GEN + 3.8, 0.14, 0.78), neonM);
    seritK.position.set(0, 6.08, 0);
    g.add(kiris, seritK);
    g.userData = { i, govde: govdeM, neon: neonM };
    kuleKok.add(g);
  }
  scene.add(kuleKok);

  // --- HALKA GECIDI (5 Eyl 2026)
  // Kullanici: "yuvarlak bir sey yolun ortasindan tam gececek, o zaman
  // icinden gecmesini istiyorum". Halka yaklasirken yanlamasina KAYIYOR ve
  // tam vurus cizgisine geldiginde ortaya oturuyor - icinden gecis o anda
  // olusuyor. Kayma z'den turetiliyor, zamandan degil: hangi karede
  // bakarsan bak ayni halka ayni yerde, render deterministik kaliyor.
  // Engel DEGIL: cue'ya bagli degil, koreografiyi degistirmiyor. Buyuk
  // engellerin arasi 2 olcu acildi, halka o boslugu dolduruyor.
  halkaKok = new THREE.Group();
  halkaKok.visible = false;
  const HALKA_ARA = 27.7 * 6;                // 6 olcu = 11,1 sn - seyrek
  const HALKA_SAY = 6;
  halkaKok.userData = { ARA: HALKA_ARA, KAP: HALKA_ARA * HALKA_SAY };
  const halkaGeo = new THREE.TorusGeometry(3.2, 0.30, 12, 44);
  for (let i = 0; i < HALKA_SAY; i++) {
    const mat = new THREE.MeshBasicMaterial({ color:'#22e0ff', fog:true });
    const m = new THREE.Mesh(halkaGeo, mat);
    m.userData = { i, mat };
    halkaKok.add(m);
  }
  scene.add(halkaKok);
}

      "  vec3 GOKT = vec3(0.80, 0.77, 0.71);",
      "  vec3 BALA = vec3(0.93, 0.62, 0.16);",
      "  vec3 BALK = vec3(0.50, 0.24, 0.03);",
      "  vec3 MUM  = vec3(0.94, 0.80, 0.46);",
      "  vec3 KPK  = vec3(0.88, 0.71, 0.38);",
      "  vec3 BOS  = vec3(0.46, 0.27, 0.08);",
      "  vec3 KNL  = vec3(0.29, 0.13, 0.03);",
      "  vec3 SUN  = normalize(vec3(0.30, 0.20, -1.0));",
      "  float ax = abs(vW.x);",
      "  float Xs = vW.z - uT * uHIZ;",
      "  vec2 hp = vec2(vW.x, Xs) / 1.20;",
      "  vec2 hs = vec2(1.0, 1.7320508);",
      "  vec2 ha = mod(hp, hs) - hs * 0.5;",
      "  vec2 hb = mod(hp - hs * 0.5, hs) - hs * 0.5;",
      "  vec2 gv = (dot(ha, ha) < dot(hb, hb)) ? ha : hb;",
      "  vec2 hid = floor((hp - gv) * 2.0 + 0.5);",
      "  float hd = max(abs(gv.x) * 0.5 + abs(gv.y) * 0.8660254, abs(gv.x)) / 0.5;",
      "  float rn = fract(sin(dot(hid, vec2(12.9898, 78.233))) * 43758.5453);",
      "  bool kapak = rn < 0.16;",
      "  bool bos = (rn >= 0.16) && (rn < 0.23);",
      "  float fw = fwidth(hp.y);",
      "  float det = 1.0 - smoothstep(0.10, 0.34, fw);",
      "  float duvar = smoothstep(0.80, 0.93, hd) * det;",
      "  float egim = kapak ? -0.35 : (bos ? 0.0 : 1.10);",
      "  vec3 nrm = normalize(vec3(-gv.x * egim * det, 1.0, -gv.y * egim * det));",
      "  vec3 V = normalize(vW - cameraPosition);",
      "  vec3 R = reflect(V, nrm);",
      "  float fres = 0.04 + 0.96 * pow(1.0 - clamp(dot(-V, nrm), 0.0, 1.0), 5.0);",
      "  float ry = clamp(R.y, 0.0, 1.0);",
      "  vec3 yans = mix(GOKU, GOKT, pow(ry, 0.55));",
      "  float sp = max(dot(R, SUN), 0.0);",
      "  float spec = pow(sp, 380.0) * 1.6 + pow(sp, 24.0) * 0.30;",
      "  float lam = 0.5 + 0.5 * dot(nrm, normalize(vec3(0.3, 0.8, -0.5)));",
      "  float hd2 = hd * hd;",
      "  vec3 bal = mix(BALA, BALK, hd2 * 0.55) * (1.0 - 0.38 * smoothstep(0.50, 0.84, hd));",
      "  bal *= (0.78 + 0.32 * lam);",
      "  vec3 icr = kapak ? KPK * (0.85 + 0.20 * lam) : (bos ? BOS * (0.80 + 0.35 * (1.0 - hd)) : bal);",
      "  vec3 yakin = mix(icr, MUM * (0.70 + 0.40 * lam), duvar);",
      "  vec3 ort = 0.22 * MUM * 0.9 + 0.16 * KPK * 0.95 + 0.07 * BOS + 0.55 * (BALA * 0.8 + BALK * 0.2) * 0.9;",
      "  ort *= vec3(0.985, 0.975, 0.93);",
      "  vec3 govde = mix(ort, yakin, det);",
      "  float parlak = kapak ? 0.18 : (bos ? 0.35 : 1.0);",
      "  parlak = mix(0.62, parlak * (1.0 - duvar * 0.7), det);",
      "  float YR = 3.5;",
      "  float mes = max(-vW.z + 10.8, 0.0);",
      "  float kap = 1.0 - smoothstep(95.0, 150.0, mes);",
      "  float icK = (1.0 - smoothstep(YR * 0.80, YR * 1.04, ax)) * kap;",
      "  float altta = 1.0 + 0.70 * duvar - 0.10 * (1.0 - duvar) * det;",
      "  vec3 knl = KNL * (0.78 + 0.34 * lam) * altta;",
      "  govde = mix(govde, knl, icK);",
      "  parlak = mix(parlak, 0.40, icK);",
      "  float dq = (ax - YR * 0.93) / 0.17;",
      "  float dudak = exp(-dq * dq) * kap;",
      "  float fk = fres * parlak;",
      "  vec3 c2 = govde * (1.0 - fk) + yans * fk + vec3(1.0, 0.93, 0.74) * spec * parlak;",
      "  c2 += vec3(1.0, 0.86, 0.55) * dudak * 0.30;",
      "  float pus = clamp(pow(mes / 280.0, 1.15), 0.0, 0.94);",
      "  pus = max(pus, clamp((ax - 28.0) / 100.0, 0.0, 0.9));",
      "  c2 = mix(c2, GOKU, pus);",
      "  gl_FragColor = vec4(c2, 1.0);",
      "  return;",
      "}",
      "      if (uMod > 1.5) {",
      // Uzak alan: sahne sisi bu duzleme islemiyor (fog:false), bu yuzden
      // gok rengine karisma shader icinde ve ERKEN yapiliyor - yoksa yiginin
      // bittigi yerden ufka kadar duz bir zemin bandi kaliyor.
      "        c = mix(c, uGok, clamp(pow(d * 2.6, 1.7), 0.0, 1.0));",
      // koridora yaklastikca koyulasir: yigin dibi yolun kenarinda golgede
      "        c *= mix(0.78, 1.0, smoothstep(3.2, 7.5, abs(vW.x)));",
      "        c = mix(c, uGok, clamp((abs(vW.x) - 13.0) / 26.0, 0.0, 1.0) * 0.99);",
      "        gl_FragColor = vec4(c, 1.0);",
      "        return;",
      "      }",
      '  float s = (vW.z - uT * uHIZ) / L;',
      '  float f = abs(fract(s) - 0.5);',
      '  float idx = floor(fract(floor(s) / 4.0) * 4.0 + 0.5);',
      '  float kalin = (idx < 0.5) ? 1.0 : 0.0;',
      '  float w = fwidth(s) * 1.6 + 0.004 + kalin * 0.010;',
      '  float cub = smoothstep(0.5, 0.5 - w, f);',
      '  cub *= (1.0 - d) * (0.34 + 0.62 * kalin);',
      '  c += uVurus * cub;',
      // 3. NABIZ HALKASI. Vurus cizgisinden disa buyuyor, bir olcude
      //    kapsami tamamliyor ve sonerek yerini yenisine biraktiriyor.
      '  float r = length(vec2(vW.x, vW.z - uZV));',
      '  float faz = fract(uT / uOLCU);',
      '  float R = faz * 88.0;',
      '  float h = exp(-pow((r - R) / 7.0, 2.0)) * (1.0 - faz);',
      '  float R2 = (faz + 1.0) * 88.0;',
      '  h += exp(-pow((r - R2) / 9.0, 2.0)) * 0.45 * (1.0 - faz * 0.5);',
      '  c += uHalka * h * 0.85 * (1.0 - d * 0.7);',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n'),
    fog: false, depthWrite: true, side: THREE.DoubleSide,
  });
  // Yol govdesinin ust yuzu y=0; taban onun hemen altinda duruyor ki
  // yol kendi koyu kutlesi olarak okunsun (cue zemini). Duzlem buyuk:
  // ufuk cizgisi geometriden degil kamera egiminden geliyor, bu yuzden
  // yuzeyin kenari kadrajda gorunmuyor.
  // Duzlem 2600 idi ve KENARI kadrajda kaliyordu: ufuk cizgisinin hemen
  // ustunde tum genisligi gecen ince SIYAH hatlar cikiyordu (12 Eyl 2026
  // olcumu: HUD disi siyah %0,47, hepsi y 301-309 bandinda). Ufuk artik
  // geometriden degil kamera egiminden geliyor - duzlem kenari kadrajin
  // disina tasindi.
  tabanKok = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), tabanMat);
  tabanKok.rotation.x = -Math.PI/2;
  tabanKok.position.set(0, -0.05, -3600);
  tabanKok.renderOrder = -3;
  tabanKok.visible = false;
  scene.add(tabanKok);
}

// kutleler renk degil SILUET olarak okunuyor. Doygun kirmizi yalnizca

// (UYGULAMA.md: "doygunluk yalnizca tepki verilecek nesnelerde").
//
// YUKSEKLIK KURALI (5 Eyl 2026 dersi): bir seyin ne oldugu, kameranin
// (y=3,7) ustunde mi altinda mi durduguyla okunuyor. Asili karpuzlarin ALT
// ucu 7,1 - duck kirisinin tepesinden (4,6) belirgin yukarida. Boylece
// "gecilecek engel" ile "mekani kuran kutle" karismiyor.
let karpuzKok = null, karpuzMat = null, karpuzAsmaMat = null;
const KARPUZ_SAY = 12;                    // ayni anda sahnedeki dal sayisi
// Dizinin gecometrisi t'den BAGIMSIZ: bir olcude gidilen mesafe sabit.
// Bu yuzden faz da sabit ve baslangicta hesaplaniyor - zemin shader'i ile
// asma dallari ayni sayidan besleniyor. (Ilk surumde faz karpuzGuncelle
// icinde hesaplaniyordu ve uniform bir KARE GERIDEN geliyordu; golge ile
// dal arasinda bir karelik kayma oluyordu.)
const KARPUZ_L = HIZ * OLCU;
const KARPUZ_KAPSAM = KARPUZ_SAY * KARPUZ_L;
const KARPUZ_TABANZ = Z_VURUS + 6 - KARPUZ_KAPSAM;
const KARPUZ_FAZ = KARPUZ_TABANZ / KARPUZ_L;

// Kabuk dokusu: koyu yesil govde uzerinde DAHA KOYU dalgali seritler.
// Serit kontrasti bilincli olarak dusuk - kutle silueti bozulmasin.
let KARPUZ_KABUK_DOKU = null;
function karpuzKabukDoku(){
  if (KARPUZ_KABUK_DOKU) return KARPUZ_KABUK_DOKU;
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  // Doku ACIK: Lambert'te map ile color CARPILIYOR. Koyu doku yazilirsa
  // kutleler ekranda siyaha dusuyor (bir kez olculdu: (2,12,0)). Degeri ve
  // rengi color tasir; doku yalnizca SERIT desenini verir.
  // Serit kontrasti gercek karpuzunki kadar: acik govde uzerinde belirgin
  // koyu dalgali bantlar. Onceki surumde kontrast dusuruldugu icin kabuk
  // "gri bir kutle" gibi okunuyordu.
  g.fillStyle = '#f4f4f0'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = '#7f8d6c'; g.lineWidth = 15; g.lineCap = 'round';
  for (let i = 0; i < 8; i++){
    const x = i * 32 + 10;
    g.beginPath();
    for (let y = -6; y <= 134; y += 8){
      const dx = Math.sin(y * 0.075 + i) * 6.5;
      if (y < 0) g.moveTo(x + dx, y); else g.lineTo(x + dx, y);
    }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  KARPUZ_KABUK_DOKU = t; return t;
}

// Kesik yuz dokusu: disdan ice kabuk -> beyaz katman -> doygun ic + cekirdek.
// Doygunluk SADECE burada. Engel dokusu oldugu icin kurala uygun.
let KARPUZ_ET_DOKU = null;
function karpuzEtDoku(){
  if (KARPUZ_ET_DOKU) return KARPUZ_ET_DOKU;
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#2b3a24'; g.fillRect(0, 0, 256, 256);      // dis kabuk
  g.fillStyle = '#e8f0cf'; g.fillRect(9, 9, 238, 238);      // beyaz katman
  g.fillStyle = '#d8233f'; g.fillRect(17, 17, 222, 222);    // ic
  // cekirdekler: deterministik izgara, kare basina rastgele yok
  g.fillStyle = '#171310';
  for (let i = 0; i < 26; i++){
    const x = 40 + ((i * 73) % 180), y = 42 + ((i * 137) % 176);
    g.beginPath(); g.ellipse(x, y, 5.5, 8, 0.5, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  KARPUZ_ET_DOKU = t; return t;
}

// Yaprak dokusu: alfali tek yaprak silueti (wave engeli icin perde).
let KARPUZ_YAPRAK_DOKU = null;
function karpuzYaprakDoku(){
  if (KARPUZ_YAPRAK_DOKU) return KARPUZ_YAPRAK_DOKU;
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 128, 128);
  g.fillStyle = '#4e8f3f';
  g.beginPath();
  g.moveTo(64, 4);
  g.bezierCurveTo(122, 30, 118, 96, 64, 126);
  g.bezierCurveTo(10, 96, 6, 30, 64, 4);
  g.fill();
  g.strokeStyle = '#2f5c27'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(64, 8); g.lineTo(64, 122); g.stroke();
  for (let y = 22; y < 116; y += 16){
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(64, y); g.lineTo(34, y + 13); g.stroke();
    g.beginPath(); g.moveTo(64, y); g.lineTo(94, y + 13); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  KARPUZ_YAPRAK_DOKU = t; return t;
}

const KARPUZ_TOP_GEO = new THREE.SphereGeometry(1, 20, 14);
const KARPUZ_SILINDIR_GEO = new THREE.CylinderGeometry(1, 1, 1, 14);
const KARPUZ_YAPRAK_GEO = new THREE.PlaneGeometry(1, 1);

{
  // Materyaller Lambert: sahnede ambient 0,58 + yonlu 1,62 var (TB && !SADE).
  // Basic secilseydi kutle DUZ okunurdu - istasyon dersinde olculmustu:
  // "duz renkli kutu ne kadar dogru yerlestirilirse yerlestirilsin kutu gibi
  // gorunur; gerceklik yuzeydeki bilgiden ve GOLGEDEN geliyor."
  // KABUK RENGI (13 Eyl 2026, kullanici karari): karpuz yesildir. Onceki
  // deger (#6e7a63) mekan bandi doygunluk kuraline uymak icin gri-yesile
  // cekilmisti ve kutleler siyah bir leke gibi okunuyordu. Kuralin kapsami
  // daraltildi: dusuk doygunluk mekanin GENEL yuzeyleri icin (zemin, gok,
  // yol); mekani kuran kimlikli cisim kendi rengini tasir.
  karpuzMat = new THREE.MeshLambertMaterial({ map: karpuzKabukDoku(),
    color: '#3f8a3a', fog: true });
  karpuzAsmaMat = new THREE.MeshLambertMaterial({ color: '#40613a', fog: true });
  karpuzKok = new THREE.Group();
  karpuzKok.visible = false;
  for (let i = 0; i < KARPUZ_SAY; i++){
    const dal = new THREE.Group();
    // ASMA DALI: yolu ENINE gecen kalin govde. Kadrajin disina tasacak kadar
    // uzun - iki ucu gorunmuyor, yani "nereye baglandigi" sorusu sorulmuyor.
    const gov = new THREE.Mesh(KARPUZ_SILINDIR_GEO, karpuzAsmaMat);
    gov.rotation.z = Math.PI / 2;
    gov.scale.set(0.30, 46, 0.30);
    gov.position.set(0, 11.7, 0);
    gov.castShadow = true;
    dal.add(gov);
    // UC KUTLE: biri tam ortada (bas ustunden gecen), ikisi yanlarda.
    // Yanlardakiler kadrajin kenarina dogru cikiyor - ust serit boylece
    // doluyor ama koridor duvarina donusmuyor (yanlarda nesne YOK kurali
    // goz hizasi icin gecerli; bunlar 7,1'in ustunde).
    const kume = [[0, 2.30, 0.9], [-6.6, 1.95, 1.4], [6.6, 2.10, 1.15]];
    for (const [x, r, sap] of kume){
      const sapM = new THREE.Mesh(KARPUZ_SILINDIR_GEO, karpuzAsmaMat);
      sapM.scale.set(0.13, sap, 0.13);
      sapM.position.set(x, 11.7 - sap / 2, 0);
      dal.add(sapM);
      const top = new THREE.Mesh(KARPUZ_TOP_GEO, karpuzMat);
      top.scale.set(r, r * 0.88, r);
      top.position.set(x, 11.7 - sap - r * 0.88, 0);
      top.castShadow = true;
      dal.add(top);
    }
    dal.userData = { i };
    karpuzKok.add(dal);
  }
  scene.add(karpuzKok);
}

// ---- KARPUZ TARLASI (13 Eyl 2026, kullanici: "doldur karpuzla doldur")
// Yol koridorunun DISINDA kalan etin uzeri bastan basa karpuz. Ilk surumde
// 54 ayri Group vardi ve 260 birime yayilinca serpistirme gibi duruyordu.
// Artik InstancedMesh: TARLA_SAY karpuz + TARLA_YAPRAK yaprak, sasirtmali ve
// jitterli izgara uzerinde, aralari kapali.
// Neden InstancedMesh: 1600 ayri Mesh cizim cagrisiyla kareyi bogar; instanced
// hepsini tek cizimde veriyor (balast tasi cozumunun aynisi).
// Koridor kurali: hicbir ornek |x| < 6,0'a girmez - oyun alani kapanmaz.
// castShadow KAPALI: 1600 ornegi golge gecisinde tekrar cizmek kare suresini
// ikiye katliyordu; tarla parlak etin uzerinde zaten koyu siluet okunuyor.
let tarlaIM = null, tarlaYaprakIM = null, tarlaVeri = [], tarlaYaprakVeri = [];
const TARLA_SAY = 2200, TARLA_YAPRAK = 520, TARLA_KAPSAM = 300;
{
  const rnd = (n) => { const x = Math.sin(n * 71.13) * 43758.5453; return x - Math.floor(x); };
  // Sasirtmali izgara: satirlar z'de 2,35 birim aralikli, her satir yarim adim
  // kaydirilmis. Duz izgara "dikili nizam" okunuyordu, sasirtmali olan tarla.
  const SATIR = Math.ceil(TARLA_KAPSAM / 1.70);   // 2,35 -> 1,70: yakin planda siralar arasi bosluk kapaniyor
  const SUTUN = Math.ceil(TARLA_SAY / (SATIR * 2));
  let n = 0;
  for (let r = 0; r < SATIR && n < TARLA_SAY; r++) {
    const kaydir = (r % 2) * 1.28;
    for (let c = 0; c < SUTUN && n < TARLA_SAY; c++) {
      for (const yon of [-1, 1]) {
        if (n >= TARLA_SAY) break;
        const h1 = rnd(n * 3 + 1), h2 = rnd(n * 3 + 2), h3 = rnd(n * 3 + 3);
        // SINIR 4,35: koridorun kenari (ak kabuk 4,15'te biter) ile dolgunun
        // basladigi yer arasinda BOS SERIT birakilmaz. Onceki deger 6,0 idi
        // ve arada 1,85 birimlik bos et seridi kaliyordu; ufka dogru uzanan
        // o serit izleyicinin gordugu tek buyuk boslukti (olculdu: yakin
        // bantta %50,9 bosluk, kural <%25).
        const x = yon * (4.35 + kaydir + c * 2.55 + (h1 - 0.5) * 1.35);
        const z0 = r * 1.70 + (h2 - 0.5) * 1.1;
        // Boy sutunla BUYUR: koridorun dibindeki ilk sira kucuk olmali,
        // yoksa buyuk karpuz kadraji kapatiyor ve cue'yu gizliyor.
        const yakinlik = Math.min(1, c / 3);
        const rr = (0.34 + h3 * 0.42) + yakinlik * (0.36 + h3 * 0.78);
        tarlaVeri.push({ x, z0, r: rr, don: h1 * 6.28 });
        n++;
      }
    }
  }
  const geo = KARPUZ_TOP_GEO;
  tarlaIM = new THREE.InstancedMesh(geo, karpuzMat, tarlaVeri.length);
  tarlaIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  tarlaIM.castShadow = false; tarlaIM.receiveShadow = false;
  tarlaIM.frustumCulled = false;
  tarlaIM.visible = false;
  scene.add(tarlaIM);

  // Yapraklar: karpuzlarin arasini kapatan ikinci katman. Tek tip yesil bir
  // kuredenizi olmasin diye - tarlada yaprak da var.
  const yMat = new THREE.MeshLambertMaterial({ map: karpuzYaprakDoku(),
    transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, fog: true });
  for (let i2 = 0; i2 < TARLA_YAPRAK; i2++) {
    const h1 = rnd(i2 * 5 + 101), h2 = rnd(i2 * 5 + 102), h3 = rnd(i2 * 5 + 103);
    const yon = h1 < 0.5 ? -1 : 1;
    tarlaYaprakVeri.push({
      x: yon * (4.6 + h2 * 22.0),
      z0: h3 * TARLA_KAPSAM,
      olc: 1.25 + h1 * 1.1,
      don: h2 * 6.28,
    });
  }
  tarlaYaprakIM = new THREE.InstancedMesh(KARPUZ_YAPRAK_GEO, yMat, TARLA_YAPRAK);
  tarlaYaprakIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  tarlaYaprakIM.castShadow = false;
  tarlaYaprakIM.frustumCulled = false;
  tarlaYaprakIM.visible = false;
  scene.add(tarlaYaprakIM);
}

// ================= ELMA YIGINI (14 Eyl 2026, MEK-003) =================
// Mekani kuran kutle: gercek PD/CC0 elma fotograflarindan kesilmis BILLBOARD
// (REF-009...REF-013). Kodla cizilmis kure DEGIL - foto-varlik-kurali.md.
// Yedi ayri sprite, her biri kendi InstancedMesh'i (tek atlas + UV kaydirma
// shader isterdi; yedi cizim cagrisi daha ucuz ve okunur).
// Kamera sabit ve -z'ye bakiyor, bu yuzden duzlemin kendi normali (+z) zaten
// kameraya donuk - kare basina quaternion hesabi yok.
let elmaKok = null, elmaIM = [], elmaVeri = [];
const ELMA_SPRITE = 7, ELMA_KAPSAM = 300, ELMA_SINIR = 3.45;
{
  const rnd = (n) => { const x = Math.sin(n * 61.71) * 43758.5453; return x - Math.floor(x); };
  const yuk = new THREE.TextureLoader();
  const dokular = [];
  for (let i = 0; i < ELMA_SPRITE; i++) {
    const d = yuk.load('../07-mekan/elma/sprite-' + i + '.png');
    d.colorSpace = THREE.SRGBColorSpace;
    dokular.push(d);
  }
  // Agirlik: gercek fotograflar agir basar, ton kaydirilan iki varyant seyrek
  // (tasarim karesinde olculdu - esit dagitinca yesil neon gibi okunuyor).
  const AGIRLIK = [3, 3, 3, 3, 2, 1, 1], TOPLAM_AG = 16;
  const secSprite = (h) => {
    let k = Math.floor(h * TOPLAM_AG), t = 0;
    for (let i = 0; i < ELMA_SPRITE; i++) { t += AGIRLIK[i]; if (k < t) return i; }
    return 0;
  };
  const kova = [];
  for (let i = 0; i < ELMA_SPRITE; i++) kova.push([]);
  let n = 0;
  const SATIR = Math.ceil(ELMA_KAPSAM / 1.22), SUTUN = 26;
  for (let r = 0; r < SATIR; r++) {
    const kaydir = (r % 2) * 0.62;                 // sasirtmali izgara
    for (let c = 0; c < SUTUN; c++) {
      for (const yon of [-1, 1]) {
        const h1 = rnd(n * 3 + 11), h2 = rnd(n * 3 + 12), h3 = rnd(n * 3 + 13);
        const x = yon * (ELMA_SINIR + kaydir + c * 1.24 + (h1 - 0.5) * 0.62);
        const z0 = r * 1.22 + (h2 - 0.5) * 0.8;
        // Boy dagilimi: yigin duz bir hali gibi durmasin. Ayrica alcak
        // frekansli iki dalga ile yigin kabarip cokuyor (tasarim karesindeki
        // "yigilmis kutle" hissi bundan geliyor).
        // Olcek: yakin plandaki elma kadraji kapatmamali. 1,52 denendi -
        // on sirada kadrajin dortte birini yiyordu; 1,05'te yigin okunuyor,
        // koridor ve cue acikta kaliyor.
        const olc = 1.05 * (0.84 + h3 * 0.46);
        const kabar = 0.42 * Math.sin(x * 0.31 + z0 * 0.17) + 0.26 * Math.sin(x * 0.11 - z0 * 0.07);
        const sp = secSprite(rnd(n * 3 + 14));
        kova[sp].push({ x, z0, olc, y: olc * 0.40 + kabar * 0.30 });
        n++;
      }
    }
  }
  elmaKok = new THREE.Group();
  elmaKok.visible = false;
  const geo = new THREE.PlaneGeometry(1, 1);
  for (let i = 0; i < ELMA_SPRITE; i++) {
    // Renk 0,82: fotograflar parlak, bloom altinda beyaza doyuyordu.
    const mat = new THREE.MeshBasicMaterial({ map: dokular[i], color: 0xd2d2d2, transparent: true,
      alphaTest: 0.42, side: THREE.DoubleSide, fog: true, depthWrite: true });
    const im = new THREE.InstancedMesh(geo, mat, Math.max(1, kova[i].length));
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.castShadow = false; im.receiveShadow = false; im.frustumCulled = false;
    elmaIM.push(im); elmaVeri.push(kova[i]); elmaKok.add(im);
  }
  scene.add(elmaKok);
}

const _bM = new THREE.Matrix4(), _bV = new THREE.Vector3(), _bQ = new THREE.Quaternion(), _bS = new THREE.Vector3();
function bulutMekanGuncelle(t){
  const taban = Z_VURUS + 12 - BULUT_KAPSAM;
  // RITIM: olcu basinda simsek. Konum olcu indeksinden deterministik; cift
  // cakma (0 ve 0,09 sn) + hizli sonum. Ikinci parlama bir onceki olcununki,
  // sonerek.
  const oi = Math.floor(t / OLCU), ic = t - oi * OLCU;
  const cak = (x) => (x < 0 ? 0 : Math.exp(-x / 0.22));
  const flas = Math.min(1.2, cak(ic) + 0.7 * cak(ic - 0.09));
  const hs = (k, a) => { const v = Math.sin(k * a) * 43758.5453; return v - Math.floor(v); };
  for (let i = 0; i < bulutSimsek.length; i++) {
    const k = oi - i;
    const h1 = hs(k + 3, 12.9898), h2 = hs(k + 7, 78.233);
    const m = bulutSimsek[i];
    const z = Z_VURUS - 45 - h2 * 70 + (ic + i * OLCU) * HIZ;   // zeminle birlikte akar
    m.position.set((h1 < 0.5 ? -1 : 1) * (14 + h1 * 30), BULUT_DENIZ_Y + 1.5, z);
    m.scale.set(46, 20, 1);
    m.quaternion.copy(camera.quaternion);
    m.material.opacity = i === 0 ? flas : 0.35 * Math.exp(-(ic + OLCU) / 0.9);
  }
  // HAL: simsek gucu halden (gun batimi / gece / safak simseksiz, firtina guclu)
  const HL = BULUT_HAL[BULUT_HAL_AKTIF] || BULUT_HAL.a;
  const flasH = flas * HL.flas;
  for (const m of bulutSimsek) m.material.opacity *= HL.flas;
  tabanMat.uniforms.uFlas.value = flasH;
  tabanMat.uniforms.uBulutPus.value.setRGB(HL.pus[0], HL.pus[1], HL.pus[2]);
  tabanMat.uniforms.uBulutRenk.value.setRGB(HL.pist[0], HL.pist[1], HL.pist[2]);
  // kule ve kumeler parlamayla hafif aydinlanir (alttan isik); ton halden
  const aydin = 1 + 0.22 * flasH;
  for (let k = 0; k < 3; k++) {
    bulutKuleIM[k].material.color.setRGB(HL.kule[0] * aydin, HL.kule[1] * aydin, HL.kule[2] * aydin);

    for (let i = 0; i < dz.length; i++) {

      _bS.set(o.en * o.ayna, o.boy, 1);
      _bM.compose(_bV, _bQ, _bS); ik.setMatrixAt(i, _bM);
    }
    ik.instanceMatrix.needsUpdate = true;
    const dd = bulutDenizVeri[k], idn = bulutDenizIM[k];
    for (let i = 0; i < dd.length; i++) {
      const o = dd[i];

      _bV.set(o.x, o.y, z);
      _bS.set(o.en * o.ayna, o.boy, 1);
