      // gecen asma dalinin GOLGESI. Sayma gorevi zeminden TAVANA tasindi -
      // MEK-001 ile ayni desen katmanini tekrarlamamak icin sart (mekan-defteri
      // kurali: "ayni yapi, farkli palet yeni mekan sayilmaz").
      uMod:    { value: 0 },                       // 0 = taban, 1 = karpuz, 2 = elma
      uYol:    { value: new THREE.Color('#99ac96') },   // karpuz: kabugun koyu dis yuzu
      uSerit:  { value: new THREE.Color('#899e87') },   // karpuz: kabuk seridi
      uAk:     { value: new THREE.Color('#f1f2ea') },   // karpuz: beyaz kabuk katmani
      uEt:     { value: new THREE.Color('#e2a8b5') },   // karpuz: doygun ic
      uCekirdek:{ value: new THREE.Color('#938989') },  // karpuz: cekirdek
      uKFaz:   { value: 0 },                       // asma dizisinin faz kaymasi
      uT:      { value: 0 },
      uOLCU:   { value: 1.846 },
      uHIZ:    { value: 15 },
      uZV:     { value: Z_VURUS },
    },
    vertexShader: [
      'varying vec3 vW;',
      'void main(){',
      '  vW = (modelMatrix * vec4(position,1.0)).xyz;',
      '  gl_Position = projectionMatrix * viewMatrix * vec4(vW,1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'precision highp float;',
      'varying vec3 vW;',
      'uniform vec3 uYakin,uUzak,uGok,uVurus,uHalka,uYol,uSerit,uAk,uEt,uCekirdek;',
      'uniform float uT,uOLCU,uHIZ,uZV,uMod,uKFaz;',
      'void main(){',
      // 1. TEMEL RAMPA. Sis KAPALI (deniz modunda oldugu gibi): ufuk
      //    cizgisi keskin kalmali, sahne sisi grileştirince zemin ve gok
      //    tek lekeye donuyor. Ufka karisma shader'in kendi icinde.
      '  float d = clamp((-vW.z)/900.0, 0.0, 1.0);',
      '  vec3 c = mix(uYakin, uUzak, pow(d, 0.60));',
      '  c = mix(c, uGok, pow(d, 2.2) * 0.92);',
      // yakinda kenarlara dogru hafif koyulma - kadrajin alt kenari
      // yanlarda agirlasiyor, goz ortada kaliyor. Nesne DEGIL, degerleme.
      '  float yan = clamp(abs(vW.x)/46.0, 0.0, 1.0);',
      '  c *= 1.0 - 0.28 * yan * (1.0 - d);',
      // 2. OLCU CUBUGU. Aralik = bir olcude gidilen mesafe, yani cubuklar
      //    muzigin olcusuyle bire bir. Her dorduncu kalin: 4 olculuk
      //    cumleyi zemin sayiyor.
      '  float L = uHIZ * uOLCU;',
      // --- KARPUZ: ASMA GOLGESI (ritmi tasiyan tek zemin ogesi)
      // Asma dallari JS tarafinda z = ... + ((i*L + t*HIZ) % kapsam) ile
      // akiyor; dunya istasyonu z - t*HIZ sabit kaliyor. Shader ayni ifadeyi
      // kullandigi icin golge, dalin GERCEK yerine kilitli - ayri bir
      // animasyon degil, ayni tek kaynaktan turuyor.
      // DIKKAT (14 Eyl 2026): kosul once 'uMod > 0.5' idi; ELMA modu uMod=2
      // gonderince KARPUZ dali calisiyor ve zemin karpuz ETI olarak PEMBE
      // boyaniyordu (elma kaydinin uEt degeri = orta cizgi rengi). Dal artik
      // araliga bakiyor.
      '  if (uMod > 0.5 && uMod < 1.5) {',
      '    float sk = (vW.z - uT * uHIZ) / L - uKFaz;',
      '    float dd = (sk - floor(sk + 0.5)) * L;',      // en yakin dala uzaklik
      '    float g = exp(-(dd * dd) / (2.0 * 3.1 * 3.1));',
      // Enine genis, boyuna dar: golge yolu ENINE gecen bir bant.
      // NOT (13 Eyl 2026, olcum): burada once pow(x, 2.0) yaziliydi ve
      // zemin TAMAMEN SIYAH cikti. GLSL'de pow(x,y) yalnizca x>=0 icin
      // tanimli; vW.x negatif oldugu anda sonuc NaN oluyor ve NaN mix
      // uzerinden butun piksele yayiliyor. Kare %36 siyah olcuyordu
      // (kural %0). Kareler pow ile degil CARPMA ile aliniyor.
      '    float ax = abs(vW.x);',
      '    float u = ax / 15.0;',
      '    float u2 = u * u;',
      '    float gx = exp(-(u2 * u2));',
      // Daldaki uc karpuz golgeyi uc yerde koyulastiriyor - kutlelerin
      // sayisi zeminden de okunuyor.
      '    float a1 = vW.x / 2.7;',
      '    float a2 = (ax - 6.6) / 2.7;',
      '    float lump = exp(-a1 * a1) + exp(-a2 * a2);',
      '    float k = clamp(g * (0.40 * gx + 0.34 * lump), 0.0, 0.86);',
      // ---- KOMPLE KARPUZ KESITI (13 Eyl 2026, kullanici: "mekanin komple
      // konsepti olmasini istiyorum"). Zemin artik karpuzun UZERINDE degil,
      // karpuzun KENDISI: ortada kabugun koyu dis yuzu (yol), iki yaninda
      // beyaz kabuk katmani, onun disinda cekirdekli doygun ic.
      // Kurallar kendiliginden saglaniyor: en koyu yuzey tam ortada (yol),
      // doygunluk oyun duzleminin YANINDA - uzerinde degil.
      '    float X = vW.z - uT * uHIZ;',                 // dunya istasyonu: akar
      // YOL: kabuk dis yuzu + boyuna dalgali koyu serit. Dalga hem X hem x
      //      ile besleniyor, yoksa desen serit cizgisi gibi okunuyor.
      // KABUK DESENI: serit BOYUNA gider (yol boyunca), enine degil - enine
      // giden desen olcu cubuguna benzer ve MEK-001'i tekrarlardi. Bantlarin
      // kenari z boyunca salinıyor, yani desen kabuk gibi organik; duz cizgi
      // olsa serit boyasi gibi okunurdu.
      '    float sal = sin(X * 0.085) * 0.75 + 0.30 * sin(X * 0.191 + 1.3);',
      '    float dg = sin(vW.x * 3.05 + sal);',
      // Sivri kenar: karpuz seridinin kenari yumusak degil, dalgali ve keskin.
      '    float ser = smoothstep(-0.10, 0.34, dg);',
      '    vec3 yol = mix(uYol, uSerit, ser);',
      // Bandin ortasinda ince acik damar - kabugun kendi ic dokusu.
      '    float damar = smoothstep(0.86, 1.0, dg) * 0.35;',
      '    yol = mix(yol, uAk, damar * 0.30);',
      '    yol = mix(yol, uGok, pow(d, 2.2) * 0.80);',
      // AK KABUK: etle kabuk arasindaki ince beyaz katman - karpuzun imzasi.
      '    vec3 ak = mix(uAk, uGok, pow(d, 2.2) * 0.92);',
      // ET: doygun ic. Ufka dogru gogun degerine karisiyor.
      '    vec3 et = mix(uEt, uGok, pow(d, 2.2) * 0.92);',
      // CEKIRDEK: dunya izgarasindan deterministik. X ile turetildigi icin
      // zeminle birlikte akiyor - kamerada civilenmiyor.
      '    vec2 g2 = vec2(vW.x / 3.6, X / 5.2);',
      '    vec2 hu = floor(g2);',
      '    float h1 = fract(sin(dot(hu, vec2(12.9898, 78.233))) * 43758.5453);',
      '    float h2 = fract(h1 * 7919.0);',
      '    vec2 mrk = hu + vec2(0.22 + 0.56 * h1, 0.22 + 0.56 * h2);',
      '    vec2 dl = (g2 - mrk) * vec2(3.6, 5.2);',
      '    float rc = length(dl / vec2(0.40, 0.66));',
      '    float cek = (1.0 - smoothstep(0.80, 1.05, rc)) * (1.0 - d * 0.88);',
      '    et = mix(et, uCekirdek, clamp(cek, 0.0, 1.0) * 0.92);',
      // Uc bolgeyi birlestir. Kenarlar YUMUSAK: keskin cizgi "boyanmis serit"
      // okunuyor, oysa burasi bir kesit yuzeyi.
      '    float kYol = smoothstep(3.40, 3.20, ax);',
      '    float kAk  = smoothstep(4.24, 4.06, ax) * (1.0 - kYol);',
      '    c = mix(et, ak, kAk);',
      '    c = mix(c, yol, kYol);',
      // GOLGE: sabit renge BOYAMAZ, uzerine dustugu yuzeyi koyultur - boylece
      // asma golgesi hem etin hem kabugun uzerinden gecerken ikisinin farki
      // okunmaya devam ediyor.
      '    c *= mix(1.0, 0.55, k * (1.0 - d * 0.75));',
      '    gl_FragColor = vec4(c, 1.0);',
      '    return;',
      '  }',
      // --- ELMA (14 Eyl 2026, MEK-003 "YIGIN"). Zemin iki parca:
      //     (a) koridor DISI = yigin tabani, uzerini billboard elmalar kapatir,
      //         burada yalnizca aralardan sizacak koyu bir taban rengi gerekli;
      //     (b) koridor = bolum 01'in nota yolu - koyu bant + uc boyuna cizgi
      //         + enine olcu cubuklari. Yol govdesi kutusu KAPALI (karpuzdaki
      //         z-savasi tuzagi), koridor tamamen burada ciziliyor.
      // --- ELMA (14 Eyl 2026, MEK-003 "YIGIN").
      // Bu dal SADECE yigin tabanini boyar. Koridoru zeminMat ciziyor -
      // bolum 01'in nota yolu (koyu yol + uc lane ayraci + akan renk bantlari)
      // zaten o shader'da; burada bir kez daha cizilirse serit cift gorunuyor.
      // Tabanin gorevi: elmalarin ARASINDAN sizan pikselin gok rengi degil,
      // koyu yigin dibi olmasi (siyah %0 kurali icin de gerekli).
      "// --- BAL / PETEK (17 Eyl 2026, MEK-004). ELMA dali 'uMod > 1.5' ile 3'u de",
      "//     yakaladigi icin bu dal ONUNDE. Fotograf yok - petek, bal, parlaklik ve",
      "//     kanal tamamen burada. Renkler SHADER ICINDE sabit (ekran degeri): uniform",
      "//     Color'lar dogrusal uzaya cevrilip ciktida geri cevrilmiyor ve koyu",
      "//     cikiyor (MEK-002 iki renk yolu tuzagi).",
      "//     Tasarim karesi: REFERANSLAR/foto/mek-004/kur.py - ayni algoritma.",
      "if (uMod > 2.5) {",
      "  vec3 GOKU = vec3(0.93, 0.88, 0.78);",
      "  vec3 GOKT = vec3(0.80, 0.77, 0.71);",
      "  vec3 BALA = vec3(0.93, 0.62, 0.16);",
      "  vec3 BALK = vec3(0.50, 0.24, 0.03);",
      "  vec3 MUM  = vec3(0.94, 0.80, 0.46);",
      "  vec3 KPK  = vec3(0.88, 0.71, 0.38);",
      "  vec3 BOS  = vec3(0.46, 0.27, 0.08);",
      "  vec3 KNL  = vec3(0.29, 0.13, 0.03);",
      "  vec3 SUN  = normalize(vec3(0.30, 0.20, -1.0));",
      "  float ax = abs(vW.x);",
      "  float Xs = vW.z - uT * uHIZ;",
      "  vec2 hp = vec2(vW.x, Xs) / 1.20;",
      "  vec2 hs = vec2(1.0, 1.7320508);",
      "  vec2 ha = mod(hp, hs) - hs * 0.5;",
      "  vec2 hb = mod(hp - hs * 0.5, hs) - hs * 0.5;",
      "  vec2 gv = (dot(ha, ha) < dot(hb, hb)) ? ha : hb;",
      "  vec2 hid = floor((hp - gv) * 2.0 + 0.5);",
      "  float hd = max(abs(gv.x) * 0.5 + abs(gv.y) * 0.8660254, abs(gv.x)) / 0.5;",
      "  float rn = fract(sin(dot(hid, vec2(12.9898, 78.233))) * 43758.5453);",
      "  bool kapak = rn < 0.16;",
      "  bool bos = (rn >= 0.16) && (rn < 0.23);",
      "  float fw = fwidth(hp.y);",
      "  float det = 1.0 - smoothstep(0.10, 0.34, fw);",
      "  float duvar = smoothstep(0.80, 0.93, hd) * det;",
      "  float egim = kapak ? -0.35 : (bos ? 0.0 : 1.10);",
      "  vec3 nrm = normalize(vec3(-gv.x * egim * det, 1.0, -gv.y * egim * det));",
      "  vec3 V = normalize(vW - cameraPosition);",
      "  vec3 R = reflect(V, nrm);",
      "  float fres = 0.04 + 0.96 * pow(1.0 - clamp(dot(-V, nrm), 0.0, 1.0), 5.0);",
      "  float ry = clamp(R.y, 0.0, 1.0);",
      "  vec3 yans = mix(GOKU, GOKT, pow(ry, 0.55));",
      "  float sp = max(dot(R, SUN), 0.0);",
      "  float spec = pow(sp, 380.0) * 1.6 + pow(sp, 24.0) * 0.30;",
      "  float lam = 0.5 + 0.5 * dot(nrm, normalize(vec3(0.3, 0.8, -0.5)));",
      "  float hd2 = hd * hd;",
      "  vec3 bal = mix(BALA, BALK, hd2 * 0.55) * (1.0 - 0.38 * smoothstep(0.50, 0.84, hd));",
      "  bal *= (0.78 + 0.32 * lam);",
      "  vec3 icr = kapak ? KPK * (0.85 + 0.20 * lam) : (bos ? BOS * (0.80 + 0.35 * (1.0 - hd)) : bal);",
      "  vec3 yakin = mix(icr, MUM * (0.70 + 0.40 * lam), duvar);",
      "  vec3 ort = 0.22 * MUM * 0.9 + 0.16 * KPK * 0.95 + 0.07 * BOS + 0.55 * (BALA * 0.8 + BALK * 0.2) * 0.9;",
      "  ort *= vec3(0.985, 0.975, 0.93);",
      "  vec3 govde = mix(ort, yakin, det);",
      "  float parlak = kapak ? 0.18 : (bos ? 0.35 : 1.0);",
      "  parlak = mix(0.62, parlak * (1.0 - duvar * 0.7), det);",
      "  float YR = 3.5;",
      "  float mes = max(-vW.z + 10.8, 0.0);",
      "  float kap = 1.0 - smoothstep(95.0, 150.0, mes);",
      "  float icK = (1.0 - smoothstep(YR * 0.80, YR * 1.04, ax)) * kap;",
      "  float altta = 1.0 + 0.70 * duvar - 0.10 * (1.0 - duvar) * det;",
      "  vec3 knl = KNL * (0.78 + 0.34 * lam) * altta;",
      "  govde = mix(govde, knl, icK);",
      "  parlak = mix(parlak, 0.40, icK);",
      "  float dq = (ax - YR * 0.93) / 0.17;",
      "  float dudak = exp(-dq * dq) * kap;",
      "  float fk = fres * parlak;",
      "  vec3 c2 = govde * (1.0 - fk) + yans * fk + vec3(1.0, 0.93, 0.74) * spec * parlak;",
      "  c2 += vec3(1.0, 0.86, 0.55) * dudak * 0.30;",
      "  float pus = clamp(pow(mes / 280.0, 1.15), 0.0, 0.94);",
      "  pus = max(pus, clamp((ax - 28.0) / 100.0, 0.0, 0.9));",
      "  c2 = mix(c2, GOKU, pus);",
      "  gl_FragColor = vec4(c2, 1.0);",
      "  return;",
      "}",
      "      if (uMod > 1.5) {",
      // Uzak alan: sahne sisi bu duzleme islemiyor (fog:false), bu yuzden
      // gok rengine karisma shader icinde ve ERKEN yapiliyor - yoksa yiginin
      // bittigi yerden ufka kadar duz bir zemin bandi kaliyor.
      "        c = mix(c, uGok, clamp(pow(d * 2.6, 1.7), 0.0, 1.0));",
      // koridora yaklastikca koyulasir: yigin dibi yolun kenarinda golgede
      "        c *= mix(0.78, 1.0, smoothstep(3.2, 7.5, abs(vW.x)));",
      "        c = mix(c, uGok, clamp((abs(vW.x) - 13.0) / 26.0, 0.0, 1.0) * 0.99);",
      "        gl_FragColor = vec4(c, 1.0);",
      "        return;",
      "      }",
      '  float s = (vW.z - uT * uHIZ) / L;',
      '  float f = abs(fract(s) - 0.5);',
      '  float idx = floor(fract(floor(s) / 4.0) * 4.0 + 0.5);',
      '  float kalin = (idx < 0.5) ? 1.0 : 0.0;',
      '  float w = fwidth(s) * 1.6 + 0.004 + kalin * 0.010;',
      '  float cub = smoothstep(0.5, 0.5 - w, f);',
      '  cub *= (1.0 - d) * (0.34 + 0.62 * kalin);',
      '  c += uVurus * cub;',
      // 3. NABIZ HALKASI. Vurus cizgisinden disa buyuyor, bir olcude
      //    kapsami tamamliyor ve sonerek yerini yenisine biraktiriyor.
      '  float r = length(vec2(vW.x, vW.z - uZV));',
      '  float faz = fract(uT / uOLCU);',
      '  float R = faz * 88.0;',
      '  float h = exp(-pow((r - R) / 7.0, 2.0)) * (1.0 - faz);',
      '  float R2 = (faz + 1.0) * 88.0;',
      '  h += exp(-pow((r - R2) / 9.0, 2.0)) * 0.45 * (1.0 - faz * 0.5);',
      '  c += uHalka * h * 0.85 * (1.0 - d * 0.7);',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n'),
    fog: false, depthWrite: true, side: THREE.DoubleSide,
  });
  // Yol govdesinin ust yuzu y=0; taban onun hemen altinda duruyor ki
  // yol kendi koyu kutlesi olarak okunsun (cue zemini). Duzlem buyuk:
  // ufuk cizgisi geometriden degil kamera egiminden geliyor, bu yuzden
  // yuzeyin kenari kadrajda gorunmuyor.
  // Duzlem 2600 idi ve KENARI kadrajda kaliyordu: ufuk cizgisinin hemen
  // ustunde tum genisligi gecen ince SIYAH hatlar cikiyordu (12 Eyl 2026
  // olcumu: HUD disi siyah %0,47, hepsi y 301-309 bandinda). Ufuk artik
  // geometriden degil kamera egiminden geliyor - duzlem kenari kadrajin
  // disina tasindi.
  tabanKok = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), tabanMat);
  tabanKok.rotation.x = -Math.PI/2;
  tabanKok.position.set(0, -0.05, -3600);
  tabanKok.renderOrder = -3;
  tabanKok.visible = false;
  scene.add(tabanKok);
}


// ================================================== KARPUZ: ASKI (MEK-002)
// 13 Eylul 2026, kullanici karari: "A ile devam et."
//
// Tasiyici fikir: MEKAN YUKARIDAN KURULUYOR. Goz hizasi bombos - yanlarda
// bina, kemer, tunel, halka, kule, bordur, su, izgara hicbiri yok (MEK-001
// ile paylasilan tek sey bu sadelik, cunku o disiplin mekan degil kural).
// Farkli olan uc sey - mekan defterinin "ayni yapi farkli palet yeni mekan
// sayilmaz" kurali bunlari zorunlu kiliyor:
//   1) RITMI TASIYAN OGE: zemindeki olcu cubugu DEGIL, her olcude bas
//      ustunden gecen asma dalinin YOLU ENINE TARAYAN GOLGESI.
//   2) PALET AILESI: notr grafit degil; koyu kabuk yesili zemin +
//      olgunlasmamis ic renginde (dusuk doygunluk) gokyuzu.
//   3) DOLULUK DENGESI: MEK-001 bombos ve genisti; burasi ust seritte DOLU,
//      goz hizasinda bos. Tam tersi.
//
// PALET KURALI - burasi olculen banttir. olc-mekan.py "mekan bandi" olarak
// karenin UST %44'unu ve orta %30-70 kolonlarini aliyor; bas ustundeki
// karpuzlar tam oraya dusuyor. Bu yuzden kabuk DOYGUN DEGIL (S<0,25):
// kutleler renk degil SILUET olarak okunuyor. Doygun kirmizi yalnizca
// engellerin kesik yuzunde - yani oyun duzleminde, tepki verilecek nesnede
// (UYGULAMA.md: "doygunluk yalnizca tepki verilecek nesnelerde").
//
// YUKSEKLIK KURALI (5 Eyl 2026 dersi): bir seyin ne oldugu, kameranin
// (y=3,7) ustunde mi altinda mi durduguyla okunuyor. Asili karpuzlarin ALT
// ucu 7,1 - duck kirisinin tepesinden (4,6) belirgin yukarida. Boylece
// "gecilecek engel" ile "mekani kuran kutle" karismiyor.
let karpuzKok = null, karpuzMat = null, karpuzAsmaMat = null;
const KARPUZ_SAY = 12;                    // ayni anda sahnedeki dal sayisi
// Dizinin gecometrisi t'den BAGIMSIZ: bir olcude gidilen mesafe sabit.
// Bu yuzden faz da sabit ve baslangicta hesaplaniyor - zemin shader'i ile
// asma dallari ayni sayidan besleniyor. (Ilk surumde faz karpuzGuncelle
// icinde hesaplaniyordu ve uniform bir KARE GERIDEN geliyordu; golge ile
// dal arasinda bir karelik kayma oluyordu.)
const KARPUZ_L = HIZ * OLCU;
const KARPUZ_KAPSAM = KARPUZ_SAY * KARPUZ_L;
const KARPUZ_TABANZ = Z_VURUS + 6 - KARPUZ_KAPSAM;
const KARPUZ_FAZ = KARPUZ_TABANZ / KARPUZ_L;

// Kabuk dokusu: koyu yesil govde uzerinde DAHA KOYU dalgali seritler.
// Serit kontrasti bilincli olarak dusuk - kutle silueti bozulmasin.
let KARPUZ_KABUK_DOKU = null;
function karpuzKabukDoku(){
  if (KARPUZ_KABUK_DOKU) return KARPUZ_KABUK_DOKU;
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  // Doku ACIK: Lambert'te map ile color CARPILIYOR. Koyu doku yazilirsa
  // kutleler ekranda siyaha dusuyor (bir kez olculdu: (2,12,0)). Degeri ve
  // rengi color tasir; doku yalnizca SERIT desenini verir.
  // Serit kontrasti gercek karpuzunki kadar: acik govde uzerinde belirgin
  // koyu dalgali bantlar. Onceki surumde kontrast dusuruldugu icin kabuk
  // "gri bir kutle" gibi okunuyordu.
  g.fillStyle = '#f4f4f0'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = '#7f8d6c'; g.lineWidth = 15; g.lineCap = 'round';
  for (let i = 0; i < 8; i++){
    const x = i * 32 + 10;
    g.beginPath();
    for (let y = -6; y <= 134; y += 8){
      const dx = Math.sin(y * 0.075 + i) * 6.5;
      if (y < 0) g.moveTo(x + dx, y); else g.lineTo(x + dx, y);
    }
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  KARPUZ_KABUK_DOKU = t; return t;
}

// Kesik yuz dokusu: disdan ice kabuk -> beyaz katman -> doygun ic + cekirdek.
// Doygunluk SADECE burada. Engel dokusu oldugu icin kurala uygun.
let KARPUZ_ET_DOKU = null;
function karpuzEtDoku(){
  if (KARPUZ_ET_DOKU) return KARPUZ_ET_DOKU;
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#2b3a24'; g.fillRect(0, 0, 256, 256);      // dis kabuk
  g.fillStyle = '#e8f0cf'; g.fillRect(9, 9, 238, 238);      // beyaz katman
  g.fillStyle = '#d8233f'; g.fillRect(17, 17, 222, 222);    // ic
  // cekirdekler: deterministik izgara, kare basina rastgele yok
  g.fillStyle = '#171310';
  for (let i = 0; i < 26; i++){
    const x = 40 + ((i * 73) % 180), y = 42 + ((i * 137) % 176);
    g.beginPath(); g.ellipse(x, y, 5.5, 8, 0.5, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  KARPUZ_ET_DOKU = t; return t;
}

// Yaprak dokusu: alfali tek yaprak silueti (wave engeli icin perde).
let KARPUZ_YAPRAK_DOKU = null;
function karpuzYaprakDoku(){
  if (KARPUZ_YAPRAK_DOKU) return KARPUZ_YAPRAK_DOKU;
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 128, 128);
  g.fillStyle = '#4e8f3f';
  g.beginPath();
  g.moveTo(64, 4);
  g.bezierCurveTo(122, 30, 118, 96, 64, 126);
  g.bezierCurveTo(10, 96, 6, 30, 64, 4);
  g.fill();
  g.strokeStyle = '#2f5c27'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(64, 8); g.lineTo(64, 122); g.stroke();
  for (let y = 22; y < 116; y += 16){
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(64, y); g.lineTo(34, y + 13); g.stroke();
    g.beginPath(); g.moveTo(64, y); g.lineTo(94, y + 13); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  KARPUZ_YAPRAK_DOKU = t; return t;
}

const KARPUZ_TOP_GEO = new THREE.SphereGeometry(1, 20, 14);
const KARPUZ_SILINDIR_GEO = new THREE.CylinderGeometry(1, 1, 1, 14);
const KARPUZ_YAPRAK_GEO = new THREE.PlaneGeometry(1, 1);

{
  // Materyaller Lambert: sahnede ambient 0,58 + yonlu 1,62 var (TB && !SADE).
  // Basic secilseydi kutle DUZ okunurdu - istasyon dersinde olculmustu:
  // "duz renkli kutu ne kadar dogru yerlestirilirse yerlestirilsin kutu gibi
  // gorunur; gerceklik yuzeydeki bilgiden ve GOLGEDEN geliyor."
  // KABUK RENGI (13 Eyl 2026, kullanici karari): karpuz yesildir. Onceki
  // deger (#6e7a63) mekan bandi doygunluk kuraline uymak icin gri-yesile
  // cekilmisti ve kutleler siyah bir leke gibi okunuyordu. Kuralin kapsami
  // daraltildi: dusuk doygunluk mekanin GENEL yuzeyleri icin (zemin, gok,
  // yol); mekani kuran kimlikli cisim kendi rengini tasir.
  karpuzMat = new THREE.MeshLambertMaterial({ map: karpuzKabukDoku(),
    color: '#3f8a3a', fog: true });
  karpuzAsmaMat = new THREE.MeshLambertMaterial({ color: '#40613a', fog: true });
  karpuzKok = new THREE.Group();
  karpuzKok.visible = false;
  for (let i = 0; i < KARPUZ_SAY; i++){
    const dal = new THREE.Group();
    // ASMA DALI: yolu ENINE gecen kalin govde. Kadrajin disina tasacak kadar
    // uzun - iki ucu gorunmuyor, yani "nereye baglandigi" sorusu sorulmuyor.
    const gov = new THREE.Mesh(KARPUZ_SILINDIR_GEO, karpuzAsmaMat);
    gov.rotation.z = Math.PI / 2;
    gov.scale.set(0.30, 46, 0.30);
    gov.position.set(0, 11.7, 0);
    gov.castShadow = true;
    dal.add(gov);
    // UC KUTLE: biri tam ortada (bas ustunden gecen), ikisi yanlarda.
    // Yanlardakiler kadrajin kenarina dogru cikiyor - ust serit boylece
    // doluyor ama koridor duvarina donusmuyor (yanlarda nesne YOK kurali
    // goz hizasi icin gecerli; bunlar 7,1'in ustunde).
    const kume = [[0, 2.30, 0.9], [-6.6, 1.95, 1.4], [6.6, 2.10, 1.15]];
    for (const [x, r, sap] of kume){
      const sapM = new THREE.Mesh(KARPUZ_SILINDIR_GEO, karpuzAsmaMat);
      sapM.scale.set(0.13, sap, 0.13);
      sapM.position.set(x, 11.7 - sap / 2, 0);
      dal.add(sapM);
      const top = new THREE.Mesh(KARPUZ_TOP_GEO, karpuzMat);
      top.scale.set(r, r * 0.88, r);
      top.position.set(x, 11.7 - sap - r * 0.88, 0);
      top.castShadow = true;
      dal.add(top);
    }
    dal.userData = { i };
    karpuzKok.add(dal);
  }
  scene.add(karpuzKok);
}

// ---- KARPUZ TARLASI (13 Eyl 2026, kullanici: "doldur karpuzla doldur")
// Yol koridorunun DISINDA kalan etin uzeri bastan basa karpuz. Ilk surumde
// 54 ayri Group vardi ve 260 birime yayilinca serpistirme gibi duruyordu.
// Artik InstancedMesh: TARLA_SAY karpuz + TARLA_YAPRAK yaprak, sasirtmali ve
// jitterli izgara uzerinde, aralari kapali.
// Neden InstancedMesh: 1600 ayri Mesh cizim cagrisiyla kareyi bogar; instanced
// hepsini tek cizimde veriyor (balast tasi cozumunun aynisi).
// Koridor kurali: hicbir ornek |x| < 6,0'a girmez - oyun alani kapanmaz.
// castShadow KAPALI: 1600 ornegi golge gecisinde tekrar cizmek kare suresini
// ikiye katliyordu; tarla parlak etin uzerinde zaten koyu siluet okunuyor.
let tarlaIM = null, tarlaYaprakIM = null, tarlaVeri = [], tarlaYaprakVeri = [];
const TARLA_SAY = 2200, TARLA_YAPRAK = 520, TARLA_KAPSAM = 300;
{
  const rnd = (n) => { const x = Math.sin(n * 71.13) * 43758.5453; return x - Math.floor(x); };
  // Sasirtmali izgara: satirlar z'de 2,35 birim aralikli, her satir yarim adim
  // kaydirilmis. Duz izgara "dikili nizam" okunuyordu, sasirtmali olan tarla.
  const SATIR = Math.ceil(TARLA_KAPSAM / 1.70);   // 2,35 -> 1,70: yakin planda siralar arasi bosluk kapaniyor
  const SUTUN = Math.ceil(TARLA_SAY / (SATIR * 2));
  let n = 0;
  for (let r = 0; r < SATIR && n < TARLA_SAY; r++) {
    const kaydir = (r % 2) * 1.28;
    for (let c = 0; c < SUTUN && n < TARLA_SAY; c++) {
      for (const yon of [-1, 1]) {
        if (n >= TARLA_SAY) break;
        const h1 = rnd(n * 3 + 1), h2 = rnd(n * 3 + 2), h3 = rnd(n * 3 + 3);
        // SINIR 4,35: koridorun kenari (ak kabuk 4,15'te biter) ile dolgunun
        // basladigi yer arasinda BOS SERIT birakilmaz. Onceki deger 6,0 idi
        // ve arada 1,85 birimlik bos et seridi kaliyordu; ufka dogru uzanan
        // o serit izleyicinin gordugu tek buyuk boslukti (olculdu: yakin
        // bantta %50,9 bosluk, kural <%25).
        const x = yon * (4.35 + kaydir + c * 2.55 + (h1 - 0.5) * 1.35);
        const z0 = r * 1.70 + (h2 - 0.5) * 1.1;
        // Boy sutunla BUYUR: koridorun dibindeki ilk sira kucuk olmali,
        // yoksa buyuk karpuz kadraji kapatiyor ve cue'yu gizliyor.
        const yakinlik = Math.min(1, c / 3);
        const rr = (0.34 + h3 * 0.42) + yakinlik * (0.36 + h3 * 0.78);
        tarlaVeri.push({ x, z0, r: rr, don: h1 * 6.28 });
        n++;
      }
    }
  }
  const geo = KARPUZ_TOP_GEO;
  tarlaIM = new THREE.InstancedMesh(geo, karpuzMat, tarlaVeri.length);
  tarlaIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  tarlaIM.castShadow = false; tarlaIM.receiveShadow = false;
  tarlaIM.frustumCulled = false;
  tarlaIM.visible = false;
  scene.add(tarlaIM);

  // Yapraklar: karpuzlarin arasini kapatan ikinci katman. Tek tip yesil bir
  // kuredenizi olmasin diye - tarlada yaprak da var.
  const yMat = new THREE.MeshLambertMaterial({ map: karpuzYaprakDoku(),
    transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, fog: true });
  for (let i2 = 0; i2 < TARLA_YAPRAK; i2++) {
    const h1 = rnd(i2 * 5 + 101), h2 = rnd(i2 * 5 + 102), h3 = rnd(i2 * 5 + 103);
    const yon = h1 < 0.5 ? -1 : 1;
    tarlaYaprakVeri.push({
      x: yon * (4.6 + h2 * 22.0),
      z0: h3 * TARLA_KAPSAM,
      olc: 1.25 + h1 * 1.1,
      don: h2 * 6.28,
    });
  }
  tarlaYaprakIM = new THREE.InstancedMesh(KARPUZ_YAPRAK_GEO, yMat, TARLA_YAPRAK);
  tarlaYaprakIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  tarlaYaprakIM.castShadow = false;
  tarlaYaprakIM.frustumCulled = false;
  tarlaYaprakIM.visible = false;
  scene.add(tarlaYaprakIM);
}

// ================= ELMA YIGINI (14 Eyl 2026, MEK-003) =================
// Mekani kuran kutle: gercek PD/CC0 elma fotograflarindan kesilmis BILLBOARD
// (REF-009...REF-013). Kodla cizilmis kure DEGIL - foto-varlik-kurali.md.
// Yedi ayri sprite, her biri kendi InstancedMesh'i (tek atlas + UV kaydirma
// shader isterdi; yedi cizim cagrisi daha ucuz ve okunur).
// Kamera sabit ve -z'ye bakiyor, bu yuzden duzlemin kendi normali (+z) zaten
// kameraya donuk - kare basina quaternion hesabi yok.
let elmaKok = null, elmaIM = [], elmaVeri = [];
const ELMA_SPRITE = 7, ELMA_KAPSAM = 300, ELMA_SINIR = 3.45;
{
  const rnd = (n) => { const x = Math.sin(n * 61.71) * 43758.5453; return x - Math.floor(x); };
  const yuk = new THREE.TextureLoader();
  const dokular = [];
  for (let i = 0; i < ELMA_SPRITE; i++) {
    const d = yuk.load('../07-mekan/elma/sprite-' + i + '.png');
    d.colorSpace = THREE.SRGBColorSpace;
    dokular.push(d);
  }
  // Agirlik: gercek fotograflar agir basar, ton kaydirilan iki varyant seyrek
  // (tasarim karesinde olculdu - esit dagitinca yesil neon gibi okunuyor).
  const AGIRLIK = [3, 3, 3, 3, 2, 1, 1], TOPLAM_AG = 16;
  const secSprite = (h) => {
    let k = Math.floor(h * TOPLAM_AG), t = 0;
    for (let i = 0; i < ELMA_SPRITE; i++) { t += AGIRLIK[i]; if (k < t) return i; }
    return 0;
  };
  const kova = [];
  for (let i = 0; i < ELMA_SPRITE; i++) kova.push([]);
  let n = 0;
  const SATIR = Math.ceil(ELMA_KAPSAM / 1.22), SUTUN = 26;
  for (let r = 0; r < SATIR; r++) {
    const kaydir = (r % 2) * 0.62;                 // sasirtmali izgara
    for (let c = 0; c < SUTUN; c++) {
      for (const yon of [-1, 1]) {
        const h1 = rnd(n * 3 + 11), h2 = rnd(n * 3 + 12), h3 = rnd(n * 3 + 13);
        const x = yon * (ELMA_SINIR + kaydir + c * 1.24 + (h1 - 0.5) * 0.62);
        const z0 = r * 1.22 + (h2 - 0.5) * 0.8;
        // Boy dagilimi: yigin duz bir hali gibi durmasin. Ayrica alcak
        // frekansli iki dalga ile yigin kabarip cokuyor (tasarim karesindeki
        // "yigilmis kutle" hissi bundan geliyor).
        // Olcek: yakin plandaki elma kadraji kapatmamali. 1,52 denendi -
        // on sirada kadrajin dortte birini yiyordu; 1,05'te yigin okunuyor,
        // koridor ve cue acikta kaliyor.
        const olc = 1.05 * (0.84 + h3 * 0.46);
        const kabar = 0.42 * Math.sin(x * 0.31 + z0 * 0.17) + 0.26 * Math.sin(x * 0.11 - z0 * 0.07);
        const sp = secSprite(rnd(n * 3 + 14));
        kova[sp].push({ x, z0, olc, y: olc * 0.40 + kabar * 0.30 });
        n++;
      }
    }
  }
  elmaKok = new THREE.Group();
  elmaKok.visible = false;
  const geo = new THREE.PlaneGeometry(1, 1);
  for (let i = 0; i < ELMA_SPRITE; i++) {
    // Renk 0,82: fotograflar parlak, bloom altinda beyaza doyuyordu.
    const mat = new THREE.MeshBasicMaterial({ map: dokular[i], color: 0xd2d2d2, transparent: true,
      alphaTest: 0.42, side: THREE.DoubleSide, fog: true, depthWrite: true });
    const im = new THREE.InstancedMesh(geo, mat, Math.max(1, kova[i].length));
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.castShadow = false; im.receiveShadow = false; im.frustumCulled = false;
    elmaIM.push(im); elmaVeri.push(kova[i]); elmaKok.add(im);
  }
  scene.add(elmaKok);
}

// --- ELMA AGACLARI (14 Eyl 2026, kullanici: "saga ve sola elma agaclari
// koyabilirsin" -> sonra "cok kotu ve silik duruyor, buyuk olsun").
// ILK DENEME (silik serit) GERI ALINDI: uc kanopi kesiti sik bir cit gibi
// diziliyordu, sis icinde acik yesil bir serit olarak okunuyordu.
// SIMDI: TEK, BUTUN, MEYVELI agac (REF-017) - az sayida, BUYUK ve yakin.
// Govde yigin tarafindan orculuyor, kanopi ufkun uzerinde duruyor.
let elmaAgacKok = null, elmaAgacIM = [], elmaAgacVeri = [];
const AGAC_SAY = 13;                       // her yan icin (7 idi - arkada bosluk kaliyordu)
{
  const rnd = (n) => { const x = Math.sin(n * 53.37) * 43758.5453; return x - Math.floor(x); };
  const yuk = new THREE.TextureLoader();
  elmaAgacKok = new THREE.Group();
  elmaAgacKok.visible = false;
  const geo = new THREE.PlaneGeometry(1, 1);
  const d = yuk.load('../07-mekan/elma/agac-tek.png');
  d.colorSpace = THREE.SRGBColorSpace;
  // Renk BEYAZ: onceki 0xc8c8c8 kismasi sisle birlesince agaci soldurmustu.
  const mat = new THREE.MeshBasicMaterial({ map: d, transparent: true,
    alphaTest: 0.50, side: THREE.DoubleSide, fog: true, depthWrite: true });
  const veri = [];
  let n = 0;
  for (let k = 0; k < AGAC_SAY; k++) {
    for (const yon of [-1, 1]) {
      const h1 = rnd(n * 4 + 41), h2 = rnd(n * 4 + 42), h3 = rnd(n * 4 + 43);
      veri.push({
        // Koridora GIRMEZ (|x| >= 12) ama yiginin icinde durur: govdenin
        // kesik dibi elmalarin arkasinda kalsin.
        x: yon * (11.0 + h1 * 19.0),
        z0: (k / AGAC_SAY) * ELMA_KAPSAM + (h2 - 0.5) * 9.0,
        boy: 16.5 + h3 * 6.5,             // BUYUK - kullanici karari (13-18 kucuk kaldi)
        ayna: h2 < 0.5 ? -1 : 1,
      });
      n++;
    }
  }
  const im = new THREE.InstancedMesh(geo, mat, veri.length);
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  im.castShadow = false; im.receiveShadow = false; im.frustumCulled = false;
  elmaAgacIM.push(im); elmaAgacVeri.push(veri); elmaAgacKok.add(im);
  scene.add(elmaAgacKok);
}

function elmaAgacGuncelle(t){
  const taban = Z_VURUS + 8 - ELMA_KAPSAM;
  for (let k = 0; k < elmaAgacIM.length; k++) {
    const dizi = elmaAgacVeri[k], im = elmaAgacIM[k];
    for (let i = 0; i < dizi.length; i++) {
      const o = dizi[i];
      const z = taban + ((o.z0 + t * HIZ) % ELMA_KAPSAM);
      // Dibi yiginin icinde kalir (y merkezi boy/2'den dusuk): yalnizca
      // kanopi gorunur, govde yigin tarafindan orculur.
      // Doku kare (1024x1024); en = boy. Dibi 1,2 birim gomulu.
      // YAKIN KESME: kameraya 26 birimden fazla yaklasan agac kapatilir.
      // Yakinda sprite'in bulanik alt kanopisi elmalarin uzerine biniyor ve
      // "olu piksel" lekesi gibi okunuyordu (14 Eyl 2026, kullanici).
      const yakinlik = z - (Z_VURUS - 26);
      const gorun = yakinlik < 0 ? 1 : 0;
      _eV.set(o.x, o.boy * 0.50 - 1.2, z);
      _eS.set(o.boy * o.ayna * gorun, o.boy * gorun, 1);
      _eM.compose(_eV, _eQ, _eS);
      im.setMatrixAt(i, _eM);
    }
    im.instanceMatrix.needsUpdate = true;
  }
}

const _eM = new THREE.Matrix4(), _eV = new THREE.Vector3(),
      _eQ = new THREE.Quaternion(), _eS = new THREE.Vector3();
function elmaGuncelle(t){
  const taban = Z_VURUS + 8 - ELMA_KAPSAM;
  for (let k = 0; k < elmaIM.length; k++) {
    const dizi = elmaVeri[k], im = elmaIM[k];
    for (let i = 0; i < dizi.length; i++) {
      const o = dizi[i];
      const z = taban + ((o.z0 + t * HIZ) % ELMA_KAPSAM);
      _eV.set(o.x, o.y, z);
      _eS.set(o.olc, o.olc, 1);
      _eM.compose(_eV, _eQ, _eS);
      im.setMatrixAt(i, _eM);
    }
    im.instanceMatrix.needsUpdate = true;
  }
}

const _tM = new THREE.Matrix4(), _tV = new THREE.Vector3(),
      _tQ = new THREE.Quaternion(), _tS = new THREE.Vector3(),
      _tE = new THREE.Euler();
function tarlaGuncelle(t){
  const taban = Z_VURUS + 8 - TARLA_KAPSAM;
  for (let i = 0; i < tarlaVeri.length; i++) {
    const o = tarlaVeri[i];
    const z = taban + ((o.z0 + t * HIZ) % TARLA_KAPSAM);
    _tV.set(o.x, o.r * 0.88, z);
    _tE.set(0, o.don, 0); _tQ.setFromEuler(_tE);
    _tS.set(o.r, o.r * 0.88, o.r);
    _tM.compose(_tV, _tQ, _tS);
    tarlaIM.setMatrixAt(i, _tM);
  }
  tarlaIM.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < tarlaYaprakVeri.length; i++) {
    const o = tarlaYaprakVeri[i];
    const z = taban + ((o.z0 + t * HIZ) % TARLA_KAPSAM);
    _tV.set(o.x, 0.62, z);
    _tE.set(-1.18, o.don, 0); _tQ.setFromEuler(_tE);
    _tS.set(o.olc, o.olc, 1);
    _tM.compose(_tV, _tQ, _tS);
    tarlaYaprakIM.setMatrixAt(i, _tM);
  }
  tarlaYaprakIM.instanceMatrix.needsUpdate = true;
}

// Her kare: dallar kameraya dogru akar. Golge ZEMIN SHADER'INDA ayni

// ==================================================== DENIZ: EK KATMANLAR
// 5 Eyl 2026, kullanici "onerdiklerini ekle" dedi. Dort ek:
//   1. Guverte bicim cesitlemesi (yan onluk) - en buyuk eksik
//   2. Su ile guvertenin birlestigi yerde kopuk
//   3. Ufukta gunes / ay diski
//   4. Samandiralar
//   5. Gece bloguna ayri kimlik (suda yildiz parildamasi)
//
// KAYDIRMA FORMULU - bir kez burada, hepsi ayni sekilde:
// Bir dunya ozelligi kameraya YAKLASIR, yani kamera-goreli z'si buyur.
// Ozelligin dunya istasyonu X = z + t*HIZ. Bicim fonksiyonu X ile
// beslenirse desen guverteyle birlikte akar. f(z) ile beslenirse desen
// kamerada CIVILENIR - ilk denemede o hata yapildi.

// Guverte yari genisligi: TABAN 3,5 (YOL_GEN/2) ve ASLA altina inmez.
// Nota koridoru orada; daraltmak oynanisi bozar. Cesitleme yalnizca
// DISARI dogru: referanstaki "dar gecit" bizde taban genislik, "genis
// guverte" ve "yuvarlak platform" onun uzerine eklenen onluk.
function denizOnlukGen(X){
  // Uc katman: yavas nefes + orta dalga + seyrek yuvarlak sisme.
  const nefes = 0.5 + 0.5 * Math.sin(X * 0.0165);
  const orta  = 0.5 + 0.5 * Math.sin(X * 0.0410 + 1.7);
  let g = 2.30 * nefes * (0.45 + 0.55 * orta);
  // Yuvarlak platform: 210 birimde bir (14 sn) genis bir sisme.
  const p = ((X % 210) + 210) % 210 - 105;
  g += 3.05 * Math.exp(-(p * p) / (2 * 17 * 17));
  // Dar gecit: onluk sifira iniyor, iki yani dogrudan su.
  const q = ((X % 330) + 330) % 330 - 165;
  g *= 1.0 - 0.95 * Math.exp(-(q * q) / (2 * 20 * 20));
  return Math.max(0.0, g);
}

// ==================================================== DENIZ YAPILARI
// 5 Eyl 2026. Kullanici: "mekani doldur iyice canli renklerle farkli
// yapilar yap denizin iki kenarina da".
// Denizin iki yaninda, suyun icinde duran yapilar. Bes ayri arketip
// donusumlu geliyor - tek bicim tekrarlayinca duvar kagidina donuyor.
//
// UC KURAL:
//   1. KIRMIZI YOK. O renk yalnizca engelin; mekanda baska hicbir yerde
//      gecmiyor (referans olcumu, REFERANS-15-VIDEO-NOTLARI.md madde 5).
//   2. Oyun koridoruna girmiyorlar: en yakin yapi x=16'da, guverte yari
//      genisligi 3,5 + onluk en fazla ~5,3. Kadrajin kenarinda kaliyorlar.
//   3. Neon yuzeyler MeshBasicMaterial - isik almiyorlar, yani gece
//      blogunda da ayni parlaklikta duruyorlar. Kendi isigi olan seyler.
const DENIZ_RENK = ['#22e0ff','#ff2fb0','#b6ff3c','#8b3cff',
                    '#ffc93c','#00ffc8','#ff5ec4','#3ad1ff'];
let yapiKok = null;
{
  yapiKok = new THREE.Group();
  yapiKok.visible = false;
  // Yan dunya ilk turda 16 yapida seyrek kaldi; deniz sadece bir zemin
  // gibi okunuyordu. 26 yapilik daha sik bir ritim, ama farkli uzaklik ve
  // olcekle "cit" etkisine dusmeden iki yakayi yasatiyor.
  const YAPI_SAY = 34, YAPI_ARA = 23.0;
  yapiKok.userData = { ARA: YAPI_ARA, KAP: YAPI_ARA * YAPI_SAY };
  const rnd = (n) => { const x = Math.sin(n * 57.31) * 43758.5453; return x - Math.floor(x); };
  const KUTU = new THREE.BoxGeometry(1, 1, 1);
  const govdeM = new THREE.MeshLambertMaterial({ color:'#141a3c', fog:true });
  // Gece bloklarinda (159 sn) koyu gokte uzak yapilar eriyordu. Govde
  // rengi ortama gore aciliyor - sayi artirmak yerine okunurlugu artiran
  // cozum bu. Malzeme butun yapilarda ORTAK, tek yerden ayarlaniyor.
  const YAPI_GOVDE_GUN = new THREE.Color('#141a3c');
  const YAPI_GOVDE_GECE = new THREE.Color('#39468f');
  // userData YUKARIDA kuruluyor ama govdeM burada tanimlaniyor; oraya
  // dogrudan yazinca 'temporal dead zone' hatasi aliniyor ve sayfa hic
  // acilmiyordu (window.HAZIR gelmedi, render zaman asimina ugradi).
  Object.assign(yapiKok.userData,
    { govde: govdeM, gun: YAPI_GOVDE_GUN, gece: YAPI_GOVDE_GECE });

  for (let i = 0; i < YAPI_SAY; i++) {
    const g = new THREE.Group();
    const tip = i % 5;
    const r1 = DENIZ_RENK[Math.floor(rnd(i + 3) * DENIZ_RENK.length)];
    const r2 = DENIZ_RENK[Math.floor(rnd(i + 91) * DENIZ_RENK.length)];
    const neon1 = new THREE.MeshBasicMaterial({ color:r1, fog:true });
    const neon2 = new THREE.MeshBasicMaterial({ color:r2, fog:true });
    const ek = (m) => { m.castShadow = false; g.add(m); return m; };

    if (tip === 0) {
      // KULE: uzun govde + uc neon halka. Dikey vurgu, ufku deler.
      const h = 14 + rnd(i + 7) * 10;
      const gov = ek(new THREE.Mesh(KUTU, govdeM));
      gov.scale.set(2.2, h, 2.2); gov.position.y = h / 2;
      for (let k = 0; k < 3; k++) {
        const hl = ek(new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.22, 8, 22), neon1));
        hl.rotation.x = Math.PI / 2;
        hl.position.y = h * (0.34 + k * 0.22);
      }
      const tepe = ek(new THREE.Mesh(KUTU, neon2));
      tepe.scale.set(3.0, 0.5, 3.0); tepe.position.y = h + 0.3;
    } else if (tip === 1) {
      // ISKELE: ayaklar uzerinde platform, kenari neon serit.
      const h = 5 + rnd(i + 11) * 4, en = 9 + rnd(i + 23) * 7;
      for (const yn of [-1, 1]) {
        const ay = ek(new THREE.Mesh(KUTU, govdeM));
        ay.scale.set(1.1, h, 1.1); ay.position.set(yn * en * 0.36, h / 2, 0);
      }
      const dek = ek(new THREE.Mesh(KUTU, govdeM));
      dek.scale.set(en, 1.0, 7.0); dek.position.y = h + 0.5;
      const ser = ek(new THREE.Mesh(KUTU, neon1));
      ser.scale.set(en + 0.4, 0.28, 7.4); ser.position.y = h + 1.1;
      const kule = ek(new THREE.Mesh(KUTU, neon2));
      kule.scale.set(1.6, 4.2, 1.6); kule.position.set(en * 0.28, h + 3.2, 0);
    } else if (tip === 2) {
      // YELKEN: uc kanat, farkli boyda. Yatay kutlelerin arasinda dikey
      // ve KESKIN bir siluet - hepsi kutu olunca kare tek dile dusuyor.
      for (let k = 0; k < 3; k++) {
        const h = 7 + rnd(i * 5 + k) * 11;
        const y = ek(new THREE.Mesh(new THREE.ConeGeometry(2.6, h, 3), k === 1 ? neon1 : neon2));
        y.position.set((k - 1) * 4.4, h / 2, (k - 1) * 2.2);
        y.rotation.y = rnd(i + k * 13) * 3.1;
      }
    } else if (tip === 3) {
      // YIGIN: ust uste kaymis renkli kutular. En "dolu" arketip,
      // seyrek gelmeli - bes tipten biri.
      let y = 0;
      for (let k = 0; k < 4; k++) {
        const h = 2.4 + rnd(i + k * 31) * 3.4;
        const en = 7.5 - k * 1.3;
        const kt = ek(new THREE.Mesh(KUTU,
          k % 2 ? neon1 : new THREE.MeshLambertMaterial({ color:r2, fog:true })));
        kt.scale.set(en, h, en * 0.8);
        kt.position.set((rnd(i + k * 7) - 0.5) * 2.4, y + h / 2, (rnd(i + k * 17) - 0.5) * 2.0);
        y += h;
      }
    } else {
      // KEMER: suyun uzerinden gecen yarim halka. Yatay acikligi olan tek
      // arketip - digerleri hep dikey kutle.
      // Kemer ilk denemede R=7..12 idi ve en yakin yapiyla birlesince
      // kadrajin ustunden gecen basibos bir egri gibi okunuyordu.
      // Kucultuldu; kemer artik suyun uzerinde duran bir yapi.
      const R = 4.2 + rnd(i + 41) * 2.6;
      const km = ek(new THREE.Mesh(
        new THREE.TorusGeometry(R, 0.55, 8, 26, Math.PI), neon1));
      km.position.y = 0.2;
      for (const yn of [-1, 1]) {
        const ay = ek(new THREE.Mesh(KUTU, govdeM));
        ay.scale.set(1.3, 2.0, 1.3); ay.position.set(yn * R, 1.0, 0);
      }
    }
    g.userData = { i, yon: (i % 2 ? 1 : -1) };
    yapiKok.add(g);
  }
  scene.add(yapiKok);
}


// Holografik engel dokusu: yatay tarama cizgileri (yayin taramasi hissi)
// + capraz tehlike seritleri. Alfa kanali sayesinde panel SAYDAM kaliyor,
// arkasindaki mekan goruluyor - kati levha okumasini kiran sey bu.
// Perde dokusu: saydam zeminde parlak cubuk dizisi. Cubugun cekirdegi
// beyaz, kenari magenta - mekanin paletinden ama dekorda olmayan bir
// parlaklikta. 'yatay' true ise cubuklar yatay (duck/hop), degilse dikey
// (step/dodge).
const SEHIR_PERDE = {};
function sehirPerdeDoku(yatay){
  const anahtar = yatay ? 'y' : 'd';
  if (SEHIR_PERDE[anahtar]) return SEHIR_PERDE[anahtar];
  const G = 256, Y = 256;
  const c = document.createElement('canvas'); c.width = G; c.height = Y;
  const g = c.getContext('2d');
  g.clearRect(0, 0, G, Y);
  // Kapak cizgileri: perdenin basladigi ve bittigi yeri okutuyor. Direk
  // degil, cizgi - cit siluetine geri donmemek icin dikey tasiyici yok.
  const kapak = (u, kal) => {
    g.fillStyle = 'rgba(255,245,255,0.95)';
    if (yatay) g.fillRect(0, u, G, kal); else g.fillRect(u, 0, kal, Y);
  };
  const cubuk = (u) => {
    // her cubuk: magenta hale + beyaz cekirdek
    const gr = yatay ? g.createLinearGradient(0, u - 11, 0, u + 11)
                     : g.createLinearGradient(u - 11, 0, u + 11, 0);
    gr.addColorStop(0.00, 'rgba(255,47,176,0)');
    gr.addColorStop(0.22, 'rgba(255,47,176,0.90)');
    gr.addColorStop(0.44, 'rgba(255,240,252,1.0)');
    gr.addColorStop(0.56, 'rgba(255,240,252,1.0)');
    gr.addColorStop(0.78, 'rgba(255,47,176,0.90)');
    gr.addColorStop(1.00, 'rgba(255,47,176,0)');
    g.fillStyle = gr;
    if (yatay) g.fillRect(0, u - 13, G, 26); else g.fillRect(u - 13, 0, 26, Y);
  };
  // 52 -> 34: perde siklasti, bosluk artik "delik" degil "gecit" okunuyor.
  for (let u = 17; u < (yatay ? Y : G); u += 34) cubuk(u);
  kapak(0, 6); kapak((yatay ? Y : G) - 6, 6);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  SEHIR_PERDE[anahtar] = t;
  return t;
}

let SEHIR_HOLO_DOKU = null;
function sehirHoloDoku(){
  if (SEHIR_HOLO_DOKU) return SEHIR_HOLO_DOKU;
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 128);
  // capraz tehlike seritleri - saydam zeminde
  g.save(); g.globalAlpha = 0.5;
  g.strokeStyle = '#ff7a3a'; g.lineWidth = 13;
  for (let x = -128; x < 384; x += 34) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 128, 128); g.stroke();
  }
  g.restore();
  // yatay tarama cizgileri: ince, parlak, sik
  g.globalAlpha = 0.9; g.fillStyle = '#ffb27a';
  for (let y = 0; y < 128; y += 6) g.fillRect(0, y, 256, 2);
  // ust ve alt kenar: panelin sinirini okutan parlak seritler
  g.globalAlpha = 1; g.fillStyle = '#fff0e0';
  g.fillRect(0, 0, 256, 5); g.fillRect(0, 123, 256, 5);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  SEHIR_HOLO_DOKU = t;
  return t;
}

// ==================================================== SEHIR KOPRUSU MEKANI (11 Eyl 2026)
// Referans: kullanicinin verdigi gorsel, 07-mekan/sehir-kopru/referans.png
// (1672x941). Mekan REFERANSTAN KURULDU - mevcut bir sahne boyanmadi
// (kural: referansa-gore-mekan).
//
// Referansta olculen (Python, tum kare):
//   V medyan 0,431 | S medyan 0,667 | S>0,5 %77 | siyah %2
//   ton: mavi %33, mor %31, magenta %16, pembe-kirmizi %10, turuncu %6,
//        cyan %4 (alani kucuk, gorsel agirligi buyuk: serit cizgileri)
//   kacis noktasi x %48 (tam orta), ufuk parlamasi y %53
//   bolge parlakligi: tavan 0,35 / orta 0,49 / zemin 0,47 - zemin
//   KARANLIK DEGIL, yansimalarla dolu.
//
// YAPI - VAR:
//   * ustu ORTULU kopru koridoru: tavanda celik kiris izgarasi, tavan
//     panellerinde ince neon cubuklar (mor/cyan) + sicak spot lambalar
//   * iki yanda ritmik kalin kolonlar, ic yuzlerinde dikey neon tup
//   * kolonlar arasi BUYUK CAM -> arkasinda gece sehri, palmiyeler
//   * iki yanda korkuluk, ustunde yatay neon serit (magenta/turuncu)
//   * ISLAK, YANSIMALI zemin - neonlarin uzun dikey yansimalari. Karenin
//     en karakteristik ogesi bu.
//   * zeminde cyan isikli cizgiler: iki dis cizgi SUREKLI, iki ic cizgi
//     KESIKLI -> 4 cizgi = 3 serit. Bizim 3 serit koridorumuzla birebir.
//   * kacis noktasinda acik cikis: gokdelenler, neon panolar, kivrimli
//     yukseltilmis yol, ufukta magenta parlama
// YAPI - YOK:
//   acik gok tepede (tavan var), gunes, bulut, deniz, ucusan cisim.
//   Kirmizi yok denecek kadar az - o renk bizde ENGELIN; neonlarda

const SEHIR = {
  ZEMIN_YG: 5.6,     // zemin yari genisligi (korkuluga kadar)
  KORKULUK_X: 5.5,
  KOLON_X: 6.25,
  CAM_X: 6.45,
  TAVAN_Y: 9.2,

  SAY: 34,           // 34 x 7 = 238 birim - kamera onunu kapliyor
  // Cati ucu (sabit portal). Olculdu: referansta aciklik kadrajin ~%25 x %28'i;
  // 12,9 x 9,2 birimlik koridor icin bu kameradan ~36-40 birim demek.
  // Kamera z=10,8 -> portal z=-28 (38,8 birim). Notalar -26'da doguyor:
  // portalin hemen onunde, isigin icinden cikiyorlar.
  KES: -28,

SEHIR.KAP = SEHIR.ADIM * SEHIR.SAY;

let sehirKok = null, sehirZeminMat = null, sehirIM = null, sehirUcMat = null;
let sehirYanMat = [], sehirCamMat = null, sehirPalmiye = null, sehirParlama = null;

// Deterministik cizim: ayni tohum ayni sehri verir; render her calistirmada
// ayni kareyi uretmeli.
function sehirSilueti(G, Y, tohum, ufukOran){
  const c = document.createElement('canvas'); c.width = G; c.height = Y;
  const g = c.getContext('2d');
  let s = tohum;
  const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const uy = Y * ufukOran;
  // gok: derin lacivert -> mor -> ufukta magenta parlama -> ince sicak bant
  const gr = g.createLinearGradient(0, 0, 0, Y);
  // v4: v3'te cikista dokunun USTU gorunuyordu ve orasi koyu lacivertti
  // (olculen merkez RGB ~7,0,51). Referansin cikis goku parlak mavi-mor,
  // ufka dogru sicak pembe, ufukta beyaza yakin.
  gr.addColorStop(0.00, '#1a1466');
  gr.addColorStop(0.30, '#3b2a9e');
  gr.addColorStop(ufukOran * 0.80, '#8a4be0');
  gr.addColorStop(ufukOran * 0.95, '#ff6fd0');
  gr.addColorStop(ufukOran, '#ffd0f0');
  gr.addColorStop(Math.min(1, ufukOran + 0.04), '#ffb46b');
  gr.addColorStop(1.00, '#2a1650');
  g.fillStyle = gr; g.fillRect(0, 0, G, Y);
  // merkez parlamasi: ufuk ortasinda genis, yumusak
  const rp = g.createRadialGradient(G / 2, uy, 0, G / 2, uy, G * 0.35);
  rp.addColorStop(0.0, 'rgba(255,230,250,0.9)');
  rp.addColorStop(0.35, 'rgba(255,120,210,0.45)');
  rp.addColorStop(1.0, 'rgba(255,120,210,0)');
  g.fillStyle = rp; g.fillRect(0, 0, G, Y);
  for (let k = 0; k < 140; k++) {                 // yildiz
    g.fillStyle = `rgba(255,255,255,${0.25 + r() * 0.6})`;
    g.fillRect(r() * G, r() * uy * 0.55, 1.6, 1.6);
  }
  const PENCERE = ['#7ae8ff', '#ff7ad0', '#ffc36b', '#b58cff'];
  const PANO = ['#ff2fb0', '#22e0ff', '#b6ff3c', '#8b3cff', '#ff8a2a'];
  const kule = (x, w, h, govde, isik) => {
    g.fillStyle = govde; g.fillRect(x, uy - h, w, h);
    // pencere izgarasi: seyrek yanik
    for (let yy = uy - h + 6; yy < uy - 4; yy += 7)
      for (let xx = x + 3; xx < x + w - 3; xx += 6)
        if (r() < isik) {
          g.fillStyle = PENCERE[Math.floor(r() * PENCERE.length)];
          g.globalAlpha = 0.8 + r() * 0.2;
          g.fillRect(xx, yy, 3.4, 3);
          g.globalAlpha = 1;
        }
    // tepe isigi
    g.fillStyle = PENCERE[Math.floor(r() * PENCERE.length)];
    g.fillRect(x + w * 0.2, uy - h - 3, w * 0.6, 3);
  };
  // uzak sira: alcak, soluk mor
  for (let x = -20; x < G; x += 22 + r() * 30)
    kule(x, 26 + r() * 40, Y * (0.10 + r() * 0.18), '#3a2c7a', 0.36);
  // yukseltilmis yol: ufkun hemen ustunde kivrilan bant + sicak lambalar
  g.strokeStyle = '#1b1238'; g.lineWidth = Y * 0.018;
  g.beginPath();
  for (let x = 0; x <= G; x += 8) {
    const yy = uy - Y * 0.06 - Math.sin(x / G * Math.PI * 1.3 + tohum) * Y * 0.05;
    x === 0 ? g.moveTo(x, yy) : g.lineTo(x, yy);
  }
  g.stroke();
  for (let x = 0; x <= G; x += 18) {
    const yy = uy - Y * 0.06 - Math.sin(x / G * Math.PI * 1.3 + tohum) * Y * 0.05;
    g.fillStyle = '#ffb35a'; g.fillRect(x, yy - Y * 0.012, 3, 3);
  }
  // yakin sira: yuksek, koyu, bol pencere, neon panolu
  for (let x = -30; x < G; x += 40 + r() * 70) {
    const w = 38 + r() * 60, h = Y * (0.22 + r() * 0.42);
    kule(x, w, h, '#221a58', 0.60);
    if (r() < 0.70) {                              // dikey neon pano
      const pc = PANO[Math.floor(r() * PANO.length)];
      const pw = w * 0.42, ph = h * (0.18 + r() * 0.2);
      const px = x + (w - pw) / 2, py = uy - h + h * (0.12 + r() * 0.3);
      g.fillStyle = pc; g.globalAlpha = 0.85; g.fillRect(px, py, pw, ph);
      g.globalAlpha = 1; g.strokeStyle = '#ffffff'; g.lineWidth = 1.5;
      g.strokeRect(px + 3, py + 3, pw - 6, ph - 6);
    }
  }
  // palmiye siluetleri: ufuk hattinda
  const palmiye = (x, h) => {
    g.strokeStyle = '#120c26'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x, uy); g.quadraticCurveTo(x + 6, uy - h * 0.5, x + 3, uy - h); g.stroke();
    g.fillStyle = '#120c26';
    for (let k = 0; k < 7; k++) {
      const a = -Math.PI / 2 + (k - 3) * 0.42;
      g.beginPath(); g.moveTo(x + 3, uy - h);
      g.quadraticCurveTo(x + 3 + Math.cos(a) * h * 0.35, uy - h + Math.sin(a) * h * 0.18 - 6,
                         x + 3 + Math.cos(a) * h * 0.5, uy - h + h * 0.18);
      g.lineTo(x + 3 + Math.cos(a) * h * 0.46, uy - h + h * 0.2);
      g.fill();
    }
  };
  for (let k = 0; k < 14; k++) palmiye(r() * G, Y * (0.07 + r() * 0.06));
  // Kulelerin USTUNE eklemeli parlama: referansta cikisin merkezi beyaza
  // yakin yaniyor, kuleler o isigin icinde eriyor.
  g.globalCompositeOperation = 'lighter';
  const rp2 = g.createRadialGradient(G / 2, uy, 0, G / 2, uy, G * 0.18);
  rp2.addColorStop(0.0, 'rgba(255,200,240,0.55)');
  rp2.addColorStop(1.0, 'rgba(255,200,240,0)');
  g.fillStyle = rp2; g.fillRect(0, 0, G, Y);
  g.globalCompositeOperation = 'source-over';
  // ufuk alti: koyu, sicak isik yansimasi
  const alt = g.createLinearGradient(0, uy, 0, Y);
  alt.addColorStop(0, 'rgba(255,120,200,0.55)');
  alt.addColorStop(0.3, 'rgba(60,20,110,0.9)');
  alt.addColorStop(1, 'rgba(14,8,40,1)');
  g.fillStyle = alt; g.fillRect(0, uy, G, Y - uy);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

{
  sehirKok = new THREE.Group();

  sehirZeminMat = new THREE.ShaderMaterial({

      uN1:     { value: new THREE.Color('#ff2fb0') },   // korkuluk A / kolon
      uN2:     { value: new THREE.Color('#ff8a2a') },   // korkuluk B (sicak)
      uN3:     { value: new THREE.Color('#8b3cff') },   // kolon tupu
      uUfuk:   { value: new THREE.Color('#ff7ad0') },   // cikis parlamasi

      uYansima:{ value: 1.0 },
      uMavi:   { value: new THREE.Color('#3a6bff') },   // mavi pencere yansimasi
    },
    vertexShader: [
      'varying vec3 vW;',
      'void main(){',
      '  vW = (modelMatrix * vec4(position,1.0)).xyz;',
      '  gl_Position = projectionMatrix * viewMatrix * vec4(vW,1.0);',

      'precision highp float;',

      'uniform float uKay,uT,uYansima;',
      'uniform vec3 uTaban,uSerit,uN1,uN2,uN3,uUfuk,uSis,uMavi;',
      'float h11(float n){ return fract(sin(n*127.1)*43758.5453); }',
      'float gur(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
      '  float a=h11(i.x+i.y*57.0), b=h11(i.x+1.0+i.y*57.0);',
      '  float c=h11(i.x+(i.y+1.0)*57.0), d=h11(i.x+1.0+(i.y+1.0)*57.0);',
      '  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }',
      'float bant(float x, float m, float w){ return exp(-pow((x-m)/w,2.0)); }',
      'void main(){',
      '  float X = vW.z + uKay;',                              // dunya istasyonu
      '  float d = clamp((-vW.z)/210.0, 0.0, 1.0);',
      '  vec3 c = uTaban;',

      '  vec2 k = vec2(vW.x, X) / 2.0;',
      '  vec2 kf = abs(fract(k) - 0.5);',
      '  float derz = smoothstep(0.47, 0.5, max(kf.x, kf.y));',
      '  c += vec3(0.05,0.055,0.09) * derz * (1.0 - d);',
      // islaklik: bazi karolar daha parlak (su birikintisi), yansima orada guclu
      '  float isl = 0.55 + 0.45 * gur(vec2(vW.x*0.55, X*0.22));',
      // yansima bantlari: kaynak x konumlari. z boyunca kirilma = uzun cizgiler
      // Ilk surumde bantlar genis ve kesintisizdi: zemin islak degil, cizgili
      // hali gibi okunuyordu; magenta da fazlaydi (olculen %37, referans %16).
      // Bantlar incildi, kirilma kontrasti artti, z frekansi dustu -> uzun,
      // kopuk dikey izler. Mavi pencere yansimasi eklendi (referansta mavi %33).
      '  float kir  = smoothstep(0.30, 0.85, gur(vec2(vW.x*3.4, X*0.35)));',
      '  float kir2 = smoothstep(0.25, 0.85, gur(vec2(vW.x*2.6 + 7.0, X*0.22)));',
      '  vec3 y = vec3(0.0);',
      '  float ax = abs(vW.x);',
      '  y += uN1 * bant(ax, 5.05, 0.24) * kir * 0.85;',
      '  y += uN2 * bant(ax, 4.45, 0.22) * kir2;',
      '  y += uN3 * bant(ax, 3.85, 0.28) * kir;',
      '  y += uMavi * bant(ax, 2.55, 0.40) * kir2 * 0.75;',
      '  y += uN3 * bant(vW.x, -1.45, 0.38) * kir * 0.5;',
      '  y += uN2 * bant(vW.x,  1.65, 0.36) * kir2 * 0.45;',
      '  y += uUfuk * bant(vW.x, 0.0, 1.0) * (0.35 + 0.65*d) * kir2 * 0.9;',
      '  c += y * isl * uYansima * (0.30 + 0.70*(1.0 - d*0.6));',
      // serit cizgileri: 3 serit -> 4 cizgi. Dis cizgiler SUREKLI (x=+-3,3),
      // ic cizgiler KESIKLI (x=+-1,1). Referansta birebir boyle.
      '  float dis = bant(ax, 3.3, 0.085);',
      '  float kes = step(0.42, fract(X / 5.0));',
      '  float ic  = bant(ax, 1.1, 0.075) * kes;',
      '  float hale = bant(ax, 3.3, 0.45) * 0.35 + bant(ax, 1.1, 0.35) * kes * 0.25;',
      '  c += uSerit * (dis + ic) * 1.25 + uSerit * hale;',
      // uzakta sise karis

      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n'),
    fog: false,
  });

      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc), transparent: true,
        depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
    sehirParlama.position.set(0, 5.5, -185);
    sehirKok.add(sehirParlama);
  }

  // --- PALMIYE: camin otesinde, sicak yukari isikli. Referansta hem sol
  // hem sag camin arkasinda, turuncu-sari aydinlatilmis yapraklar.
  sehirPalmiye = new THREE.Group();
  const govdeP = new THREE.MeshLambertMaterial({ color:'#5b3a2c', fog:true });
  const yaprakP = new THREE.MeshBasicMaterial({ color:'#ffc05a', fog:true });
  const yaprakK = new THREE.MeshBasicMaterial({ color:'#3fa060', fog:true });
  const PALM_SAY = 16;
  for (let i = 0; i < PALM_SAY; i++) {
    const g = new THREE.Group();
    const h = 6.4 + (i % 3) * 1.3;
    const gov = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, h, 6), govdeP);
    gov.position.y = h / 2; g.add(gov);
    for (let k = 0; k < 8; k++) {
      const y = new THREE.Mesh(new THREE.ConeGeometry(0.42, 3.8, 4), k % 2 ? yaprakP : yaprakK);
      y.position.set(0, h, 0);
      y.rotation.set(0, k * Math.PI / 4, 1.95);   // disa ve asagi sarkan yaprak
      y.translateY(1.7);
      g.add(y);
    }
    g.userData = { i, yon: i % 2 ? 1 : -1, x: 7.3 + (i % 4) * 1.4 };
    sehirPalmiye.add(g);
  }
  sehirPalmiye.userData = { ARA: 14.5, KAP: 14.5 * PALM_SAY };
  sehirKok.add(sehirPalmiye);
}

// Her kare: kaydirma + ortam rengi. sehirMod kapaliyken hic calismaz.
function sehirGuncelle(t, O0, O1, yumusak, karistir){
  const { ADIM, SAY, KAP, KOLON_X, KORKULUK_X, TAVAN_Y, CAM_X } = SEHIR;
  const P = t * HIZ;
  const U = sehirZeminMat.uniforms;
  U.uKay.value = P; U.uT.value = t;
  const renk = (a, v) => karistir(O0[a] || v, O1[a] || v);
  U.uN1.value.copy(renk('neon1', '#ff2fb0'));
  U.uN2.value.copy(renk('neon2', '#ff8a2a'));
  U.uN3.value.copy(renk('neon3', '#8b3cff'));
  U.uSerit.value.copy(renk('serit', '#2ee6ff'));
  U.uUfuk.value.copy(renk('ufukIsik', '#ff7ad0'));
  U.uMavi.value.copy(renk('neon4', '#3a6bff'));
  U.uSis.value.copy(renk('gok', '#0b0a2a'));
  const M = sehirIM.mat;
  M.neonA.color.copy(renk('neon1', '#ff2fb0'));
  M.neonB.color.copy(renk('neon3', '#8b3cff'));
  M.korA.color.copy(renk('neon1', '#ff2fb0'));
  M.korB.color.copy(renk('neon2', '#ff8a2a'));
  M.tavA.color.copy(renk('tavan1', '#b04dff'));
  M.tavB.color.copy(renk('tavan2', '#22e0ff'));
  const ton = renk('sehirTon', '#ffffff');
  sehirParlama.material.color.copy(renk('ufukIsik', '#ff7ad0')).lerp(new THREE.Color('#ffffff'), 0.5);
  sehirUcMat.color.copy(ton);
  for (const m of sehirYanMat) {
    m.color.copy(ton);
    m.map.offset.x = (P * 0.35 / 330) % 1;       // paralaks: yapidan yavas
  }

  const Mx = new THREE.Matrix4(), V = new THREE.Vector3(),
        Q = new THREE.Quaternion(), S = new THREE.Vector3();
  const koy = (imesh, idx, x, y, z, sx, sy, sz) => {
    V.set(x, y, z); S.set(sx, sy, sz); Mx.compose(V, Q, S); imesh.setMatrixAt(idx, Mx);
  };
  const I = sehirIM;
  let ia = 0, ib = 0, ta = 0, tb = 0, ka = 0, kb = 0;
  for (let i = 0; i < SAY; i++) {
    const z = Z_VURUS + 8 - KAP + ((i * ADIM + P) % KAP);
    // istasyon tabanli tek/cift: desen guverteyle birlikte akar
    const n = Math.round((z + P) / ADIM);
    const cift = (n & 1) === 0;
    // ORTULU / ACIK: referansta cati kameraya YAKIN bitiyor, otesi acik
    // yurume yolu + sehir. Sonsuz kosuda karsiligi donusumlu bolum:
    // 10 bay ortulu (70 birim, 4,7 sn), 4 bay acik (28 birim, 1,9 sn).
    // Ilk surumde cati 238 birim kesintisizdi; cikis kadrajda igne deligi
    // kadar pembe bir kareye donuyordu, sehir hic gorunmuyordu.
    // CATI KESIMI (v3): v2'de acik araligin arkasindan bir sonraki ortulu
    // bolum geliyor ve kacis noktasini yine igne deligine ceviriyordu.
    // Referansin imzasi tam tersi: cati YAKINDA bitiyor, otesi buyuk ve
    // parlak sehir. Cati/kolon/cam artik yalnizca z > -92'de (kameradan
    // ~100 birim); otesi korkuluklu acik yol, lambalar ufka kadar gidiyor.
    // Kesme noktasinda bir anda belirmesinler diye yapi zeminin ALTINDAN
    // yukseliyor (k: -92'de 0, -72'de 1) - zemin opak, alti gorunmuyor.
    // v6 - CATI UCU SABIT PORTAL. Olculdu: v5'te cati 92 birimde bitiyordu
    // ve cikis kadrajin yalnizca ~%10 x %9'unu kapliyordu (merkez V her
    // karede 0,125). Referansta aciklik ~%25 x %28 -> cati ~38 birimde
    // bitmeli. Ama bay'ler 7 birimde bir eklenince cati ucu o mesafede %20
    // titriyordu. Cati ucu artik sabit portal (SEHIR.KES); bay'ler oraya
    // kadar KIRPILIYOR - portal tarafindaki bay kismi boyla ciziliyor.
    const KES = SEHIR.KES;
    const zb = z - ADIM / 2;
    const yok = (imesh, idx) => koy(imesh, idx, 0, -99, 0, 1e-4, 1e-4, 1e-4);
    const zUzak = Math.max(z - ADIM, KES);               // bay'in portal tarafi
    const L = z - zUzak;                                  // kirpilmis bay boyu
    const zc = z - L / 2;                                 // kirpilmis bay ortasi
    if (z > KES + 0.3) {
      koy(I.kolon, i * 2,     -KOLON_X, TAVAN_Y / 2, z, 0.95, TAVAN_Y, 0.95);
      koy(I.kolon, i * 2 + 1,  KOLON_X, TAVAN_Y / 2, z, 0.95, TAVAN_Y, 0.95);
      for (const yon of [-1, 1]) {
        if (cift) koy(I.tupA, ia++, yon * (KOLON_X - 0.52), TAVAN_Y * 0.52, z, 0.14, TAVAN_Y * 0.62, 0.22);
        else      koy(I.tupB, ib++, yon * (KOLON_X - 0.52), TAVAN_Y * 0.52, z, 0.14, TAVAN_Y * 0.62, 0.22);
      }
      koy(I.kiris, i, 0, TAVAN_Y - 0.05, z, KOLON_X * 2 + 0.6, 0.55, 0.55);
    } else {
      yok(I.kolon, i * 2); yok(I.kolon, i * 2 + 1); yok(I.kiris, i);
    }
    if (L > 0.05) {
      // ORTULU (tamami ya da portala kadar kirpilmis kismi)
      if (zb > KES) {
        const tv = cift ? I.tavA : I.tavB;
        koy(tv, cift ? ta++ : tb++, cift ? -1.3 : 1.3, TAVAN_Y - 0.28, zb, 2.6, 0.07, 0.22);
      }
      const s1 = z - ADIM * 0.25, s2 = z - ADIM * 0.75;
      if (s1 > KES) koy(I.spot, i * 2, -3.6, TAVAN_Y - 0.32, s1, 0.32, 0.12, 0.32); else yok(I.spot, i * 2);
      if (s2 > KES) koy(I.spot, i * 2 + 1, 3.6, TAVAN_Y - 0.32, s2, 0.32, 0.12, 0.32); else yok(I.spot, i * 2 + 1);
      koy(I.mull, i * 2,     -(KOLON_X + 0.12), 4.6, zc, 0.12, 0.14, L);
      koy(I.mull, i * 2 + 1,  (KOLON_X + 0.12), 4.6, zc, 0.12, 0.14, L);
      koy(I.tavanP, i, 0, TAVAN_Y + 0.35, zc, KOLON_X * 2 + 1, 0.12, L + 0.02);
      koy(I.tRay, i * 4,     -(KOLON_X - 0.2), TAVAN_Y - 0.2,  zc, 0.7, 0.35, L + 0.02);
      koy(I.tRay, i * 4 + 1,  (KOLON_X - 0.2), TAVAN_Y - 0.2,  zc, 0.7, 0.35, L + 0.02);
      koy(I.tRay, i * 4 + 2, -2.6,             TAVAN_Y + 0.05, zc, 0.5, 0.3,  L + 0.02);
      koy(I.tRay, i * 4 + 3,  2.6,             TAVAN_Y + 0.05, zc, 0.5, 0.3,  L + 0.02);
      koy(I.cam, i * 2,     -CAM_X, (TAVAN_Y + 0.6) / 2, zc, 0.02, TAVAN_Y - 0.6, L);
      koy(I.cam, i * 2 + 1,  CAM_X, (TAVAN_Y + 0.6) / 2, zc, 0.02, TAVAN_Y - 0.6, L);
      for (const q of [0, 1]) { yok(I.lambaD, i * 2 + q); yok(I.lambaB, i * 2 + q); }
    } else {
      // ACIK YOL: portalin otesi. Korkuluk + sokak lambalari ufka kadar.
      for (const m2 of [I.spot, I.mull, I.cam]) { yok(m2, i * 2); yok(m2, i * 2 + 1); }
      yok(I.tavanP, i);
      for (let q = 0; q < 4; q++) yok(I.tRay, i * 4 + q);
      koy(I.lambaD, i * 2,     -(KORKULUK_X - 0.35), 3.2,  zb, 0.12, 6.4,  0.12);
      koy(I.lambaD, i * 2 + 1,  (KORKULUK_X - 0.35), 3.2,  zb, 0.12, 6.4,  0.12);
      koy(I.lambaB, i * 2,     -(KORKULUK_X - 0.75), 6.35, zb, 0.9,  0.16, 0.36);
      koy(I.lambaB, i * 2 + 1,  (KORKULUK_X - 0.75), 6.35, zb, 0.9,  0.16, 0.36);
    }
    // korkuluk HER bolumde - referansta cati bitince de devam ediyor
    for (let k = 0; k < 2; k++) {
      const zz = z - k * ADIM / 2;
      koy(I.direk, i * 4 + k * 2,     -KORKULUK_X, 0.65, zz, 0.1, 1.3, 0.1);
      koy(I.direk, i * 4 + k * 2 + 1,  KORKULUK_X, 0.65, zz, 0.1, 1.3, 0.1);
    }
    // Iki yanda da neon serit; sol ve sag ters fazda - ayni bayda sol
    // magenta iken sag turuncu. Ayna gibi durunca kare duzlesiyordu.
    for (const yon of [-1, 1]) {
      const a = (yon < 0) === cift;
      if (a) koy(I.korA, ka++, yon * KORKULUK_X, 1.05, zb, 0.1, 0.12, ADIM * 0.92);
      else   koy(I.korB, kb++, yon * KORKULUK_X, 1.05, zb, 0.1, 0.12, ADIM * 0.92);
    }
  }
  // kullanilmayan ornekleri gorunmez kil (sifir olcek)
  const sifirla = (imesh, from) => {
    for (let j = from; j < imesh.count; j++) koy(imesh, j, 0, -99, 0, 0.0001, 0.0001, 0.0001);
  };
  sifirla(I.tupA, ia); sifirla(I.tupB, ib); sifirla(I.tavA, ta); sifirla(I.tavB, tb);
  sifirla(I.korA, ka); sifirla(I.korB, kb);
  for (const k in I) if (I[k].isInstancedMesh) I[k].instanceMatrix.needsUpdate = true;

  // palmiyeler
  const { ARA, KAP: PK } = sehirPalmiye.userData;
  for (const g of sehirPalmiye.children) {
    const z = Z_VURUS + 8 - PK + ((g.userData.i * ARA + P) % PK);
    g.position.set(g.userData.yon * g.userData.x, 0, z);
  }
}

// ==================================================== OBBY LEGO YAPILARI
// Kullanici (5 Eyl 2026): "orta seridin kenarlarina serit boyu ufka dogru
// legolardan yapilar yap rengarenk, yapilar arasinda cok az bosluk olsun".
// Iki sira: YAKIN sira alcak ve sik (serit kenarini ciziyor, hiz hissini
// veren sey o), UZAK sira yuksek ve seyrek (silueti dolduruyor, derinlik
// veriyor). Referansta da kenar bos degil - bosluk birakinca kare renk
// duvarina donuyor.
// Cizim yuku: renk basina TEK InstancedMesh -> 12 draw call, 700+ degil.
let legoKok = null;
{
  legoKok = new THREE.Group();
  legoKok.visible = false;
  const LEGO_RENK = ['#e8342c','#f5b81e','#2a7de1','#3fbf4a',
                     '#e05fc0','#ffffff','#f07020','#25c3c9'];
  const lrnd = (n) => { const x = Math.sin(n * 78.233) * 43758.5453; return x - Math.floor(x); };

  // Lego tugla dokusu: ust yuzde perçin sirasi, yan yuzde ince kenar.
  const lc = document.createElement('canvas'); lc.width = lc.height = 64;
  const lg = lc.getContext('2d');
  lg.fillStyle = '#ffffff'; lg.fillRect(0, 0, 64, 64);
  lg.fillStyle = 'rgba(0,0,0,0.16)'; lg.fillRect(0, 0, 64, 3);
  lg.fillStyle = 'rgba(0,0,0,0.10)'; lg.fillRect(0, 61, 64, 3);
  for (const cx of [16, 48]) {                       // perçinler
    lg.fillStyle = 'rgba(255,255,255,0.55)';
    lg.beginPath(); lg.arc(cx, 12, 7, 0, 6.2832); lg.fill();
    lg.fillStyle = 'rgba(0,0,0,0.14)';
    lg.beginPath(); lg.arc(cx, 15, 7, 0, 6.2832); lg.fill();
  }
  const legoDoku = new THREE.CanvasTexture(lc);

  const KAP = 240;                                   // dongu uzunlugu
  const tuglalar = [];                               // {renk, x, y, z0, sx, sy, sz}
  // --- YAKIN SIRA: serit kenari, alcak, cok az bosluklu
  for (const yon of [-1, 1]) {
    let z = 0, i = 0;
    while (z < KAP) {
      const derin = 2.6 + lrnd(i + yon * 7) * 1.6;   // yapinin z uzunlugu
      const kat   = 1 + Math.floor(lrnd(i + 41) * 2); // 1-2 kat: gok acik kalsin
      const gen   = 2.4 + lrnd(i + 59) * 1.4;
      const x = yon * (4.6 + gen / 2 + lrnd(i + 13) * 0.6);
      for (let k = 0; k < kat; k++)
        tuglalar.push({ r: Math.floor(lrnd(i * 3 + k + 5) * LEGO_RENK.length),
                        x, y: -0.55 + 0.62 + k * 1.24, z0: z + derin / 2,
                        sx: gen, sy: 1.18, sz: derin });
      z += derin + 0.35;                             // COK AZ bosluk
      i++;
    }
  }
  // --- UZAK SIRA: yuksek kuleler, silueti dolduruyor
  for (const yon of [-1, 1]) {
    let z = 0, i = 0;
    while (z < KAP) {
      const derin = 4.0 + lrnd(i + 101 + yon * 3) * 3.0;
      const kat   = 2 + Math.floor(lrnd(i + 131) * 6);  // 2-7 kat
      const gen   = 3.4 + lrnd(i + 149) * 2.6;
      const x = yon * (15.0 + lrnd(i + 167) * 15.0);
      for (let k = 0; k < kat; k++)
        tuglalar.push({ r: Math.floor(lrnd(i * 5 + k + 23) * LEGO_RENK.length),
                        x, y: -0.55 + 0.75 + k * 1.5, z0: z + derin / 2,
                        sx: gen, sy: 1.42, sz: derin });
      z += derin + 0.7;
      i++;
    }
  }

  const kutuGeoL = new THREE.BoxGeometry(1, 1, 1);
  const legoMesh = [];
  for (let r = 0; r < LEGO_RENK.length; r++) {
    const alt = tuglalar.filter(b => b.r === r);
    if (!alt.length) { legoMesh.push(null); continue; }
    const im = new THREE.InstancedMesh(kutuGeoL,
      new THREE.MeshLambertMaterial({ color: LEGO_RENK[r], map: legoDoku, fog: true }),
      alt.length);
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.castShadow = false; im.receiveShadow = false;
    im.userData.tuglalar = alt;
    legoKok.add(im); legoMesh.push(im);
  }
  legoKok.userData = { mesh: legoMesh, KAP };
  scene.add(legoKok);
}

// ================= BAL IPLIKLERI (17 Eyl 2026, MEK-004 ritim ogesi) =================
// Yolun iki yaninda her VURUS araliginda bir iplik; OLCU basi (her dorduncu)
// uzun, digerleri kisa. Hepsi ayni olcu fazinda yukselir, ortasi incelir ve
// OLCU BASINDA koparak coker - saha olcu olcu nefes aliyor. MEK-001 zemin
// cubugu, MEK-002 tavan golgesi, MEK-003 zemin kabarmasi DEGIL: dikey,
// kisa omurlu, sivinin kendisi.
// Fotograf yok: geometri Lathe, parlaklik canvas matcap (bal yuzeyiyle ayni aile).
let balIplikKok = null, balIplikIM = null, balDamlaIM = null, balIplikVeri = [];
const BAL_IPLIK_KAP = 280;
function balIplikKur(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(56, 50, 4, 64, 64, 64);
  r.addColorStop(0.00, '#fff4d2');
  r.addColorStop(0.18, '#ffd27a');
  r.addColorStop(0.55, '#e0922a');
  r.addColorStop(0.85, '#8a4608');
  r.addColorStop(1.00, '#5a2c04');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const mat = new THREE.MeshMatcapMaterial({ matcap: new THREE.CanvasTexture(c),
    transparent: true, opacity: 0.93, fog: true });
  const prof = [];
  for (let i = 0; i <= 16; i++) {
    const u = i / 16;
    prof.push(new THREE.Vector2(0.26 * Math.pow(1 - u, 2.2) + 0.045 * (1 - Math.pow(1 - u, 2)), u));
  }
  const iplikGeo = new THREE.LatheGeometry(prof, 12);
  const damlaGeo = new THREE.SphereGeometry(0.11, 10, 8);
  const ARA = OLCU * HIZ / 4;                      // bir vurus araligi (dunya birimi)
  const N = Math.ceil(BAL_IPLIK_KAP / ARA);
  balIplikKok = new THREE.Group();
  balIplikIM = new THREE.InstancedMesh(iplikGeo, mat, N * 2);
  balDamlaIM = new THREE.InstancedMesh(damlaGeo, mat, N * 2);
  balIplikIM.frustumCulled = false; balDamlaIM.frustumCulled = false;
  balIplikVeri = [];
  for (let k = 0; k < N; k++) {
    for (const yan of [-1, 1]) {
      const h = Math.sin((k + 1) * 12.9898 * (yan + 3)) * 43758.5453;
      const j = h - Math.floor(h);
      balIplikVeri.push({ z0: k * ARA, x: yan * (YOL_GEN / 2 + 1.85 + (j - 0.5) * 0.5), uzun: (k % 4) === 0, j });
    }
  }
  balIplikKok.add(balIplikIM); balIplikKok.add(balDamlaIM);
  balIplikKok.visible = false;
  scene.add(balIplikKok);
}
function balIplikGuncelle(t){
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  const taban = Z_VURUS + 20 - BAL_IPLIK_KAP;
  // faz: 0,80'de kopma -> olcu basina (vurus 1) denk gelsin diye +0,20 kaydirma
  const faz = ((t / OLCU) + 0.20) % 1;
  for (let i = 0; i < balIplikVeri.length; i++) {
    const o = balIplikVeri[i];
    const z = taban + ((o.z0 + t * HIZ) % BAL_IPLIK_KAP);
    const boyMax = o.uzun ? 2.3 : 1.15;
    let boy, gen, dy = -99;
    if (faz < 0.55)      { boy = boyMax * (0.25 + 0.75 * faz / 0.55); gen = 1.0; }
    else if (faz < 0.80) { boy = boyMax; gen = 1.0 - 0.45 * (faz - 0.55) / 0.25; }
    else                 { const k = (faz - 0.80) / 0.20; boy = boyMax * (0.35 * (1 - k) + 0.12); gen = 0.8;
                           dy = boyMax * (1 - k * k) ; }
    q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0.10 * Math.sin(o.j * 6.28 + t * 1.3));
    p.set(o.x, 0, z); sc.set(gen, boy, gen);
    m.compose(p, q, sc); balIplikIM.setMatrixAt(i, m);
    if (dy > -90) { p.set(o.x, dy, z); sc.set(1, 1.25, 1); }
    else { p.set(o.x + 0.02 * Math.sin(t), boy, z); sc.set(0.8 + 0.3 * gen, 0.9, 0.8 + 0.3 * gen); }
    q.identity(); m.compose(p, q, sc); balDamlaIM.setMatrixAt(i, m);
  }
  balIplikIM.instanceMatrix.needsUpdate = true;
  balDamlaIM.instanceMatrix.needsUpdate = true;
}

// ================= ENG-004 MAVI BUZ (17 Eyl 2026) =================
// Kural: ENGEL = HAREKETIN FIZIKSEL SEBEBI. Gecis yukseklikleri engel-defteri
// sabitleri - BICIM degisir (kimlik % 3), SAYI degismez.
//   zipla_a  -> alcak buz kaliplari, tepe 1,10          (ustunden zipla)
//   egil     -> buz sacagi, koridor ustu sarkit ucu 3,86 (egilerek gec)
//   yanadim  -> yarim buz levhasi, derinlik 0,44 tepe 3,54 (ACIK tarafa)
//   it_c     -> gogus hizasinda buz paneli + yan sutunlar (iki elle it)
// Fotograf yok: saydam buz shader'i (fresnel kenar + kiraG + soguk ton).
const BUZ_MAT = new THREE.ShaderMaterial({
  uniforms: {},
  // 17 Eyl 2026 ilk motor karesi: yuz basina tek renk -> "duz mavi arayuz
  // paneli" gibi okunuyordu. Buz olmasi icin: UV kenarinda parlak kirilma
  // bandi, alttan koyulasan kutle, yuzeyde catlak agi ve kiraG.
  vertexShader: [
    'varying vec3 vN; varying vec3 vV; varying vec3 vW; varying vec2 vUv;',
    'void main(){',
    '  vec4 w = modelMatrix * vec4(position, 1.0);',
    '  vW = w.xyz; vUv = uv;',
    '  vN = normalize(mat3(modelMatrix) * normal);',
    '  vV = normalize(cameraPosition - w.xyz);',
    '  gl_Position = projectionMatrix * viewMatrix * w;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vN; varying vec3 vV; varying vec3 vW; varying vec2 vUv;',
    'float hs(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
    'void main(){',
    '  vec3 n = normalize(vN);',
    '  float fr = pow(1.0 - abs(dot(n, vV)), 2.2);',
    '  float ke = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));',
    '  float kenar = 1.0 - smoothstep(0.0, 0.07, ke);',
    // catlak agi: iki olcekte dunya uzayi hucreleri, sinir cizgileri
    '  vec2 q = vec2(vW.x + vW.z * 0.7, vW.y) * 1.3;',
    '  vec2 f1 = fract(q) - 0.5;',
    '  float cat = 1.0 - smoothstep(0.0, 0.04, abs(abs(f1.x + 0.3 * sin(q.y * 3.1 + hs(floor(q)))) - 0.46));',
    '  cat *= step(0.55, hs(floor(q) + 3.0));',
    '  float kir = 0.5 + 0.5 * sin(vW.x * 7.1 + vW.y * 5.3) * sin(vW.y * 6.7 - vW.z * 4.1);',
    '  float alt = clamp(vW.y / 3.6, 0.0, 1.0);',
    '  vec3 ic = mix(vec3(0.30, 0.52, 0.78), vec3(0.58, 0.80, 0.96), alt);',
    '  vec3 c = mix(ic, vec3(0.92, 0.98, 1.0), clamp(fr * 0.9 + kenar * 0.85 + cat * 0.55, 0.0, 1.0));',
    '  c += vec3(0.06, 0.07, 0.08) * kir;',
    '  float ust = step(0.9, n.y);',
    '  c = mix(c, vec3(0.88, 0.96, 1.0), ust * 0.5);',
    '  float a = clamp(0.62 + 0.30 * fr + 0.25 * kenar + 0.10 * kir - 0.10 * alt, 0.0, 0.97);',
    '  gl_FragColor = vec4(c, a);',
    '}'
  ].join('\n'),
  transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
});
const BUZ_KUTU_GEO = new THREE.BoxGeometry(1, 1, 1);
const BUZ_SARKIT_GEO = (() => { const g = new THREE.ConeGeometry(0.5, 1, 7); g.rotateX(Math.PI); g.translate(0, -0.5, 0); return g; })();
const BUZ_GOLGE_MAT = new THREE.MeshBasicMaterial({ map: ELMA_GOLGE_DOKU, color: '#6f8fb8',
