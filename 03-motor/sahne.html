<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// ---------------------------------------------------------------- SABITLER
const S = await fetch('/spec/sabitler.json').then(r => r.json());
const FPS   = S.video.fps;                 // 30
// let: bolum dosyasi kendi BPM'ini veriyorsa asagida yeniden hesaplaniyor.
let OLCU  = S.izgara.saniye_per_olcu;      // 130 BPM -> 1.846 sn
let VURUS = S.izgara.saniye_per_vurus;     // 130 BPM -> 0.4615 sn
const YAKLASMA = S.oynanis.yaklasma_saniye;// 2.0 sn

const SP = new URLSearchParams(location.search);
const W = Number(SP.get('w') || 1280);
const H = Number(SP.get('h') || 720);
const SADE = SP.get('sade') === '1';   // karsilastirma icin: dolgu katmanlari kapali
// hiz olcumu icin katman anahtarlari
const BLOOM_ACIK = SP.get('bloom') !== '0';
const PAS_ACIK   = SP.get('pas')   !== '0';

// ------------------------------------------------------------ BOLUM DOSYASI
// Koreografi KODDA DEGIL VERIDE. Her bolum kendi JSON'u; motor degismiyor.
// Bu olmadan her bolum birebir ayni videoyu uretiyordu - planin "en kritik
// risk" dedigi tekrar problemi tam olarak buydu.
// Verilmezse dosyadaki varsayilan iskelet kullanilir (hizli testler icin).
const BOLUM = SP.get('bolum')
  ? await fetch('/' + SP.get('bolum')).then(r => r.json())
  : null;

// BOLUM BAZLI BPM: bolum dosyasinda 'bpm' varsa izgara ona gore yeniden
// kuruluyor. Cue zamanlari, engel yaklasma mesafesi, ortam gecisleri ve
// mekan akis hizi hep OLCU/VURUS'tan turedigi icin tek yerden degisiyor.
// Alan yoksa sabitler.json gecerli - biten bolumler etkilenmiyor.
if (BOLUM && BOLUM.bpm) {
  VURUS = 60 / BOLUM.bpm;
  OLCU  = VURUS * S.izgara.vurus_per_olcu;
  console.log('bolum BPM:', BOLUM.bpm, 'olcu:', OLCU.toFixed(4), 'sn');
}

// ---------------------------------------------------------------- TEMA
// Iki gorsel dil, tek motor. Rakip analizinin bulduguu iki nis
// (bkz. docs/RAKIP-ANALIZI-6-KANAL.md):
//   'a' = soyut ritim seridi - koyu zemin, neon, additive parlama
//   'b' = temali kosu        - gunduz, doygun blok dunyasi, normal harman
//
// B'de additive harman KULLANILAMAZ. Toplama isik parlak zeminde beyaza
// doyar ve butun sahne yikanir. Bu yuzden harman modu temayla secilir ve
// B'de kontrast parlaklikla degil RENK ALANI + KOYU KONTUR ile kurulur.
const TEMA = SP.get('tema') === 'b' ? 'b' : 'a';
const TB   = TEMA === 'b';
// Isik ogeleri (kemer, parcacik, ufuk, halka) koyu zeminde additive olmali -
// neon parlamasi toplama isikla olusur.
const HARMAN = THREE.AdditiveBlending;
// Notalar istisna: referansta nota PARLAMIYOR, duz renkli fayans olarak
// duruyor ve uzerinde koyu simge var. Additive olsa zeminle karisirdi.
const HARMAN_NOTA = TB ? THREE.NormalBlending : THREE.AdditiveBlending;
const YAZI_KONTUR = 'rgba(255,255,255,0.92)';

const Z_VURUS = 4;      // vurus cizgisi
const Z_DOGUM = -26;    // notanin dogdugu yer (30 birim / 2 sn)
const LANE_X  = [-2.2, 0, 2.2];
const SIS_YAKIN = TB ? 20 : 14, SIS_UZAK = TB ? 78 : 33;

const PALET = TB ? {
  zemin:'#0d0524', grid:'#ff2f8f',
  lane:['#22e0e8','#ff2f8f','#8b3cff'],
  cizgi:'#ffffff', siluet:'#000000', rim:'#22e0e8', hud:'#ffffff'
} : {
  zemin:'#0a0118', grid:'#ff2fd0',
  lane:['#00e5ff','#b14aff','#ffe600'],
  cizgi:'#ffffff', siluet:'#000000', rim:'#00e5ff', hud:'#ffffff'
};

// ------------------------------------------------------------- KOREOGRAFI
// Kalip ve kademe tanimlari asagida (P / KADEME) - CUE tablosunun yaninda.
// Burada sadece ISKELET var: hangi olcu araliginda hangi kademe.
//
// Siluet artik her cue'da klip degistirmiyor. Evde takip eden biri icin
// siluet bir EGITMEN: blok boyunca TEK bir egzersizi tekrarliyor. Vuruslara
// gore ziplayan bir figur takip edilemez, cirpinma gibi gorunur.
// 64 olculuk DEMO iskeleti: tirmanisi ve dort ortami hizlica gormek icin.
const ISKELET_DEMO = [
  [0,  2,  'bos',  'nefes'        ],
  [2,  6,  'd15',  'adim'         ],
  [6,  16, 'd20',  'side-to-side' ],
  [16, 18, 'mola', 'nefes'        ],
  [18, 32, 'd25',  'jacks'        ],
  [32, 34, 'mola', 'nefes'        ],
  [34, 48, 'd30',  'duck'         ],
  [48, 50, 'mola', 'nefes'        ],
  [50, 60, 'd35',  'punch'        ],
  [60, 64, 'd40',  'jacks'        ],
];

// 264 olculuk TAM BOLUM iskeleti - DANCE-MODE-PLANI.md'deki yapinin birebir
// karsiligi: ogretme 32, uc tur 48'er, aralarinda 8'er olcu mola, final 64.
//
// Turlar 16'sarlik uc bloga bolundu. Zorluk kademesi tur boyunca AYNI kaliyor
// (kademe2/3/4/5), degisen sey SILUETIN EGZERSIZI. Sebep: 48 olcu = 1:36 ve
// evde takip eden biri ayni hareketi bir bucuk dakika yapamaz; ama cue
// yogunlugunu blok icinde degistirmek de ogrenilen tempoyu bozar.
// Yani ritim sabit, egzersiz degisiyor.
// [baslangic, bitis, yogunluk_kademesi, siluet_egzersizi]
// Zorluk GERCEKTEN tirmaniyor: 2,0 -> 2,5 -> 3,0 -> 3,5 -> 4,0.
// Siluet egzersizi her 16 olcude degisiyor - 48 olcu (1:36) boyunca ayni
// hareketi yapmak evde takip eden biri icin imkansiz.
const ISKELET_TAM = [
  [0,   4,   'bos',  'nefes'        ],  // giris: READY / GO
  [4,   12,  'd15',  'adim'         ],  // OGRETME - yana adim
  [12,  20,  'd20',  'jump'         ],  //   ziplama / comelme
  [20,  32,  'd20',  'jacks'        ],  //   karma

  [32,  48,  'd20',  'adim'         ],  // TUR 1 - ortalama 2,0
  [48,  64,  'd15',  'side-to-side' ],  //   dip
  [64,  80,  'd25',  'adim'         ],  //   tepe
  [80,  88,  'mola', 'arm-stretch'  ],  // AKTIF MOLA

  [88,  104, 'd25',  'jacks'        ],  // TUR 2 - ortalama 2,5
  [104, 120, 'd20',  'charleston'   ],  //   dip
  [120, 136, 'd30',  'jacks'        ],  //   tepe
  [136, 144, 'mola', 'neck-roll'    ],  // AKTIF MOLA

  [144, 160, 'd30',  'duck'         ],  // TUR 3 - ortalama 3,0
  [160, 176, 'd25',  'kick-step'    ],  //   dip
  [176, 192, 'd35',  'twist-dance'  ],  //   tepe
  [192, 200, 'mola', 'arm-stretch'  ],  // AKTIF MOLA

  [200, 216, 'd35',  'punch'        ],  // FINAL - ortalama 3,5
  [216, 232, 'd30',  'running-man'  ],  //   dip
  [232, 248, 'd40',  'punch'        ],  //   tepe
  [248, 264, 'd40',  'jacks'        ],  // son 16 - 4,0, combo kapak rakamina
];

// Kac olculuk bolum render edilecek. Parca render'da bu HER ZAMAN tam
// bolumun uzunlugu olmali (parcanin degil) - final karti ve ortam
// gecisleri mutlak zamandan hesaplaniyor.
const TOPLAM_OLCU = (BOLUM && BOLUM.toplam_olcu) || Number(SP.get('toplam') || 64);
const TAM_BOLUM   = TOPLAM_OLCU >= 200;
const BLOKLAR     = (BOLUM && BOLUM.iskelet) || (TAM_BOLUM ? ISKELET_TAM : ISKELET_DEMO);

// ---------------------------------------------------------------- ORTAMLAR
// Bolum icinde ortam degisir: palet + kemer renkleri + LEVEL etiketi.
// "NEW LEVEL" bir sozdur; gorsel olarak karsilanmazsa izleyici 3. dakikada anlar.
const ORTAMLAR_A = [
  { olcu: 0,  seviye: 1, gok: '#0a0118',
    grid: ['#ff2fd0','#00e5ff','#8b5cff'],
    kemer:['#00e5ff','#ff2fd0','#8b5cff','#25d9c2','#ffb454'],
    ufuk: '#ff5ec4', ara: 5.0, olcek: 1.00, bicim: 'yuvarlak', en:1, boy:1, yer:5.3 },
  { olcu: 16, seviye: 2, gok: '#0a0118',
    grid: ['#25d9c2','#3d7bff','#ffb454'],
    kemer:['#ffb454','#25d9c2','#3d7bff','#ffe066','#00e5ff'],
    ufuk: '#ffb454', ara: 3.4, olcek: 0.86, bicim: 'altigen',  en:1, boy:1, yer:5.3 },
  { olcu: 32, seviye: 3, gok: '#0a0118',
    grid: ['#b18cff','#ff6ad5','#5ce1e6'],
    kemer:['#ff6ad5','#b18cff','#5ce1e6','#ffffff','#8b5cff'],
    ufuk: '#b18cff', ara: 6.6, olcek: 1.20, bicim: 'ikiz',     en:1, boy:1, yer:5.3 },
  { olcu: 48, seviye: 4, gok: '#0a0118',
    grid: ['#ffe066','#ff5ec4','#00e5ff'],
    kemer:['#ffe066','#ff2fd0','#00e5ff','#ffb454','#ffffff'],
    ufuk: '#ff2fd0', ara: 2.9, olcek: 0.94, bicim: 'keskin',   en:1, boy:1, yer:5.3 },
];
// B temasi: dort "dunya". Hicbiri lisansli bir evrene ait degil - tema ismi
// aramayi cekiyor ama IP kullanmadan da tema yapilabiliyor. Rakip analizinin
// en onemli cikarimlarindan biri buydu.
// Ortam kutuphanesi JSON'dan geliyor: spec/ortamlar.json
// Yeni ortam eklemek icin bu dosyayi acmaya gerek yok. Bolum dosyalari
// kutuphaneden ADA gore secim yapiyor, boylece her bolum farkli mekanlarda
// geciyor - tekrar problemine karsi asil savunma bu.
const ORTAM_JSON = await fetch('/spec/ortamlar.json').then(r => r.json());
const ORTAMLAR_B = Object.entries(ORTAM_JSON.ortamlar)
  .map(([ad, o]) => ({ ad, ...o }));
// Ortam degisimi YAPISAL sinirda olmali: her yeni tur yeni bir mekanda
// basliyor, boylece "LEVEL UP" karti molanin hemen ardindan geliyor ve
// izleyici dinlenmeden sonra yeni bir yere ciktigini hissediyor.
// Rakip olcumu: gorsel durum medyan 19 saniyede bir degisiyor. Bizde dort
// ortam 88 olcude bir degisiyordu (~162 sn). Alti ortam, 44 olculuk aralik:
// ~81 saniye. Aradaki bosluk kemer renk akisiyla dolduruluyor.
// Ortam kutuphanesi: ada gore secilebilir. Bolum dosyasi hangi ortamlari
// hangi sirayla kullanacagini soyluyor - ayni kutuphaneden farkli diziler.
const ORTAM_KUT = {};
for (const o of ORTAMLAR_B) ORTAM_KUT[o.ad] = o;

const ORTAM_SECIM = (BOLUM && BOLUM.ortamlar)
  ? BOLUM.ortamlar.map(ad => ORTAM_KUT[ad]).filter(Boolean)
  : (TB ? ORTAMLAR_B : ORTAMLAR_A);
const ORTAM_OLCU = (BOLUM && BOLUM.ortam_olcu)
  || (TAM_BOLUM ? [0, 44, 88, 132, 176, 220] : [0, 12, 22, 34, 44, 54]);
const ORTAMLAR = ORTAM_SECIM.map((o, i) => ({
  ...o, olcu: ORTAM_OLCU[i], seviye: i + 1 }));
// Renk gecisi KISA olmali. 1 olcuye yayilinca fark edilmiyordu; yarim
// olcude bitince "bir sey degisti" hissi net veriyor.
const GECIS_OLCU = 0.4;

const CUE = {
  step_L:  { lane:0, sure:VURUS*2, klip:'step-left'   },
  step_R:  { lane:2, sure:VURUS*2, klip:'step-right'  },
  jump:    { lane:1, sure:OLCU,    klip:'jump'        },
  duck:    { lane:1, sure:OLCU,    klip:'duck'        },
  dodge_L: { lane:0, sure:OLCU,    klip:'dodge-right' },
  dodge_R: { lane:2, sure:OLCU,    klip:'dodge-right' },
  punch:   { lane:1, sure:OLCU,    klip:'punch'       },
  arms_up: { lane:1, sure:OLCU,    klip:'arms-up'     },
  // Bolum 6 icin eklendi (5 Eyl 2026). 'jump' cue'su YERINDE BIRAKILDI:
  // klibini degistirmek yayinlanmis bolumlerin yeniden render'ini bozardi.
  // hop  = yerinde siçrama (jump-standing). 'jump' yer degistiriyor, bu degil.
  // wave = yana uzanan kol (arm-wave). Tek yatay genis siluet - digerlerinden
  //        ayirt edilmesi en kolay sekil. Olcum: docs/OLCUM-SILUET-CAKISMA.md
  // hop klibi 2,37 sn. Tek olcu (1,85 sn) 1,30x hizlandiriyordu; tavan iki
  // olcuye cikinca koreografideki bes vurusluk bosluk (2,31 sn) gecerli
  // oluyor ve oran 1,03x'e iniyor. Tavan 2 ama pencere yine bir sonraki
  // cue'ya gore - yani iki olcu bos kalmadikca iki olcu ALMIYOR.
  hop:     { lane:1, sure:OLCU,    klip:'jump-standing', maxOlcu: 2 },
  // maxOlcu: bu cue'nun alabilecegi EN UZUN pencere (olcu cinsinden).
  // arm-wave klibi 5,20 sn - 130 BPM'de uc olcu (5,54 sn) ile 0,94x oluyor.
  wave_L:  { lane:0, sure:OLCU,    klip:'arm-wave', maxOlcu: 3 },
  wave_R:  { lane:2, sure:OLCU,    klip:'arm-wave', maxOlcu: 3 },
  // SHIMMY (13 Eyl 2026, HAR-002/A1): omuz-govde titresimi, ayaklar sabit.
  // Dorduncu sekil ailesi - comelme/yana egilme/uzanma disinda kalan tek
  // okunakli aile. Olcum: en yuksek cifti duck ile 0,413 (esik 0,50).
  // Lane 1: yer degistirme yok, oldugun yerde yapiliyor.
  shimmy:  { lane:1, sure:OLCU,    klip:'shimmy', maxOlcu: 2 },
  // ---- KUTUPHANENIN GERI KALANI (13 Eyl 2026) ----
  // Kullanici: "bir suru hareket tarzimiz var, hepsinin hazir olmasini
  // istiyorum". Bu kliplerin cue'su yoktu, yani yeni bir set secilse motor
  // cizemezdi. Hepsi tanimli; hangisinin sete girecegi OLCUMLE (olc-iou.py)
  // ve kullanici secimiyle belirlenir.
  charleston: { lane:1, sure:OLCU, klip:'charleston', maxOlcu: 2 },
  jacks:      { lane:1, sure:OLCU, klip:'jacks',      maxOlcu: 2 },
  neck_roll:  { lane:1, sure:OLCU, klip:'neck-roll',  maxOlcu: 2 },
  running:    { lane:1, sure:OLCU, klip:'running-man',maxOlcu: 2 },
  roof:       { lane:1, sure:OLCU, klip:'raise-roof', maxOlcu: 2 },
  kick_L:     { lane:0, sure:OLCU, klip:'kick-step',  maxOlcu: 2 },
  kick_R:     { lane:2, sure:OLCU, klip:'kick-step',  maxOlcu: 2 },
  side_L:     { lane:0, sure:OLCU, klip:'side-to-side', maxOlcu: 2 },
  side_R:     { lane:2, sure:OLCU, klip:'side-to-side', maxOlcu: 2 },
  twist_L:    { lane:0, sure:OLCU, klip:'twist-dance',maxOlcu: 2 },
  twist_R:    { lane:2, sure:OLCU, klip:'twist-dance',maxOlcu: 2 },
  // ---- HAR-004 ADAYLARI (16 Eyl 2026). Cue adi ENGEL AILESINI soyler.
  // Pencereler klip SURELERINDEN (132,5 BPM, olcu 1,811 sn): hiz 0,85-0,9x.
  //   standing-jump 2,40 sn -> 1,5 olcu (2,72) 0,88x
  //   ducking       1,53 sn -> 1 olcu   (1,81) 0,85x
  //   side step     0,77 sn -> 0,5 olcu (0,91) 0,85x  (1 olcuye yayilsa 0,43x agir cekim)
  //   push-it       1,60 sn -> 1 olcu   (1,81) 0,88x
  zipla_a:  { lane:1, sure:OLCU, klip:'standing-jump', maxOlcu: 1.5 },
  zipla_b:  { lane:1, sure:OLCU, klip:'box-jump',      maxOlcu: 2 },
  zipla_c:  { lane:1, sure:OLCU, klip:'jump-up',       maxOlcu: 2 },
  egil:     { lane:1, sure:OLCU, klip:'ducking',       maxOlcu: 1 },
  yanadim_L:{ lane:0, sure:OLCU, klip:'long-left-side-step', maxOlcu: 0.5 },
  yanadim_R:{ lane:2, sure:OLCU, klip:'long-left-side-step', maxOlcu: 0.5 },
  it_a:     { lane:1, sure:OLCU, klip:'push-start',    maxOlcu: 2 },
  it_b:     { lane:1, sure:OLCU, klip:'pushing',       maxOlcu: 2 },
  it_c:     { lane:1, sure:OLCU, klip:'push-it',       maxOlcu: 1 },
  // aktif mola cue'lari: yogunluk duser ama ekran BOSALMAZ
  reach_L: { lane:0, sure:OLCU,    klip:'arm-stretch' },
  reach_R: { lane:2, sure:OLCU,    klip:'arm-stretch' },
  // TUTMA NOTASI: iki vurus boyunca pozda kalinir. Uzun fayans olarak cizilir.
  hold:    { lane:1, sure:VURUS*4, klip:'raise-roof', uzun: 2 },
};

// ------------------------------------------------- YOGUNLUK KADEMELERI
// Rakip olcumu (docs/OLCUM-STAY-ON-BEAT-11.md): ortalama 2,64 cue/olcu ve
// zorluk 11 dakikada 4,00'ten 4,25'e cikiyor - yani DUZ. Bizim farkimiz
// gercek bir yay olacak: 2,0 -> 2,5 -> 3,0 -> 3,5.
//
// Kesirli yogunluk tek kalipla olmaz. Her kademe bir kalip SETI; olculer
// set boyunca sirayla donuyor, ortalama kesirli cikiyor.
const P_VAR = {
  s2a: ['step_L', null,      'step_R', null   ],   // 2
  s2b: ['jump',   null,      'duck',   null   ],   // 2
  s3a: ['step_L', 'jump',    'step_R', null   ],   // 3
  s3b: ['step_L', null,      'step_R', 'duck' ],   // 3
  s4a: ['step_L', 'jump',    'step_R', 'duck' ],   // 4
  s4b: ['step_L', 'dodge_R', 'jump',   'duck' ],   // 4
  s4c: ['step_L', 'punch',   'step_R', 'jump' ],   // 4
  s3c: ['step_L', 'dodge_R', 'step_R', null   ],   // 3 - kacis
  s3d: ['punch',  null,      'step_R', 'duck' ],   // 3 - yumruk
  m1:  ['reach_L', null, null,     null],          // aktif mola
  m2:  [null,      null, 'reach_R', null],
  m3:  ['hold',    null, null,     null],
  m0:  [null,      null, null,     null],
  bos: [null,      null, null,     null],
};
const YOGUNLUK_VAR = {
  bos:  ['bos'],
  d15:  ['s2a', 'm0'],                 // 1,5 - ogretme baslangici
  d20:  ['s2a', 's2b'],                // 2,0 - tur 1
  d25:  ['s2a', 's3c', 's3a', 's2b'],  // 2,5 - kacis girer
  d30:  ['s3a', 's3d', 's3b', 's3a'],  // 3,0 - yumruk girer
  d35:  ['s3a', 's4b', 's3b', 's4a'],  // 3,5
  d40:  ['s4b', 's4c'],                // 4,0 - son duz
  mola: ['m1', 'm2', 'm3', 'm0'],      // 0,75 - ekran bosalmiyor
};

// ---------------------------------------------------------- CUE URETECI
// AYNALAMA: her 8 olculuk cumlede sol/sag takas. Vucut dengeli calissin.
// Rakipler bunu sistematik yapmiyor; bir egzersiz videosunda yapilmali.
// Kaliplar ve kademeler de bolum dosyasindan gelebilir. Boylece bir bolum
// "sadece 4 hareket kullan" gibi bir kisit koyabiliyor - motor degismeden.
const P = (BOLUM && BOLUM.kaliplar) ? { ...P_VAR, ...BOLUM.kaliplar } : P_VAR;
const YOGUNLUK = (BOLUM && BOLUM.kademeler)
  ? { ...YOGUNLUK_VAR, ...BOLUM.kademeler } : YOGUNLUK_VAR;

const AYNA = { step_L:'step_R', step_R:'step_L',
               dodge_L:'dodge_R', dodge_R:'dodge_L',
               reach_L:'reach_R', reach_R:'reach_L',
               wave_L:'wave_R',   wave_R:'wave_L' };

const NOTALAR = [];
for (const [b0, b1, kademeAdi] of BLOKLAR) {
  const set = YOGUNLUK[kademeAdi] || YOGUNLUK.bos;
  for (let olcu = b0; olcu < b1; olcu++) {
    const kalip = P[set[(olcu - b0) % set.length]];
    const aynala = Math.floor(olcu / 8) % 2 === 1;
    for (let v = 0; v < 4; v++) {
      let tip = kalip[v];
      if (!tip) continue;
      if (aynala && AYNA[tip]) tip = AYNA[tip];
      NOTALAR.push({ tip, t: olcu * OLCU + v * VURUS, ...CUE[tip] });
    }
    // SEKIZLIK PATLAMA
    // Rakipte 966 cue'nun tamami ceyreklikte - sekizlik altbolunme yok.
    // 8 olculuk cumlenin SON olcusunde yarim vurusluk bir cift koyuyoruz:
    // ortalama yogunlugu neredeyse hic degistirmiyor ama "burada bir sey
    // oldu" hissi veriyor. Molada ve giriste yok.
    const sonOlcu = (olcu + 1) % 8 === 0;
    if (sonOlcu && kademeAdi !== 'mola' && kademeAdi !== 'bos') {
      const t0 = olcu * OLCU + 3 * VURUS + VURUS / 2;
      const tip = aynala ? 'step_L' : 'step_R';
      NOTALAR.push({ tip, t: t0, ...CUE[tip], patlama: true });
    }
  }
}
NOTALAR.sort((a,b) => a.t - b.t);
NOTALAR.forEach((n,i) => n.combo = i + 1);

// ============================== SILUET ZAMANLAMASI: PENCERE ve ONALMA
// Olculdu (3 Eyl 2026), iki ayri hata cikti:
//
// 1) HAREKET TAMAMLANMIYORDU. Klip suresi 2 sn'ye (bir olcu) sabitlenmisti
//    ama cue'lar 0,5-1 sn arayla geliyor. Her yeni cue oncekini kesiyordu,
//    yani siluet her hareketin sadece ILK CEYREGINI oynuyordu. 'duck'
//    (Air Squat) klibinin comelme dibi klibin ortasinda; o ana hic
//    varilmadigi icin siluet vurus aninda AYAKTA duruyordu.
//
// 2) POZ VURUSA DENK GELMIYORDU. Klip tam vurusta basliyordu, yani
//    karakteristik poz vurustan sonra olusuyordu - engel coktan gecmis
//    oluyordu. Gercek bir oyuncu hareketi ONCEDEN baslatir.
//
// Cozum: her cue'nun kendi PENCERESI var (bir sonraki cue'ya kadar olan
// sure, 0,5-2 sn arasina kirpilmis). Klip o pencereye SIGDIRILIYOR, yani
// hareket bir sonraki cue gelmeden bitiyor. Ve pencere vurustan
// ONALMA_PAY kadar once basliyor: karakteristik poz vurusun uzerine denk
// geliyor.
const ONALMA_PAY = 0.35;                       // pencerenin ne kadari vurustan once
// TEPE FAZI TABLOSU (13 Eyl 2026, OLCULDU - 03-motor/olc-iou.py).
// Her klibin "en okunakli" ani klibin neresinde? Pencere bu orana gore
// kaydiriliyor ki o an VURUSA denk gelsin.
//
// Neden gerekti: test bolumunde yeni cue'lar calistirildi ve vurus aninda
// jacks/kick/neck_roll/running/twist hala NOTR durusta cikti. Klip oynuyordu
// ama tepe pozu vurustan sonra geliyordu - izleyici vurusta duz bir figur
// goruyordu. Sabit %35 yalnizca tepesi erken gelen klipler icin dogruydu.
//
// Tabloda OLMAYAN klip eski davranisi (0,35) korur -> yayinlanmis bolumlerin
// zamanlamasi degismez.
// KLIP DONGUSU (15 Eyl 2026, olculdu: 03-motor/olc-klip-dongu.js).
// Dans klipleri TEKRARLI: charleston 20,90 sn'lik klibin icinde ayni dongu
// sekiz kez var. Motor cue penceresine klibin TAMAMINI sigdiriyordu ->
// 11,5 KAT hiz (olc-tempo.js). Kullanicinin gordugu "garip hareketlilik"
// buydu. Artik pencereye TAM SAYIDA DONGU sigdiriliyor, yani hareket kendi
// dogal hizinda kaliyor ve olcuye oturuyor.
// Tabloda OLMAYAN klip eski davranisini korur -> yayinlanmis bolumler
// (hop/duck/dodge/wave/arm-stretch/shimmy) degismez.
const KLIP_DONGU = {
  'charleston': 2.61,      // 20,90 sn klip = 8 dongu
  'side-to-side': 1.14,    // 13,63 sn klip = 12 dongu
  'raise-roof': 0.51,      // 4,10 sn klip = 8 dongu
  'jacks': 1.07,           // 1,07 sn - klibin kendisi tek dongu
};
// CUE BAZLI TEPE FAZI ve AYNALAMA (15 Eyl 2026, kullanici: "engellerle
// siluetin hareketleri birbirini tutmuyor").
// Olculdu (03-motor/olc-eslesme.js): vurusta engel z=4 (vurus cizgisi) ve
// dogru klip agirlik 1,00 ile caliyordu - yani ZAMANLAMA dogruydu. Bozuk olan
// YONDU: side_R cue'sunda siluetin yatay merkezi -0,056 ile +0,471 arasinda
// degisiyordu, yani ayni cue'da bazen SOLA bazen SAGA yatiyordu. Sebep tek
// klibin (side-to-side) iki yone de salinmasi ve cue yonunun faza
// baglanmamis olmasi.
// olc-yon.js ile dongu ici yon egrisi olculdu: en saga yatis faz 0,438
// (com +0,137), en sola yatis faz 0,146 (com yalnizca -0,035) - klip
// ASIMETRIK. Bu yuzden iki cue de AYNI fazi (0,438) kullaniyor, side_L
// icin siluet kutusu AYNALANIYOR: iki yon de esit guclu okunuyor.
const CUE_DONGU_FAZ = { 'side_L': 0.438, 'side_R': 0.438 };
// yanadim_L (17 Eyl 2026, olc-yon.js): long-left-side-step klibi siluet kutusunda
// figuru SAGA gotururuyor (com -0,067 -> -0,024). Sola gitmesi gereken cue aynalanir.
const AYNA_CUE = { 'side_L': true, 'yanadim_L': true };
let SILUET_AYNA = false;
const SILUET_DON = 1.1;   // push-it cue'sunda govdenin yana donus acisi (radyan)
const TEPE_FAZI = {
  'charleston': 0.30, 'running-man': 0.30,
  'raise-roof': 0.45, 'side-to-side': 0.45, 'step-left': 0.45,
  // jacks 0,60 -> 0,75 (14 Eyl 2026, HAR-003'te olculdu). Tepe fazi araci
  // "faz 0'a en uzak kare"yi tepe sayiyor ve klibin faz 0'da NOTR durdugunu
  // varsayiyor; jacks klibi kollar-bacaklar ACIK basliyor, bu yuzden arac
  // KAPALI duz durusu (0,60) tepe ilan ediyordu. Siluet genisligi olculdu:
  // 0,60'ta 78 px, 0,75'te 111 px. Not: asagidaki kirpma payi 0,70'te
  // tutuyor - cikis harmanina denk gelmesin diye konmustu, dokunulmadi.
  'jacks': 0.75, 'step-right': 0.60,
  'neck-roll': 0.75,
  'kick-step': 0.90, 'twist-dance': 0.90,
  // HAR-004 (17 Eyl 2026, olc-iou.py tepe fazi): havada / comelmis / hamle / itis
  'standing-jump': 0.45, 'ducking': 0.70, 'long-left-side-step': 0.30, 'push-it': 0.40,
};
NOTALAR.forEach((n, i) => {
  const sonraki = NOTALAR[i + 1];
  // TAVAN ARTIK CUE TIPINE GORE (5 Eyl 2026). Onceki halde her cue en fazla
  // BIR olcu alabiliyordu. Olculdu (03-motor/olc-tempo.js): klip suresi
  // pencereye sigdirildigi icin hareketler hizlaniyordu -
  //   wave 6,4x | hop 4,0x | duck 2,9x | dodge 2,3x
  // Cue'larin %56'si tek vurusluk (0,46 sn) pencere aliyordu. Koreografi
  // adim hareketlerine (0,80 sn klip) gore kurulmustu; dort yeni hareket
  // 1,43-5,20 sn. arm-wave tek olcuye HICBIR sekilde sigmiyor.
  const tavan = OLCU * ((CUE[n.tip] && CUE[n.tip].maxOlcu) || 1);
  let pencere = sonraki ? (sonraki.t - n.t) : tavan;
  pencere = Math.min(Math.max(pencere, VURUS), tavan);
  n.pencere = pencere;
  // Pencere, klibin tepe fazi VURUSA denk gelecek sekilde kaydiriliyor.
  // Pay [0,25 - 0,70] arasina KIRPILIYOR. Sebep olculdu: tepesi 0,90 olan
  // klipte (kick-step, twist-dance) vurus pencerenin CIKIS HARMANINA denk
  // geliyor ve motor orada notr klibe agirlik veriyor - vurusta yine duz
  // figur cikiyordu. Kirpma tepe hizalamasini bozmuyor, yalnizca harman
  // bolgesine girmesini engelliyor.
  let pay = (TEPE_FAZI[n.klip] !== undefined) ? TEPE_FAZI[n.klip] : ONALMA_PAY;
  // UST SINIR 0,70 -> 0,76 (15 Eyl 2026). 0,70 sinirinin sebebi 0,90'lik
  // kliplerin CIKIS HARMANINA denk gelmesiydi; 0,75 orada degil. jacks 0,75
  // isterken 0,70'e kirpiliyor ve tepe pozu yakalanamiyordu (siluet genisligi
  // 111 px yerine ~90 px). Etkilenen diger klipler: kick-step ve twist-dance
  // (0,90 -> artik 0,76); ikisi de YAYINLANMIS hicbir bolumde kullanilmiyor,
  // yani gecmis zamanlama degismiyor.
  pay = Math.min(0.76, Math.max(0.25, pay));
  n.bas = n.t - pay * pencere;
});

// ==================================================== GOKYUZU (GUNDUZ)
// Sadece 'gunduz' ortamlarda gorunur. Referans olcumu: acik alan karelerinde
// gokyuzu karenin %29-33'u ve DOYGUNSUZ - neredeyse beyaz. Buyuk, sakin,
// detaysiz bir dinlenme alani. Doygun mavi denendigi anda nota ile
// parlaklik yarisina giriyor. Bkz. 07-mekan/acik-alan/ANALIZ.md bolum 4.
let gokyuzu = null;
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  // dikey rampa: UFUKTA acik, TEPEDE biraz koyu. Renk materyalden gelir.
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0.00, 'rgb(150,168,196)');   // tepe
  gr.addColorStop(0.55, 'rgb(214,226,240)');
  gr.addColorStop(1.00, 'rgb(252,251,246)');   // ufuk cizgisi - en acik
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  // bulutlar: yumusak, alcak kontrastli. Deterministik - indeksten turetiliyor.
  const kar = (n) => { const v = Math.sin(n * 91.7) * 43758.5453; return v - Math.floor(v); };
  for (let i = 0; i < 9; i++) {
    const cx = kar(i) * 512, cy = 60 + kar(i + 17) * 210, r = 26 + kar(i + 31) * 44;
    g.fillStyle = `rgba(255,255,255,${0.34 + kar(i + 5) * 0.30})`;
    for (let k = 0; k < 7; k++) {
      const tt = k / 6;
      g.beginPath();
      g.arc(cx + (tt - 0.5) * r * 2.8, cy - Math.sin(tt * Math.PI) * r * 0.5,
            r * (0.46 + 0.40 * Math.sin(tt * Math.PI)), 0, 6.2832);
      g.fill();
    }
  }
  // DIKKAT: bu materyal OPAK olmali. Saydam yapilinca three.js onu saydam
  // gecise aliyor ve saydam gecis TUM OPAK nesnelerden SONRA cizilyor;
  // depthTest de kapali oldugu icin gokyuzu, acik alan geometrisinin
  // uzerini boyuyordu - duvarlar sahnede vardi ama hicbir karede
  // gorunmuyordu. renderOrder yalnizca kendi gecisi icinde siralar.
  gokyuzu = new THREE.Mesh(new THREE.PlaneGeometry(260, 96),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c),
      transparent: false, depthWrite: false, fog: false }));
  gokyuzu.material.depthTest = false;
  gokyuzu.position.set(0, 26, -120);
  gokyuzu.renderOrder = -5;          // her seyin arkasi
  gokyuzu.visible = false;
  scene.add(gokyuzu);
}

// --- zemin: kaydirilan neon izgara (kamera sabit, doku akar)
const zeminMat = new THREE.ShaderMaterial({
  uniforms: {
    uKaydir: { value: 0 },
    uGrid:   { value: new THREE.Color(PALET.grid) },
    uGrid2:  { value: new THREE.Color('#00e5ff') },
    uGrid3:  { value: new THREE.Color('#8b5cff') },
    uZemin:  { value: new THREE.Color(PALET.zemin) },
    uSis:    { value: new THREE.Color(PALET.zemin) },
    uSisYakin:{ value: SIS_YAKIN }, uSisUzak:{ value: SIS_UZAK },
    uSeritGuc:{ value: 1.0 }, uSeritSik:{ value: 9.0 },
    uTema:   { value: TB ? 1.0 : 0.0 },
    // GUNDUZ (2 Eyl 2026): 0 = gece neon, 1 = acik alan gunduz.
    // Ortam basina gelir ve gecisle yumusar. Bkz. 07-mekan/acik-alan/ANALIZ.md
    uGunduz: { value: 0.0 },
  },
  vertexShader: `
    varying vec2 vUv; varying vec3 vGoz;
    void main(){
      vUv = uv;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vGoz = mv.xyz;              // fragment basina mesafe icin
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uKaydir; uniform vec3 uGrid, uGrid2, uGrid3, uZemin, uSis;
    uniform float uSisYakin, uSisUzak, uTema, uGunduz, uSeritGuc, uSeritSik;
    varying vec2 vUv; varying vec3 vGoz;
    float cizgi(float k, float sik, float kal){
      float f = abs(fract(k*sik - 0.5) - 0.5) / fwidth(k*sik);
      return 1.0 - smoothstep(0.0, kal, f);
    }
    void main(){
      // KOYU YOL + PARLAK SERITLER
      // Referans kanallarda zemin koyu, nota parlak. Bizde tersiydi ve
      // nota zeminle yarisiyordu. Artik izgara sadece derinlik ipucu,
      // asil parlaklik lane ayraclarinda.
      // Cizgi SAYISI kritik: sik cizgiler ufka dogru birbirine karisip
      // tek parlak yuzeye donusuyordu. Seyrek cizgi = koyu yol.
      float boyuna = cizgi(vUv.x, uSeritSik, 1.0);
      float enine  = cizgi(vUv.y + uKaydir, 16.0, 1.0);
      float g = max(boyuna * 0.40, enine * 0.16);
      // akan renk bantlari: tunel boyunca yumusak gecisli, 3 renkli
      // (tek renk izgara monoton duruyor; sert renk gecisi de bunaltir,
      //  bu yuzden sinus ile yumusak harmanlaniyor)
      float bantF = uTema > 0.5 ? 24.0 : 2.4;
      float f = ((vUv.y * bantF) + uKaydir * bantF) * 6.28318;
      // agirliklari sivrilt + normalize et: renkler birbirine karisip
      // beyaza kacmasin, doygun kalsin
      float w1 = pow(0.5 + 0.5*sin(f),          3.0);
      float w2 = pow(0.5 + 0.5*sin(f + 2.0944), 3.0);
      float w3 = pow(0.5 + 0.5*sin(f + 4.1888), 3.0);
      vec3 gr = (uGrid*w1 + uGrid2*w2 + uGrid3*w3) / max(w1+w2+w3, 0.001);
      // yol yuzeyi: merkeze dogru biraz daha koyu asfalt hissi
      float merkez = 1.0 - smoothstep(0.26, 0.48, abs(vUv.x - 0.5));
      // Yol her iki temada da KOYU. Olcum: referans karelerin %57'si
      // neredeyse siyah. Parlaklik yolda degil CIZGIDE.
      // uTema sadece kontrasti sertlestirir.
      float kuv = (uTema > 0.5 ? 1.45 : 1.0) * uSeritGuc;   // B'de cizgi daha kuvvetli; uSeritGuc ortam bazli kisar
      // B'de izgara YOLUN DISINA tasmaz. Referansta yolun disi bos uzay;
      // her yere yayilan izgara hem parlakligi hem dagitikligi artiriyordu.
      float gg = uTema > 0.5 ? max(boyuna * 0.40, enine * 0.16) * merkez : g;
      vec3 yol = uZemin * mix(0.85, 0.06, merkez);
      // GUNDUZ: yol koyu degil, gun isigi alan notr bir yuzey. Gece
      // formulundeki 0.06 carpani gunduz siyah bir seride donusuyordu.
      yol = mix(yol, mix(uZemin * 0.92, uZemin * 0.52, merkez), uGunduz);
      // HATA (26 Agu - 2 Eyl 2026): 'vec3' unutulmus, fragment shader hic
      // derlenmiyordu. Bu tarihler arasindaki tum render'larda zemin izgarasi
      // YOKTU - yol sadece yatak dokusundan ibaretti. Olculdu, tahmin degil:
      //   ERROR: 0:95: 'renk' : undeclared identifier
      vec3 renk = mix(yol, gr, min(1.0, gg * kuv));
      // parlama gucu: gunduz additive parlama beyaza doyuyor, kisiliyor
      renk += gr * gg * mix(uTema > 0.5 ? 0.26 : 0.16, 0.05, uGunduz) * uSeritGuc;
      float mesafe = length(vGoz);                    // FRAGMENT basina - dogru
      float sis = smoothstep(uSisYakin, uSisUzak, mesafe);
      // sise KAPANMIYOR, SAYDAMLASIYOR - yoksa arkadaki ufuk/gunes kapanir
      gl_FragColor = vec4(renk, 1.0 - sis);
      #include <colorspace_fragment>   // cikti renk uzayi - yoksa zemin arka plandan koyu kalir
    }`,
  transparent: true,
  depthWrite: false,
});
const zemin = new THREE.Mesh(new THREE.PlaneGeometry(34, 220, 1, 1), zeminMat);
zemin.rotation.x = -Math.PI/2;
zemin.position.z = -95;

// --- YOL PLATFORMU (B)
// Referansta yol boyali bir zemin degil, KALINLIGI OLAN yukseltilmis bir
// platform: yan yuzleri goruluyor, altinda ayri bir dunya zemini var ve
// yuzeyinde kesikli serit cizgileri akiyor. Bizde tek duz duzlem vardi.
const YOL_GEN = 7.0, YOL_KAL = 0.85, YAN_GEN = 27.0;
let yatak = null, yatakDoku = null, yolGovdeMesh = null;
let yanYatak = null, yanDoku = null, yatakGunduzDoku = null, yatakSerinDoku = null;
if (TB) {
  // dunya zemini asagi iniyor - yol onun uzerinde YUKSELIYOR
  zemin.position.y = -YOL_KAL;

  // govde: kalinligi olan kutu, yan yuzleri kameradan goruluyor
  yolGovdeMesh = new THREE.Mesh(
    new THREE.BoxGeometry(YOL_GEN, YOL_KAL, 220),
    new THREE.MeshBasicMaterial({ color:'#07060f', fog:true }));
  yolGovdeMesh.position.set(0, -YOL_KAL/2, -95);
  scene.add(yolGovdeMesh);

  // ust yuzey: TEK katman, normal harman.
  // Once additive bir katman vardi (kesikli otoyol cizgileri). Additive koyu
  // piksel eklemez - yani TRAVERS gibi zeminden koyu bir oge orada cizilemez.
  // Yatak normal harmana alininca additive katmana gerek kalmadi; ray, travers
  // ve kenar cizgisi hepsi ayni dokuda.

  // --- yatak: balast + enine traversler (normal harman)
  // Referans (FLEM metro deposu) yolun boyali bir serit degil, uzerinde
  // yuruunen bir YATAK oldugunu gosteriyor: sicak koyu balast, duzenli
  // araliklarla enine kirisler. Bizdeki kesikli beyaz otoyol cizgileri hem
  // yanlis mekani anlatiyordu hem de her ortamda ayniydi.
  const bc = document.createElement('canvas'); bc.width = 256; bc.height = 256;
  const bg = bc.getContext('2d');
  const bkar = (n) => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };
  bg.fillStyle = '#8c8c8c'; bg.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {            // balast taneleri - deterministik
    const r = bkar(i), r2 = bkar(i + 313);
    bg.fillStyle = r2 > 0.5 ? `rgba(255,255,255,${0.05 + r * 0.16})`
                            : `rgba(0,0,0,${0.05 + r * 0.18})`;
    bg.fillRect(r * 256, r2 * 256, 2, 2);
  }
  bg.fillStyle = 'rgba(0,0,0,0.72)';         // traversler
  for (let y = 0; y < 256; y += 32) bg.fillRect(0, y, 256, 11);
  // Gunduz icin AYRI bir yatak dokusu. Gece yataginda travers siyah, cunku
  // nota koyu bir yuzeyin uzerinde okunuyor. Gunduz acik alanda ayni doku
  // yolu olu bir gri seride ceviriyordu; referansta travers BAL RENGI ahsap,
  // balast acik gri. Yani gunduz yataginin degeri gece yataginin tersi.
  const gc = document.createElement('canvas'); gc.width = 256; gc.height = 256;
  const gg2 = gc.getContext('2d');
  gg2.fillStyle = '#9c9a94'; gg2.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {           // acik balast taneleri
    const r = bkar(i), r2 = bkar(i + 313);
    gg2.fillStyle = r2 > 0.5 ? `rgba(255,255,255,${0.06 + r * 0.20})`
                             : `rgba(60,52,40,${0.05 + r * 0.16})`;
    gg2.fillRect(r * 256, r2 * 256, 2, 2);
  }
  for (let y = 0; y < 256; y += 32) {       // bal rengi ahsap traversler
    gg2.fillStyle = '#c69a53'; gg2.fillRect(0, y, 256, 11);
    gg2.fillStyle = 'rgba(120,84,36,0.45)'; gg2.fillRect(0, y + 9, 256, 2);
  }
  for (let i = 0; i < 3; i++) {             // celik raylar - parlak
    const mx = (i + 0.5) * (256 / 3), ry = (256 / 3) * 0.55 / 2;
    for (const yon of [-1, 1]) {
      const x = mx + yon * ry;
      gg2.fillStyle = 'rgba(60,52,44,0.45)'; gg2.fillRect(x - 5, 0, 10, 256);
      gg2.fillStyle = 'rgba(255,255,255,0.88)'; gg2.fillRect(x - 1, 0, 3, 256);
    }
  }
  // raylar: traverslerin USTUNDE, serit basina bir cift. Celik grisi ve
  // NORMAL harman - additive denendi, yolu parlak bir merdivene cevirdi ve
  // notayla parlaklik yarisina girdi. Neon serit cizgileri zaten shader'da.
  const seritEn = 256 / 3, rayYari = seritEn * 0.55 / 2;
  for (let i = 0; i < 3; i++) {
    const mx = (i + 0.5) * seritEn;
    for (const yon of [-1, 1]) {
      const x = mx + yon * rayYari;
      bg.fillStyle = 'rgba(0,0,0,0.82)';     // rayin oturdugu golge
      bg.fillRect(x - 5, 0, 10, 256);
      bg.fillStyle = 'rgba(255,255,255,0.42)';   // celik govde
      bg.fillRect(x - 1, 0, 3, 256);
      bg.fillStyle = 'rgba(255,255,255,0.30)';   // ust yuz
      bg.fillRect(x - 1, 0, 1, 256);
    }
  }
  yatakDoku = new THREE.CanvasTexture(bc);
  yatakDoku.wrapS = yatakDoku.wrapT = THREE.RepeatWrapping;
  yatakDoku.repeat.set(1, 34);
  yatakGunduzDoku = new THREE.CanvasTexture(gc);
  yatakGunduzDoku.wrapS = yatakGunduzDoku.wrapT = THREE.RepeatWrapping;
  yatakGunduzDoku.repeat.set(1, 34);

  // SERIN GUNDUZ YATAGI (5 Eyl 2026). Olculdu: gunduz kareleri turuncu
  // %53-67 cikiyor ve bunun kaynagi ortam paleti DEGIL - bal rengi ahsap
  // travers (#c69a53) + sicak gri balast, karenin alt yarisini kapliyor.
  // Ortam kaydina renk eklemek bu yuzden sonucu degistirmedi.
  // Referansin parlak ailesi cyan; onu yakalamak icin yatagin da soguk
  // olmasi gerekiyor. Bu doku SADECE ortam 'yatak: "serin"' derse secilir,
  // varsayilan davranis ve biten bolumler aynen korunuyor.
  const sc = document.createElement('canvas'); sc.width = 256; sc.height = 256;
  const sg = sc.getContext('2d');
  sg.fillStyle = '#c3d4d8'; sg.fillRect(0, 0, 256, 256);      // acik soguk balast
  for (let i = 0; i < 900; i++) {
    const r = bkar(i), r2 = bkar(i + 313);
    sg.fillStyle = r2 > 0.5 ? `rgba(255,255,255,${0.08 + r * 0.22})`
                            : `rgba(40,64,72,${0.05 + r * 0.14})`;
    sg.fillRect(r * 256, r2 * 256, 2, 2);
  }
  for (let y = 0; y < 256; y += 32) {       // turkuaz-gri traversler
    sg.fillStyle = '#5f9aa6'; sg.fillRect(0, y, 256, 11);
    sg.fillStyle = 'rgba(30,72,84,0.42)'; sg.fillRect(0, y + 9, 256, 2);
  }
  for (let i = 0; i < 3; i++) {
    const mx = (i + 0.5) * (256 / 3), ry = (256 / 3) * 0.55 / 2;
    for (const yon of [-1, 1]) {
      const x = mx + yon * ry;
      sg.fillStyle = 'rgba(44,60,66,0.42)'; sg.fillRect(x - 5, 0, 10, 256);
      sg.fillStyle = 'rgba(255,255,255,0.92)'; sg.fillRect(x - 1, 0, 3, 256);
    }
  }
  yatakSerinDoku = new THREE.CanvasTexture(sc);
  yatakSerinDoku.wrapS = yatakSerinDoku.wrapT = THREE.RepeatWrapping;
  yatakSerinDoku.repeat.set(1, 34);

  // --- YAN HATLAR (sadece gunduz acik alanda)
  // Referansta yolun disi bos degil: duvara kadar balast ve YAN HATLAR
  // uzaniyor, toplam dort hat var. Ilk denemede yolun iki yani ozelliksiz
  // acik gri bir duzlemdi ve butun mekan basili bir kilim gibi okunuyordu -
  // kullanicinin hakli olarak "sacma" dedigi sey buydu.
  // Ayni dokunun genis tekrarlisi: ray araligi yolla ayni kaliyor.
  yanDoku = new THREE.CanvasTexture(gc);
  yanDoku.wrapS = yanDoku.wrapT = THREE.RepeatWrapping;
  yanDoku.repeat.set(YAN_GEN / YOL_GEN, 34);
  yanYatak = new THREE.Mesh(new THREE.PlaneGeometry(YAN_GEN, 220),
    new THREE.MeshBasicMaterial({ map: yanDoku, fog: true, transparent: true }));
  yanYatak.rotation.x = -Math.PI/2;
  yanYatak.position.set(0, -YOL_KAL + 0.01, -95);   // dunya zemini hizasinda
  yanYatak.renderOrder = 0;
  yanYatak.visible = false;                          // gunduzde acilir
  scene.add(yanYatak);
  yatak = new THREE.Mesh(new THREE.PlaneGeometry(YOL_GEN, 220),
    new THREE.MeshBasicMaterial({ map: yatakDoku, fog: true }));
  yatak.rotation.x = -Math.PI/2; yatak.position.set(0, 0.006, -95);
  yatak.renderOrder = 1;
  scene.add(yatak);

}

// ==================================================== ISTASYON KATMANI
// Sadece dekor 'ray' olan ortamlarda gorunur (RAIL YARD, MAGENTA HALL).
//
// Neden gerekti: iki 'ray' ortamini yan yana olctugumuzde ikisinde de baskin
// ton 240 derece ve %29-31 cikti; alti referans kanalda ise tek bir ton ailesi
// kareyi %44-62 domine ediyor. Yani sorun paletin degeri degil, mekanin
// KENDISININ ayirt edici olmamasiydi - iki ortam da ayni bos koridordu.
// FLEM referans karesinde mekani kuran sey yan duvar degil, yolun iki yanindaki
// DOLU hacim: park etmis vagonlar ve onlarin arkasindaki peron seddi.

// ==================================================== ACIK ALAN GEOMETRISI
// Kullanici geri bildirimi (2 Eyl 2026): "gercek bir yapi istiyorum ama cok
// sanal olmus". Haklıydi. Viyaduk duvari DUZ BIR DUZLEME CIZILMIS RESIMDI:
// kemerin derinligi yoktu, ayaklar birbirini kapatmiyordu, paralaks yoktu.
// Referansta ayaklar ilerledikce birbirinin onunden geciyor ve kemerin ic
// yuzeyi (soffit) goruunuyor - yapiyi "gercek" yapan sey bu.
//
// Artik gercek geometri:
//   - her acikliK bir EXTRUDE edilmis kemer gozu (kalinligi olan duvar)
//   - direkler ayri kutular, konsol kollariyla
//   - yan hatlarin raylari uzun kutular
// ve sahneye ISIK eklendi. MeshBasicMaterial isik almadigi icin extrude
// edilmis geometri de duz gorunurdu; Lambert + yonlu isik olmadan derinlik
// ORTAYA CIKMIYOR. Isiklar yalnizca bu katmani etkiler, geri kalan sahne
// hala Basic materyal kullaniyor.
const acikBaylar = [], acikRaylar = [];
let acikKok = null, travers3d = null, balastZemin = null, cakil3d = null;
let ufukSilueti = null;
if (TB && !SADE) {
  // Ambient yuksek olunca butun yuzler ayni deger cikiyor ve extrude edilmis
  // geometri yine duz gorunuyor. Bicimi ortaya cikaran sey yonlu isikla
  // ambient arasindaki FARK.
  // Gunes acisi (3 Eyl 2026, kullanici istegi): ambient dusuk, yonlu isik
  // yuksek. Ambient her yuzu esit aydinlatir ve bicimi YOK EDER; hacmi
  // ortaya cikaran sey ikisi arasindaki fark. Gunes ayrica ALCALTILDI:
  // tepeden gelen isik kisa golge verir, alcak gunes uzun ve okunakli.
  scene.add(new THREE.AmbientLight(0xffffff, 0.58));
  const gunes3d = new THREE.DirectionalLight(0xffffff, 1.62);
  gunes3d.position.set(-38, 19, 13);
  gunes3d.target.position.set(0, 0, -26);
  scene.add(gunes3d.target);
  gunes3d.castShadow = true;
  // Golge kamerasi SADECE yakin alani kapsiyor: uzak koridorda golge zaten
  // okunmuyor, buyuk kutu golge cozunurlugunu bosa harciyor.
  gunes3d.shadow.mapSize.set(1024, 1024);
  const sc = gunes3d.shadow.camera;
  sc.left = -30; sc.right = 30; sc.top = 34; sc.bottom = -22;
  sc.near = 1; sc.far = 120;
  gunes3d.shadow.bias = -0.0012;
  scene.add(gunes3d);

  // --- BALAST ZEMINI
  // Shader'li 'zemin' duzlemi ozel materyal oldugu icin golge alamiyor.
  // Gunduzde onun yerine golge alan gercek bir Lambert duzlem geciyor;
  // ayrica taneli bir dokusu var - duz gri yuzey de "bos" duruyordu.
  {
    const bc2 = document.createElement('canvas'); bc2.width = bc2.height = 256;
    const bg2 = bc2.getContext('2d');
    const kr = (n) => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };
    // Cakil: her tas AYRI cizilir - aydinlik ust yuz + koyu golge kenari.
    // Duz serpme noktalar "kum" gibi okunuyordu; tasi tas yapan sey
    // uzerindeki isik/golge cifti.
    bg2.fillStyle = '#6f6c65'; bg2.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 1500; i++) {
      const a1 = kr(i) * 256, a2 = kr(i + 313) * 256, a3 = kr(i + 77);
      const r1 = 2.4 + a3 * 4.6;
      bg2.fillStyle = `rgba(28,25,21,${0.35 + a3 * 0.35})`;    // golge
      bg2.beginPath(); bg2.ellipse(a1 + r1 * 0.35, a2 + r1 * 0.40, r1, r1 * 0.82, a3 * 3, 0, 6.2832); bg2.fill();
      const t1 = 118 + kr(i + 41) * 92;                         // tas govdesi
      bg2.fillStyle = `rgb(${t1|0},${(t1 - 4)|0},${(t1 - 14)|0})`;
      bg2.beginPath(); bg2.ellipse(a1, a2, r1, r1 * 0.82, a3 * 3, 0, 6.2832); bg2.fill();
      bg2.fillStyle = `rgba(255,255,255,${0.16 + kr(i + 5) * 0.26})`;   // ust yuz
      bg2.beginPath(); bg2.ellipse(a1 - r1 * 0.24, a2 - r1 * 0.28, r1 * 0.46, r1 * 0.34, a3 * 3, 0, 6.2832); bg2.fill();
    }
    const bd = new THREE.CanvasTexture(bc2);
    bd.wrapS = bd.wrapT = THREE.RepeatWrapping;
    bd.repeat.set(9, 82);
    balastZemin = new THREE.Mesh(new THREE.PlaneGeometry(46, 240),
      new THREE.MeshLambertMaterial({ map: bd, fog: true }));
    balastZemin.rotation.x = -Math.PI / 2;
    balastZemin.position.set(0, -0.13, -95);
    balastZemin.receiveShadow = true;
    balastZemin.visible = false;
    scene.add(balastZemin);
    window.__BALAST = bd;
  }

  // ==================================================== UFUK SILUETI
  // Kullanici (3 Eyl 2026): "raylarin sonuna dogru gokyuzu goruunuyor,
  // bu iyi ama cok bos". Koridor bitiyor ve arkasi bostu; bakisin
  // durdugu yerde hicbir sey yoktu. Ufka istasyon hangarlari, su kulesi,
  // vinc ve uzak bloklar konuldu - siluet halinde, puslu.
  {
    const c3 = document.createElement('canvas'); c3.width = 1024; c3.height = 256;
    const g3 = c3.getContext('2d');
    const kr3 = (n) => { const v = Math.sin(n * 63.7) * 43758.5453; return v - Math.floor(v); };
    g3.clearRect(0, 0, 1024, 256);
    // uzak bloklar
    for (let i = 0; i < 26; i++) {
      const x = kr3(i) * 1024, w = 30 + kr3(i + 9) * 70, h = 40 + kr3(i + 21) * 110;
      g3.fillStyle = `rgba(70,78,92,${0.42 + kr3(i + 3) * 0.22})`;
      g3.fillRect(x, 256 - h, w, h);
    }
    // istasyon hangarlari: genis kemerli catilar
    for (let i = 0; i < 4; i++) {
      const cx = 150 + i * 240, w = 190, h = 92;
      g3.fillStyle = 'rgba(52,58,70,0.82)';
      g3.beginPath();
      g3.moveTo(cx - w / 2, 256);
      g3.lineTo(cx - w / 2, 256 - h * 0.55);
      g3.quadraticCurveTo(cx, 256 - h * 1.35, cx + w / 2, 256 - h * 0.55);
      g3.lineTo(cx + w / 2, 256);
      g3.closePath(); g3.fill();
    }
    // su kulesi
    g3.fillStyle = 'rgba(46,52,62,0.9)';
    g3.fillRect(690, 120, 14, 136); g3.fillRect(722, 120, 14, 136);
    g3.fillRect(676, 92, 74, 34);
    // vinc
    g3.fillStyle = 'rgba(58,64,76,0.88)';
    g3.fillRect(880, 70, 10, 186);
    g3.fillRect(806, 70, 150, 9);
    g3.fillRect(898, 79, 6, 40);
    const d3 = new THREE.CanvasTexture(c3);
    ufukSilueti = new THREE.Mesh(new THREE.PlaneGeometry(230, 58),
      new THREE.MeshBasicMaterial({ map: d3, transparent: true,
        depthWrite: false, fog: true }));
    ufukSilueti.position.set(0, 12.0, -108);
    ufukSilueti.visible = false;
    scene.add(ufukSilueti);

  }

  acikKok = new THREE.Group();
  // ==================================================== CAKIL TASLARI
  // Doku tek basina yetmiyor: duz bir duzlemin uzerine cizilen tas, yandan
  // bakildiginda hala DUZ. Yakin planda balastin siluetini kiran sey
  // taslarin kendi hacmi. Ucgen sayisi dusuk tutuldu (Icosahedron detay 0
  // = 20 ucgen) ve sadece YAKIN alana serpildi; uzakta doku zaten yetiyor.
  // Golge dusurmuyorlar - 900 golge dokumu yazilim rasterlestiricide cok
  // pahali; kabartmayi Lambert'in yuz aydinlatmasi veriyor.
  {
    const tasGeo = new THREE.IcosahedronGeometry(0.115, 0);
    const TAS_SAY = 900, TAS_Z = 62;
    cakil3d = new THREE.InstancedMesh(tasGeo,
      new THREE.MeshLambertMaterial({ color: '#9b978d', fog: true }), TAS_SAY);
    cakil3d.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    cakil3d.frustumCulled = false;
    cakil3d.visible = false;
    scene.add(cakil3d);
    window.__CAKIL = { say: TAS_SAY, z: TAS_Z };
  }

  acikKok.visible = false;
  scene.add(acikKok);

  // OLCEK. Sahnenin birimi metre DEGIL: siluet govdesi 4,7 birim = ~1,75 m,
  // yani 1 birim ~ 0,37 m. Ilk denemede duvar 6,6 birim yapildi - gercekte
  // 2,4 metrelik bir duvar, yani beline geliyordu ve ufukta kayboluyordu.
  // Referans oranlari (kisi boyuna gore olculdu): duvar ~2,5 boy, kemer
  // aciklik ~2 boy, ayak araligi ~1,8 boy.
  const BAY_Z = 8.6, BAY_SAY = 16;
  const YER = -0.85;                       // dunya zemini

  const kutuGeo = new THREE.BoxGeometry(1, 1, 1);
  const yap = (renk) => new THREE.MeshLambertMaterial({ color: renk, fog: true });

  // ==================================================== YUZEY DOKULARI
  // Kullanici (3 Eyl 2026): "hala cok sanal duruyor". Sebep aydinlatma
  // degil YUZEY: her sey duz renkli kutuydu. Duz renkli kutu, ne kadar
  // dogru yerlestirilirse yerlestirilsin, kutu gibi gorunur. Gercekcilik
  // hissini veren sey yuzeyin uzerindeki bilgi: derz, panel, cizik, pas.
  const kr = (n) => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };

  // beton: panel derzleri + leke + hafif tane
  function betonDoku(){
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2200; i++) {            // tane
      const a1 = kr(i), a2 = kr(i + 51), a3 = kr(i + 91);
      g.fillStyle = a3 > 0.5 ? 'rgba(255,255,255,0.16)' : 'rgba(40,36,30,0.13)';
      g.fillRect(a1 * 256, a2 * 256, 2, 2);
    }
    g.strokeStyle = 'rgba(30,26,22,0.34)'; g.lineWidth = 3;   // panel derzleri
    for (let y = 0; y < 256; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke(); }
    for (let x = 0; x < 256; x += 128) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 256); g.stroke(); }
    g.strokeStyle = 'rgba(255,255,255,0.20)'; g.lineWidth = 1;
    for (let y = 3; y < 256; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke(); }
    for (let i = 0; i < 12; i++) {              // akma lekeleri
      const x = kr(i + 7) * 256, w = 6 + kr(i + 3) * 16;
      g.fillStyle = 'rgba(45,40,34,0.10)';
      g.fillRect(x, kr(i + 19) * 180, w, 40 + kr(i + 23) * 70);
    }
    const d = new THREE.CanvasTexture(c);
    d.wrapS = d.wrapT = THREE.RepeatWrapping;
    return d;
  }

  // tren govdesi: pencere serisi + kapi + alt-ust kusak + dikey nervurler
  function trenDoku(){
    const c = document.createElement('canvas'); c.width = 512; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 512, 128);
    g.fillStyle = 'rgba(0,0,0,0.10)';                    // dikey nervurler
    for (let x = 0; x < 512; x += 16) g.fillRect(x, 0, 2, 128);
    g.fillStyle = 'rgba(20,26,32,0.92)';                 // pencere bandi
    for (let x = 26; x < 512; x += 62) g.fillRect(x, 30, 40, 34);
    g.fillStyle = 'rgba(255,255,255,0.22)';              // cam yansimasi
    for (let x = 26; x < 512; x += 62) g.fillRect(x, 32, 40, 8);
    g.fillStyle = 'rgba(0,0,0,0.30)';                    // kapi hatlari
    for (let x = 150; x < 512; x += 248) { g.fillRect(x, 20, 3, 96); g.fillRect(x + 44, 20, 3, 96); }
    g.fillStyle = 'rgba(0,0,0,0.22)';                    // alt kusak
    g.fillRect(0, 100, 512, 10);
    g.fillStyle = 'rgba(255,255,255,0.16)';              // ust kusak
    g.fillRect(0, 14, 512, 5);
    const d = new THREE.CanvasTexture(c);
    d.wrapS = d.wrapT = THREE.RepeatWrapping;
    return d;
  }

  const DOKU_BETON = betonDoku(), DOKU_TREN = trenDoku();
  const yapD = (renk, doku, tekrar) => {
    const m = new THREE.MeshLambertMaterial({ color: renk, map: doku, fog: true });
    return m;
  };

  // ============================================ ISTASYON PERONU + SUNDURMA
  // Kullanici karari (3 Eyl 2026). Referansin kemerli viyaduguyle AYNI
  // gorunmesin istendi; yapi gercek olsun ama baska bir yer olsun.
  // Parcalar: peron seddi (kenarinda sari guvenlik seridi) - demir kolonlar
  // - kolonlarin uzerinde sacak - sacak altinda asili lambalar - kolonlarda
  // tabelalar. Iki sacagin arasi ACIK: gokyuzu oradan goruunuyor.
  const PERON_IC = 10.4, PERON_DIS = 20.0;   // peronun ic ve dis kenari
  const PERON_UST = 2.2;                     // peron yuzeyi (ray ustu ~0,8 m)
  const KOLON_X = 11.6, SACAK_Y = 9.6;

  for (let i = 0; i < BAY_SAY; i++) {
    for (const yon of [-1, 1]) {
      const g = new THREE.Group();
      const om = (PERON_IC + PERON_DIS) / 2;

      // peron seddi: yoldan yukselen dolu hacim
      const betonM = new THREE.MeshLambertMaterial({ color: '#ffffff', fog: true });
      betonM.map = DOKU_BETON.clone();
      betonM.map.wrapS = betonM.map.wrapT = THREE.RepeatWrapping;
      betonM.map.repeat.set(2, 2);
      const peron = new THREE.Mesh(kutuGeo, betonM);
      peron.scale.set(PERON_DIS - PERON_IC, PERON_UST + 0.85, BAY_Z);
      peron.position.set(yon * om, (PERON_UST - 0.85) / 2, BAY_Z / 2);
      g.add(peron);

      // peron kenari: ic yuzde koyu bir seritle biten sedde agzi
      const agiz = new THREE.Mesh(kutuGeo, yap('#ffffff'));
      agiz.scale.set(0.45, PERON_UST + 0.85, BAY_Z);
      agiz.position.set(yon * (PERON_IC + 0.22), (PERON_UST - 0.85) / 2, BAY_Z / 2);
      g.add(agiz);

      // sari guvenlik seridi: peron yuzeyinde, kenara paralel
      const serit = new THREE.Mesh(kutuGeo, yap('#f2c53d'));
      serit.scale.set(0.9, 0.06, BAY_Z);
      serit.position.set(yon * (PERON_IC + 0.85), PERON_UST + 0.03, BAY_Z / 2);
      g.add(serit);

      // demir kolon: dikey metronom. Her bayde bir.
      const kolon = new THREE.Mesh(kutuGeo, yap('#ffffff'));
      kolon.scale.set(0.52, SACAK_Y - PERON_UST, 0.52);
      kolon.position.set(yon * KOLON_X, (SACAK_Y + PERON_UST) / 2, BAY_Z * 0.3);
      g.add(kolon);

      // kolon basligi: sacagi tasiyan konsol
      const baslik = new THREE.Mesh(kutuGeo, yap('#ffffff'));
      baslik.scale.set(2.6, 0.34, 0.7);
      baslik.position.set(yon * (KOLON_X - 0.6), SACAK_Y - 0.35, BAY_Z * 0.3);
      g.add(baslik);

      // sacak: kolonlarin uzerinde, yola dogru tasiyor. Ic kenari
      // +-9,5'te bitiyor - iki sacagin arasi acik gokyuzu.
      const sacak = new THREE.Mesh(kutuGeo, yap('#ffffff'));
      // Sacagin IC kenari gogun ne kadar goruundugunu belirliyor. 9,5'te
      // iki sacak ustte birlesip yine tunel yapiyordu.
      sacak.scale.set(PERON_DIS - 10.8, 0.40, BAY_Z);
      sacak.position.set(yon * ((10.8 + PERON_DIS) / 2), SACAK_Y, BAY_Z / 2);
      g.add(sacak);

      // sacak alni: on kenardaki dik bant - sacaga kalinlik verir
      const alin = new THREE.Mesh(kutuGeo, yap('#ffffff'));
      alin.scale.set(0.26, 0.62, BAY_Z);
      alin.position.set(yon * 10.92, SACAK_Y - 0.42, BAY_Z / 2);
      g.add(alin);

      // asili lamba: sacagin altinda, iki bayde bir
      let lamba = null;
      if (i % 2 === 0) {
        lamba = new THREE.Mesh(kutuGeo, yap('#fff3d0'));
        lamba.scale.set(1.5, 0.22, 0.5);
        lamba.position.set(yon * 11.0, SACAK_Y - 0.95, BAY_Z * 0.7);
        g.add(lamba);
      }

      // tabela: kolonun yola bakan yuzunde
      let tabela = null;
      if (i % 2 === 1) {
        tabela = new THREE.Mesh(kutuGeo, yap('#ffffff'));
        tabela.scale.set(0.12, 0.72, 2.0);
        tabela.position.set(yon * (KOLON_X - 0.36), 6.4, BAY_Z * 0.3);
        g.add(tabela);
      }

      // ==================================== ISTASYON DONANIMI
      // Kullanici (3 Eyl 2026): "resimler bici bos gozukuyor, bulundugun
      // ortama gore eklemeler yap". Mekan dogru kurulmustu ama BOSTU:
      // peron yuzeyi duz bir ochre kutle, arkasi hicbir sey.
      // Esyalar bay'e bagli oldugu icin koridorla birlikte akiyor;
      // farkli bay'lere farkli esya konuyor ki tekrar hissi olusmasin.
      const ek = [];

      // arka duvar: peronun bittigi yerde. Yanlari kapatan sey bu; olmayinca
      // peron bosluga bakiyordu.
      const duvarM = new THREE.MeshLambertMaterial({ color: '#ffffff', fog: true });
      duvarM.map = DOKU_BETON.clone();
      duvarM.map.wrapS = duvarM.map.wrapT = THREE.RepeatWrapping;
      duvarM.map.repeat.set(2, 3);
      const arkaDuvar = new THREE.Mesh(kutuGeo, duvarM);
      arkaDuvar.scale.set(0.5, SACAK_Y - PERON_UST, BAY_Z);
      arkaDuvar.position.set(yon * (PERON_DIS - 0.25), (SACAK_Y + PERON_UST) / 2, BAY_Z / 2);
      g.add(arkaDuvar); ek.push([arkaDuvar, 'duvarKoyu']);

      // arka duvarda kapi nisi - iki bayde bir
      if (i % 2 === 0) {
        const kapi = new THREE.Mesh(kutuGeo, yap('#ffffff'));
        kapi.scale.set(0.18, 3.4, 1.9);
        kapi.position.set(yon * (PERON_DIS - 0.58), PERON_UST + 1.7, BAY_Z * 0.55);
        g.add(kapi); ek.push([kapi, 'nis']);
      }

      // bank: oturma yuzeyi + iki ayak
      if (i % 3 === 0) {
        const bz = BAY_Z * 0.62;
        const otur = new THREE.Mesh(kutuGeo, yap('#ffffff'));
        otur.scale.set(1.0, 0.16, 2.6);
        otur.position.set(yon * 16.2, PERON_UST + 0.85, bz);
        g.add(otur); ek.push([otur, 'silme']);
        const arkalik = new THREE.Mesh(kutuGeo, yap('#ffffff'));
        arkalik.scale.set(0.16, 0.9, 2.6);
        arkalik.position.set(yon * 16.7, PERON_UST + 1.3, bz);
        g.add(arkalik); ek.push([arkalik, 'silme']);
        for (const dz of [-0.95, 0.95]) {
          const ayak = new THREE.Mesh(kutuGeo, yap('#3f3a34'));
          ayak.scale.set(0.75, 0.85, 0.16);
          ayak.position.set(yon * 16.2, PERON_UST + 0.42, bz + dz);
          g.add(ayak);
        }
      }

      // sandik yigini - peronda bekleyen yuk
      if (i % 3 === 1) {
        const bz = BAY_Z * 0.35;
        const s1 = new THREE.Mesh(kutuGeo, yap('#8a6b45'));
        s1.scale.set(1.5, 1.1, 1.5);
        s1.position.set(yon * 15.0, PERON_UST + 0.55, bz);
        g.add(s1);
        const s2 = new THREE.Mesh(kutuGeo, yap('#7a5c39'));
        s2.scale.set(1.15, 0.85, 1.2);
        s2.position.set(yon * 15.2, PERON_UST + 1.52, bz + 0.2);
        g.add(s2);
      }

      // cop kutusu
      if (i % 3 === 2) {
        const kutu = new THREE.Mesh(kutuGeo, yap('#4a5560'));
        kutu.scale.set(0.75, 1.25, 0.75);
        kutu.position.set(yon * 13.4, PERON_UST + 0.62, BAY_Z * 0.8);
        g.add(kutu);
      }

      // sinyal diregi: yolun kenarinda, tepesinde lamba kutusu
      let sinyal = null;
      if (i % 4 === 1) {
        sinyal = new THREE.Mesh(kutuGeo, yap('#39413c'));
        sinyal.scale.set(0.26, 5.4, 0.26);
        sinyal.position.set(yon * 10.0, 2.7, BAY_Z * 0.15);
        g.add(sinyal);
        const kafa = new THREE.Mesh(kutuGeo, yap('#22282a'));
        kafa.scale.set(0.6, 1.5, 0.5);
        kafa.position.set(yon * 10.0, 5.7, BAY_Z * 0.15);
        g.add(kafa);
        const isik = new THREE.Mesh(kutuGeo, yap('#4ad07a'));
        isik.scale.set(0.3, 0.3, 0.12);
        isik.position.set(yon * 10.0, 5.9, BAY_Z * 0.15 - 0.28);
        g.add(isik);
      }

      // ==================================== YAN HATTA DURAN TREN
      // Kullanici (3 Eyl 2026): "tren raylarinda trenlerin olmasi
      // gerekmiyor mu?" Gerekiyordu - raylar bostu.
      // Onceki halde vagon tek duz kirmizi kutuydu ve konteynere benziyordu.
      // Simdi: dokulu govde (pencere bandi, kapilar, nervurler) + cati +
      // catı ustu ekipman + BOJI TEKERLEKLERI. Tekerlekler rayin uzerine
      // oturuyor - treni yola BAGLAYAN sey o.
      // Uc bay boyunca surekli: iki bayde govde, ucuncude bosluk kalirsa
      // tren kesik kesik okunuyordu.
      // Tren KESINTILI olmali: bosluksuz tren iki yani boydan boya kapatiyor
      // ve arkadaki istasyon hic gorunmuyor. Iki yan da farkli yerde duruyor
      // ki kare simetrik bir koridora donusmesin.
      const rIdx = (yon < 0) ? (i % 16) : ((i + 9) % 16);
      const rUzun = (yon < 0) ? 6 : 5;
      const trenVar = rIdx < rUzun;
      if (trenVar) {
        // Z-FIGHTING (3 Eyl 2026): parcalar tam BAY_Z uzunluktaydi ve
        // komsu parcanin yuzuyle TAM CAKISIYORDU. Ayni duzlemde iki yuz
        // olunca derinlik tamponu hangisinin onde oldugunu secemiyor ve
        // yuz kare kare siyaha/kendi rengine atliyor - kullanicinin
        // "trenin on tarafinda renk aniden siyah olup duruyor" dedigi sey.
        // Cozum: parcalari BINDIR, sinirda cakisik yuz kalmasin.
        const UZ = BAY_Z + 0.4, TY = 7.8;           // hat merkezi
        const ilkBay = rIdx === 0, sonBay = rIdx === rUzun - 1;
        const govde = new THREE.Mesh(kutuGeo,
          new THREE.MeshLambertMaterial({ color: '#ffffff', map: DOKU_TREN, fog: true }));
        govde.material.map = DOKU_TREN.clone();
        govde.material.map.wrapS = govde.material.map.wrapT = THREE.RepeatWrapping;
        govde.material.map.repeat.set(1.6, 1);
        govde.scale.set(3.0, 3.3, UZ);
        govde.position.set(yon * TY, 2.35, BAY_Z / 2);
        g.add(govde); ek.push([govde, 'kaide']);

        const cati = new THREE.Mesh(kutuGeo, yap('#b9bec2'));
        cati.scale.set(3.12, 0.26, UZ);
        cati.position.set(yon * TY, 4.11, BAY_Z / 2);
        g.add(cati);

        // cati ustu ekipman: klima / pantograf kaidesi
        if (i % 4 === 1) {
          const kl = new THREE.Mesh(kutuGeo, yap('#8d9296'));
          kl.scale.set(1.7, 0.5, 2.4);
          kl.position.set(yon * TY, 4.48, BAY_Z * 0.5);
          g.add(kl);
        }

        // KABIN: trenin iki ucu. Onceki halde tren aniden kesiliyordu ve
        // kesit yuzu duz doku olarak kaliyordu - "on taraf" diye okunacak
        // bir sey yoktu. Metro setlerinin iki ucunda da kabin vardir.
        for (const uc of [ilkBay ? 0 : null, sonBay ? 1 : null]) {
          if (uc === null) continue;
          const zk = uc === 0 ? -0.1 : BAY_Z + 0.1;
          const kabin = new THREE.Mesh(kutuGeo, yap('#ffffff'));
          kabin.scale.set(3.06, 3.36, 0.5);
          kabin.position.set(yon * TY, 2.35, zk);
          g.add(kabin); ek.push([kabin, 'duvarKoyu']);
          const cam2 = new THREE.Mesh(kutuGeo, yap('#1d2630'));
          cam2.scale.set(2.3, 1.15, 0.14);
          cam2.position.set(yon * TY, 3.15, zk + (uc === 0 ? -0.22 : 0.22));
          g.add(cam2);
          const far = new THREE.Mesh(kutuGeo, yap('#ffe9b8'));
          far.scale.set(0.42, 0.30, 0.12);
          far.position.set(yon * TY - 0.95, 1.35, zk + (uc === 0 ? -0.24 : 0.24));
          g.add(far);
          const far2 = far.clone(); far2.position.x = yon * TY + 0.95;
          g.add(far2);
        }

        // etek: govdenin altinda koyu bant - tekerlek boslugunu kapatir
        const etek = new THREE.Mesh(kutuGeo, yap('#31373b'));
        etek.scale.set(2.86, 0.75, UZ);
        etek.position.set(yon * TY, 0.85, BAY_Z / 2);
        g.add(etek);

        // BOJI: her bayde iki tekerlek cifti, raya oturuyor
        for (const dz of [BAY_Z * 0.22, BAY_Z * 0.78]) {
          for (const dx of [-1.2, 1.2]) {
            const tk = new THREE.Mesh(kutuGeo, yap('#23282b'));
            tk.scale.set(0.28, 0.86, 0.86);
            tk.position.set(yon * TY + dx, 0.50, dz);
            g.add(tk);
          }
        }
      }

      // SINYAL KOPRUSU: raylarin UZERINDEN gecen enine kafes + sinyal
      // kafalari. Uzak koridoru dolduran ve derinligi olceklendiren sey bu;
      // bos gokyuzune bakan bakisin onune ritimli bir yapi koyuyor.
      // Sadece bir tarafin dongusunde kuruluyor - iki kez cizilmesin.
      if (yon < 0 && i % 4 === 2) {
        const kY = 7.6;
        const kiris1 = new THREE.Mesh(kutuGeo, yap('#4d565c'));
        kiris1.scale.set(21.0, 0.34, 0.34);
        kiris1.position.set(0, kY, BAY_Z * 0.5);
        g.add(kiris1);
        const kiris2 = new THREE.Mesh(kutuGeo, yap('#3f474c'));
        kiris2.scale.set(21.0, 0.26, 0.26);
        kiris2.position.set(0, kY - 0.95, BAY_Z * 0.5);
        g.add(kiris2);
        // capraz baglantilar
        for (let k = -4; k <= 4; k++) {
          const capraz = new THREE.Mesh(kutuGeo, yap('#454e54'));
          capraz.scale.set(0.15, 1.15, 0.15);
          capraz.position.set(k * 2.4, kY - 0.48, BAY_Z * 0.5);
          capraz.rotation.z = (k % 2 ? 0.42 : -0.42);
          g.add(capraz);
        }
        // ayaklar
        for (const dx of [-10.2, 10.2]) {
          const ayak2 = new THREE.Mesh(kutuGeo, yap('#454e54'));
          ayak2.scale.set(0.42, kY, 0.42);
          ayak2.position.set(dx, kY / 2, BAY_Z * 0.5);
          g.add(ayak2);
        }
        // sinyal kafalari: her hattin uzerinde bir tane
        for (const dx of [-3.4, 3.4]) {
          const kafa2 = new THREE.Mesh(kutuGeo, yap('#22282a'));
          kafa2.scale.set(0.5, 1.35, 0.42);
          kafa2.position.set(dx, kY - 1.75, BAY_Z * 0.5);
          g.add(kafa2);
          const isik2 = new THREE.Mesh(kutuGeo, yap(dx < 0 ? '#4ad07a' : '#e8563f'));
          isik2.scale.set(0.26, 0.26, 0.10);
          isik2.position.set(dx, kY - 1.45, BAY_Z * 0.5 + 0.24);
          g.add(isik2);
        }
      }

      // kablo kanali: yol boyunca uzanan surekli beton oluk
      const kanal = new THREE.Mesh(kutuGeo, yap('#6e6a62'));
      kanal.scale.set(0.75, 0.42, BAY_Z);
      kanal.position.set(yon * 10.05, 0.05, BAY_Z / 2);
      g.add(kanal);

      // Golge: peron, kolon, sacak ve esyalar golge DUSURUR; peron yuzeyi
      // ayrica golge ALIR (uzerindeki bank ve sandigin golgesi orada olusur).
      g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

      acikKok.add(g);
      acikBaylar.push({ g, i, yon, peron, agiz, serit, kolon, baslik,
                        sacak, alin, lamba, tabela, ek });
    }
  }

  // --- KATENER TELLERI: direk tepelerinden gecen uzun ince cubuklar.
  // Referansta gokyuzunu yay yay kesip kacis noktasina giden en guclu
  // cizgi seti bunlar - hem de nota alaninin USTUNDE, oyunu kapatmiyorlar.
  for (const yon of [-1, 1]) {
    for (let j = 0; j < 3; j++) {
      const tel = new THREE.Mesh(kutuGeo,
        new THREE.MeshLambertMaterial({ color: '#8c99a8', fog: true }));
      tel.scale.set(0.09, 0.09, 220);
      tel.position.set(yon * (7.4 - j * 0.85), 9.6 - j * 0.30, -95);
      acikKok.add(tel); acikRaylar.push(tel);
    }
  }

  // ================================================ GERCEK YOL: BALAST + TRAVERS + RAY
  // Kullanici geri bildirimi (3 Eyl 2026): "yerde engel istiyorum, ray
  // istiyorum, sen bana farkli sey yapiyorsun". Haklıydi.
  // Referansta zemin BOYALI BIR DOKU DEGIL, yolun kendisi:
  //   - cakil balast (iri taneli, dokusu goruunuyor)
  //   - uzerine ENINE ahsap traversler, aralarindan balast goruunuyor
  //   - traverslerin uzerinde kalin parlak celik raylar
  // En yakin traversler kocaman ve tek tek sayilabiliyor. Bizde doku ufka
  // dogru eriyip duz bir yuzeye donusuyordu; "sanal" hissinin kaynagi buydu.
  //
  // Oyuncu ORTA HATTIN raylari ARASINDA kosuyor - referansta da oyle.
  // Lane'ler +-2,2'de, orta hat raylari +-3,4'te: notalar rayin icinde kaliyor.
  // Travers ile balast arasinda DEGER farki olmali. Ilk denemede ikisi de
  // ayni ton cikti ve zemin tahta bir guverte gibi okundu; traversler
  // birbirinden ayrilmiyordu.
  // Travers YUKSEKLIGI kritik: 0,30'da alcak kamera acisinda yan yuzler
  // aradaki bosluklari kapatiyor ve zemin kesintisiz kahverengi bir
  // guverteye donusuyor. Alcak travers + genis aralik = balast gorunur.
  // Travers KALINLIGI ve balast derinligi birlikte calisiyor: kalin
  // travers + derin kuyu = alcak acidan yan yuzler bosluklari kapatiyor
  // ve zemin kesintisiz tahta guverte oluyor. Ince travers + sig kuyu.
  const TRAVERS_ARA = 1.50, TRAVERS_SAY = 76;
  const travGeo = new THREE.BoxGeometry(25.0, 0.12, 0.50);
  travers3d = new THREE.InstancedMesh(travGeo,
    new THREE.MeshLambertMaterial({ color: '#8a6b45', fog: true }), TRAVERS_SAY);
  travers3d.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  travers3d.frustumCulled = false;
  travers3d.castShadow = true; travers3d.receiveShadow = true;
  acikKok.add(travers3d);
  window.__TRAVERS = { ara: TRAVERS_ARA, say: TRAVERS_SAY };

  // --- RAYLAR
  // Ilk denemede 0,19 x 0,20'lik yassi cubuklardi ve bu mesafede yol cizgisi
  // gibi okunuyorlardi. Rayi ray yapan sey UC parca:
  //   1) yuksek ve dar govde (web)  2) parlayan ust yuz (mantar)
  //   3) altindaki koyu taban plakasi - rayi traversten AYIRAN golge
  // Ucu de ayri kutu; toplam 3 x 6 = 18 mesh, ucuz.
  // NOT: yan hat raylari once 10,9'daydi ve peronun (ic kenar 10,4) ALTINA
  // giriyordu. Hat merkezi 7,8, aciklik 2,4 -> raylar 6,6 ve 9,0.
  for (const rx of [-3.4, 3.4, -6.6, -9.0, 6.6, 9.0]) {
    const taban = new THREE.Mesh(kutuGeo,
      new THREE.MeshLambertMaterial({ color: '#3a3a38', fog: true }));
    taban.scale.set(0.44, 0.10, 220);
    taban.position.set(rx, 0.07, -95);
    taban.castShadow = true; taban.receiveShadow = true;
    acikKok.add(taban); acikRaylar.push(taban);

    const govde = new THREE.Mesh(kutuGeo,
      new THREE.MeshLambertMaterial({ color: '#8e9499', fog: true }));
    govde.scale.set(0.15, 0.34, 220);
    govde.position.set(rx, 0.24, -95);
    govde.castShadow = true;
    acikKok.add(govde); acikRaylar.push(govde);

    const mantar = new THREE.Mesh(kutuGeo,
      new THREE.MeshLambertMaterial({ color: '#eef2f6', fog: true }));
    mantar.scale.set(0.26, 0.09, 220);
    mantar.position.set(rx, 0.45, -95);
    mantar.castShadow = true;
    acikKok.add(mantar); acikRaylar.push(mantar);
  }

  // --- YAN HATLARIN RAYLARI: gercek celik. Boyali cizgi degil.
  // Yol (+-3.5) ile duvar (6.4) arasindaki 2,9 birimlik seride bir hat.

}

const istasyon = [];
if (TB) {
  // peron seddi: yol ile yan duvar arasindaki bosluğu kapatir. Kamera
  // y=3.7'de; sed 0.75 yuksekliginde kaldigi icin seritleri ORTMUYOR,
  // sadece kadrajin alt yanlarini dolduruyor.
  const peronMat = new THREE.MeshBasicMaterial({ color:'#1d1c28', fog:true });
  for (const yon of [-1, 1]) {
    const pr = new THREE.Mesh(new THREE.BoxGeometry(5.3, 0.75, 220), peronMat);
    pr.position.set(yon * 12.8, 0.375 - YOL_KAL, -95);
    scene.add(pr); istasyon.push(pr);
  }

  // vagon govdesi: koyu kasa + aydinlik pencere serisi. Pencereler kareye
  // sicak nokta koyuyor ama additive DEGIL - notayla parlaklik yarisina
  // girmemeleri gerekiyor.
  function vagonDoku(govde, cam){
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = govde; g.fillRect(0, 0, 256, 64);
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 0, 256, 9);     // cati bandi
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 50, 256, 14);   // sasi
    g.fillStyle = 'rgba(255,255,255,0.14)'; g.fillRect(0, 40, 256, 2); // bel cizgisi
    // pencereler: ilk denemede parlak cyan'di ve vagon karanlikta asili duran
    // isikli bir kasa gibi okunuyordu. Sicak ve sonuk - kasa silueti one ciksin.
    g.fillStyle = cam;
    for (let x = 14; x < 246; x += 30) {
      g.fillRect(x, 18, 19, 18);
      g.fillStyle = 'rgba(0,0,0,0.30)'; g.fillRect(x, 30, 19, 6);   // alt yari koyu
      g.fillStyle = cam;
    }
    return new THREE.CanvasTexture(c);
  }
  // yan hat yatagi: vagonlarin uzerinde durdugu serit. Olmadan vagonlar
  // karanlikta asili duruyor ve mekan yerine dekor gibi okunuyor.
  const yanHatMat = new THREE.MeshBasicMaterial({ color:'#1a1016', fog:true });
  for (const yon of [-1, 1]) {
    const yh = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.18, 220), yanHatMat);
    yh.position.set(yon * 8.2, 0.09 - YOL_KAL, -95);
    scene.add(yh); istasyon.push(yh);
  }

  const VAGON_ARA = 38, VAGON_SAY = 3;
  const govdeler = ['#1e2438', '#33161d', '#14262a'];
  const camlar   = ['#a8863f', '#5d7d91', '#8f5d78'];
  for (let i = 0; i < VAGON_SAY * 2; i++) {
    const sag = i % 2 === 1, k = Math.floor(i / 2);
    const m = new THREE.Mesh(new THREE.BoxGeometry(2.9, 3.1, 15),
      new THREE.MeshBasicMaterial({ map: vagonDoku(govdeler[k % 3], camlar[k % 3]),
                                    fog:true }));
    // x=8.2: yol kenari (3.5) ile peron basi (10.15) arasindaki yan hat
    m.position.set(sag ? 8.2 : -8.2, 1.55 - YOL_KAL, 0);
    m.userData = { i: k, sag, ara: VAGON_ARA, say: VAGON_SAY, akar: true };
    scene.add(m); istasyon.push(m);
  }
}

// ==================================================== DOLGU KATMANLARI
// Kareyi doldurmak icin: ufuk gunesi + ufuk parlamasi + yandan akan sutunlar.
// Hepsi oyun alaninin ARKASINDA ve daha sonuk - nota her zaman en okunakli sey.
const HIZ = (Z_VURUS - Z_DOGUM) / YAKLASMA;   // birim/sn - notayla ayni

// --- ufuk gunesi (yatay dilimli synthwave gunesi)
// B temasinda "gunes" yerine BULUT BANKASI + gunes: kareyi ustten dolduran
// sey o. Synthwave gunesi koyu zeminde ise yarar, gokyuzunde kaybolur.
function bulutDoku(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 384;
  const g = c.getContext('2d');
  // gunes
  const gg = g.createRadialGradient(792, 96, 10, 792, 96, 118);
  gg.addColorStop(0,   'rgba(255,252,214,1)');
  gg.addColorStop(0.42,'rgba(255,238,140,0.95)');
  gg.addColorStop(1,   'rgba(255,238,140,0)');
  g.fillStyle = gg; g.fillRect(600, 0, 424, 260);
  // bulutlar: ust uste binen daireler - deterministik, indeksten turetiliyor
  const puf = (cx, cy, r, a) => {
    g.fillStyle = `rgba(255,255,255,${a})`;
    for (let i = 0; i < 7; i++){
      const t = i / 6;
      g.beginPath();
      g.arc(cx + (t - 0.5) * r * 2.6, cy - Math.sin(t * Math.PI) * r * 0.55,
            r * (0.52 + 0.42 * Math.sin(t * Math.PI)), 0, 6.2832);
      g.fill();
    }
  };
  puf(180, 176, 62, 0.96); puf(470, 132, 46, 0.90);
  puf(760, 196, 54, 0.86); puf(950, 128, 38, 0.80);
  return new THREE.CanvasTexture(c);
}
function gunesDoku(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,60,0,470);
  grad.addColorStop(0,   '#fff2a8');
  grad.addColorStop(0.35,'#ff5ec4');
  grad.addColorStop(1,   '#7b2bff');
  g.fillStyle = grad;
  g.beginPath(); g.arc(256,256,200,0,Math.PI*2); g.fill();
  // asagi indikce kalinlasan bosluklar
  g.globalCompositeOperation = 'destination-out';
  for (let i=0; i<14; i++){
    const y = 262 + i*13;
    g.fillRect(0, y, 512, 2 + i*0.85);
  }
  g.globalCompositeOperation = 'source-over';
  return new THREE.CanvasTexture(c);
}
let gunes = null, ufuk = null;
const sutunlar = [];
const SUTUN_ARA = 5.0, SUTUN_SAY = TB ? 30 : 9, SUTUN_X = 7.4;

if (!SADE) {
  gunes = new THREE.Mesh(new THREE.PlaneGeometry(19, 19),

      blending: THREE.AdditiveBlending, depthWrite:false, fog:false }));
  gunes.position.set(0, 5.4, -62);
  gunes.visible = !TB;
  gunes.material.depthTest = false;    // arka fon: her zaman en altta cizilir
  gunes.renderOrder = -3;
  scene.add(gunes);

  // ufuk parlamasi - yatay yumusak bant

  ugr.addColorStop(1,'rgba(123,43,255,0)');
  ug.fillStyle = ugr; ug.fillRect(0,0,8,128);
  ufuk = new THREE.Mesh(new THREE.PlaneGeometry(150, 7),
    new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(uc), transparent:true,

  ufuk.visible = !TB;
