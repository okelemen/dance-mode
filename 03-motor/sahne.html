  : null;
const IZINLI_KLIP = (klip) => !IZINLI || IZINLI.has(klip);

const ILK_NOTA = NOTALAR.length ? NOTALAR[0].t : 4.0;
const T_READY = [ILK_NOTA - 3.65, ILK_NOTA - 1.45];
const T_GO    = [ILK_NOTA - 1.00, ILK_NOTA + 0.20];

// kilometre tasi ovgu sozleri (kendi setimiz)
const OVGU = ['NICE!','KEEP GOING!','PERFECT!','ON FIRE!','AMAZING!','YOU GOT THIS!'];
// yumusak, gozÃ¼ yormayan renkler - saf kirmizi/yesil yok
const OVGU_RENK = ['#00e5ff','#ffb454','#ff6ad5','#25d9c2','#ffe066','#b18cff'];

// Kademe esikleri tek yerde: hem rozet metni hem "ne zaman degisti" bundan.
const KADEME = [
  { esik: 200, s:'UNSTOPPABLE', r:'#ff2038' },
  { esik: 120, s:'PERFECT',     r:'#ff2f8f' },
  { esik:  60, s:'AWESOME',     r:'#ff9a1f' },
  { esik:  25, s:'GREAT',       r:'#25d9c2' },
  { esik:   1, s:'NICE',        r:'#22e0e8' },
];
// Kademenin BASLADIGI an. Duvar saati veya kare arasi durum yok - deger
// dogrudan koreografiden turetiliyor, yani render deterministik kaliyor.
function kademeBaslangic(combo){
  for (const K of KADEME) if (combo >= K.esik) {
    const n = NOTALAR.find(x => x.combo === K.esik);
    return n ? n.t : 0;
  }
  return 0;
}

function hudCiz(t, combo, epic, kmCombo, seviye, duyuru, sonVurus, karistirHud){
  hx.clearRect(0,0,W,H);
  const k = W/1280;
  // B temasinda parlak zeminde beyaz yazi okunmuyor. Her yazi once koyu
  // konturla ciziliyor. A'da kontur zaten beyaz oldugu icin bu adim atlanir.
  const yaz = (yazi, x, y) => hx.fillText(yazi, x, y);

  // combo sayaci - ilk vurusa kadar gizli
  if (combo > 0){
    hx.textAlign = 'right';
    hx.fillStyle = PALET.hud;
    hx.font = `700 ${Math.round(124*k)}px Impact, Arial Black, sans-serif`;
    hx.shadowColor = PALET.grid; hx.shadowBlur = 32*k;
    if (TB) {
      // rakamlari ayri bir tuvale ciz, centigi oy, sonra HUD'a bas
      const cw = Math.ceil(hx.measureText(String(combo)).width) + 40*k;
      const ch = Math.ceil(150*k);
      const cc = document.createElement('canvas'); cc.width = cw; cc.height = ch;
      const cg = cc.getContext('2d');
      cg.font = hx.font; cg.textAlign = 'right'; cg.fillStyle = PALET.hud;
      cg.shadowColor = PALET.grid; cg.shadowBlur = 32*k;
      cg.fillText(String(combo), cw - 4*k, 118*k);
      cg.shadowBlur = 0;
      cg.globalCompositeOperation = 'destination-out';
      cg.fillStyle = '#000';
      cg.fillRect(0, 74*k, cw, Math.max(2, 5*k));   // yatay centik
      // Her vurusta rakam kisa bir "tik" atar. Sayinin artmasi tek basina
      // fark edilmiyor; hareket fark ediliyor.
      const vdt = sonVurus >= 0 ? t - sonVurus : 9;
      const tik = vdt < 0.18 ? 1 + 0.13 * Math.pow(1 - vdt / 0.18, 2) : 1;
      hx.save();
      hx.translate(W - 46*k, 122*k);
      hx.scale(tik, tik);
      hx.drawImage(cc, -(cw - 4*k), -118*k);
      hx.restore();
    } else {
      yaz(String(combo), W - 46*k, 122*k);
    }
    hx.font = `700 ${Math.round(38*k)}px Arial Black, sans-serif`;
    yaz('COMBO', W - 46*k, 164*k);

    // --- KADEMELI DEGERLENDIRME ROZETI
    // Referansta combo'nun altinda kalici, renk kodlu bir kutu var.
    // Bizim ortadaki ovgu yazisi gosterisli ama anlik; bu surekli okunuyor.
    const kademe = KADEME.find(K => combo >= K.esik) || KADEME[KADEME.length - 1];

    // BOYUT: LEVEL 52 px, COMBO etiketi 38 px. Rozet ikisinin arasinda
    // durmali - eskiden 30 px'di ve HUD'un en onemsiz ogesi gibi okunuyordu.
    // HIZA: sag kenari combo rakami ve COMBO etiketiyle ayni dikeyde (W-46k),
    // solda LEVEL ile ayni kenar boslugu.
    hx.save();
    hx.font = `700 ${Math.round(44*k)}px Arial Black, sans-serif`;
    const gen = hx.measureText(kademe.s).width + 52*k, yuk = 72*k;
    const rx = TB ? W - 46*k - gen : PX - 22*k - gen;
    const ry = TB ? 186*k : 196*k;

    // KADEME ATLAMA: yeni kademeye girildigi an rozet buyuyup yerine oturur
    // ve bir kez beyaz cakar. Odul anini gorunur kilan sey bu; kalici kutu
    // tek basina "bir sey kazandim" hissi vermiyor.
    const kdt = t - kademeBaslangic(combo);
    const patla = kdt >= 0 && kdt < 0.6 ? Math.pow(1 - kdt / 0.6, 2.0) : 0;
    const olcek = 1 + 0.42 * patla;
    hx.translate(rx + gen, ry + yuk / 2);      // sag kenardan olcekle
    hx.scale(olcek, olcek);
    hx.translate(-(rx + gen), -(ry + yuk / 2));

    // Dolu renkli kutu + koyu yazi: ters kontrast, ayni alanda daha cok cikiyor
    hx.shadowColor = kademe.r; hx.shadowBlur = (26 + 34 * patla) * k;
    hx.fillStyle = kademe.r;
    hx.beginPath(); hx.roundRect(rx, ry, gen, yuk, 12*k); hx.fill();
    hx.shadowBlur = 0;
    hx.lineWidth = 3.5*k; hx.strokeStyle = 'rgba(255,255,255,0.92)';
    hx.beginPath(); hx.roundRect(rx, ry, gen, yuk, 12*k); hx.stroke();
    hx.fillStyle = 'rgba(8,4,20,0.95)';
    hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.fillText(kademe.s, rx + gen/2, ry + yuk/2 + 2*k);
    if (patla > 0){                             // beyaz cakma
      hx.globalAlpha = patla * 0.75;
      hx.fillStyle = '#ffffff';
      hx.beginPath(); hx.roundRect(rx, ry, gen, yuk, 12*k); hx.fill();
      hx.globalAlpha = 1;
    }
    hx.restore();
    hx.textAlign = 'right'; hx.textBaseline = 'alphabetic';
  }

  hx.textAlign = 'left';
  hx.fillStyle = PALET.hud;
  hx.shadowColor = PALET.grid;
  hx.font = `700 ${Math.round(52*k)}px Arial Black, sans-serif`;
  hx.shadowBlur = 24*k;
  yaz('LEVEL ' + seviye, 46*k, 106*k);
  // NOT (2 Eyl 2026): LEVEL'in altinda ortamin ADI yazardi ("MAGENTA HALL" vb).
  // Kullanici karariyla KALDIRILDI: seviye degisimini dunya degisimi zaten
  // anlatiyor, ad yazmak HUD'u kalabaliklastiriyordu. Geri eklenmeyecek.

  // --- GIRIS: READY / GO!
  const pop = (yazi, [t0,t1], renk, buyukluk) => {
    if (t < t0 || t > t1) return;
    const p = (t - t0) / (t1 - t0);
    const olcek = p < 0.16 ? 0.55 + 0.45*(p/0.16)      // hizli buyume
                : p > 0.82 ? 1 + (p-0.82)/0.18*0.35    // sonda hafif genisleyerek kaybol
                : 1;
    const alfa = p > 0.82 ? 1 - (p-0.82)/0.18 : 1;
    hx.save();
    hx.globalAlpha = alfa;
    hx.translate(W/2, H*0.40);
    // hiz cizgileri: merkezden disari acilan ince beyaz izler
    hx.save();
    hx.globalAlpha = alfa * 0.30 * (1 - p*0.5);
    hx.strokeStyle = '#ffffff'; hx.lineWidth = 2.5*k;
    for (let i = 0; i < 22; i++){
      const a = (i / 22) * Math.PI * 2 + p * 0.25;
      const i0 = 220*k + (i % 3) * 60*k, i1 = i0 + 130*k + (i % 4) * 70*k;
      hx.beginPath();
      hx.moveTo(Math.cos(a)*i0, Math.sin(a)*i0*0.55);
      hx.lineTo(Math.cos(a)*i1, Math.sin(a)*i1*0.55);
      hx.stroke();
    }
    hx.restore();
    hx.scale(olcek, olcek);
    hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.fillStyle = renk; hx.shadowColor = renk; hx.shadowBlur = 60*k;
    hx.font = `700 ${Math.round(buyukluk*k)}px Impact, Arial Black, sans-serif`;
    hx.fillText(yazi, 0, 0);
    hx.lineWidth = 3*k; hx.strokeStyle = YAZI_KONTUR;
    hx.strokeText(yazi, 0, 0);
    hx.restore();
  };
  // --- GIRIS BOSLUGU (12 Eyl 2026, kullanici: "baslangic cok bos kaliyor")
  // Bolumun iskeleti ilk 8 olcuyu 'bos' birakiyor: ilk nota 14,5 sn'de.
  // READY ondan sadece 3,65 sn once cikiyordu, yani acilisin ilk ~11 saniyesi
  // tamamen yaziisizdi. Buraya vurusa nabiz atan tek bir soru koyuldu.
  // Genislik kadraja gore kuculuyor - Impact'te 14 karakter 1280 px'de tasar.
  const T_SORU = [0.45, Math.max(1.60, T_READY[0] - 0.40)];
  if (t >= T_SORU[0] && t <= T_SORU[1]) {
    const giris = Math.min(1, (t - T_SORU[0]) / 0.55);
    const cikis = Math.min(1, (T_SORU[1] - t) / 0.55);
    const alfa  = Math.min(giris, cikis);
    // her vurusta kisa bir buyume - metin 10 saniye boyunca donmus durmasin
    const vurusFaz = (t / VURUS) % 1;
    const nabiz = 1 + 0.06 * Math.pow(1 - vurusFaz, 4);
    hx.save();
    hx.globalAlpha = alfa;
    hx.translate(W/2, H*0.40);
    hx.scale((0.62 + 0.38*giris) * nabiz, (0.62 + 0.38*giris) * nabiz);
    hx.textAlign = 'center'; hx.textBaseline = 'middle';
    const YAZI = 'ARE YOU READY?';
    let bs = 104;                                  // 1280 px tabaninda
    hx.font = `700 ${Math.round(bs*k)}px Impact, Arial Black, sans-serif`;
    const enGenis = W * 0.82;
    const olculen = hx.measureText(YAZI).width;
    if (olculen > enGenis) {                       // tasarsa kucult
      bs = bs * (enGenis / olculen);
      hx.font = `700 ${Math.round(bs*k)}px Impact, Arial Black, sans-serif`;
    }
    hx.fillStyle = '#00e5ff'; hx.shadowColor = '#00e5ff'; hx.shadowBlur = 52*k;
    hx.fillText(YAZI, 0, 0);
    hx.lineWidth = 3*k; hx.strokeStyle = YAZI_KONTUR;
    hx.strokeText(YAZI, 0, 0);
    hx.restore();
  }

  pop('READY', T_READY, '#00e5ff', 138);
  pop('GO!',   T_GO,    '#ffe600', 176);

  // --- SEVIYE DUYURUSU: ortam degisimi fark edilsin diye tam ekran
  if (duyuru >= 0){
    const p = duyuru / 2.4;
    const olcek = p < 0.12 ? 0.45 + 0.55*(p/0.12)
                : p > 0.72 ? 1 + (p-0.72)/0.28*0.30 : 1;
    const alfa = p > 0.72 ? 1 - (p-0.72)/0.28 : 1;
    hx.save();
    hx.globalAlpha = alfa;
    hx.translate(W/2, H*0.40);
    // isin cizgileri
    hx.save();
    hx.globalAlpha = alfa * 0.35 * (1 - p*0.6);
    hx.strokeStyle = '#ffffff'; hx.lineWidth = 3*k;
    for (let i = 0; i < 26; i++){
      const a = (i/26) * Math.PI * 2 - p * 0.4;
      const i0 = 240*k + (i%3)*70*k, i1 = i0 + 170*k + (i%4)*80*k;
      hx.beginPath();
      hx.moveTo(Math.cos(a)*i0, Math.sin(a)*i0*0.5);
      hx.lineTo(Math.cos(a)*i1, Math.sin(a)*i1*0.5);
      hx.stroke();
    }
    hx.restore();
    hx.scale(olcek, olcek);
    hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.font = `700 ${Math.round(64*k)}px Arial Black, sans-serif`;
    hx.fillStyle = '#ffffff'; hx.shadowColor = '#ffffff'; hx.shadowBlur = 40*k;
    hx.fillText('LEVEL UP', 0, -74*k);
    hx.font = `700 ${Math.round(176*k)}px Impact, Arial Black, sans-serif`;
    hx.fillStyle = '#ffe066'; hx.shadowColor = '#ffe066'; hx.shadowBlur = 64*k;
    hx.fillText(String(seviye), 0, 40*k);
    hx.lineWidth = 4*k; hx.strokeStyle = YAZI_KONTUR;
    hx.strokeText(String(seviye), 0, 40*k);
    hx.restore();
  }
  hx.textBaseline = 'alphabetic';

  // --- OVGU YAZISI: ekranin UST BANDINDAN iner
  // Eskiden ufuk noktasindan dogup ekranin ortasina (H*0.40) buyuyerek
  // geliyordu. Perspektif hissi guzeldi ama tam notalarin aktigi koridorun
  // onune oturuyor ve yaklasan cue'yu kapatiyordu - oyunun okunmasi
  // gosterisin onunde gelir. Artik ustten inip ust bantta duruyor.
  const OV_GEL = 0.34, OV_TUT = 0.74, OV_SON = 0.44;
  if (epic >= 0 && epic < OV_GEL + OV_TUT + OV_SON){
    const sira = Math.max(0, Math.floor(kmCombo/8) - 1);
    const yazi = OVGU[sira % OVGU.length];
    const renk = OVGU_RENK[sira % OVGU_RENK.length];

    const UST_Y = H * 0.155;        // durdugu yer: LEVEL ve COMBO ile ayni bant
    const BAS_Y = -H * 0.10;        // dogdugu yer: ust kenarin disi
    let ilerle, alfa, ek;
    if (epic < OV_GEL){                       // hizli in
      const q = epic / OV_GEL;
      ilerle = 1 - Math.pow(1 - q, 3);        // sonda yumusayarak otur
      alfa = Math.min(1, q * 4);
      ek = 0;
    } else if (epic < OV_GEL + OV_TUT){       // tut
      ilerle = 1; alfa = 1; ek = 0;
    } else {                                  // hafifce yukari suzul ve kaybol
      const q = (epic - OV_GEL - OV_TUT) / OV_SON;
      ilerle = 1; alfa = 1 - q; ek = -q * H * 0.035;
    }
    const olcek = 0.62 + 0.38 * ilerle;       // inerken buyur
    const cx = W / 2;
    const cy = BAS_Y + (UST_Y - BAS_Y) * ilerle + ek;

    hx.save();
    hx.globalAlpha = alfa;
    hx.translate(cx, cy);
    hx.scale(olcek, olcek);
    hx.textAlign = 'center'; hx.textBaseline = 'middle';
    // Ust bantta solda LEVEL, sagda COMBO + rozet var. Yazi ikisinin arasina
    // sigmali; sigmiyorsa punto kucululur. Sabit punto birakilirsa
    // "YOU GOT THIS!" gibi uzun ovguler ikisinin de uzerine biniyor.
    let punto = 104;
    hx.font = `700 ${Math.round(punto*k)}px Impact, Arial Black, sans-serif`;
    const enGenis = W * 0.50;
    const olculen = hx.measureText(yazi).width * olcek;
    if (olculen > enGenis) {
      punto = Math.max(52, punto * enGenis / olculen);
      hx.font = `700 ${Math.round(punto*k)}px Impact, Arial Black, sans-serif`;
    }
    hx.fillStyle = renk; hx.shadowColor = renk; hx.shadowBlur = 52*k;
    hx.fillText(yazi, 0, 0);
    hx.lineWidth = 3*k; hx.strokeStyle = YAZI_KONTUR;
    hx.strokeText(yazi, 0, 0);
    hx.restore();
  }
  // --- FINAL KARTI: abone cagrisi
  // Referansta var, bizde yoktu - kacirilmis bir yer.
  const SON = TOPLAM_OLCU * OLCU;
  if (t >= SON - 4.2){
    const p = Math.min(1, (t - (SON - 4.2)) / 4.2);
    const giris = Math.min(1, p / 0.10);
    hx.save();
    hx.globalAlpha = giris * 0.88;
    hx.fillStyle = '#050110';
    hx.fillRect(0, 0, W, H);                       // ekrani karart
    hx.globalAlpha = giris;
    hx.translate(W/2, H*0.46);
    hx.save();
    hx.globalAlpha = giris * 0.30;
    hx.strokeStyle = '#ffffff'; hx.lineWidth = 3*k;
    for (let i = 0; i < 30; i++){
      const a = (i/30) * Math.PI * 2 + p * 0.3;
      const i0 = 200*k, i1 = i0 + 320*k + (i % 5) * 90*k;
      hx.beginPath();
      hx.moveTo(Math.cos(a)*i0, Math.sin(a)*i0*0.55);
      hx.lineTo(Math.cos(a)*i1, Math.sin(a)*i1*0.55);
      hx.stroke();
    }
    hx.restore();
    hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.fillStyle = '#ffffff'; hx.shadowColor = '#00e5ff'; hx.shadowBlur = 40*k;
    hx.font = `700 ${Math.round(72*k)}px Arial Black, sans-serif`;
    hx.fillText('THANKS FOR WATCHING', 0, -60*k);
    hx.fillStyle = '#ffe066'; hx.shadowColor = '#ffe066'; hx.shadowBlur = 54*k;
    hx.font = `700 ${Math.round(112*k)}px Impact, Arial Black, sans-serif`;
    hx.fillText('SUBSCRIBE', 0, 46*k);
    hx.font = `700 ${Math.round(34*k)}px Arial, sans-serif`;
    hx.fillStyle = '#ffffff'; hx.shadowBlur = 20*k;
    hx.fillText('for the next level', 0, 128*k);
    hx.restore();
  }

  // ------------------------------------------------- ILERLEME HALKASI
  // Rakiplerin ucunde (Escapify, FLEM, Prime & Prep) ilerleme gostergesi var,
  // bizde yoktu. 8:48'lik bir videoda "ne kadar kaldi" bilgisi tutma oranina
  // dogrudan etki ediyor - evde takip eden biri icin bu bir dayanma noktasi.
  //
  // Duz cubuk yerine HALKA: sag alt kosede duruyor, karenin hicbir yerini
  // yatay olarak kesmiyor. Ortasinda KALAN SURE var - yuzde degil, cunku
  // egzersiz yapan biri icin anlamli olan sayi dakika.
  {
    const SON_T = TOPLAM_OLCU * OLCU;
    const ilerle = Math.max(0, Math.min(1, t / SON_T));
    const kalan = Math.max(0, SON_T - t);
    const dk = Math.floor(kalan / 60), sn = Math.floor(kalan % 60);
    const cx = W - 108*k, cy = H - 120*k, r = 56*k;
    const vn = Math.max(0, 1 - (t % VURUS) / 0.20);   // vurus nabzi

    hx.save();
    // koyu disk: yolun kenar hatti halkanin icinden geciyordu, okunmuyordu
    hx.fillStyle = 'rgba(6,2,16,0.80)';
    hx.beginPath(); hx.arc(cx, cy, r + 15*k, 0, 6.2832); hx.fill();
    // arka halka
    hx.lineWidth = 11*k;
    hx.strokeStyle = 'rgba(255,255,255,0.16)';
    hx.beginPath(); hx.arc(cx, cy, r, 0, 6.2832); hx.stroke();
    // dolan yay - ortamin aksan renginde, 12 yonunden saat yonunde
    const renk = '#' + karistirHud.getHexString();
    hx.strokeStyle = renk; hx.lineCap = 'round';
    hx.shadowColor = renk; hx.shadowBlur = (16 + 12*vn) * k;
    hx.beginPath();
    hx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + 6.2832 * ilerle);
    hx.stroke();
    hx.shadowBlur = 0; hx.lineCap = 'butt';
    // kalan sure
    hx.textAlign = 'center'; hx.textBaseline = 'middle';
    hx.fillStyle = '#ffffff';
    hx.font = `700 ${Math.round(30*k)}px Arial Black, sans-serif`;
    hx.fillText(`${dk}:${String(sn).padStart(2,'0')}`, cx, cy - 2*k);
    hx.font = `700 ${Math.round(15*k)}px Arial, sans-serif`;
    hx.fillStyle = 'rgba(255,255,255,0.62)';
    hx.fillText('LEFT', cx, cy + 24*k);
    hx.restore();
    hx.textAlign = 'left'; hx.textBaseline = 'alphabetic';
  }

  // ------------------------------------------------- ABONE CAGRISI
  // Video boyunca her 8 OLCUDE bir (120 BPM'de 16 sn, 130'da 14,8 sn).
  // Saniyeye degil OLCUYE kilitli: cagri her seferinde vurusun uzerine
  // dusuyor, muzikle birlikte "tik" atiyor - rastgele beliren bir kutu
  // gibi degil, ritmin parcasi gibi okunuyor.
  //
  // Yeri SOL ALT: koridor orta bantta akiyor, siluet paneli ustte.
  // Burasi karenin tek gercekten bos kosesi - hicbir seyin onunu kapatmiyor.
  const AB_ARA = 8 * OLCU;              // gorunme araligi
  const AB_SURE = 2.6;                  // ekranda kalma
  const abT = t % AB_ARA;
  if (t > OLCU * 2 && abT < AB_SURE) {
    const q = abT / AB_SURE;
    // gir (0-0.18) - tut - cik (0.82-1)
    const giris = Math.min(1, q / 0.18);
    const cikis = q > 0.82 ? 1 - (q - 0.82) / 0.18 : 1;
    const alfa = Math.min(giris, cikis);
    const kay = (1 - giris) * -160 * k;            // soldan kayarak girer
    // vurus nabzi: her vurusta hafif buyume
    const vn = Math.max(0, 1 - (t % VURUS) / 0.18);
    const olcek = (0.94 + 0.06 * giris) * (1 + 0.05 * vn);

    hx.save();
    hx.globalAlpha = alfa;
    hx.font = `700 ${Math.round(40*k)}px Arial Black, sans-serif`;
    const yazi = 'SUBSCRIBE';
    const gen = hx.measureText(yazi).width + 104*k, yuk = 66*k;
    const ax0 = 46*k + kay, ay0 = H - yuk - 46*k;
    hx.translate(ax0, ay0 + yuk/2);
    hx.scale(olcek, olcek);
    hx.translate(-ax0, -(ay0 + yuk/2));

    hx.shadowColor = '#ff0033'; hx.shadowBlur = (26 + 22*vn) * k;
    hx.fillStyle = '#ff0033';
    hx.beginPath(); hx.roundRect(ax0, ay0, gen, yuk, 12*k); hx.fill();
    hx.shadowBlur = 0;
    hx.lineWidth = 3.5*k; hx.strokeStyle = 'rgba(255,255,255,0.95)';
    hx.beginPath(); hx.roundRect(ax0, ay0, gen, yuk, 12*k); hx.stroke();

    // oynat ucgeni - YouTube isareti
    hx.fillStyle = '#ffffff';
    const px = ax0 + 30*k, py = ay0 + yuk/2, pb = 15*k;
    hx.beginPath();
    hx.moveTo(px + pb, py); hx.lineTo(px - pb*0.7, py - pb);
    hx.lineTo(px - pb*0.7, py + pb); hx.closePath(); hx.fill();

    hx.fillStyle = '#ffffff';
    hx.textAlign = 'left'; hx.textBaseline = 'middle';
    hx.fillText(yazi, ax0 + 62*k, ay0 + yuk/2 + 2*k);
    hx.restore();
    hx.textAlign = 'left'; hx.textBaseline = 'alphabetic';
  }

  hx.textBaseline = 'alphabetic';
  hx.shadowBlur = 0;
}

// ------------------------------------------------------- KARE KURULUMU
const birlesik = document.createElement('canvas');
birlesik.width = W; birlesik.height = H;
const bx = birlesik.getContext('2d');

// B'nin son doygunluk pasi icin ara tuval (canvas kendi uzerine filtreli
// cizilemiyor, ara kopya sart)
const araCv = TB ? document.createElement('canvas') : null;
if (araCv) { araCv.width = W; araCv.height = H; }
const ax = araCv ? araCv.getContext('2d') : null;

// --- siluet paneli
const PW = Math.round(PANEL.g * W), PH = Math.round(PANEL.h * H);
const PX = TB ? Math.round(PANEL.kenar * W)
              : W - PW - Math.round(PANEL.kenar * W);
const PY = Math.round(PANEL.y * H);
kameraSiluet.aspect = PW / PH; kameraSiluet.updateProjectionMatrix();

const maskeCv = document.createElement('canvas'); maskeCv.width = PW; maskeCv.height = PH;
// AYNA kopyasi: sol yonlu cue'larda siluet yatay cevriliyor (bkz. AYNA_CUE).
const aynaCv = document.createElement('canvas'); aynaCv.width = PW; aynaCv.height = PH;
const ax2 = aynaCv.getContext('2d');
const mx = maskeCv.getContext('2d');
const icCv   = document.createElement('canvas'); icCv.width = PW; icCv.height = PH;
const ix = icCv.getContext('2d');

/** Sag taraftaki kutu: koyu zemin, acik kenarlik, icinde konturlu siluet. */
function siluetPaneliCiz(renk){
  const r = Math.round(0.012 * W);

  // kutu
  bx.save();
  bx.shadowColor = renk; bx.shadowBlur = 0.022 * W;
  bx.fillStyle = 'rgba(4,2,14,1)';   // tam opak: arkadaki lazer/sehir sizmasin
  bx.beginPath(); bx.roundRect(PX, PY, PW, PH, r); bx.fill();
  bx.shadowBlur = 0;
  bx.lineWidth = Math.max(2, 0.0026 * W);
  bx.strokeStyle = 'rgba(235,240,255,0.92)';
  bx.beginPath(); bx.roundRect(PX, PY, PW, PH, r); bx.stroke();
  bx.restore();

  if (!siluet) return;

  // AYNALAMA: sol yonlu cue'da maske yatay cevrilir. Klip asimetrik oldugu
  // icin (sola yatis com -0,035, saga +0,137) iki yonu ayni klipten esit
  // guclu okutmanin olculmus yolu bu.
  const kaynak = SILUET_AYNA ? (() => {
    ax2.clearRect(0, 0, PW, PH);
    ax2.save(); ax2.translate(PW, 0); ax2.scale(-1, 1);
    ax2.drawImage(maskeCv, 0, 0); ax2.restore();
    return aynaCv;
  })() : maskeCv;

  // ic dolgu icin maskenin siyah kopyasi
  ix.clearRect(0, 0, PW, PH);
  ix.globalCompositeOperation = 'source-over';
  ix.drawImage(kaynak, 0, 0);
  ix.globalCompositeOperation = 'source-in';
  ix.fillStyle = '#050110';
  ix.fillRect(0, 0, PW, PH);
  ix.globalCompositeOperation = 'source-over';

  bx.save();
  bx.beginPath(); bx.roundRect(PX + 2, PY + 2, PW - 4, PH - 4, r); bx.clip();

  // yumusak dis parlama
  bx.globalAlpha = 0.55;
  bx.filter = `blur(${Math.round(0.007 * W)}px)`;
  bx.drawImage(kaynak, PX, PY);
  bx.filter = 'none';

  // KONTUR: maskeyi 8 yone kaydirip beyaz cizmek dis hat verir
  const k = Math.max(1.5, 0.0026 * W);
  bx.globalAlpha = 1;
  for (let a = 0; a < 8; a++){
    const t = a * Math.PI / 4;
    bx.drawImage(kaynak, PX + Math.cos(t) * k, PY + Math.sin(t) * k);
  }
  // ic dolgu ustte -> geriye ince beyaz hat kalir
  bx.drawImage(icCv, PX, PY);
  bx.restore();
  bx.globalAlpha = 1;
}

function kareKur(n){
  const t = n / FPS;                       // DETERMINISTIK: duvar saati yok

  // zemin akisi - mod 1 icinde kalir, hicbir sayi buyumez
  const hiz = (Z_VURUS - Z_DOGUM) / YAKLASMA;   // birim/sn
  zeminMat.uniforms.uKaydir.value = (t * hiz / 220 * 40) % 1;
  // yol ust yuzeyi de akar - notayla ayni hizda, ayni yonde.
  // Bu satir eskiden additive serit katmanina bagliydi; yatak gelince
  // baglanmadan kaldi ve traversler DURDU (iki kare caprazlanarak olculdu:
  // en iyi dikey kayma 0 px). Artik yatak dokusu kayiyor.
  if (yatakDoku) yatakDoku.offset.y = (-t * hiz / (220 / 34)) % 1;
  if (yatakGunduzDoku) yatakGunduzDoku.offset.y = yatakDoku.offset.y;
  if (yatakSerinDoku)  yatakSerinDoku.offset.y  = yatakDoku.offset.y;
  if (yanDoku)   yanDoku.offset.y   = (-t * hiz / (220 / 34)) % 1;

  // --- ORTAM: hangi bolumdeyiz, gecis ne kadar ilerledi
  const suOlcu = t / OLCU;
  let ix = 0;
  for (let i = 0; i < ORTAMLAR.length; i++) if (suOlcu >= ORTAMLAR[i].olcu) ix = i;
  const O1 = ORTAMLAR[ix], O0 = ORTAMLAR[Math.max(0, ix - 1)];
  const gecis = ix === 0 ? 1
    : THREE.MathUtils.clamp((suOlcu - O1.olcu) / GECIS_OLCU, 0, 1);
  const yumusak = gecis * gecis * (3 - 2 * gecis);        // smoothstep

  // TABAN MODU (12 Eyl 2026): gokMod ustune kurulu; deniz ve sehir
  // katmanlari kendi bayraklarina bagli oldugu icin kapali kalir. Ek olarak
  // KEMER GECITLERI ve LAZERLER de kapatiliyor - onlar koridor mimarisi,
  // bu modun kurali "yanlarda nesne yok". Bayrak BURADA tanimlaniyor cunku
  // dolgu katmani donguleri (sutun, lazer) asagida DEGIL yukarida calisiyor.
  const tabanMod = ((yumusak < 0.5 ? O0 : O1).taban === true);
  // KARPUZ MODU (13 Eyl 2026, MEK-002 "ASKI"). TABAN ile paylastigi tek sey
  // SADELIK: yanlarda nesne yok. Bu yuzden ikisi ortak bir bayrakta
  // toplaniyor (sadeMod) - kapatilan katmanlar ayni. Ayrildiklari yer
  // zemin shader'inin ritim katmani (uMod) ve bas ustundeki asma.
  const karpuzMod = ((yumusak < 0.5 ? O0 : O1).karpuz === true);
  // ELMA MODU (14 Eyl 2026, MEK-003 "YIGIN"). TABAN ve KARPUZ ile paylastigi
  // tek sey yine SADELIK (yanlarda mimari yok) - bu yuzden ayni bayrakta
  // toplaniyor. Ayrildigi yer: zemin shader'inin uMod=2 dali (yigin tabani +
  // bolum 01'in nota yolu) ve billboard elma yigini.
  const elmaMod = ((yumusak < 0.5 ? O0 : O1).elma === true);
  // BAL MODU (17 Eyl 2026, MEK-004). Sadelik ortak (yanlarda mimari yok);
  // ayrildigi yer taban shader'inin uMod=3 dali (petek + dokulmus bal kanali)
  // ve ölçüye kilitli bal iplikleri. Fotograf yok.
  const balMod = ((yumusak < 0.5 ? O0 : O1).bal === true);
  const sadeMod = tabanMod || karpuzMod || elmaMod || balMod;
  const karistir = (a, b) => new THREE.Color(a).lerp(new THREE.Color(b), yumusak);
  zeminMat.uniforms.uGrid .value.copy(karistir(O0.grid[0], O1.grid[0]));
  zeminMat.uniforms.uGrid2.value.copy(karistir(O0.grid[1], O1.grid[1]));
  zeminMat.uniforms.uGrid3.value.copy(karistir(O0.grid[2], O1.grid[2]));
  if (ufuk) {
    ufuk.material.color.copy(karistir(O0.ufuk || O0.gok, O1.ufuk || O1.gok));
    // ELMA: ufuk seridi yiginin arkasinda PARLAK bant olarak okunuyordu;
    // bu mekanda ufku yigin siluetinin kendisi kuruyor.
    ufuk.visible = !elmaMod && !balMod;
  }
  // Gokyuzu de ortamla degisir. A'da dort ortamin da gogu ayni koyu renk,
  // yani A icin bu satirlar gorunur bir sey degistirmez.
  const gok = karistir(O0.gok, O1.gok);
  scene.background.copy(gok);
  scene.fog.color.copy(gok);
  zeminMat.uniforms.uSis.value.copy(gok);
  zeminMat.uniforms.uSeritGuc.value = (elmaMod || balMod) ? 0.42 : 1.0;
  // ELMA: yol UC CIZGILI (bolum 01 dili) - sol / orta / sag. Varsayilan 9
  // ayrac bu mekanda kalabalik okunuyordu.
  zeminMat.uniforms.uSeritSik.value = (elmaMod || balMod) ? 3.0 : 9.0;

  // --- GUNDUZ KARISIMI (2 Eyl 2026)
  // Ortam 'gunduz: true' dediginde sahne acik alana doner. Gecis ortam
  // gecisiyle ayni yumusatmayi kullanir, yani ani atlama olmaz.
  // Neyi degistirir: gokyuzu acilir, yol aydinlanir ve TUM ADDITIVE
  // katmanlar kisilir. Sebep olculdu (ANALIZ.md): toplama isik parlak
  // zeminde beyaza doyuyor; kisilmezse butun kare yikaniyor.
  const gd = (O0.gunduz ? 1 : 0) + ((O1.gunduz ? 1 : 0) - (O0.gunduz ? 1 : 0)) * yumusak;
  zeminMat.uniforms.uGunduz.value = gd;
  // SIS: gecede sis mekani kapatan bir arac, gunduzde ise DUSMAN.
  // Ilk denemede gece degerleriyle (20/78) birakildi ve butun koridor
  // acik zeminde beyaza yikandi - kare tek bir pastel lekeye dondu.
  // Gunduzde sis cok daha uzaga itiliyor: mekan derinlemesine okunuyor.
  // ZEMIN RENGI: uZemin bugune kadar PALET.zemin sabitiydi (#0d0524, koyu mor).
  // Gunduzde yolun disi bu yuzden KARA bir seride donuyordu - acik gogun
  // altinda en goze batan hataydi. Artik gunduzde notr cakil rengine
  // dogru gidiyor, icine ortamin gok renginden bir tutam kariyor.
  const zeminRenk = new THREE.Color(PALET.zemin);
  if (gd > 0.001) {
    const gunGok = karistir(O0.gok2 || O0.gok, O1.gok2 || O1.gok);
    const gunZemin = new THREE.Color('#8e8b7e').lerp(gunGok, 0.25);
    zeminRenk.lerp(gunZemin, gd);
  }
  // gunduzde zemin = BALAST. Notr, orta degerde, cakil grisi.
  // Balast ortam renginden BAGIMSIZ notr gri. Ortam rengiyle boyayinca
  // traversle ayni aileye giriyor ve ikisi tek kutle oluyordu.
  if (gd > 0.001) zeminRenk.lerp(new THREE.Color('#aeaba2'), gd);
  zeminMat.uniforms.uZemin.value.copy(zeminRenk);

  scene.fog.near = SIS_YAKIN + gd * 62;
  scene.fog.far  = SIS_UZAK  + gd * 140;
  // KARPUZ: sis UZAGA itiliyor. Sebep olculdu (13 Eyl 2026) - bu mekanda gok
  // ACIK, sis rengi de goktan geliyor. Gece degerleriyle (20/78) birakilinca
  // yol 78 birim icinde gok rengine yikaniyor ve kadrajin ortasinda PARLAK
  // bir rampa olarak okunuyordu; oysa kural "yol tam ortada ve KOYU".
  // Ayni tuzak acik alan uygulamasinda bir kez yasanmisti (ANALIZ.md:
  // "gecede sis mekani kapatan bir arac, gunduzde DUSMAN").
  // Ufka karisma isi sise degil, taban shader'inin kendi rampasina birakildi.
  if (karpuzMod) { scene.fog.near = 96; scene.fog.far = 260; }
  // ELMA: gok acik, sis gece degerleriyle birakilirsa yol 78 birim icinde gok
  // rengine yikaniyor (karpuzda olculmus tuzak). Ayrica yiginin ufka dogru
  // gok rengine karismasi ISTENEN sey - sis o isi yapiyor, taban shaderi degil.
  if (elmaMod) { scene.fog.near = 70; scene.fog.far = 235; }
  // BAL: gok acik (krem); karpuz/elma ile ayni tuzak - sis yakin kalirsa yol gok rengine yikanir.
  if (balMod) { scene.fog.near = 90; scene.fog.far = 280; }
  zeminMat.uniforms.uSisYakin.value = SIS_YAKIN + gd * 62;
  zeminMat.uniforms.uSisUzak .value = SIS_UZAK  + gd * 140;
  if (gokyuzu) {
    // Opak oldugu icin acilip kapanmasi kademeli degil, gecisin ortasinda.
    // Motor zaten ortam gecisinde beyaz cakma yapiyor; takas orada gizleniyor.
    gokyuzu.visible = gd > 0.5 && !((yumusak < 0.5 ? O0 : O1).zemin === 'gok');
    gokyuzu.material.color.copy(karistir(O0.gok2 || O0.gok, O1.gok2 || O1.gok));
  }

  // gecis aninda beyaz cakma + tam ekran seviye duyurusu
  const gecisT = t - O1.olcu * OLCU;                 // gecis basindan gecen sure
  const cakma = (ix > 0 && gecis < 0.5) ? Math.pow(1 - gecis / 0.5, 1.6) : 0;
  let duyuru = (ix > 0 && gecisT >= 0 && gecisT < 2.4) ? gecisT : -1;
  // LEVEL 1-5 (16 Eyl 2026 kullanici kurali). Tek sahneli bolumde seviye
  // ortama bagli kaldigi icin hic artmiyordu. Bolum dosyasi 'seviye_olcu'
  // (acik sinirlar) ya da 'seviye_bes: true' (TOPLAM_OLCU/5 esit dilim) verirse
  // seviye ORTAMDAN BAGIMSIZ buradan gelir; LEVEL UP duyurusu sinirda calar.
  // Bayraksiz (yayinlanmis) bolumler eskisi gibi ortamdan okur.
  let seviyeNo = O1.seviye;
  if (BOLUM && (BOLUM.seviye_olcu || BOLUM.seviye_bes)) {
    const sin = BOLUM.seviye_olcu ||
      [0, 1, 2, 3, 4].map(k => Math.round(TOPLAM_OLCU * k / 5));
    let li = 0;
    for (let k = 0; k < sin.length; k++) if (suOlcu >= sin[k]) li = k;
    seviyeNo = li + 1;
    const lt = t - sin[li] * OLCU;
    duyuru = (li > 0 && lt >= 0 && lt < 2.4) ? lt : -1;
  }

  // --- dolgu katmanlari
  // olcu nabzi: her olcu basinda sahne nefes alir
  const olcuIci = t % OLCU;
  const nabizOlcu = Math.max(0, 1 - olcuIci / 0.30);

  // sutunlar: mod ile dolasirlar, koordinat asla buyumez
  // Ortam degisiminde GEOMETRI de degisiyor - sadece renk degil.
  // Referansta koridorun bicimi tamamen degisiyor; sadece palet
  // degistirmek fark ettirmiyordu.
  const ara   = O0.ara   + (O1.ara   - O0.ara)   * yumusak;
  const kOlc  = O0.olcek + (O1.olcek - O0.olcek) * yumusak;
  const kapsam = ara * SUTUN_SAY;
  for (const s of sutunlar) {
    // TABAN modu: kemer geciti KORIDOR MIMARISI - referans benzerligi
    // buradan geliyordu (tel kafes / halka / kemer dizisi). Kapali.
    if (sadeMod) { s.visible = false; continue; }
    s.visible = true;
    const { i } = s.userData;
    s.position.z = Z_VURUS + 4 - kapsam + ((i * ara + t * HIZ) % kapsam);
    // kameraya cok yaklasan kemer kareyi basiyor - yakinda sondur
    const yakinSonme = THREE.MathUtils.smoothstep(camera.position.z - s.position.z, 1.5, 7);
    s.material.opacity = (TB ? 0.12 + 0.10 * nabizOlcu
                             : 0.52 + 0.40 * nabizOlcu) * yakinSonme * (1 - gd * 0.96);
    // BICIM degisimi: doku beyaz cakmanin ortasinda takas edilir, gozukmez
    const dk = window.__KEMER_DOKULARI;
    if (dk) {
      const bic = (yumusak > 0.5 ? O1.bicim : O0.bicim) || (TB ? 'kemer' : 'yuvarlak');
      if (dk[bic] && s.material.map !== dk[bic]) { s.material.map = dk[bic]; s.material.needsUpdate = true; }
    }
    // RENK AKISI: kemer tunelin sonuna varip basa dondugunde siradaki rengi
    // alir; renkler koridor boyunca akar. Ani sicrama olmaz cunku renk,
    // kemer sisin icindeyken degisiyor.
    const donus = Math.floor((i * ara + t * HIZ) / kapsam);
    const ci = (i + donus) % 5;
    s.material.color.copy(karistir(
      O0.kemer[ci % O0.kemer.length], O1.kemer[ci % O1.kemer.length]));
    // YAVAS DONUS: tam tur 32 olcude (64 sn). Olcu izgarasina bagli
    // oldugu icin deterministik ve muzikle uyumlu. Her kemere indeksten
    // gelen sabit bir faz farki verilir -> koridor boyunca spiral etkisi.
    // A'da kemer KAPALI bir cokgen; yavas donmesi spiral etkisi veriyor.
    // B'de sekiller ACIK (kemer, tonoz): donunce kemer olarak degil savrulan
    // serit olarak okunuyor ve mekan hissi tamamen kayboluyor. B'de donus yok.
    s.rotation.z = TB ? 0
      : (t / (32 * OLCU)) * Math.PI * 2 + i * (Math.PI * 2 / SUTUN_SAY) * 0.22;
    const p = kOlc * (TB ? 0.82 : 1) * (1 + nabizOlcu * 0.035);
    // en/boy ayri: halka yuvarlak, tonoz yuksek, kemer genis olmali
    const en  = (O0.en  ?? 1) + ((O1.en  ?? 1) - (O0.en  ?? 1)) * yumusak;
    const boy = (O0.boy ?? 1) + ((O1.boy ?? 1) - (O0.boy ?? 1)) * yumusak;
    const yer = (O0.yer ?? 5.3) + ((O1.yer ?? 5.3) - (O0.yer ?? 5.3)) * yumusak;
    s.scale.set(p * en, p * boy, 1);
    s.position.y = yer;
  }
  // lazerler: tunelle ayni yonde akar, vurusta parlar
  for (const l of lazerler) {
    // TABAN modu: yandan akan isin sutunlari da mekan nesnesi - kapali.
    if (sadeMod) { l.visible = false; continue; }
    l.visible = true;
    const d = l.userData;
    l.position.z = Z_VURUS + 6 - d.kapsam + ((d.i * d.ara + t * HIZ * 0.75) % d.kapsam);
    const vurusIci = t % VURUS;
    l.material.opacity = (0.09 + 0.16 * Math.max(0, 1 - vurusIci / 0.22)) * (1 - gd);
  }

  // yol dalgalari: her olcu basinda vurus cizgisinden disari yayilir
  dalgalar.forEach((dg, i) => {
    const faz = (t / OLCU + i / dalgalar.length) % 1;
    dg.scale.setScalar(0.6 + faz * 6.5);
    dg.material.opacity = 0.30 * (1 - faz) * (1 - faz) * (1 - gd * 0.55);
    dg.material.color.copy(karistir(O0.grid[i % 3], O1.grid[i % 3]));
  });

  // yan dekor: tunelle ayni yonde akar. Doku takasi beyaz cakmanin
  // ortasinda oluyor (kemer bicimiyle ayni numara), o yuzden gozukmuyor.
  const dekorTip = (yumusak > 0.5 ? O1.dekor : O0.dekor) || 'sehir';
  const dk = window.__DEKOR;
  for (const b of binalar) {
    const d = b.userData, kap = d.ara * d.say;
    b.position.z = Z_VURUS + 6 - kap + ((d.i * d.ara + t * HIZ) % kap);
    // Acik alanda duvarlar YOLA YAKLASIR. 15.5'te viyaduk arkadi uzakta
    // kaliyor ve kemerler okunmuyordu; referansta duvar koridoru sariyor.
    // OLCEK (2 Eyl 2026, ikinci gecis). Ilk denemede duvarlar x=12'deydi;
    // yolun yari genisligi 3,5 oldugu icin aralarinda kocaman bos gri bir
    // duzlem kaliyordu ve mekan maket gibi okunuyordu. Referansta duvar
    // dibi balasta giriyor, koridoru sariyor. Duvar yola YAKLASTI.
    b.position.x = (d.sag ? 1 : -1) * (15.5 - gd * 7.6);
    // Yukseklik: duvarin ALTI dunya zeminine (y=-0.85) otursun, ustu ~11'e
    // ciksin. Alcak duvar denemesi gogu actigi kadar duvari da yok etti.
    // Duvar YUKSEKLIGI. Referans olculdu: duvarin ustu kamera goz hizasinin
    // biraz USTUNDE kaliyor, uzeri acik gokyuzu. Ilk denemede duvar 11,8
    // birim yuksekti (kamera 3,7'de) - koridor ustte kapaniyordu ve yine
    // tunel gibi okunuyordu. Simdi duvar ustu ~5,2: gok genis bir bant.
    b.scale.y = 1 - gd * 0.50;
    b.position.y = 6.2 - gd * 2.80;
    if (dekorTip === 'yok') { b.visible = false; continue; }
    // Gunduzde duvari artik GERCEK GEOMETRI ciziyor (acikKok). Duz billboard
    // katmani kapatilmazsa ikisi ust uste biner.
    if (gd > 0.5 && String(dekorTip).startsWith('acik')) { b.visible = false; continue; }
    b.visible = true;
    if (dk && dk[dekorTip]) {
      const yeni = dk[dekorTip][d.di];
      if (b.material.map !== yeni) { b.material.map = yeni; b.material.needsUpdate = true; }
    }
  }

  // istasyon: yatak/ray yuzeyi ve vagonlar sadece 'ray' dekorunda. Diger
  // ortamlar eski serit cizgili yolu korur - takas doku duzeyinde.
  const istasyonda = (dekorTip === 'ray');
  // Yatak alti ortamin HEPSINDE: bolum-04'un yalnizca ilk 88 olcusu 'ray',
  // yatak ona kilitli kalsaydi 8:48'lik bolumun 2:56'si ray yatagi, kalan
  // 5:52'si eski otoyol olurdu. Vagon ve peron ray ortamlarina ozel kaliyor.
  if (yatak) {
    yatak.visible = true;
    // yatak dokusu notr; rengi ortamin ANA renginden geliyor. 0.42 carpani
    // yatagi koyu tutuyor - notanin uzerinde durdugu yuzey parlarsa nota
    // okunmuyor (ilk ray denemesinde olculdu).
    // GUNDUZ: yatak artik ortamin renginde degil, gun isigi alan notr
    // balast. Gece formulunun 0.42 carpani gunduz yolu siyah bir seride
    // ceviriyordu; referansta yatak orta degerde ve renksiz.
    // Doku takasi: gunduzde bal rengi traversli acik yatak.
    // Ortam 'yatak: "serin"' derse soguk yatak. Iki ortam arasi gecerken
    // hangisine daha yakinsak onunki gecerli (dokular harmanlanamaz).
    const serinIster = (yumusak < 0.5 ? O0 : O1).yatak === 'serin';
    const gunduzYatak = (serinIster && yatakSerinDoku) ? yatakSerinDoku : yatakGunduzDoku;
    const istenen = (gd > 0.5 && gunduzYatak) ? gunduzYatak : yatakDoku;
    if (yatak.material.map !== istenen) {
      yatak.material.map = istenen; yatak.material.needsUpdate = true;
    }
    const yr = karistir(O0.grid[0], O1.grid[0]);
    // Deger: yatak gunduzde de ORTA degerde kalmali. Tam acik birakilinca
    // krem bir kilime donuyor ve nota uzerinde tutunamiyor - notanin
    // oturdugu yuzeyin daima ondan koyu olmasi kurali gece icin oldugu
    // kadar gunduz icin de gecerli.
    yr.lerp(new THREE.Color('#ffffff'), gd * 0.88);
    yatak.material.color.copy(yr).multiplyScalar(0.42 + gd * 0.24);
  }
  // GUNDUZ: karanlik temadan kalan katmanlar KAPANIR.
  // Kullanici (3 Eyl): "bir onceki videodaki seyleri burada niye
  // kullaniyorsun". Neon lane seritleri, akan izgara, havada suzulen dikey
  // kartlar ve boyali yatak dokusu hepsi gece dilinin parcasi; acik alanda
  // sahneyi hem yikayip hem sahtelestiriyorlardi.
  // ======================================== OBBY MEKANI (raysiz acik gok)
  // 5 Eyl 2026. Referans: Escapify 'Roblox Obby Run' (imnH2PtT5-o), parlak
  // bolum kareleri. Olculdu: kare %71-96 gok-benzeri piksel, deger 0,96.
  // Referansta mekanin YAPISI su - ve neyin OLMADIGI en az neyin oldugu
  // kadar onemli:
  //   VAR : duz tek renk fon (gradyan yok), boslukta suzulen tek renk
  //         doseli serit, ucusan cubuk/top/halka
  //   YOK : yan duvar, ray, balast, travers, tren, viyaduk, ufuk silueti,
  //         gokyuzu kubbesi, yol platformu seddi
  // Bu mod ortam 'zemin: "gok"' dediginde acilir. Demeyen ortamlar icin
  // hicbir sey degismiyor - gar dunyasi oldugu gibi duruyor.
  const gokMod = ((yumusak < 0.5 ? O0 : O1).zemin === 'gok');
  // DENIZ MODU (5 Eyl 2026): gokMod'un ustune kurulu. Obby'nin lego
  // yapilari kapaniyor, yerine su yuzeyi + bordur + kule geliyor.
  // Bulut ACIK kaliyor: referansta bulut hizli akiyor, deniz durgun -
  // derinlik o hiz farkindan cikiyor (REFERANS-15-VIDEO-NOTLARI.md 3).
  const denizMod = ((yumusak < 0.5 ? O0 : O1).deniz === true);
  // SEHIR KOPRUSU (11 Eyl 2026): o da gokMod ustune kurulu; deniz katmanlari
  // 'deniz' bayragina bagli oldugu icin burada kapali kaliyor.
  const sehirMod = ((yumusak < 0.5 ? O0 : O1).sehir === true);
  // UFUK YUKSEKLIGI - olculdu, gozle ayarlanmadi.
  // Kamera (0, 3.7, 10.8) -> lookAt(0, 0.55, -6) ile 10,6 derece asagi
  // bakiyor; render edilen karede ufuk kadrajin %26'sinda cikti.
  // Referans %45-50 (MEKAN-KARARI.md dogrulama olcutu). Tam oraya cikarmak
  // nota koridorunu kadrajin disina itiyor - egim YARIYA indirildi, hedef
  // %36. Ara deger bilincli: denizin gorunmesi ile oyun alaninin korunmasi
  // arasindaki takas. Yalnizca deniz modunda; oteki bolumlerin cerceveleme
  // kararlari degismiyor.
  // Sehir referansinda ufuk %53 - tam oraya cikmak vurus cizgisini kadraj
  // disina itiyor (deniz icin hesaplandi). Ayni ara deger: ufuk ~%40.
  // KARPUZ'da ufuk 2,14 ile %41,5 olculdu - kural %42-50, kil payi disarida.
  // Mekan yukaridan kuruldugu icin kadrajin ust seridi zaten dolu; egimi
  // biraz artirmak hem ufku kurala sokuyor hem bas ustundeki kutleye yer
  // aciyor. Oteki modlarin cerceveleme karari DEGISMIYOR.
  // ELMA: ufuk %41,6 olculmustu (kural %42-50). Bakis noktasi yukari alininca
  // ufuk kadrajda asagi iner ve bant icine oturur - olculerek bulundu.
  camera.lookAt(0, balMod ? BAL_BAKIS : elmaMod ? 2.62 : (karpuzMod ? 2.62 : ((denizMod || sehirMod || sadeMod) ? 2.14 : 0.55)), -6);

  // --- KURULUS CEKIMI (5 Eyl 2026)
  // Referansta ilk 10 saniye piste DEGIL, denize bakiyor: tek platform
  // disaridan gosteriliyor, sonra kamera pistin uzerine iniyor. Oyuncu
  // nereye asili oldugunu gormeden "deniz ustu" hissi olusmuyor
  // (REFERANS-15-VIDEO-NOTLARI.md, madde 8.1).
  // Muzige DOKUNMUYOR: bolum-06 iskeletinin ilk kaydi [0, 6, 'bos',
  // 'nefes'] - basta zaten 6 olculuk (11,1 sn) bos nefes var. Kurulus o
  // bosluga oturuyor, tek bir nota kaymiyor, yeniden hizalama gerekmiyor.
  // Deterministik: yalnizca t'nin fonksiyonu, kare basina rastgele yok.
  if (denizMod && suOlcu < 5.4) {
    const k = THREE.MathUtils.smoothstep(suOlcu / 5.4, 0, 1);
    const y = k * k * (3 - 2 * k);                 // iki kat yumusatma: cikis cok yavas
    // Disaridan -> icine. Kamera saga ve yukari aciliyor, sonra pistin
    // uzerindeki normal yerine oturuyor.
    camera.position.set(
      THREE.MathUtils.lerp(30.0, 0.0,  y),
      THREE.MathUtils.lerp(17.5, 3.7,  y),
      THREE.MathUtils.lerp(44.0, 10.8, y));
    camera.lookAt(
      0,
      THREE.MathUtils.lerp(-1.2, 2.14, y),
      THREE.MathUtils.lerp(-22.0, -6.0, y));
  } else if (denizMod || sehirMod) {
    camera.position.set(0, 3.7, 10.8);             // kurulus bitti, normal yer
    camera.lookAt(0, 2.14, -6);
  }

  for (const ls of laneSeritleri) ls.visible = gd < 0.5;
  if (yatak) yatak.visible = gd < 0.5 && !gokMod;
  // Yukseltilmis yol platformu da gece dilinin parcasi. Gunduzde oyuncu
  // dogrudan traverslerin uzerinde: referansta kosucu rayin ICINDE kosuyor,
  // ayri bir sedde uzerinde degil. Platform acik kalinca traverslerin
  // ustunu ortuyor ve ortada bos krem bir serit birakiyordu.
  if (yolGovdeMesh) yolGovdeMesh.visible = gd < 0.5 || gokMod;
  vurusCizgi.visible = gd < 0.5;          // yerde neon serit yok
  for (const dg of dalgalar) dg.visible = gd < 0.5;
  // Gunduzde shader'li zemin yerine golge ALAN balast duzlemi.
  zemin.visible = gd < 0.5 && !gokMod;
  zemin.position.y = -YOL_KAL;
  if (cakil3d) cakil3d.visible = gd > 0.5 && !gokMod;
  if (ufukSilueti) ufukSilueti.visible = gd > 0.5 && !gokMod;
  if (balastZemin) {
    balastZemin.visible = gd > 0.5 && !gokMod;
    if (window.__BALAST) window.__BALAST.offset.y = (-t * hiz / (240 / 60)) % 1;
  }

  // --- ACIK ALAN GEOMETRISI: kaydirma, renk, gorunurluk
  if (acikKok) {
    acikKok.visible = gd > 0.5 && !gokMod;
    if (acikKok.visible) {
      const tipAd = (yumusak > 0.5 ? O1.dekor : O0.dekor) || 'acik1';
      const P = ACIK_PALET[tipAd] || ACIK_PALET.acik1;
      // Cakil taslari: traverslerle ayni hizda akar. Konum, olcek ve donus
      // indeksten turetiliyor -> deterministik, kare basina rastgele yok.
      if (cakil3d) {
        const C = window.__CAKIL;
        const m2 = new THREE.Matrix4(), q = new THREE.Quaternion();
        const e = new THREE.Euler(), v = new THREE.Vector3(), sc2 = new THREE.Vector3();
        const rnd = (n) => { const x = Math.sin(n * 91.37) * 43758.5453; return x - Math.floor(x); };
        for (let i = 0; i < C.say; i++) {
          const x = (rnd(i) - 0.5) * 25.0;
          const z0 = rnd(i + 501) * C.z;
          const z = Z_VURUS + 5 - C.z + ((z0 + t * HIZ) % C.z);
          const o = 0.55 + rnd(i + 77) * 1.15;
          e.set(rnd(i + 11) * 3.14, rnd(i + 23) * 3.14, rnd(i + 37) * 3.14);
          q.setFromEuler(e);
          v.set(x, -0.11 + rnd(i + 91) * 0.05, z);
          sc2.set(o, o * 0.72, o);
          m2.compose(v, q, sc2);
          cakil3d.setMatrixAt(i, m2);
        }
        cakil3d.instanceMatrix.needsUpdate = true;
      }

      // Traversler: kamera sabit, travers akiyor. Notayla AYNI hizda -
      // yoksa yol kayiyor ama nota duruyor gibi bir kayma hissi olusuyor.
      if (travers3d) {
        const T = window.__TRAVERS, kap = T.ara * T.say;
        const mat = new THREE.Matrix4();
        for (let i = 0; i < T.say; i++) {
          const z = Z_VURUS + 6 - kap + ((i * T.ara + t * HIZ) % kap);
          mat.makeTranslation(0, -0.04, z);       // ust yuz ~0.02
          travers3d.setMatrixAt(i, mat);
        }
        travers3d.instanceMatrix.needsUpdate = true;
      }
      const BAY_Z = 8.6, kapsam = BAY_Z * (acikBaylar.length / 2);
      for (const b of acikBaylar) {
        b.g.position.z = Z_VURUS + 8 - kapsam + ((b.i * BAY_Z + t * HIZ) % kapsam);
        b.peron.material.color.set(P.duvar);
        b.agiz.material.color.set(P.duvarKoyu);
        b.kolon.material.color.set(P.direk);
        b.baslik.material.color.set(P.direkUst);
        b.sacak.material.color.set(P.silme);
        b.alin.material.color.set(P.duvarKoyu);
        // tabela: kolonla ayni aileden, sadece daha koyu. Once kaide
        // rengindeydi (doygun mercan) ve havada asili kirmizi levhalar
        // gibi okunuyordu.
        if (b.tabela) b.tabela.material.color.set(P.duvarKoyu);
        if (b.ek) for (const [mesh, anahtar] of b.ek) mesh.material.color.set(P[anahtar]);
        // serit ve lamba ortamdan bagimsiz: guvenlik seridi her istasyonda
        // ayni sari, lamba her istasyonda ayni sicak beyaz.
      }
    }
  }

  if (yanYatak) {
    // Yan hatlar SADECE gunduz acik alanda. Gece ortamlarinda yolun disi
    // bos uzay kalmali - orasi zaten olculmus bir karar.
    // Obby mekaninda yolun disi BOS gok. Referansta serit boslukta suzuluyor,
    // iki yaninda hat yok - yan yatak acik kalinca kare yine gara donuyordu.
    yanYatak.visible = gd > 0.02 && !gokMod;
    yanYatak.material.opacity = gd;
    // Yan hatlar yolun KENDISINDEN koyu olmali: goz oyun alanina gitsin.
    // 0,80'de zemin genisleyince kare pastel bir kilime donuyordu.
    yanYatak.material.color.copy(new THREE.Color('#e8dcc4')).multiplyScalar(0.60);
  }
  GOK_MOD_AKTIF = gokMod;
  DENIZ_MOD_AKTIF = denizMod;
  SEHIR_MOD_AKTIF = sehirMod;
  KARPUZ_MOD_AKTIF = karpuzMod;
  ELMA_MOD_AKTIF = elmaMod;
  BAL_MOD_AKTIF = balMod;
  if (sehirKok) {
    sehirKok.visible = sehirMod;
    if (sehirMod) sehirGuncelle(t, O0, O1, yumusak, karistir);
  }
  if (bulutKok) {
    const bulutIster = gokMod && ((yumusak < 0.5 ? O0 : O1).bulut === true);
    bulutKok.visible = bulutIster;
    if (bulutIster) for (const m of bulutKok.children) {
      const u = m.userData;
      // Seritten YAVAS akiyorlar (0,22 kat) - paralaks bundan cikiyor.
      m.position.set(u.x, u.y,
        Z_VURUS + 20 - u.KAPB + ((u.z0 + t * HIZ * 0.22) % u.KAPB));
      m.quaternion.copy(camera.quaternion);      // her zaman kameraya bak
    }
  }
  // --- TABAN: tek yuzey + olcu cubugu + nabiz halkasi
  if (tabanKok) {
    tabanKok.visible = sadeMod;
    if (sadeMod) {
      const U = tabanMat.uniforms;
      // uMod ritim katmanini secer: 0 = olcu cubugu + nabiz halkasi (MEK-001),
      // 1 = bas ustunden gecen asma dalinin golgesi (MEK-002). Ayni duzlem,
      // ayni rampa, farkli sayma ogesi.
      U.uMod.value = balMod ? 3 : (elmaMod ? 2 : (karpuzMod ? 1 : 0));
      U.uYakin.value.copy(karistir(O0.tabanYakin || O0.gok, O1.tabanYakin || O1.gok));
      U.uUzak .value.copy(karistir(O0.tabanUzak  || O0.gok, O1.tabanUzak  || O1.gok));
      U.uGok  .value.copy(karistir(O0.gok, O1.gok));
      U.uVurus.value.copy(karistir(O0.tabanVurus || O0.gok, O1.tabanVurus || O1.gok));
      U.uHalka.value.copy(karistir(O0.tabanHalka || O0.gok, O1.tabanHalka || O1.gok));
      U.uT.value = t; U.uOLCU.value = OLCU; U.uHIZ.value = HIZ;
      if (karpuzMod) {
        U.uYol.value     .copy(karistir(O0.yolZemin   || O0.gok, O1.yolZemin   || O1.gok));
        U.uSerit.value   .copy(karistir(O0.kabukSerit || O0.gok, O1.kabukSerit || O1.gok));
        U.uAk.value      .copy(karistir(O0.akKabuk    || O0.gok, O1.akKabuk    || O1.gok));
        U.uEt.value      .copy(karistir(O0.et         || O0.gok, O1.et         || O1.gok));
        U.uCekirdek.value.copy(karistir(O0.cekirdek   || O0.gok, O1.cekirdek   || O1.gok));
        U.uKFaz.value = KARPUZ_FAZ;
      }
      if (elmaMod) {
        // Shader'da: uYol = koridor koyu bandi, uSerit = SOL cizgi,
        // uEt = ORTA cizgi, uHalka = SAG cizgi, uVurus = enine olcu cubugu.
        U.uYol.value  .copy(karistir(O0.yol || O0.gok, O1.yol || O1.gok));
        U.uSerit.value.copy(karistir(O0.elmaCizgiSol  || O0.grid[0], O1.elmaCizgiSol  || O1.grid[0]));
        U.uEt.value   .copy(karistir(O0.elmaCizgiOrta || O0.grid[1], O1.elmaCizgiOrta || O1.grid[1]));
        U.uHalka.value.copy(karistir(O0.elmaCizgiSag  || O0.grid[2], O1.elmaCizgiSag  || O1.grid[2]));
      }
    }
  }
  // --- KARPUZ: bas ustunden gecen asma dallari (mekani kuran kutle)
  // --- ELMA: billboard elma yigini (mekani kuran kutle)
  if (elmaKok) {
    elmaKok.visible = elmaMod;
    if (elmaMod) elmaGuncelle(t);
  }
  if (elmaAgacKok) {
    elmaAgacKok.visible = elmaMod;
    if (elmaMod) elmaAgacGuncelle(t);
  }
  // --- BAL: olcuye kilitli bal iplikleri (MEK-004 ritim ogesi)
  if (balMod && !balIplikKok) balIplikKur();
  if (balIplikKok) {
    balIplikKok.visible = balMod;
    if (balMod) balIplikGuncelle(t);
  }
  if (karpuzKok) {
    karpuzKok.visible = karpuzMod;
    if (tarlaIM) { tarlaIM.visible = karpuzMod; tarlaYaprakIM.visible = karpuzMod; }
    if (karpuzMod) karpuzGuncelle(t, O0, O1, yumusak, karistir);
  }
  // --- DENIZ: su yuzeyi, guverte deseni, bordur, kule
  if (denizKok) {
    denizKok.visible = denizMod;
    if (denizMod) {
      const U = denizMat.uniforms;
      U.uT.value = t;
      U.uYakin  .value.copy(karistir(O0.denizYakin || O0.gok, O1.denizYakin || O1.gok));
      U.uUzak   .value.copy(karistir(O0.denizUzak || O0.gok, O1.denizUzak || O1.gok));
      U.uGok    .value.copy(gok);
      U.uParlama.value.copy(karistir(O0.parlama || '#ff7a3c', O1.parlama || '#ff7a3c'));
      U.uGuc    .value = (O0.parlamaGuc ?? 1.0) + (((O1.parlamaGuc ?? 1.0)) - (O0.parlamaGuc ?? 1.0)) * yumusak;
      const g0 = O0.gece ? 1 : 0, g1 = O1.gece ? 1 : 0;
      U.uGece   .value = g0 + (g1 - g0) * yumusak;
    }
  }
  if (guverteMesh) {
    guverteMesh.visible = denizMod;
    // Desen notayla AYNI hizda akiyor. repeat.y = 26, uzunluk 220 birim ->
    // bir tekrar 8,46 birim. Kayma = yol alinan mesafe / tekrar boyu.
    if (denizMod) guverteDoku.offset.y = (-t * HIZ / (220 / 26)) % 1;
  }
  if (bordurKok) {
    bordurKok.visible = denizMod;
    if (denizMod) for (const m of bordurKok.children) {
      const anahtar = m.userData.rol === 'ust' ? 'bordur' : 'bordurKoyu';
      m.material.color.copy(karistir(O0[anahtar] || (anahtar === 'bordur' ? '#ff4d2e' : '#7a1408'),
                                     O1[anahtar] || (anahtar === 'bordur' ? '#ff4d2e' : '#7a1408')));
    }
  }
  if (kuleKok) {
    kuleKok.visible = denizMod;
    if (denizMod) {
      const { ARA, KAP } = kuleKok.userData;
      for (const g of kuleKok.children) {
        g.position.z = Z_VURUS + 6 - KAP + ((g.userData.i * ARA + t * HIZ) % KAP);
        g.userData.govde.color.copy(karistir(O0.kule || '#0d0f2e', O1.kule || '#0d0f2e'));
        g.userData.neon .color.copy(karistir(O0.kuleNeon || '#22e0ff', O1.kuleNeon || '#22e0ff'));
      }
    }
  }
  if (halkaKok) {
    halkaKok.visible = denizMod;
    if (denizMod) {
      const { ARA, KAP } = halkaKok.userData;
      for (const m of halkaKok.children) {
        // ARA*0.5 kaydirma: kule 4 olcuda bir, halka 6 olcuda bir geliyor;
        // kaydirma olmadan 12 olcude bir ust uste biniyorlar ve halka
        // kapinin icinde kayboluyordu.
        const z = Z_VURUS + 4 - KAP + ((m.userData.i * ARA + ARA * 0.5 + t * HIZ) % KAP);
        // u = vurus cizgisine uzaklik. u=0'da sinus sifir -> halka TAM ORTADA.
        // Uzaktayken yana aciliyor, yaklastikca ortaya oturuyor.
        const u = (z - Z_VURUS) / 46;
        // y=2,7 ilk denemede halkanin alt yarisi guvertenin ICINE giriyordu
        // ve kadrajda yarim ay gibi okunuyordu. 3,4'e cikti: alt nokta
        // guvertenin hemen ustunde, halka TAM DAIRE olarak koridoru
        // cevreliyor - icinden gecildigi ancak boyle okunuyor.
        m.position.set(4.8 * Math.sin(u * 1.35), 3.4, z);
        m.rotation.z = u * 0.42;                 // hafif yalpalama
        m.userData.mat.color.copy(karistir(O0.kuleNeon || '#22e0ff',
                                           O1.kuleNeon || '#22e0ff'));
      }
    }
  }
  // --- DENIZ EK KATMANLARI: onluk, kopuk, gunes diski, samandira
  if (onlukL) {
    onlukL.visible = onlukR.visible = kopukIM.visible = denizMod;
    if (denizMod) {
      const { ADIM, SAY, KAP } = onlukL.userData;
      const M = new THREE.Matrix4(), V = new THREE.Vector3(),
            Q = new THREE.Quaternion(), S3 = new THREE.Vector3();
      const P = t * HIZ;
      let ki = 0;
      for (let i = 0; i < SAY; i++) {
        const z = Z_VURUS + 6 - KAP + ((i * ADIM + P) % KAP);
        const g = denizOnlukGen(z + P);        // dunya istasyonu = z + P
        const w = Math.max(0.001, g);
        for (const [im, yon] of [[onlukL, -1], [onlukR, 1]]) {
          V.set(yon * (YOL_GEN/2 + w/2), -YOL_KAL/2, z);
          S3.set(w, YOL_KAL, ADIM + 0.06);
          M.compose(V, Q, S3);
          im.setMatrixAt(i, M);
        }
        for (const yon of [-1, 1]) {
          // Kopuk cizgisi kabariyor: dalga suyun kenarina vuruyor.
          // Kopuk ilk denemede DENIZ_Y+0,10'daydi ve onlugun arkasinda
          // kaliyordu (onluk kutusu -0,85..0 arasini kapliyor). Su

            kur(EN, 1.5, 0.75);
          } else if (no.tip === 'wave_L' || no.tip === 'wave_R') {
            // Yana uzanma: yolu kapatmaz, hedef seridin uzerinde durur.
            kur(3.0, 1.3, 3.95);
            m.position.x = gov.cx;
          } else {
            // Yana adim / dodge: GENISLIK bosluktan geliyor, ona
            // dokunulmuyor (buyutmek boslugu kapatir, yon okunmaz olur).
            // Degisen yalnizca yukseklik: kutle tavana kadar cikiyor.
            kur(gov.w, TAV - 0.1, (TAV - 0.1) / 2);
          }
        }
        // Sehirde de duck govdesi gizli: kirisi neonBar tasiyor.
        if (GOK_MOD_AKTIF && !SEHIR_MOD_AKTIF && no.tip === 'duck') m.visible = false;
        // KARPUZ: engelin govdesi HER cue'da gizli. Dort hareketin dordu de
        // ayni kutunun olceklenmis hali olamaz (4 Eyl dersi) - engeli
        // meyve / dal / kesit / yaprak kuruyor, kutu degil.
        if (KARPUZ_MOD_AKTIF || ELMA_MOD_AKTIF || BAL_MOD_AKTIF) m.visible = false;
        if (m.userData.destek){
          m.userData.destek.visible = true;
          engelDestekGuncelle(m.userData.destek, no.tip, z, gov ||
            { cx:m.position.x, y:m.position.y, w:2.05*m.scale.x,
              h:0.34*m.scale.y, d:2.45*m.scale.z }, no.combo || 0);
        }
      } else {
        if (m.userData.gece && m.material !== m.userData.gece) m.material = m.userData.gece;
        if (m.userData.destek) m.userData.destek.visible = false;
        m.scale.set(1, 1, 1);
        m.position.set(LANE_X[no.lane], TB ? 0.18 : 0.06, z);
      }
      const sonme = ilerleme > 1 ? 1 - (ilerleme-1)/0.04 : 1;
      const op = TB ? (0.70 + 0.30 * Math.min(1, ilerleme*2.6)) * sonme
                    : 0.35 + 0.65 * Math.min(1, ilerleme*1.6) * sonme;
      if (engelde) { /* engel opak: yerde duran cisim solmaz */ }
      else if (m.userData.mats) m.userData.mats.forEach(x => x.opacity = op);
      else m.material.opacity = op;
    }
    if (TB) {
      const km = kartMesh[i];
      if (ilerleme < 0 || ilerleme > 0.62) km.visible = false;
      else {
        km.visible = gd < 0.5;      // gunduzde havada kart yok
        const z = Z_DOGUM + (Z_VURUS - Z_DOGUM) * ilerleme;
        km.position.set(LANE_X[no.lane] * 0.55, 2.35, z);
        // devir teslim: 0.42'den sonra sonuyor, blok devraliyor
        km.material.opacity = ilerleme < 0.10 ? ilerleme / 0.10
                            : ilerleme > 0.42 ? Math.max(0, 1 - (ilerleme - 0.42) / 0.20)
                            : 1;
      }
    }
    if (t >= no.t) { combo = no.combo; sonVurus = no.t; }
    if (t >= no.t && no.combo % 8 === 0) { sonKm = no.t; kmCombo = no.combo; }
  });

  // vurus halkasi
  const dt = t - sonVurus;
  if (dt >= 0 && dt < 0.30){
    const k = dt/0.30;
    const no = NOTALAR.find(x => x.t === sonVurus);
    halka.visible = true;
    halka.position.set(no ? LANE_X[no.lane] : 0, 0.07, Z_VURUS);
    halka.scale.setScalar(0.55 + k*1.9);
    halka.material.opacity = (1 - k) * (1 - k);
  } else halka.visible = false;

  // siluet: aktif cue varsa onun klibi, yoksa idle
  if (mixer){
    const suO = t / OLCU;
    const blok0 = BLOKLAR.find(b => suO >= b[0] && suO < b[1]) || BLOKLAR[BLOKLAR.length-1];

    // ---------------------------------------------- SEGMAN (15 Eyl 2026)
    // Siluetin o anda ne oynadigi TEK bir fonksiyondan cikiyor: cue varsa
    // cue klibi, yoksa blogun adim/egzersiz klibi. Fonksiyon t'nin saf
    // fonksiyonu oldugu icin BIR ONCEKI segman da hesaplanabiliyor - gecis
    // harmani bundan turuyor.
    // Sebep olculdu (olc-siluet-akis.js): klip degisimlerinde siluetin yatay
    // merkezi tek karede medyanin 6-14 kati siciyordu; cue bitisi, cue
    // baslangici ve step_L<->step_R takasi. Kullanici: "garip hareketler
    // yapmasin".
    const segAl = (tt) => {
      let lo = 0, hi = NOTALAR.length - 1, kk = -1;
      while (lo <= hi) { const m = (lo + hi) >> 1;
        if (NOTALAR[m].bas <= tt) { kk = m; lo = m + 1; } else hi = m - 1; }
      let cueBitis = 0;
      if (kk >= 0) {
        const n = NOTALAR[kk];
        if (tt < n.bas + n.pencere && aksiyon[n.klip])
          return { ad: n.klip, bas: n.bas, gecisBas: n.bas, sure: n.pencere, ayna: !!AYNA_CUE[n.tip] };
        // Cue bitmis: dolgu segmani IZGARA basindan degil, cue'nun BITTIGI
        // yerden baslar. Yoksa gecis harmani hic tetiklenmiyordu - cue tam
        // ortasinda bittigi adim segmaninin basi cok geride kaliyor.
        cueBitis = n.bas + n.pencere;
      }
      const bl = BLOKLAR.find(b => tt / OLCU >= b[0] && tt / OLCU < b[1]) || BLOKLAR[BLOKLAR.length-1];
      const hr = bl[3] || 'idle';
      if (hr === 'adim') {
        const yn = Math.floor(tt / (OLCU / 2));
        const gb = yn * (OLCU / 2);
        return { ad: (yn % 2) ? 'step-right' : 'step-left', bas: gb,
                 gecisBas: Math.max(gb, cueBitis), sure: OLCU / 2, ayna: false };
      }
      if (hr !== 'nefes' && aksiyon[hr] && IZINLI_KLIP(hr)) {
        const hd = HEDEF_SURE[hr] || OLCU;
        const gb2 = Math.floor(tt / hd) * hd;
        return { ad: hr, bas: gb2, gecisBas: Math.max(gb2, cueBitis), sure: hd, ayna: false };
      }
      const nb = aksiyon['idle-breathing'] ? 'idle-breathing' : 'idle';
      const hd2 = HEDEF_SURE[nb] || OLCU;
      const gb3 = Math.floor(tt / hd2) * hd2;
      return { ad: nb, bas: gb3, gecisBas: Math.max(gb3, cueBitis), sure: hd2, ayna: false };
    };
    const olcek = (adx, surex) => {
      const A0 = aksiyon[adx]; if (!A0) return 1;
      const dg = KLIP_DONGU[adx];
      if (dg) { const tk = Math.max(1, Math.round(surex / dg)); return (tk * dg) / surex; }
      return A0.klip.duration / surex;
    };

    const seg = segAl(t);
    let ad = seg.ad, yerel = t - seg.bas, ozelSure = seg.sure;
    SILUET_AYNA = seg.ayna;
    // SILUET DONUSU (16 Eyl 2026, push-it). Onden bakan kamerada ONE uzanan
    // kollar kisalip "eller yukari" gibi okunuyordu (olculdu: don 0'da tepe
    // pozu kollar bas ustunde). Govde 1,1 rad yana donunce ayni poz duvara
    // yuklenen iki elle itme olarak okunuyor. Donus itmenin kendi agirlik
    // egrisiyle (0,14-0,42 sn cik, 1,18-1,46 sn don) yapiliyor - ani cevrilme yok.
    if (siluet) {
      let dn = 0;
      if (seg.ad === 'push-it' && seg.sure > 0) {
        const p = Math.min(1, Math.max(0, (t - seg.bas) / seg.sure));
        const yuk = (x, a0, a1) => { const k = Math.min(1, Math.max(0, (x - a0) / (a1 - a0))); return k * k * (3 - 2 * k); };
        dn = SILUET_DON * (yuk(p, 0.06, 0.26) - yuk(p, 0.74, 0.94));
      }
      siluet.rotation.y = dn;
    }

    // GECIS HARMANI: segman degisiminin ilk GECIS saniyesinde onceki segman
    // hala calmaya devam ediyormus gibi hesaplanip uzerine harmanlaniyor.
    const GECIS = AKIS2 ? 0.16 : 0;
    let segOnce = null, w = 1;
    const segBasi = (seg.gecisBas !== undefined) ? seg.gecisBas : seg.bas;
    if (GECIS > 0 && (t - segBasi) < GECIS && segBasi > 0.001) {
      segOnce = segAl(segBasi - 1e-4);
      if (segOnce.ad === seg.ad) segOnce = null;
      else { const x = (t - segBasi) / GECIS; w = x * x * (3 - 2 * x); }
    }
    // Aynalama harman sirasinda BASKIN segmana gore secilir; yoksa yari yolda
    // figur aniden cevriliyor.
    if (segOnce) SILUET_AYNA = (w >= 0.5) ? seg.ayna : segOnce.ayna;

    const A = aksiyon[ad];
    const N = segOnce ? aksiyon[segOnce.ad] : null;
    if (A){
      const sure = ozelSure || A.hedef;
      const harmanla = !!N && N !== A && w < 0.999;
      for (const [k,v] of Object.entries(aksiyon))
        v.a.enabled = (k === ad) || (harmanla && v === N);

      A.a.play();
      A.a.setEffectiveWeight(harmanla ? w : 1);
      A.a.timeScale = olcek(ad, sure);
      let nSure = 0, nYerel = 0;
      if (harmanla){
        nSure = segOnce.sure;
        nYerel = t - segOnce.bas;              // onceki segman DEVAM ediyormus gibi
        N.a.play();
        N.a.setEffectiveWeight(1 - w);
        N.a.timeScale = olcek(segOnce.ad, nSure);
      }
      mixer.setTime(0);
      A.a.time = (yerel % sure) * A.a.timeScale;
      if (harmanla) N.a.time = (nYerel % nSure) * N.a.timeScale;
      mixer.update(0);
      // root motion kilidi - poz korunur, yer degistirme silinir
      if (kokKemik && kokBaslangic) {
        kokKemik.position.x = kokBaslangic.x;
        kokKemik.position.z = kokBaslangic.z;
      }
    } else {
      for (const [k,v] of Object.entries(aksiyon)) v.a.enabled = false;
    }
  }

  renderer.render(scene, camera);

  // 3B -> 2B kopyala, HUD ustune yaz
  bx.filter = 'none';
  bx.globalCompositeOperation = 'source-over';
  bx.globalAlpha = 1;
  bx.drawImage(canvas, 0, 0);

  // UCUZ BLOOM: ayni kareyi bulaniklastirip toplayarak ekle.
  // Gercek cok gecisli bloom pahali; bu tek cizimle neon parlamasini veriyor.
  bx.save();
  bx.globalCompositeOperation = 'lighter';
  if (BLOOM_ACIK) {
    // BLOOM gece dilinin aracidir: koyu zeminde neon parlamasini o veriyor.
    // Gunduz acik alanda ayni bloom butun kareyi turuncu bir pusa cevirip
    // yeni kurulan gercek geometriyi yikiyordu. Gunduzde neredeyse kapali.
    // BAL (17 Eyl 2026): krem gok + parlak petek bloom altinda beyaza yikaniyordu
    // (ilk motor karesi). Gunduz gibi kisiliyor.
    const bloomK = 1 - Math.max(gd * 0.86, BAL_MOD_AKTIF ? 0.80 : 0);
    bx.globalAlpha = (TB ? 0.17 : 0.50) * bloomK;
    bx.filter = TB ? 'blur(10px)' : 'blur(14px)';
    bx.drawImage(canvas, 0, 0);
    // genis bulaniklik parlak zemini siluetin uzerine tasiyip onu saydam
    // gosteriyordu - dusuk tutuluyor
    bx.globalAlpha = (TB ? 0.05 : 0.13) * bloomK;
    bx.filter = 'blur(38px)';
    bx.drawImage(canvas, 0, 0);
  }
  bx.restore();
  bx.filter = 'none';

  // --- ON PLAN CERCEVESI
  // Sahnenin ONUNDE duran grafik katman. Kareyi "oyun arayuzu" gibi
  // gosteriyor ve kenar boslugunu kapatiyor. Bicimi ortamla degisiyor.
  {
    const ins = 0.026 * W, r = 0.05 * W;
    const x0 = ins, y0 = ins, x1 = W - ins, y1 = H - ins;
    const bic = (yumusak > 0.5 ? O1.bicim : O0.bicim) || 'yuvarlak';
    bx.save();
    // B'de 'lighter' parlak zeminde hicbir sey gostermez - normal cizim,
    // koyu golge ve daha kalin hat gerekiyor.
    bx.globalCompositeOperation = 'lighter';
    bx.globalAlpha = (TB ? 0.16 : 0.30) + (TB ? 0.10 : 0.22) * nabizOlcu;
    bx.strokeStyle = '#' + karistir(O0.kemer[0], O1.kemer[0]).getHexString();
    bx.shadowColor = bx.strokeStyle; bx.shadowBlur = 0.020 * W;
    bx.lineWidth = 0.0055 * W;
    bx.beginPath();
    if (bic === 'altigen' || bic === 'elmas') {
      const k = 0.10 * W;
      bx.moveTo(x0+k, y0);  bx.lineTo(x1-k, y0); bx.lineTo(x1, (y0+y1)/2);
      bx.lineTo(x1-k, y1);  bx.lineTo(x0+k, y1); bx.lineTo(x0, (y0+y1)/2);
      bx.closePath();
    } else if (bic === 'keskin' || bic === 'tonoz') {
      bx.rect(x0, y0, x1-x0, y1-y0);
    } else if (bic === 'ikiz' || bic === 'halka') {
      bx.rect(x0, y0, x1-x0, y1-y0);
      bx.rect(x0+r*0.5, y0+r*0.5, x1-x0-r, y1-y0-r);
    } else {
      bx.roundRect(x0, y0, x1-x0, y1-y0, r);
    }
    bx.stroke();
    bx.restore();
    bx.globalAlpha = 1;
    bx.globalCompositeOperation = 'source-over';
  }

  // --- SILUET GECISI: kendi sahnesi, saydam arka planla, kosede kucuk
  //     bir alana render edilir; sonra 2B tarafta panele cizilir.
  if (siluet) {
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, PW, PH);
    renderer.setScissor(0, 0, PW, PH);
    renderer.setClearAlpha(0);
    renderer.render(sahneSiluet, kameraSiluet);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, W, H);
    renderer.setClearAlpha(1);
    // GL viewport sol-ALT baslar, 2B sol-UST -> y cevrilir
    mx.clearRect(0, 0, PW, PH);
    mx.drawImage(canvas, 0, H - PH, PW, PH, 0, 0, PW, PH);
  }
  siluetPaneliCiz(O1.grid[0]);
  hudCiz(t, combo, sonKm > -90 ? t - sonKm : -1, kmCombo, seviyeNo, duyuru, sonVurus,
         karistir(O0.grid[0], O1.grid[0]));

  // ortam gecisinde beyaz cakma
  if (cakma > 0){
    bx.save();
    bx.globalCompositeOperation = 'lighter';
    bx.globalAlpha = cakma * 0.80;
    bx.fillStyle = '#ffffff';
    bx.fillRect(0, 0, W, H);
    bx.restore();
  }
  bx.drawImage(hud, 0, 0);

  // --- SON PAS (sadece B): siyahi dibe bastir
  // Olcum: referansta medyan luma 0.084, piksellerin %39'u siyah; bizde
  // 0.173 / %13 kalmisti. Tek tek katmanlari kismak yerine son karede
  // seviye duzeltmesi yapmak hem daha kontrollu hem tek yerde duruyor.
  // contrast siyahi asagi ceker, brightness genel seviyeyi indirir;
  // parlak neon hatlar ayakta kalir.
  if (TB && PAS_ACIK) {
    ax.clearRect(0, 0, W, H);
    ax.drawImage(birlesik, 0, 0);
    bx.clearRect(0, 0, W, H);
    bx.filter = 'brightness(0.88) contrast(1.16)';
    bx.drawImage(araCv, 0, 0);
    bx.filter = 'none';
  }
}

// disariya ac
window.SURE_OLCU = TOPLAM_OLCU;
window.TOPLAM_KARE = Math.round(TOPLAM_OLCU * OLCU * FPS);
window.kareKur = kareKur;
// CIKIS TUVALI - opak.
// birlesik tuvalin ~%10'u saydam kaliyor (siluet gecisi clearAlpha(0) ile
// render ediliyor). PNG alfayi tasiyor, JPEG tasimiyor; format degistirince
// goruntu de degisiyordu. Cikis once SIYAH zemine bindiriliyor, boylece
// format secimi goruntuyu etkilemiyor.
const cikisCv = document.createElement('canvas');
cikisCv.width = W; cikisCv.height = H;
const cikisCtx = cikisCv.getContext('2d', { alpha: false });
window.__CIKIS = cikisCv;
window.kareAl = (bicim, kalite) => {
  cikisCtx.fillStyle = '#000000';
  cikisCtx.fillRect(0, 0, W, H);
  cikisCtx.drawImage(birlesik, 0, 0);
  // KARE BICIMI - olculdu (03-motor/olc-hiz.js, olc-jpeg.js), 1920x1080:
  //   png        ~2450 ms   kayipsiz
  //   webp q1.0  ~2450 ms   kayipsiz (PNG ile bit bit ayni)
  //   jpeg q1.0     64 ms   PSNR 51,9 dB - en buyuk piksel farki 5/255
  //   jpeg q0.99    32 ms   PSNR 39,1 dB - en buyuk fark 121  (krominans
  //                         altorneklemesi aciliyor, neon kenarlar bozuluyor)
  // Kodlama render suresinin %98'ini yiyordu (sahnenin kendisi 33 ms).
  // jpeg KALITE 1.0 varsayilan: 4:4:4 krominans, gorunmez kayip, 38 kat hizli.
  // Kayipsiz gerekirse --bicim webp veya png.
  // SONUC: bicim secimi hizi DEGISTIRMIYOR. WebGL komutlari asenkron;
  // toDataURL sadece bekleyen rasterlestirmeyi bekletiyor, o yuzden kodlama
  // pahali gorunuyordu. Gercek maliyet SwiftShader'in yazilimla cizmesi.
  // Bu yuzden KAYIPSIZ kaliniyor. webp q1.0 = png ile bit bit ayni ama
  // boru uzerinden yarisi kadar veri tasiyor (995 KB / 2056 KB base64).
  if (bicim === 'png')  return cikisCv.toDataURL('image/png');
  if (bicim === 'jpeg') return cikisCv.toDataURL('image/jpeg', kalite || 1);
  return cikisCv.toDataURL('image/webp', kalite || 1);
};
window.__T = { THREE, scene, camera, siluet, notaMesh, NOTALAR, halka, mixer, aksiyon };
window.HAZIR = true;
window.SILUET_VAR = !!siluet;
window.insanSimge = insanSimge;   // simge tablosu icin
window.__CUE = CUE;                // cue tablosunun tamami - simge-tablosu.js okuyor   // simge sayfasi uretmek icin

// Kapak icin tek siluet karesi: saydam arka plan, konturlu, istenen olcude.
// Videodaki panelden bagimsiz - kapakta siluet ekranin ortasinda ve buyuk
// duruyor, panelin kucuk kutusuyla ayni goruntu ise yaramiyor.
window.siluetKaresi = function(klipAdi, faz, gen, yuk, don){
  if (!siluet || !mixer) return null;
  // don: yalnizca olcum/inceleme icin gecici govde donusu (radyan)
  const donEski = siluet.rotation.y;
  siluet.rotation.y = don || 0;
  const ad = aksiyon[klipAdi] ? klipAdi : 'idle';
  for (const [k, v] of Object.entries(aksiyon)) v.a.enabled = (k === ad);
  const A = aksiyon[ad];
  A.a.play();
  mixer.setTime(0);
  A.a.time = (faz % 1) * A.hedef * A.a.timeScale;
  mixer.update(0);
  if (kokKemik && kokBaslangic) {
    kokKemik.position.x = kokBaslangic.x;
    kokKemik.position.z = kokBaslangic.z;
  }

  // siluet sahnesini istenen olcude, saydam zeminle render et
  const kam = kameraSiluet.clone();
  kam.aspect = gen / yuk; kam.updateProjectionMatrix();
  renderer.setSize(gen, yuk, false);
  renderer.setViewport(0, 0, gen, yuk);
  renderer.setScissorTest(false);
  renderer.setClearAlpha(0);
  renderer.render(sahneSiluet, kam);

  // maske: beyaz figur, saydam zemin
  const mc = document.createElement('canvas'); mc.width = gen; mc.height = yuk;
  const mg = mc.getContext('2d');
  mg.drawImage(canvas, 0, 0, gen, yuk, 0, 0, gen, yuk);

  // sonuc: dis parlama -> beyaz kontur -> koyu govde
  const oc = document.createElement('canvas'); oc.width = gen; oc.height = yuk;
  const og = oc.getContext('2d');
  og.globalAlpha = 0.55;
  og.filter = `blur(${Math.round(gen * 0.012)}px)`;
  og.drawImage(mc, 0, 0);
  og.filter = 'none'; og.globalAlpha = 1;
  const k = Math.max(2, gen * 0.006);              // kontur kalinligi
  for (let i = 0; i < 16; i++) {
    const t = i * Math.PI / 8;
    og.drawImage(mc, Math.cos(t) * k, Math.sin(t) * k);
  }
  const ic = document.createElement('canvas'); ic.width = gen; ic.height = yuk;
  const ig = ic.getContext('2d');
  ig.drawImage(mc, 0, 0);
  ig.globalCompositeOperation = 'source-in';
  ig.fillStyle = '#050110'; ig.fillRect(0, 0, gen, yuk);
  og.drawImage(ic, 0, 0);

  // renderer'i eski haline dondur
  renderer.setSize(W, H, false);
  renderer.setViewport(0, 0, W, H);
  renderer.setClearAlpha(1);
  siluet.rotation.y = donEski;
  return oc.toDataURL('image/png');
};
window.TEMA = TEMA;
window.KLIP_SAYISI = Object.keys(klipler).length;
window.NOTA_SAYISI = NOTALAR.length;
</script>
