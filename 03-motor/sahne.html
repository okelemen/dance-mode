function sekerDokular(){
  const D = SEKER_DOKU;
  // BISKUVI YOL: enine 4 karo, boyuna 4 karo. Karo = altin biskuvi, ortasi
  // acik, kenari kizarmis; ustte delik (dokme) noktalari; derz cikolata.
  D.yol = sekerCanvas(512, 512, (g, w, h) => {
    g.fillStyle = '#5b2a12'; g.fillRect(0, 0, w, h);
    const kx = w / 4, ky = h / 4, ara = 9;
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
      const x = i * kx + ara / 2, y = j * ky + ara / 2, kw = kx - ara, kh = ky - ara;
      const r = 14;
      const gr = g.createRadialGradient(x + kw / 2, y + kh / 2, 6, x + kw / 2, y + kh / 2, kw * 0.75);
      gr.addColorStop(0, '#f6c874'); gr.addColorStop(0.7, '#e9a84c'); gr.addColorStop(1, '#c97d2e');
      g.fillStyle = gr;
      g.beginPath(); g.roundRect(x, y, kw, kh, r); g.fill();
      // ust kenar isigi, alt kenar golgesi (kabartma)
      g.strokeStyle = 'rgba(255,236,190,0.75)'; g.lineWidth = 4;
      g.beginPath(); g.moveTo(x + r, y + 3); g.lineTo(x + kw - r, y + 3); g.stroke();
      g.strokeStyle = 'rgba(120,58,18,0.55)';
      g.beginPath(); g.moveTo(x + r, y + kh - 3); g.lineTo(x + kw - r, y + kh - 3); g.stroke();
      // dokme delikleri 3x3
      for (let a = 1; a <= 3; a++) for (let b = 1; b <= 3; b++) {
        const px = x + kw * a / 4, py = y + kh * b / 4;
        g.fillStyle = 'rgba(122,62,20,0.75)';
        g.beginPath(); g.arc(px, py, 3.6, 0, 6.2832); g.fill();
        g.fillStyle = 'rgba(255,230,170,0.6)';
        g.beginPath(); g.arc(px - 1.2, py - 1.4, 1.4, 0, 6.2832); g.fill();
      }
    }
  });
  D.yol.wrapS = D.yol.wrapT = THREE.RepeatWrapping;
  // YESIL KREMA ZEMIN + SERPME SEKER
  D.zemin = sekerCanvas(512, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, '#58d24a'); gr.addColorStop(1, '#46c23f');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) {             // krema dalgasi
      g.fillStyle = `rgba(160,245,140,${0.10 + sekerRnd(i + 5) * 0.12})`;
      g.beginPath(); g.ellipse(sekerRnd(i) * w, sekerRnd(i + 11) * h, 20 + sekerRnd(i + 3) * 40, 8 + sekerRnd(i + 7) * 12, sekerRnd(i + 9) * 3, 0, 6.2832); g.fill();
    }
    const renk = ['#ff4f8b', '#ffd23f', '#4fc3ff', '#ffffff', '#b06bff', '#ff8a3d'];
    for (let i = 0; i < 260; i++) {            // serpme seker (sprinkles)
      const x = sekerRnd(i * 3 + 1) * w, y = sekerRnd(i * 3 + 2) * h, a = sekerRnd(i * 3 + 3) * 6.28;
      g.save(); g.translate(x, y); g.rotate(a);
      g.fillStyle = renk[i % renk.length];
      g.beginPath(); g.roundRect(-6, -2, 12, 4, 2); g.fill();
      g.restore();
    }
  });
  D.zemin.wrapS = D.zemin.wrapT = THREE.RepeatWrapping;
  // SEKER BASTON SERIDI (bordur, baston, kule)
  D.serit = sekerCanvas(256, 256, (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#ff2f5e';
    for (let k = -2; k < 6; k++) {
      g.beginPath(); g.moveTo(k * 64, 0); g.lineTo(k * 64 + 32, 0); g.lineTo(k * 64 + 32 + h, h); g.lineTo(k * 64 + h, h); g.fill();
    }
  });
  D.serit.wrapS = D.serit.wrapT = THREE.RepeatWrapping;
  // PEMBE-BEYAZ serit (kule govdesi)
  D.seritPembe = sekerCanvas(256, 256, (g, w, h) => {
    g.fillStyle = '#fff4fa'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#ff8fc4';
    for (let k = 0; k < 8; k += 2) g.fillRect(k * 32, 0, 32, h);
  });
  D.seritPembe.wrapS = D.seritPembe.wrapT = THREE.RepeatWrapping;
  // LOLIPOP SARMALI - farkli renk ciftleri
  D.lolipop = [['#ff2f7a', '#ffffff'], ['#ffb300', '#ff4f2f'], ['#34c3ff', '#ffffff'], ['#9b5cff', '#ffe14d'], ['#2fd17a', '#ffffff']]
    .map(([r1, r2]) => sekerCanvas(256, 256, (g, w, h) => {
      g.fillStyle = r2; g.fillRect(0, 0, w, h);
      g.save(); g.translate(w / 2, h / 2);
      for (let k = 0; k < 2; k++) {
        g.strokeStyle = k ? r1 : r1; g.lineWidth = 17; g.lineCap = 'round';
        g.beginPath();
        for (let a = 0; a < 6.2832 * 4.2; a += 0.05) {
          const rr = 2 + a * 4.4, aa = a + k * 3.1416;
          const px = Math.cos(aa) * rr, py = Math.sin(aa) * rr;
          if (a === 0) g.moveTo(px, py); else g.lineTo(px, py);
        }
        g.stroke();
      }
      g.restore();
      const pr = g.createRadialGradient(w * 0.36, h * 0.32, 4, w / 2, h / 2, w / 2);
      pr.addColorStop(0, 'rgba(255,255,255,0.55)'); pr.addColorStop(0.35, 'rgba(255,255,255,0)');
      g.fillStyle = pr; g.fillRect(0, 0, w, h);
    }));
  // CUPCAKE KAGIDI
  D.kagit = ['#ff6fae', '#58c8ff', '#ffcf3a', '#a77bff'].map(r => sekerCanvas(256, 64, (g, w, h) => {
    g.fillStyle = r; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,0.45)';
    for (let k = 0; k < w; k += 16) g.fillRect(k, 0, 6, h);
  }));
  // GOK: yukarida doygun mavi, ufukta acik turkuaz-beyaz
  SEKER_ARKA = sekerCanvas(16, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#1f8cff'); gr.addColorStop(0.45, '#5cb8ff'); gr.addColorStop(0.8, '#a8e2ff'); gr.addColorStop(1, '#dff6ff');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}
function sekerMat(renk, o){
  return new THREE.MeshStandardMaterial(Object.assign({ color: renk, roughness: 0.42, metalness: 0.0 }, o || {}));
}
function sekerGolge(m, at, al){ m.traverse(c => { if (c.isMesh) { c.castShadow = !!at; c.receiveShadow = !!al; } }); return m; }
// --- NESNELER (hepsi y=0 zemine oturur)
function sekerLolipop(i){
  const g = new THREE.Group();
  const boy = 3.4 + sekerRnd(i + 1) * 3.2, r = 1.2 + sekerRnd(i + 2) * 1.0;
  const sap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, boy, 10), sekerMat('#fffaf2', { roughness: 0.6 }));
  sap.position.y = boy / 2; g.add(sap);
  const dt = SEKER_DOKU.lolipop[i % SEKER_DOKU.lolipop.length];
  const yuz = sekerMat('#ffffff', { map: dt, roughness: 0.18 });
  const kenar = sekerMat('#ffffff', { roughness: 0.25 });
  const disk = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.42, 36), [kenar, yuz, yuz]);
  disk.rotation.x = Math.PI / 2;
  disk.position.y = boy + r * 0.85; g.add(disk);
  return sekerGolge(g, true, false);
}
function sekerDamla(i){
  const renk = ['#ff3b5c', '#ff9d1c', '#ffe03a', '#3fd66b', '#a45cff', '#35b6ff'][i % 6];
  const s = 0.9 + sekerRnd(i + 4) * 0.9;
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12, 0, 6.2832, 0, Math.PI / 2), sekerMat(renk, { roughness: 0.28 }));
  m.scale.set(1, 1.15, 1);
  const g = new THREE.Group(); g.add(m); g.scale.setScalar(s);
  return sekerGolge(g, true, false);
}
function sekerBaston(i){
  const g = new THREE.Group();
  const mat = sekerMat('#ffffff', { map: SEKER_DOKU.serit, roughness: 0.25 });
  const yol = new THREE.CurvePath();
  const h = 1.9;
  yol.add(new THREE.LineCurve3(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, h, 0)));
  yol.add(new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, h, 0), new THREE.Vector3(0, h + 0.75, 0.38), new THREE.Vector3(0, h + 0.1, 0.72)));
  const tup = new THREE.Mesh(new THREE.TubeGeometry(yol, 40, 0.13, 10, false), mat);
  g.add(tup);
  return sekerGolge(g, true, false);
}
function sekerCupcake(i){
  const g = new THREE.Group();
  const s = 1.0 + sekerRnd(i + 8) * 0.6;
  const kag = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 1.7, 2.4, 24, 1, true),
    sekerMat('#ffffff', { map: SEKER_DOKU.kagit[i % 4], roughness: 0.5, side: THREE.DoubleSide }));
  kag.position.y = 1.2; g.add(kag);
  const kremaR = ['#fff3fb', '#ffd1e8', '#fff7d6', '#e7f7ff'][i % 4];
  const km = sekerMat(kremaR, { roughness: 0.55 });
  for (let k = 0; k < 3; k++) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(1.95 - k * 0.6, 0.55 - k * 0.08, 12, 28), km);
    t.rotation.x = Math.PI / 2; t.position.y = 2.55 + k * 0.62; g.add(t);
  }
  const tepe = new THREE.Mesh(new THREE.SphereGeometry(0.62, 16, 12), km); tepe.position.y = 4.05; g.add(tepe);
  const kiraz = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), sekerMat('#e8102e', { roughness: 0.15 }));
  kiraz.position.y = 4.75; g.add(kiraz);
  // pencere + kapi: ev oldugu okunsun
  const kapi = new THREE.Mesh(new THREE.CircleGeometry(0.55, 20, 0, Math.PI), sekerMat('#6b3413', { roughness: 0.6 }));
  kapi.position.set(0, 0.55, 2.02); g.add(kapi);
  const kapiAlt = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.55), sekerMat('#6b3413', { roughness: 0.6 }));
  kapiAlt.position.set(0, 0.28, 2.02); g.add(kapiAlt);
  g.scale.setScalar(s);
  return sekerGolge(g, true, false);
}
function sekerDonut(i){
  const renk = ['#ff7fb6', '#8a4b2a', '#ffe7f2', '#b58cff'][i % 4];
  const g = new THREE.Group();
  const hamur = new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.95, 16, 32), sekerMat('#e0a04e', { roughness: 0.6 }));
  g.add(hamur);
  const krema = new THREE.Mesh(new THREE.TorusGeometry(2.0, 0.98, 16, 32, Math.PI), sekerMat(renk, { roughness: 0.3 }));
  krema.rotation.z = 0; g.add(krema);
  g.position.y = 2.9;
  const k = new THREE.Group(); k.add(g);
  return sekerGolge(k, true, false);
}
function sekerBulut(i){
  const g = new THREE.Group();
  const renk = i % 3 === 0 ? '#ffd6ec' : (i % 3 === 1 ? '#ffffff' : '#fff0f8');
  const mat = new THREE.MeshLambertMaterial({ color: renk, emissive: renk, emissiveIntensity: 0.38, fog: false });
  const n = 5 + Math.floor(sekerRnd(i + 20) * 4);
  for (let k = 0; k < n; k++) {
    const r = 4 + sekerRnd(i * 7 + k) * 5;
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), mat);
    m.position.set((k - n / 2) * 5.2 + sekerRnd(i + k) * 2, sekerRnd(i * 3 + k) * 3 - (Math.abs(k - n / 2) * 0.9), sekerRnd(i * 5 + k) * 3);
    g.add(m);
  }
  return g;
}
function sekerYildiz(i){
  const s = new THREE.Shape();
  for (let k = 0; k < 10; k++) {
    const r = k % 2 ? 0.45 : 1.0, a = Math.PI / 2 + k * Math.PI / 5;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (k === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.35, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.1, bevelSegments: 3 });
  geo.center();
  const renk = ['#ffd21f', '#ff7ab8', '#7fe0ff'][i % 3];
  return new THREE.Mesh(geo, sekerMat(renk, { roughness: 0.2, emissive: renk, emissiveIntensity: 0.25 }));
}
// PASTA SATO: katli pasta govde, krema damlalari, baston-serit kuleler,
// kiraz kubbeler, bayraklar, cikolata kapi. Ozgun tasarim (md. 16).
function sekerSato(gece){
  const g = new THREE.Group();
  const pembe = sekerMat('#ff9cc9', { roughness: 0.5 });
  const beyaz = sekerMat('#fff6fb', { roughness: 0.5 });
  const krema = sekerMat('#ffffff', { roughness: 0.35 });
  const cik = sekerMat('#5a2a12', { roughness: 0.5 });
  const kiraz = sekerMat('#e3102e', { roughness: 0.15 });
  const katlar = [[17, 8, pembe], [12.5, 7, beyaz], [8.5, 6, pembe], [5.2, 5, beyaz]];
  let y = 0;
  for (const [r, h, m] of katlar) {
    const kat = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48), m);
    kat.position.y = y + h / 2; g.add(kat);
    const hal = new THREE.Mesh(new THREE.TorusGeometry(r, 0.7, 12, 64), krema);
    hal.rotation.x = Math.PI / 2; hal.position.y = y + h; g.add(hal);
    // krema damlalari
    const n = Math.round(r * 2.2);
    for (let k = 0; k < n; k++) {
      const a = k / n * 6.2832, dl = 1.2 + sekerRnd(k + r) * 1.8;
      const d = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, dl, 4, 8), krema);
      d.position.set(Math.cos(a) * (r + 0.1), y + h - dl / 2 - 0.2, Math.sin(a) * (r + 0.1));
      g.add(d);
    }
    // cilekler
    const cn = Math.round(r * 0.9);
    for (let k = 0; k < cn; k++) {
      const a = (k + 0.5) / cn * 6.2832;
      const c = new THREE.Mesh(new THREE.SphereGeometry(0.85, 14, 10), kiraz);
      c.position.set(Math.cos(a) * (r - 1.4), y + h + 0.7, Math.sin(a) * (r - 1.4));
      g.add(c);
    }
    y += h;
  }
  const kubbe = new THREE.Mesh(new THREE.SphereGeometry(3.2, 28, 16, 0, 6.2832, 0, Math.PI / 2), pembe);
  kubbe.position.y = y; g.add(kubbe);
  const tepeK = new THREE.Mesh(new THREE.SphereGeometry(1.4, 18, 14), kiraz); tepeK.position.y = y + 4.2; g.add(tepeK);
  // KULELER
  const kuleMat = sekerMat('#ffffff', { map: SEKER_DOKU.seritPembe, roughness: 0.45 });
  const catiMat = sekerMat('#ffffff', { map: SEKER_DOKU.serit, roughness: 0.3 });
  const kuleler = [[-19, 4, 27, 3.0], [19, 4, 27, 3.0], [-12, 13, 33, 2.4], [12, 13, 33, 2.4], [-23, -8, 21, 2.2], [23, -8, 21, 2.2]];
  for (const [x, z, h, r] of kuleler) {
    const k = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.08, h, 28), kuleMat);
    k.position.set(x, h / 2, z); g.add(k);
    const kh = new THREE.Mesh(new THREE.TorusGeometry(r * 1.05, 0.45, 10, 32), krema);
    kh.rotation.x = Math.PI / 2; kh.position.set(x, h, z); g.add(kh);
    const cati = new THREE.Mesh(new THREE.ConeGeometry(r * 1.35, r * 3.2, 28), catiMat);
    cati.position.set(x, h + r * 1.6, z); g.add(cati);
    const top = new THREE.Mesh(new THREE.SphereGeometry(r * 0.38, 14, 10), kiraz);
    top.position.set(x, h + r * 3.25, z); g.add(top);
    const direk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.4, 6), beyaz);
    direk.position.set(x, h + r * 3.4 + 1.6, z); g.add(direk);
    const bayrak = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.4), sekerMat('#ff2f7a', { side: THREE.DoubleSide, roughness: 0.6 }));
    bayrak.position.set(x + 1.25, h + r * 3.4 + 2.6, z); g.add(bayrak);
    // pencereler
    for (const py of [h * 0.45, h * 0.72]) {
      const p = new THREE.Mesh(new THREE.CircleGeometry(r * 0.32, 18), gece ? new THREE.MeshBasicMaterial({ color: '#ffe38a', fog: false }) : cik);
      p.position.set(x, py, z + r + 0.02); g.add(p);
    }
  }
  // CIKOLATA KAPI (yol kapiya varir)
  const kapi = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 1.0, 32, 1, false, -Math.PI / 2, Math.PI), cik);
  kapi.rotation.x = Math.PI / 2; kapi.position.set(0, 5.2, 17.3); g.add(kapi);
  const kapiA = new THREE.Mesh(new THREE.BoxGeometry(7.2, 5.2, 1.0), cik); kapiA.position.set(0, 2.6, 17.3); g.add(kapiA);
  const kapiC = new THREE.Mesh(new THREE.TorusGeometry(3.7, 0.45, 10, 32, Math.PI), krema);
  kapiC.position.set(0, 5.2, 17.85); g.add(kapiC);
  if (gece) {                                   // SENLIK: katlarin cevresinde ampul dizisi
    const renk = ['#ff5fa2', '#ffe45c', '#5fe08a', '#4fc3ff', '#ffffff'];
    let yy = 0;
    for (const [r, h] of katlar) {
      yy += h;
      const n = Math.round(r * 3);
      for (let k = 0; k < n; k++) {
        const a = k / n * 6.2832;
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.42, 8, 6), new THREE.MeshBasicMaterial({ color: renk[k % renk.length], fog: false }));
        b.position.set(Math.cos(a) * (r + 0.9), yy - 1.6, Math.sin(a) * (r + 0.9)); g.add(b);
      }
    }
  }
  g.scale.setScalar(SEKER_SATO_OLCEK);
  g.position.set(0, 0, SEKER_SATO_Z);
  return sekerGolge(g, false, false);
}
// CIKOLATA (25 Eyl 2026, kullanici: "cikolatalar ekleyebiliriz")
function sekerTablet(i){
  const g = new THREE.Group();
  const cik = sekerMat('#4a2210', { roughness: 0.35 });
  const kare = sekerMat('#5c2c14', { roughness: 0.3 });
  const en = 3.2, boy = 4.6, kal = 0.55;
  const govde = new THREE.Mesh(new THREE.BoxGeometry(en, boy, kal), cik);
  govde.position.y = boy / 2; g.add(govde);
  for (let a = 0; a < 3; a++) for (let b = 0; b < 4; b++) {       // tablet kareleri
    const k = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.95, 0.22), kare);
    k.position.set(-1.0 + a * 1.0, 0.62 + b * 1.12, kal / 2 + 0.08); g.add(k);
  }
  const folyoR = ['#d81b3a', '#ffcc2a', '#2a7fff', '#9c27b0'][i % 4];
  const folyo = new THREE.Mesh(new THREE.BoxGeometry(en + 0.14, boy * 0.42, kal + 0.14), sekerMat(folyoR, { roughness: 0.25, metalness: 0.35 }));
  folyo.position.y = boy * 0.21; g.add(folyo);
  const serit = new THREE.Mesh(new THREE.BoxGeometry(en + 0.16, 0.22, kal + 0.16), sekerMat('#fff2b0', { roughness: 0.2, metalness: 0.5 }));
  serit.position.y = boy * 0.42; g.add(serit);
  g.rotation.z = (sekerRnd(i + 700) - 0.5) * 0.35;
  const k = new THREE.Group(); k.add(g); k.scale.setScalar(0.9 + sekerRnd(i + 701) * 0.7);
  return sekerGolge(k, true, false);
}
function sekerTruf(i){
  const g = new THREE.Group();
  const r = 0.8 + sekerRnd(i + 720) * 0.6;
  const renk = ['#3d1a0b', '#6b3616', '#f3e3c8', '#2a1206'][i % 4];
  const top = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), sekerMat(renk, { roughness: 0.3 }));
  top.position.y = r; g.add(top);
  const sos = new THREE.Mesh(new THREE.TorusGeometry(r * 0.72, r * 0.16, 8, 24), sekerMat(i % 2 ? '#ff7fb6' : '#fff4e0', { roughness: 0.3 }));
  sos.rotation.x = Math.PI / 2; sos.position.y = r * 1.62; g.add(sos);
  return sekerGolge(g, true, false);
}
function sekerSarili(i){
  const g = new THREE.Group();
  const renk = ['#ff3b7a', '#35c6ff', '#ffd23f', '#7cdb4a', '#b46bff'][i % 5];
  const m = sekerMat(renk, { roughness: 0.2, metalness: 0.15 });
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), m); g.add(top);
  for (const y of [-1, 1]) {
    const k = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.7, 12), m);
    k.rotation.z = y * Math.PI / 2; k.position.x = y * 0.85; g.add(k);
  }
  g.position.y = 0.5; g.rotation.y = sekerRnd(i + 740) * 6.28;
  const k = new THREE.Group(); k.add(g);
  return sekerGolge(k, true, false);
}
function sekerDondurma(i){
  const g = new THREE.Group();
  const kulah = new THREE.Mesh(new THREE.ConeGeometry(2.2, 7, 20), sekerMat('#e0a04e', { roughness: 0.6 }));
  kulah.rotation.x = Math.PI; kulah.position.y = 3.5; g.add(kulah);
  const top = ['#ffb3d9', '#fff3d6', '#a7e8ff', '#c9a6ff', '#8a4b2a', '#b8f07a'];

const FISEK_N = 90, FISEK_ES = 4;
function sekerFisekKur(kok){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(FISEK_N * FISEK_ES * 3), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(FISEK_N * FISEK_ES * 3), 3));
  const p = new THREE.Points(geo, new THREE.PointsMaterial({ size: 2.2, vertexColors: true, transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
  p.frustumCulled = false; kok.add(p); return p;
}
function sekerFisekGuncelle(p, t){
  const pos = p.geometry.attributes.position.array, col = p.geometry.attributes.color.array;
  const oi = Math.floor(t / OLCU), R = [[1, .35, .65], [1, .9, .3], [.4, 1, .6], [.35, .8, 1], [.75, .5, 1]];
  for (let e = 0; e < FISEK_ES; e++) {
    const k = oi - e, yas = t - k * OLCU;
    const cx = (sekerRnd(k * 3 + 1) - 0.5) * 220, cy = 55 + sekerRnd(k * 3 + 2) * 45, cz = -200 - sekerRnd(k * 3 + 3) * 50;
    const r = R[((k % 5) + 5) % 5], sonum = Math.max(0, 1 - yas / (OLCU * FISEK_ES));
    for (let j = 0; j < FISEK_N; j++) {
      const a = j * 2.399963, z = 1 - 2 * (j + 0.5) / FISEK_N, rr = Math.sqrt(1 - z * z);
      const hiz = 26 * (1 - Math.exp(-yas * 2.2));
      const i3 = (e * FISEK_N + j) * 3;
      pos[i3] = cx + Math.cos(a) * rr * hiz; pos[i3 + 1] = cy + z * hiz - yas * yas * 2.2; pos[i3 + 2] = cz + Math.sin(a) * rr * hiz * 0.5;
      col[i3] = r[0] * sonum; col[i3 + 1] = r[1] * sonum; col[i3 + 2] = r[2] * sonum;
    }
  }
  p.geometry.attributes.position.needsUpdate = true; p.geometry.attributes.color.needsUpdate = true;
}

// SEKER KAMERASI (26 Eyl 2026). Hiz duruma gore:
//   kay_L/R : HIZLI konumlama - 0,12 sn'de o yone 1,7 birim, tutus, 0,30 sn'de geri
//   seksek  : iki sekmede HIZLI minik titreme (0,05 birim, 0,18 sn sonum)
//   yumruk  : SABIT
//   dizkol  : YAVAS kalkis - hareket boyunca 0,22 birim yukari, yumusak donus
//   nefes/LEVEL UP: YAVAS one suzulme (0,8 birim) ve geri
const SEKER_KAM_NOTA = NOTALAR.filter(n => /^(yumruk_L|yumruk_R|kay_L|kay_R|seksek|dizkol)$/.test(n.tip)).sort((a, b) => a.t - b.t);
function sekerKamera(t){
  // 26 Eyl 2026 (kullanici: "her engelde kamera konumu hep ayni"): HER ENGEL TIPININ KENDI
  // KADRAJI. Kamera engel yaklasirken o kadraja gecer (gecis hizi tipe gore), vurustan sonra doner.
  //   yumruk : HIZLI (0,22 sn) hedef tarafina 0,7 + alcal/yaklas; vurus aninda SABIT (titreme yok)
  //   seksek : HIZLI (0,25 sn) YUKSEL + asagi bak (bosluklar gorunsun) + sekmelerde minik titreme
  //   kay    : HIZLI (0,12 sn) o yone 1,7 + yone dogru hafif yatis (roll)
  //   dizkol : YAVAS (0,7 sn) alcal + yukari bak (sarkan nesne one ciksin)
  //   level siniri: YAVAS one suzulme
  let x = 0, y = 0, z = 0, lx = 0, ly = 0, roll = 0;
  const ss = (v) => v <= 0 ? 0 : v >= 1 ? 1 : v * v * (3 - 2 * v);
  const zarf = (d, gir, tut, cik) => ss((d + gir) / gir) - ss((d - tut) / cik);   // d<0 yaklasma
  for (const n of SEKER_KAM_NOTA) {
    const d = t - n.t;
    if (d < -1.2 || d > 1.6) continue;
    if (n.tip === 'yumruk_L' || n.tip === 'yumruk_R') {
      const yon = n.tip === 'yumruk_L' ? -1 : 1, w = zarf(d, 0.22, 0.30, 0.35);
      x += yon * 0.7 * w; y -= 0.45 * w; z -= 1.4 * w; lx += yon * 0.5 * w; ly += 0.15 * w;
    } else if (n.tip === 'kay_L' || n.tip === 'kay_R') {
      const yon = n.tip === 'kay_L' ? -1 : 1, w = zarf(d, 0.12, 0.45, 0.30);
      x += yon * 1.7 * w; roll -= yon * 0.06 * w;
    } else if (n.tip === 'seksek') {
      const w = zarf(d, 0.25, 0.55, 0.35);
      y += 1.5 * w; z += 0.6 * w; ly -= 0.9 * w;
      for (const h of [0, OLCU * 0.30]) {
        const e = d - h;
        if (e >= 0 && e < 0.4) { const a = 0.085 * Math.exp(-e / 0.18); y += a * Math.sin(e * 95); x += a * 0.6 * Math.sin(e * 77 + 1.3); }
      }
    } else if (n.tip === 'dizkol') {
      const w = zarf(d, 0.70, 0.45, 0.60);
      y -= 0.9 * w; z -= 0.8 * w; ly += 0.95 * w;
    }
  }
  for (const o of SEVIYE_SIN.slice(1)) {
    const d = t - o * OLCU;
    if (d > -2.8 && d < 2.6) z -= 0.8 * (ss((d + 2.8) / 2.2) - ss((d - 0.4) / 2.2));
  }
  return { x, y, z, lx, ly, roll };
}

// hal'in tek nesnesi, yaricap r. rol: 'havada' | 'yer' | 'dev'

  else if (hal === 'd') { const m = new THREE.Mesh(G.disk, [M.naneKenar, M.naneYuz, M.naneYuz]); m.scale.set(r, r, r);
    if (rol === 'havada') m.rotation.x = Math.PI / 2; // havada: yuzu kameraya

        const z = Z_DOGUM + (Z_VURUS - Z_DOGUM) * ilerleme;
        eng.position.set(0, 0.3, z);
        eng.scale.setScalar(Math.min(1, ilerleme / 0.15));
        for (const o of eng.userData.parca) {
          if (o.userData.yuvarlan) o.rotation.x = z / o.userData.r;   // yuvarlanma: yol aldikca doner
          else if (o.position.y > 1.2) o.position.y += Math.sin(t * 5 + i) * 0.004;   // havadaki hafif salinim
        }
      }
    }
    // patlama
    const patGor = d >= 0 && d < PAT;
    let pat = SEKER_ENG.pat.get(i);
    if (patGor && !pat) { const e2 = eng || sekerEngKur(no, i); SEKER_ENG.not.set(i, e2); pat = sekerPatKur(no, i, e2); SEKER_ENG.pat.set(i, pat); }
    if (pat) {
      pat.visible = patGor;
      if (patGor) {
        pat.position.set(0, 0.3, Z_VURUS);
        const q = d / PAT;
        for (const m of pat.userData.p) {
          const u = m.userData;
          m.position.set(u.x0 + u.vx * d, u.y0 + u.vy * d - 9.8 * d * d, u.z0 + u.vz * d);
          m.rotation.set(u.don * d, u.don * d * 0.7, 0);
          m.scale.setScalar(u.s * (1 - q * 0.7));
          m.material.opacity = 1 - q * q;
        }
      }
    }
  });
}

function sekerMekanGuncelle(t){
  const h = SEKER_HAL_AKTIF in SEKER_HAL ? SEKER_HAL_AKTIF : 'a';
  const H = SEKER_HAL[h];
  SEKER_HUD_AKTIF = SEKER_HUD[h]; SEKER_KONTUR = SEKER_HUD_AKTIF.kontur; SEKER_GOLGE = SEKER_HUD_AKTIF.golge;
  for (const k in SEKER_HAL) SEKER_HAL[k].kok.visible = (k === h);
  // yol malzemesi + bordur seridi hale gore
  const yd = SEKER_DOKU.yolH[h], bd = SEKER_DOKU.bordurH[h];
  if (SEKER_DOKU.yolUst.map !== yd) { SEKER_DOKU.yolUst.map = yd; SEKER_DOKU.yolUst.needsUpdate = true; }
  if (SEKER_DOKU.bordurMat.map !== bd) { SEKER_DOKU.bordurMat.map = bd; SEKER_DOKU.bordurMat.needsUpdate = true; }
  SEKER_DOKU.yolYan.color.set({ a: '#c47a33', b: '#b8641a', c: '#2e140a', d: '#2f7fc4', e: '#6a3aa8' }[h]);
  const yol = t * HIZ;
  yd.offset.y = (yol / SEKER_YOL_TEKRAR) % 1;
  H.zeminDoku.offset.y = (yol / SEKER_ZEMIN_TEKRAR) % 1;
  bd.offset.y = (-yol / 1.6) % 1;
  if (h === 'c') { SEKER_DOKU.nehir.offset.y = (yol * 1.35 / (220 / 12)) % 1;    // cikolata biraz daha hizli akar
                   SEKER_DOKU.nehirIsik.offset.y = (yol * 1.9 / (220 / 12)) % 1; SEKER_DOKU.nehirIsik.offset.x = Math.sin(t * 0.7) * 0.05; }
  if (h === 'b') SEKER_DOKU.selale.offset.y = (t * 0.6) % 1;                     // selale asagi akar
  const taban = Z_VURUS + 14 - SEKER_KAPSAM;
  for (const o of H.akan) {
    const u = o.userData;
    const z = taban + ((u.z0 + yol) % SEKER_KAPSAM);
    o.position.set(u.x, 0, z);
    o.rotation.y = u.don;
    o.scale.setScalar(Math.min(1, (z - taban) / 14) * (u.olcek || 1));
    if (u.balon) u.balon.position.x = Math.sin(t * 1.1 + u.z0) * 0.4;
    if (u.kabarcik) { const f = (t * 0.8 + u.z0 * 0.37) % 1; u.kabarcik.scale.setScalar(Math.sin(f * Math.PI)); }
    if (h === 'c') o.traverse(c => { if (c.userData.hale) { c.quaternion.copy(camera.quaternion); c.material.opacity = 0.28 + 0.12 * Math.sin(t * 9 + u.z0); } });
  }
  for (const o of H.gok) {
    const u = o.userData;
    if (u.yildiz) {
      o.position.set(u.x, u.y + Math.sin(t * 1.3 + u.f) * 0.8, u.z);
      o.rotation.set(0, Math.sin(t * 0.9 + u.f) * 0.6, Math.sin(t * 0.7 + u.f) * 0.15);
      o.scale.setScalar(u.s);
    } else {
      o.position.set(((u.x + 180 + t * u.hiz) % 360) - 180, u.y, u.z);
    }
  }
  if (H.kar) {                                                                    // kar yagar
    const a = H.kar.geometry.attributes.position.array, b0 = H.kar.userData.taban;
    for (let i = 0; i < a.length; i += 3) { a[i + 1] = ((b0[i + 1] - t * (3 + (i % 7))) % 110 + 110) % 110; a[i] = b0[i] + Math.sin(t * 0.8 + i) * 1.2; }
    H.kar.geometry.attributes.position.needsUpdate = true;
  }
  if (H.yildiz) H.yildiz.material.opacity = 0.75 + 0.2 * Math.sin(t * 2.3);
  if (H.fisek) sekerFisekGuncelle(H.fisek, t);
  sekerEngelGuncelle(t);                                        // ENG-006
  const A = SEKER_HAL_AYAR[h];
  scene.fog.near = A.sis[0]; scene.fog.far = A.sis[1];
}


const _tM = new THREE.Matrix4(), _tV = new THREE.Vector3(),
      _tQ = new THREE.Quaternion(), _tS = new THREE.Vector3(),
      _tE = new THREE.Euler();
function tarlaGuncelle(t){
  const taban = Z_VURUS + 8 - TARLA_KAPSAM;
  for (let i = 0; i < tarlaVeri.length; i++) {
    const o = tarlaVeri[i];
    const z = taban + ((o.z0 + t * HIZ) % TARLA_KAPSAM);
    _tV.set(o.x, o.r * 0.88, z);
    _tE.set(0, o.don, 0); _tQ.setFromEuler(_tE);
    _tS.set(o.r, o.r * 0.88, o.r);
    _tM.compose(_tV, _tQ, _tS);
    tarlaIM.setMatrixAt(i, _tM);
  }
  tarlaIM.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < tarlaYaprakVeri.length; i++) {
    const o = tarlaYaprakVeri[i];
    const z = taban + ((o.z0 + t * HIZ) % TARLA_KAPSAM);
    _tV.set(o.x, 0.62, z);
    _tE.set(-1.18, o.don, 0); _tQ.setFromEuler(_tE);
    _tS.set(o.olc, o.olc, 1);
    _tM.compose(_tV, _tQ, _tS);
    tarlaYaprakIM.setMatrixAt(i, _tM);
  }
  tarlaYaprakIM.instanceMatrix.needsUpdate = true;
}

// ==================================================== DENIZ: EK KATMANLAR
// 5 Eyl 2026, kullanici "onerdiklerini ekle" dedi. Dort ek:
//   1. Guverte bicim cesitlemesi (yan onluk) - en buyuk eksik
//   2. Su ile guvertenin birlestigi yerde kopuk
//   3. Ufukta gunes / ay diski
//   4. Samandiralar
//   5. Gece bloguna ayri kimlik (suda yildiz parildamasi)
//
// KAYDIRMA FORMULU - bir kez burada, hepsi ayni sekilde:
// Bir dunya ozelligi kameraya YAKLASIR, yani kamera-goreli z'si buyur.
// Ozelligin dunya istasyonu X = z + t*HIZ. Bicim fonksiyonu X ile
// beslenirse desen guverteyle birlikte akar. f(z) ile beslenirse desen
// kamerada CIVILENIR - ilk denemede o hata yapildi.

// Guverte yari genisligi: TABAN 3,5 (YOL_GEN/2) ve ASLA altina inmez.
// Nota koridoru orada; daraltmak oynanisi bozar. Cesitleme yalnizca
// DISARI dogru: referanstaki "dar gecit" bizde taban genislik, "genis
// guverte" ve "yuvarlak platform" onun uzerine eklenen onluk.
function denizOnlukGen(X){
  // Uc katman: yavas nefes + orta dalga + seyrek yuvarlak sisme.
  const nefes = 0.5 + 0.5 * Math.sin(X * 0.0165);
  const orta  = 0.5 + 0.5 * Math.sin(X * 0.0410 + 1.7);
  let g = 2.30 * nefes * (0.45 + 0.55 * orta);
  // Yuvarlak platform: 210 birimde bir (14 sn) genis bir sisme.
  const p = ((X % 210) + 210) % 210 - 105;
  g += 3.05 * Math.exp(-(p * p) / (2 * 17 * 17));
  // Dar gecit: onluk sifira iniyor, iki yani dogrudan su.
  const q = ((X % 330) + 330) % 330 - 165;
  g *= 1.0 - 0.95 * Math.exp(-(q * q) / (2 * 20 * 20));
  return Math.max(0.0, g);
}

let onlukL = null, onlukR = null, kopukIM = null, gunesDisk = null, samandiraIM = null;

// ==================================================== DENIZ YAPILARI
// 5 Eyl 2026. Kullanici: "mekani doldur iyice canli renklerle farkli
// yapilar yap denizin iki kenarina da".
// Denizin iki yaninda, suyun icinde duran yapilar. Bes ayri arketip
// donusumlu geliyor - tek bicim tekrarlayinca duvar kagidina donuyor.
//
// UC KURAL:
//   1. KIRMIZI YOK. O renk yalnizca engelin; mekanda baska hicbir yerde
//      gecmiyor (referans olcumu, REFERANS-15-VIDEO-NOTLARI.md madde 5).
//   2. Oyun koridoruna girmiyorlar: en yakin yapi x=16'da, guverte yari
//      genisligi 3,5 + onluk en fazla ~5,3. Kadrajin kenarinda kaliyorlar.
//   3. Neon yuzeyler MeshBasicMaterial - isik almiyorlar, yani gece
//      blogunda da ayni parlaklikta duruyorlar. Kendi isigi olan seyler.
const DENIZ_RENK = ['#22e0ff','#ff2fb0','#b6ff3c','#8b3cff',
                    '#ffc93c','#00ffc8','#ff5ec4','#3ad1ff'];
let yapiKok = null;
{
  yapiKok = new THREE.Group();
  yapiKok.visible = false;
  // Yan dunya ilk turda 16 yapida seyrek kaldi; deniz sadece bir zemin
  // gibi okunuyordu. 26 yapilik daha sik bir ritim, ama farkli uzaklik ve
  // olcekle "cit" etkisine dusmeden iki yakayi yasatiyor.
  const YAPI_SAY = 34, YAPI_ARA = 23.0;
  yapiKok.userData = { ARA: YAPI_ARA, KAP: YAPI_ARA * YAPI_SAY };
  const rnd = (n) => { const x = Math.sin(n * 57.31) * 43758.5453; return x - Math.floor(x); };
  const KUTU = new THREE.BoxGeometry(1, 1, 1);
  const govdeM = new THREE.MeshLambertMaterial({ color:'#141a3c', fog:true });
  // Gece bloklarinda (159 sn) koyu gokte uzak yapilar eriyordu. Govde
  // rengi ortama gore aciliyor - sayi artirmak yerine okunurlugu artiran
  // cozum bu. Malzeme butun yapilarda ORTAK, tek yerden ayarlaniyor.
  const YAPI_GOVDE_GUN = new THREE.Color('#141a3c');
  const YAPI_GOVDE_GECE = new THREE.Color('#39468f');
  // userData YUKARIDA kuruluyor ama govdeM burada tanimlaniyor; oraya
  // dogrudan yazinca 'temporal dead zone' hatasi aliniyor ve sayfa hic
  // acilmiyordu (window.HAZIR gelmedi, render zaman asimina ugradi).
  Object.assign(yapiKok.userData,
    { govde: govdeM, gun: YAPI_GOVDE_GUN, gece: YAPI_GOVDE_GECE });

  for (let i = 0; i < YAPI_SAY; i++) {
    const g = new THREE.Group();
    const tip = i % 5;
    const r1 = DENIZ_RENK[Math.floor(rnd(i + 3) * DENIZ_RENK.length)];
    const r2 = DENIZ_RENK[Math.floor(rnd(i + 91) * DENIZ_RENK.length)];
    const neon1 = new THREE.MeshBasicMaterial({ color:r1, fog:true });
    const neon2 = new THREE.MeshBasicMaterial({ color:r2, fog:true });
    const ek = (m) => { m.castShadow = false; g.add(m); return m; };

    if (tip === 0) {
      // KULE: uzun govde + uc neon halka. Dikey vurgu, ufku deler.
      const h = 14 + rnd(i + 7) * 10;
      const gov = ek(new THREE.Mesh(KUTU, govdeM));
      gov.scale.set(2.2, h, 2.2); gov.position.y = h / 2;
      for (let k = 0; k < 3; k++) {
        const hl = ek(new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.22, 8, 22), neon1));
        hl.rotation.x = Math.PI / 2;
        hl.position.y = h * (0.34 + k * 0.22);
      }
      const tepe = ek(new THREE.Mesh(KUTU, neon2));
      tepe.scale.set(3.0, 0.5, 3.0); tepe.position.y = h + 0.3;
    } else if (tip === 1) {
      // ISKELE: ayaklar uzerinde platform, kenari neon serit.
      const h = 5 + rnd(i + 11) * 4, en = 9 + rnd(i + 23) * 7;
      for (const yn of [-1, 1]) {
        const ay = ek(new THREE.Mesh(KUTU, govdeM));
        ay.scale.set(1.1, h, 1.1); ay.position.set(yn * en * 0.36, h / 2, 0);
      }
      const dek = ek(new THREE.Mesh(KUTU, govdeM));
      dek.scale.set(en, 1.0, 7.0); dek.position.y = h + 0.5;
      const ser = ek(new THREE.Mesh(KUTU, neon1));
      ser.scale.set(en + 0.4, 0.28, 7.4); ser.position.y = h + 1.1;
      const kule = ek(new THREE.Mesh(KUTU, neon2));
      kule.scale.set(1.6, 4.2, 1.6); kule.position.set(en * 0.28, h + 3.2, 0);
    } else if (tip === 2) {
      // YELKEN: uc kanat, farkli boyda. Yatay kutlelerin arasinda dikey
      // ve KESKIN bir siluet - hepsi kutu olunca kare tek dile dusuyor.
      for (let k = 0; k < 3; k++) {
        const h = 7 + rnd(i * 5 + k) * 11;
        const y = ek(new THREE.Mesh(new THREE.ConeGeometry(2.6, h, 3), k === 1 ? neon1 : neon2));
        y.position.set((k - 1) * 4.4, h / 2, (k - 1) * 2.2);
        y.rotation.y = rnd(i + k * 13) * 3.1;
      }
    } else if (tip === 3) {
      // YIGIN: ust uste kaymis renkli kutular. En "dolu" arketip,
      // seyrek gelmeli - bes tipten biri.
      let y = 0;
      for (let k = 0; k < 4; k++) {
        const h = 2.4 + rnd(i + k * 31) * 3.4;
        const en = 7.5 - k * 1.3;
        const kt = ek(new THREE.Mesh(KUTU,
          k % 2 ? neon1 : new THREE.MeshLambertMaterial({ color:r2, fog:true })));
        kt.scale.set(en, h, en * 0.8);
        kt.position.set((rnd(i + k * 7) - 0.5) * 2.4, y + h / 2, (rnd(i + k * 17) - 0.5) * 2.0);
        y += h;
      }
    } else {
      // KEMER: suyun uzerinden gecen yarim halka. Yatay acikligi olan tek
      // arketip - digerleri hep dikey kutle.
      // Kemer ilk denemede R=7..12 idi ve en yakin yapiyla birlesince
      // kadrajin ustunden gecen basibos bir egri gibi okunuyordu.
      // Kucultuldu; kemer artik suyun uzerinde duran bir yapi.
      const R = 4.2 + rnd(i + 41) * 2.6;
      const km = ek(new THREE.Mesh(
        new THREE.TorusGeometry(R, 0.55, 8, 26, Math.PI), neon1));
      km.position.y = 0.2;
      for (const yn of [-1, 1]) {
        const ay = ek(new THREE.Mesh(KUTU, govdeM));
        ay.scale.set(1.3, 2.0, 1.3); ay.position.set(yn * R, 1.0, 0);
      }
    }
    g.userData = { i, yon: (i % 2 ? 1 : -1) };
    yapiKok.add(g);
  }
  scene.add(yapiKok);
}


// Holografik engel dokusu: yatay tarama cizgileri (yayin taramasi hissi)
// + capraz tehlike seritleri. Alfa kanali sayesinde panel SAYDAM kaliyor,
// arkasindaki mekan goruluyor - kati levha okumasini kiran sey bu.
// Perde dokusu: saydam zeminde parlak cubuk dizisi. Cubugun cekirdegi
// beyaz, kenari magenta - mekanin paletinden ama dekorda olmayan bir
// parlaklikta. 'yatay' true ise cubuklar yatay (duck/hop), degilse dikey
// (step/dodge).
const SEHIR_PERDE = {};
function sehirPerdeDoku(yatay){
  const anahtar = yatay ? 'y' : 'd';
  if (SEHIR_PERDE[anahtar]) return SEHIR_PERDE[anahtar];
  const G = 256, Y = 256;
  const c = document.createElement('canvas'); c.width = G; c.height = Y;
  const g = c.getContext('2d');
  g.clearRect(0, 0, G, Y);
  // Kapak cizgileri: perdenin basladigi ve bittigi yeri okutuyor. Direk
  // degil, cizgi - cit siluetine geri donmemek icin dikey tasiyici yok.
  const kapak = (u, kal) => {
    g.fillStyle = 'rgba(255,245,255,0.95)';
    if (yatay) g.fillRect(0, u, G, kal); else g.fillRect(u, 0, kal, Y);
  };
  const cubuk = (u) => {
    // her cubuk: magenta hale + beyaz cekirdek
    const gr = yatay ? g.createLinearGradient(0, u - 11, 0, u + 11)
                     : g.createLinearGradient(u - 11, 0, u + 11, 0);
    gr.addColorStop(0.00, 'rgba(255,47,176,0)');
    gr.addColorStop(0.22, 'rgba(255,47,176,0.90)');
    gr.addColorStop(0.44, 'rgba(255,240,252,1.0)');
    gr.addColorStop(0.56, 'rgba(255,240,252,1.0)');
    gr.addColorStop(0.78, 'rgba(255,47,176,0.90)');
    gr.addColorStop(1.00, 'rgba(255,47,176,0)');
    g.fillStyle = gr;
    if (yatay) g.fillRect(0, u - 13, G, 26); else g.fillRect(u - 13, 0, 26, Y);
  };
  // 52 -> 34: perde siklasti, bosluk artik "delik" degil "gecit" okunuyor.
  for (let u = 17; u < (yatay ? Y : G); u += 34) cubuk(u);
  kapak(0, 6); kapak((yatay ? Y : G) - 6, 6);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  SEHIR_PERDE[anahtar] = t;
  return t;
}

// Deterministik cizim: ayni tohum ayni sehri verir; render her calistirmada
// ayni kareyi uretmeli.
function sehirSilueti(G, Y, tohum, ufukOran){
  const c = document.createElement('canvas'); c.width = G; c.height = Y;
  const g = c.getContext('2d');
  let s = tohum;
  const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
  const uy = Y * ufukOran;
  // gok: derin lacivert -> mor -> ufukta magenta parlama -> ince sicak bant
  const gr = g.createLinearGradient(0, 0, 0, Y);
  // v4: v3'te cikista dokunun USTU gorunuyordu ve orasi koyu lacivertti
  // (olculen merkez RGB ~7,0,51). Referansin cikis goku parlak mavi-mor,
  // ufka dogru sicak pembe, ufukta beyaza yakin.
  gr.addColorStop(0.00, '#1a1466');
  gr.addColorStop(0.30, '#3b2a9e');
  gr.addColorStop(ufukOran * 0.80, '#8a4be0');
  gr.addColorStop(ufukOran * 0.95, '#ff6fd0');
  gr.addColorStop(ufukOran, '#ffd0f0');
  gr.addColorStop(Math.min(1, ufukOran + 0.04), '#ffb46b');
  gr.addColorStop(1.00, '#2a1650');
  g.fillStyle = gr; g.fillRect(0, 0, G, Y);
  // merkez parlamasi: ufuk ortasinda genis, yumusak
  const rp = g.createRadialGradient(G / 2, uy, 0, G / 2, uy, G * 0.35);
  rp.addColorStop(0.0, 'rgba(255,230,250,0.9)');
  rp.addColorStop(0.35, 'rgba(255,120,210,0.45)');
  rp.addColorStop(1.0, 'rgba(255,120,210,0)');
  g.fillStyle = rp; g.fillRect(0, 0, G, Y);
  for (let k = 0; k < 140; k++) {                 // yildiz
    g.fillStyle = `rgba(255,255,255,${0.25 + r() * 0.6})`;
    g.fillRect(r() * G, r() * uy * 0.55, 1.6, 1.6);
  }
  const PENCERE = ['#7ae8ff', '#ff7ad0', '#ffc36b', '#b58cff'];
  const PANO = ['#ff2fb0', '#22e0ff', '#b6ff3c', '#8b3cff', '#ff8a2a'];
  const kule = (x, w, h, govde, isik) => {
    g.fillStyle = govde; g.fillRect(x, uy - h, w, h);
    // pencere izgarasi: seyrek yanik
    for (let yy = uy - h + 6; yy < uy - 4; yy += 7)
      for (let xx = x + 3; xx < x + w - 3; xx += 6)
        if (r() < isik) {
          g.fillStyle = PENCERE[Math.floor(r() * PENCERE.length)];
          g.globalAlpha = 0.8 + r() * 0.2;
          g.fillRect(xx, yy, 3.4, 3);
          g.globalAlpha = 1;
        }
    // tepe isigi
    g.fillStyle = PENCERE[Math.floor(r() * PENCERE.length)];
    g.fillRect(x + w * 0.2, uy - h - 3, w * 0.6, 3);
  };
  // uzak sira: alcak, soluk mor
  for (let x = -20; x < G; x += 22 + r() * 30)
    kule(x, 26 + r() * 40, Y * (0.10 + r() * 0.18), '#3a2c7a', 0.36);
  // yukseltilmis yol: ufkun hemen ustunde kivrilan bant + sicak lambalar
  g.strokeStyle = '#1b1238'; g.lineWidth = Y * 0.018;
  g.beginPath();
  for (let x = 0; x <= G; x += 8) {
    const yy = uy - Y * 0.06 - Math.sin(x / G * Math.PI * 1.3 + tohum) * Y * 0.05;
    x === 0 ? g.moveTo(x, yy) : g.lineTo(x, yy);
  }
  g.stroke();
  for (let x = 0; x <= G; x += 18) {
    const yy = uy - Y * 0.06 - Math.sin(x / G * Math.PI * 1.3 + tohum) * Y * 0.05;
    g.fillStyle = '#ffb35a'; g.fillRect(x, yy - Y * 0.012, 3, 3);
  }
  // yakin sira: yuksek, koyu, bol pencere, neon panolu
  for (let x = -30; x < G; x += 40 + r() * 70) {
    const w = 38 + r() * 60, h = Y * (0.22 + r() * 0.42);
    kule(x, w, h, '#221a58', 0.60);
    if (r() < 0.70) {                              // dikey neon pano
      const pc = PANO[Math.floor(r() * PANO.length)];
      const pw = w * 0.42, ph = h * (0.18 + r() * 0.2);
      const px = x + (w - pw) / 2, py = uy - h + h * (0.12 + r() * 0.3);
      g.fillStyle = pc; g.globalAlpha = 0.85; g.fillRect(px, py, pw, ph);
      g.globalAlpha = 1; g.strokeStyle = '#ffffff'; g.lineWidth = 1.5;
      g.strokeRect(px + 3, py + 3, pw - 6, ph - 6);
    }
  }
  // palmiye siluetleri: ufuk hattinda
  const palmiye = (x, h) => {
    g.strokeStyle = '#120c26'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x, uy); g.quadraticCurveTo(x + 6, uy - h * 0.5, x + 3, uy - h); g.stroke();
    g.fillStyle = '#120c26';
    for (let k = 0; k < 7; k++) {
      const a = -Math.PI / 2 + (k - 3) * 0.42;
      g.beginPath(); g.moveTo(x + 3, uy - h);
      g.quadraticCurveTo(x + 3 + Math.cos(a) * h * 0.35, uy - h + Math.sin(a) * h * 0.18 - 6,
                         x + 3 + Math.cos(a) * h * 0.5, uy - h + h * 0.18);
      g.lineTo(x + 3 + Math.cos(a) * h * 0.46, uy - h + h * 0.2);
      g.fill();
    }
  };
  for (let k = 0; k < 14; k++) palmiye(r() * G, Y * (0.07 + r() * 0.06));
  // Kulelerin USTUNE eklemeli parlama: referansta cikisin merkezi beyaza
  // yakin yaniyor, kuleler o isigin icinde eriyor.
  g.globalCompositeOperation = 'lighter';
  const rp2 = g.createRadialGradient(G / 2, uy, 0, G / 2, uy, G * 0.18);
  rp2.addColorStop(0.0, 'rgba(255,200,240,0.55)');
  rp2.addColorStop(1.0, 'rgba(255,200,240,0)');
  g.fillStyle = rp2; g.fillRect(0, 0, G, Y);
  g.globalCompositeOperation = 'source-over';
  // ufuk alti: koyu, sicak isik yansimasi
  const alt = g.createLinearGradient(0, uy, 0, Y);
  alt.addColorStop(0, 'rgba(255,120,200,0.55)');
  alt.addColorStop(0.3, 'rgba(60,20,110,0.9)');
  alt.addColorStop(1, 'rgba(14,8,40,1)');
  g.fillStyle = alt; g.fillRect(0, uy, G, Y - uy);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

{

  sehirZeminMat = new THREE.ShaderMaterial({
    uniforms: {

      uT:      { value: 0 },
      uTaban:  { value: new THREE.Color('#12152e') },

      uN1:     { value: new THREE.Color('#ff2fb0') },   // korkuluk A / kolon
      uN2:     { value: new THREE.Color('#ff8a2a') },   // korkuluk B (sicak)
      uN3:     { value: new THREE.Color('#8b3cff') },   // kolon tupu

      uSis:    { value: new THREE.Color('#0b0a2a') },

      uMavi:   { value: new THREE.Color('#3a6bff') },   // mavi pencere yansimasi
    },
    vertexShader: [
      'varying vec3 vW;',
      'void main(){',

    ].join('\n'),
    fragmentShader: [
      'precision highp float;',

      'uniform float uKay,uT,uYansima;',
      'uniform vec3 uTaban,uSerit,uN1,uN2,uN3,uUfuk,uSis,uMavi;',
      'float h11(float n){ return fract(sin(n*127.1)*43758.5453); }',
      'float gur(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',

      '  float c=h11(i.x+(i.y+1.0)*57.0), d=h11(i.x+1.0+(i.y+1.0)*57.0);',
      '  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }',

      '  vec2 k = vec2(vW.x, X) / 2.0;',
      '  vec2 kf = abs(fract(k) - 0.5);',
      '  float derz = smoothstep(0.47, 0.5, max(kf.x, kf.y));',
      '  c += vec3(0.05,0.055,0.09) * derz * (1.0 - d);',
      // islaklik: bazi karolar daha parlak (su birikintisi), yansima orada guclu
      '  float isl = 0.55 + 0.45 * gur(vec2(vW.x*0.55, X*0.22));',
      // yansima bantlari: kaynak x konumlari. z boyunca kirilma = uzun cizgiler

      '  float kir  = smoothstep(0.30, 0.85, gur(vec2(vW.x*3.4, X*0.35)));',
      '  float kir2 = smoothstep(0.25, 0.85, gur(vec2(vW.x*2.6 + 7.0, X*0.22)));',
      '  vec3 y = vec3(0.0);',
      '  float ax = abs(vW.x);',
      '  y += uN1 * bant(ax, 5.05, 0.24) * kir * 0.85;',
      '  y += uN2 * bant(ax, 4.45, 0.22) * kir2;',
      '  y += uN3 * bant(ax, 3.85, 0.28) * kir;',
      '  y += uMavi * bant(ax, 2.55, 0.40) * kir2 * 0.75;',
      '  y += uN3 * bant(vW.x, -1.45, 0.38) * kir * 0.5;',

  }

  // --- SUREKLI PARCALAR (z boyunca tekduze - kaydirmaya gerek yok)
  const uzun = (w, h, x, y, mat) => {
    const m = new THREE.Mesh(KUTU, mat); m.scale.set(w, h, 232);
    m.position.set(x, y, -100); sehirKok.add(m); return m;
  };
  for (const yon of [-1, 1]) {
    uzun(0.9, 0.46, yon * (ZEMIN_YG + 0.3), 0.23, koyu);          // korkuluk kaidesi
    uzun(0.12, 0.12, yon * KORKULUK_X, 1.28, celik);              // ust tirabzan
    uzun(0.08, 0.08, yon * KORKULUK_X, 0.62, celik);              // orta tirabzan
    // tavan raylari artik bay basina (sehirIM.tRay) - acik bolumde cati yok
  }
  // tavan panosu + raylar: BAY BASINA. Ortulu/acik donusumu icin surekli
  // tek parca olamaz (bkz. sehirGuncelle).
  sehirIM.tavanP = im(KUTU, new THREE.MeshLambertMaterial({ color:'#14172a', fog:true }), SAY);
  sehirIM.tRay   = im(KUTU, celik, SAY * 4);

  // --- CAM + ARKASINDAKI SEHIR
  // Cam: hafif mavi tul. Asil "cam" okumasini kolonlar ve yatay kayit
  // veriyor; tek basina saydam duzlem gorunmez.
  sehirCamMat = new THREE.MeshBasicMaterial({ color:'#6f7dff', transparent:true,
    opacity:0.16, depthWrite:false, fog:true, side: THREE.DoubleSide });
  sehirIM.cam    = im(KUTU, sehirCamMat, SAY * 2);
  // Acik bolumde sokak lambasi: referansta catinin otesinde yol boyunca
  // sicak turuncu nokta dizisi.
  sehirIM.lambaD = im(KUTU, celik, SAY * 2);
  sehirIM.lambaB = im(KUTU, spot, SAY * 2);
  // Yan sehir: camin otesinde uzun seritli duzlem. Kendi hizinda (0,35 kat)
  // akiyor - paralaks, uzakta oldugunu soyleyen sey bu.
  const yanDoku = sehirSilueti(2048, 512, 777, 0.80);
  yanDoku.wrapS = THREE.RepeatWrapping; yanDoku.repeat.set(3, 1);
  for (const yon of [-1, 1]) {
    const mat = new THREE.MeshBasicMaterial({ map: yanDoku.clone(), fog:false,
      side: THREE.DoubleSide });
    mat.map.wrapS = THREE.RepeatWrapping; mat.map.repeat.set(3, 1);
    mat.map.needsUpdate = true;
    const p = new THREE.Mesh(new THREE.PlaneGeometry(330, 62), mat);
    p.rotation.y = yon * Math.PI / 2;
    p.position.set(yon * 34, 18, -120);
    sehirKok.add(p);
    sehirYanMat.push(mat);
  }
  // Cikistaki sehir: kacis noktasinda, kameranin uzak duzleminin (300)
  // ICINDE - gunes diskinde ogrenildi, 300'un otesi hic cizilmiyor.
  sehirUcMat = new THREE.MeshBasicMaterial({ map: sehirSilueti(2048, 1024, 4242, 0.66),
    fog:false });
  // v3: 250x125 / z=-262 idi, kadrajda kucuk kaliyordu. 300x150 / z=-200:
  // yatayda kadrajin neredeyse tamami, dokudaki ufuk cizgisi (%66) dunyada
  // y~6'ya dusuyor - goz hizasinin hemen ustu. Alt yarisini zemin kapatiyor.
  const uc = new THREE.Mesh(new THREE.PlaneGeometry(300, 150), sehirUcMat);
  uc.position.set(0, 30, -200);
  sehirKok.add(uc);
  // CIKIS PARLAMASI: referansta kacis noktasi karenin EN PARLAK yeri
  // (olculen merkez V 0,89). Pano tek basina bunu vermedi (v3: 0,15).
  {
    const pc = document.createElement('canvas'); pc.width = pc.height = 256;
    const p2 = pc.getContext('2d');
    const rg = p2.createRadialGradient(128, 128, 0, 128, 128, 128);
    rg.addColorStop(0.00, 'rgba(255,255,255,1)');
    rg.addColorStop(0.18, 'rgba(255,220,245,0.85)');
    rg.addColorStop(0.45, 'rgba(255,120,210,0.35)');
    rg.addColorStop(1.00, 'rgba(255,80,200,0)');
    p2.fillStyle = rg; p2.fillRect(0, 0, 256, 256);
    sehirParlama = new THREE.Mesh(new THREE.PlaneGeometry(90, 60),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc), transparent: true,
        depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
    sehirParlama.position.set(0, 5.5, -185);
    sehirKok.add(sehirParlama);
  }

  // --- PALMIYE: camin otesinde, sicak yukari isikli. Referansta hem sol
  // hem sag camin arkasinda, turuncu-sari aydinlatilmis yapraklar.
  sehirPalmiye = new THREE.Group();
  const govdeP = new THREE.MeshLambertMaterial({ color:'#5b3a2c', fog:true });
  const yaprakP = new THREE.MeshBasicMaterial({ color:'#ffc05a', fog:true });
  const yaprakK = new THREE.MeshBasicMaterial({ color:'#3fa060', fog:true });
  const PALM_SAY = 16;
  for (let i = 0; i < PALM_SAY; i++) {
    const g = new THREE.Group();
    const h = 6.4 + (i % 3) * 1.3;
    const gov = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, h, 6), govdeP);
    gov.position.y = h / 2; g.add(gov);
    for (let k = 0; k < 8; k++) {
      const y = new THREE.Mesh(new THREE.ConeGeometry(0.42, 3.8, 4), k % 2 ? yaprakP : yaprakK);
      y.position.set(0, h, 0);
      y.rotation.set(0, k * Math.PI / 4, 1.95);   // disa ve asagi sarkan yaprak
      y.translateY(1.7);
      g.add(y);
    }
    g.userData = { i, yon: i % 2 ? 1 : -1, x: 7.3 + (i % 4) * 1.4 };
    sehirPalmiye.add(g);
  }
  sehirPalmiye.userData = { ARA: 14.5, KAP: 14.5 * PALM_SAY };
  sehirKok.add(sehirPalmiye);
}

// Her kare: kaydirma + ortam rengi. sehirMod kapaliyken hic calismaz.
function sehirGuncelle(t, O0, O1, yumusak, karistir){
  const { ADIM, SAY, KAP, KOLON_X, KORKULUK_X, TAVAN_Y, CAM_X } = SEHIR;
  const P = t * HIZ;
  const U = sehirZeminMat.uniforms;
  U.uKay.value = P; U.uT.value = t;
  const renk = (a, v) => karistir(O0[a] || v, O1[a] || v);
  U.uN1.value.copy(renk('neon1', '#ff2fb0'));
  U.uN2.value.copy(renk('neon2', '#ff8a2a'));
  U.uN3.value.copy(renk('neon3', '#8b3cff'));
  U.uSerit.value.copy(renk('serit', '#2ee6ff'));
  U.uUfuk.value.copy(renk('ufukIsik', '#ff7ad0'));
  U.uMavi.value.copy(renk('neon4', '#3a6bff'));
  U.uSis.value.copy(renk('gok', '#0b0a2a'));
  const M = sehirIM.mat;
  M.neonA.color.copy(renk('neon1', '#ff2fb0'));
  M.neonB.color.copy(renk('neon3', '#8b3cff'));
  M.korA.color.copy(renk('neon1', '#ff2fb0'));
  M.korB.color.copy(renk('neon2', '#ff8a2a'));
  M.tavA.color.copy(renk('tavan1', '#b04dff'));
  M.tavB.color.copy(renk('tavan2', '#22e0ff'));
  const ton = renk('sehirTon', '#ffffff');
  sehirParlama.material.color.copy(renk('ufukIsik', '#ff7ad0')).lerp(new THREE.Color('#ffffff'), 0.5);
  sehirUcMat.color.copy(ton);
  for (const m of sehirYanMat) {
    m.color.copy(ton);
    m.map.offset.x = (P * 0.35 / 330) % 1;       // paralaks: yapidan yavas
  }

  const Mx = new THREE.Matrix4(), V = new THREE.Vector3(),
        Q = new THREE.Quaternion(), S = new THREE.Vector3();
  const koy = (imesh, idx, x, y, z, sx, sy, sz) => {
    V.set(x, y, z); S.set(sx, sy, sz); Mx.compose(V, Q, S); imesh.setMatrixAt(idx, Mx);
  };
  const I = sehirIM;
  let ia = 0, ib = 0, ta = 0, tb = 0, ka = 0, kb = 0;
  for (let i = 0; i < SAY; i++) {
    const z = Z_VURUS + 8 - KAP + ((i * ADIM + P) % KAP);
    // istasyon tabanli tek/cift: desen guverteyle birlikte akar
    const n = Math.round((z + P) / ADIM);
    const cift = (n & 1) === 0;
    // ORTULU / ACIK: referansta cati kameraya YAKIN bitiyor, otesi acik
    // yurume yolu + sehir. Sonsuz kosuda karsiligi donusumlu bolum:
    // 10 bay ortulu (70 birim, 4,7 sn), 4 bay acik (28 birim, 1,9 sn).
    // Ilk surumde cati 238 birim kesintisizdi; cikis kadrajda igne deligi
    // kadar pembe bir kareye donuyordu, sehir hic gorunmuyordu.
    // CATI KESIMI (v3): v2'de acik araligin arkasindan bir sonraki ortulu
    // bolum geliyor ve kacis noktasini yine igne deligine ceviriyordu.
    // Referansin imzasi tam tersi: cati YAKINDA bitiyor, otesi buyuk ve
    // parlak sehir. Cati/kolon/cam artik yalnizca z > -92'de (kameradan
    // ~100 birim); otesi korkuluklu acik yol, lambalar ufka kadar gidiyor.
    // Kesme noktasinda bir anda belirmesinler diye yapi zeminin ALTINDAN
    // yukseliyor (k: -92'de 0, -72'de 1) - zemin opak, alti gorunmuyor.
    // v6 - CATI UCU SABIT PORTAL. Olculdu: v5'te cati 92 birimde bitiyordu
    // ve cikis kadrajin yalnizca ~%10 x %9'unu kapliyordu (merkez V her
    // karede 0,125). Referansta aciklik ~%25 x %28 -> cati ~38 birimde
    // bitmeli. Ama bay'ler 7 birimde bir eklenince cati ucu o mesafede %20
    // titriyordu. Cati ucu artik sabit portal (SEHIR.KES); bay'ler oraya
    // kadar KIRPILIYOR - portal tarafindaki bay kismi boyla ciziliyor.
    const KES = SEHIR.KES;
    const zb = z - ADIM / 2;
    const yok = (imesh, idx) => koy(imesh, idx, 0, -99, 0, 1e-4, 1e-4, 1e-4);
    const zUzak = Math.max(z - ADIM, KES);               // bay'in portal tarafi
    const L = z - zUzak;                                  // kirpilmis bay boyu
    const zc = z - L / 2;                                 // kirpilmis bay ortasi
    if (z > KES + 0.3) {
      koy(I.kolon, i * 2,     -KOLON_X, TAVAN_Y / 2, z, 0.95, TAVAN_Y, 0.95);
      koy(I.kolon, i * 2 + 1,  KOLON_X, TAVAN_Y / 2, z, 0.95, TAVAN_Y, 0.95);
      for (const yon of [-1, 1]) {
        if (cift) koy(I.tupA, ia++, yon * (KOLON_X - 0.52), TAVAN_Y * 0.52, z, 0.14, TAVAN_Y * 0.62, 0.22);
        else      koy(I.tupB, ib++, yon * (KOLON_X - 0.52), TAVAN_Y * 0.52, z, 0.14, TAVAN_Y * 0.62, 0.22);
      }
      koy(I.kiris, i, 0, TAVAN_Y - 0.05, z, KOLON_X * 2 + 0.6, 0.55, 0.55);
    } else {
      yok(I.kolon, i * 2); yok(I.kolon, i * 2 + 1); yok(I.kiris, i);
    }
    if (L > 0.05) {
      // ORTULU (tamami ya da portala kadar kirpilmis kismi)
      if (zb > KES) {
        const tv = cift ? I.tavA : I.tavB;
        koy(tv, cift ? ta++ : tb++, cift ? -1.3 : 1.3, TAVAN_Y - 0.28, zb, 2.6, 0.07, 0.22);
      }
      const s1 = z - ADIM * 0.25, s2 = z - ADIM * 0.75;
      if (s1 > KES) koy(I.spot, i * 2, -3.6, TAVAN_Y - 0.32, s1, 0.32, 0.12, 0.32); else yok(I.spot, i * 2);
      if (s2 > KES) koy(I.spot, i * 2 + 1, 3.6, TAVAN_Y - 0.32, s2, 0.32, 0.12, 0.32); else yok(I.spot, i * 2 + 1);
      koy(I.mull, i * 2,     -(KOLON_X + 0.12), 4.6, zc, 0.12, 0.14, L);
      koy(I.mull, i * 2 + 1,  (KOLON_X + 0.12), 4.6, zc, 0.12, 0.14, L);
      koy(I.tavanP, i, 0, TAVAN_Y + 0.35, zc, KOLON_X * 2 + 1, 0.12, L + 0.02);
      koy(I.tRay, i * 4,     -(KOLON_X - 0.2), TAVAN_Y - 0.2,  zc, 0.7, 0.35, L + 0.02);
      koy(I.tRay, i * 4 + 1,  (KOLON_X - 0.2), TAVAN_Y - 0.2,  zc, 0.7, 0.35, L + 0.02);
      koy(I.tRay, i * 4 + 2, -2.6,             TAVAN_Y + 0.05, zc, 0.5, 0.3,  L + 0.02);
      koy(I.tRay, i * 4 + 3,  2.6,             TAVAN_Y + 0.05, zc, 0.5, 0.3,  L + 0.02);
      koy(I.cam, i * 2,     -CAM_X, (TAVAN_Y + 0.6) / 2, zc, 0.02, TAVAN_Y - 0.6, L);
      koy(I.cam, i * 2 + 1,  CAM_X, (TAVAN_Y + 0.6) / 2, zc, 0.02, TAVAN_Y - 0.6, L);
      for (const q of [0, 1]) { yok(I.lambaD, i * 2 + q); yok(I.lambaB, i * 2 + q); }
    } else {
      // ACIK YOL: portalin otesi. Korkuluk + sokak lambalari ufka kadar.
      for (const m2 of [I.spot, I.mull, I.cam]) { yok(m2, i * 2); yok(m2, i * 2 + 1); }
      yok(I.tavanP, i);
      for (let q = 0; q < 4; q++) yok(I.tRay, i * 4 + q);
      koy(I.lambaD, i * 2,     -(KORKULUK_X - 0.35), 3.2,  zb, 0.12, 6.4,  0.12);
      koy(I.lambaD, i * 2 + 1,  (KORKULUK_X - 0.35), 3.2,  zb, 0.12, 6.4,  0.12);
      koy(I.lambaB, i * 2,     -(KORKULUK_X - 0.75), 6.35, zb, 0.9,  0.16, 0.36);
      koy(I.lambaB, i * 2 + 1,  (KORKULUK_X - 0.75), 6.35, zb, 0.9,  0.16, 0.36);
    }
    // korkuluk HER bolumde - referansta cati bitince de devam ediyor
    for (let k = 0; k < 2; k++) {
      const zz = z - k * ADIM / 2;
      koy(I.direk, i * 4 + k * 2,     -KORKULUK_X, 0.65, zz, 0.1, 1.3, 0.1);
      koy(I.direk, i * 4 + k * 2 + 1,  KORKULUK_X, 0.65, zz, 0.1, 1.3, 0.1);
    }
    // Iki yanda da neon serit; sol ve sag ters fazda - ayni bayda sol
    // magenta iken sag turuncu. Ayna gibi durunca kare duzlesiyordu.
    for (const yon of [-1, 1]) {
      const a = (yon < 0) === cift;
      if (a) koy(I.korA, ka++, yon * KORKULUK_X, 1.05, zb, 0.1, 0.12, ADIM * 0.92);
      else   koy(I.korB, kb++, yon * KORKULUK_X, 1.05, zb, 0.1, 0.12, ADIM * 0.92);
    }
  }
  // kullanilmayan ornekleri gorunmez kil (sifir olcek)
  const sifirla = (imesh, from) => {
    for (let j = from; j < imesh.count; j++) koy(imesh, j, 0, -99, 0, 0.0001, 0.0001, 0.0001);
  };
  sifirla(I.tupA, ia); sifirla(I.tupB, ib); sifirla(I.tavA, ta); sifirla(I.tavB, tb);
  sifirla(I.korA, ka); sifirla(I.korB, kb);
  for (const k in I) if (I[k].isInstancedMesh) I[k].instanceMatrix.needsUpdate = true;

  // palmiyeler
  const { ARA, KAP: PK } = sehirPalmiye.userData;
  for (const g of sehirPalmiye.children) {
    const z = Z_VURUS + 8 - PK + ((g.userData.i * ARA + P) % PK);
    g.position.set(g.userData.yon * g.userData.x, 0, z);
  }
}

// ==================================================== OBBY LEGO YAPILARI
// Kullanici (5 Eyl 2026): "orta seridin kenarlarina serit boyu ufka dogru
// legolardan yapilar yap rengarenk, yapilar arasinda cok az bosluk olsun".
// Iki sira: YAKIN sira alcak ve sik (serit kenarini ciziyor, hiz hissini
// veren sey o), UZAK sira yuksek ve seyrek (silueti dolduruyor, derinlik
// veriyor). Referansta da kenar bos degil - bosluk birakinca kare renk
// duvarina donuyor.
// Cizim yuku: renk basina TEK InstancedMesh -> 12 draw call, 700+ degil.
let legoKok = null;
{
  legoKok = new THREE.Group();
  legoKok.visible = false;
  const LEGO_RENK = ['#e8342c','#f5b81e','#2a7de1','#3fbf4a',
                     '#e05fc0','#ffffff','#f07020','#25c3c9'];
  const lrnd = (n) => { const x = Math.sin(n * 78.233) * 43758.5453; return x - Math.floor(x); };

  // Lego tugla dokusu: ust yuzde perçin sirasi, yan yuzde ince kenar.
  const lc = document.createElement('canvas'); lc.width = lc.height = 64;
  const lg = lc.getContext('2d');
  lg.fillStyle = '#ffffff'; lg.fillRect(0, 0, 64, 64);
  lg.fillStyle = 'rgba(0,0,0,0.16)'; lg.fillRect(0, 0, 64, 3);
  lg.fillStyle = 'rgba(0,0,0,0.10)'; lg.fillRect(0, 61, 64, 3);
  for (const cx of [16, 48]) {                       // perçinler
    lg.fillStyle = 'rgba(255,255,255,0.55)';
    lg.beginPath(); lg.arc(cx, 12, 7, 0, 6.2832); lg.fill();
    lg.fillStyle = 'rgba(0,0,0,0.14)';
    lg.beginPath(); lg.arc(cx, 15, 7, 0, 6.2832); lg.fill();
  }
  const legoDoku = new THREE.CanvasTexture(lc);

  const KAP = 240;                                   // dongu uzunlugu
  const tuglalar = [];                               // {renk, x, y, z0, sx, sy, sz}
  // --- YAKIN SIRA: serit kenari, alcak, cok az bosluklu
  for (const yon of [-1, 1]) {
    let z = 0, i = 0;
    while (z < KAP) {
      const derin = 2.6 + lrnd(i + yon * 7) * 1.6;   // yapinin z uzunlugu
      const kat   = 1 + Math.floor(lrnd(i + 41) * 2); // 1-2 kat: gok acik kalsin
      const gen   = 2.4 + lrnd(i + 59) * 1.4;
      const x = yon * (4.6 + gen / 2 + lrnd(i + 13) * 0.6);
      for (let k = 0; k < kat; k++)
        tuglalar.push({ r: Math.floor(lrnd(i * 3 + k + 5) * LEGO_RENK.length),
                        x, y: -0.55 + 0.62 + k * 1.24, z0: z + derin / 2,
                        sx: gen, sy: 1.18, sz: derin });
      z += derin + 0.35;                             // COK AZ bosluk
      i++;
    }
  }
  // --- UZAK SIRA: yuksek kuleler, silueti dolduruyor
  for (const yon of [-1, 1]) {
    let z = 0, i = 0;
    while (z < KAP) {
      const derin = 4.0 + lrnd(i + 101 + yon * 3) * 3.0;
      const kat   = 2 + Math.floor(lrnd(i + 131) * 6);  // 2-7 kat
      const gen   = 3.4 + lrnd(i + 149) * 2.6;
      const x = yon * (15.0 + lrnd(i + 167) * 15.0);
      for (let k = 0; k < kat; k++)
        tuglalar.push({ r: Math.floor(lrnd(i * 5 + k + 23) * LEGO_RENK.length),
                        x, y: -0.55 + 0.75 + k * 1.5, z0: z + derin / 2,
                        sx: gen, sy: 1.42, sz: derin });
      z += derin + 0.7;
      i++;
    }
  }

  const kutuGeoL = new THREE.BoxGeometry(1, 1, 1);
  const legoMesh = [];
  for (let r = 0; r < LEGO_RENK.length; r++) {
    const alt = tuglalar.filter(b => b.r === r);
    if (!alt.length) { legoMesh.push(null); continue; }
    const im = new THREE.InstancedMesh(kutuGeoL,
      new THREE.MeshLambertMaterial({ color: LEGO_RENK[r], map: legoDoku, fog: true }),
      alt.length);
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.castShadow = false; im.receiveShadow = false;
    im.userData.tuglalar = alt;
    legoKok.add(im); legoMesh.push(im);
  }
  legoKok.userData = { mesh: legoMesh, KAP };
  scene.add(legoKok);
}

// Obby modu engel guncellemesine bayrak olarak tasiniyor (engelDestekGuncelle
// ve nota materyali render dongusunun disindan cagriliyor).
let GOK_MOD_AKTIF = false;
// Deniz modu engel destekleri icin bayrak. Obby ile ayni yerde okunuyor
// ama ayri: obby'de engelin tasiyicisi HIC yok, denizde VAR ama gar dili
// degil - sarkac halati, bariyer kolu, guverteye civilenmis varil.
let DENIZ_MOD_AKTIF = false;
// Sehir koprusu: kapali koridor, tavan var. Engel tasiyicisi gar dilinde
// (tavandan sarkan kiris) - obby/deniz dalina girmemeli.
let SEHIR_MOD_AKTIF = false;
// KARPUZ (13 Eyl 2026): engel de mekanla ayni bitkinin parcasi. Kullanici
// karari - "tek meyve, dort hali". Sahneye sonradan birakilmis gri celik
// yerine govde / meyve / kesit / yaprak: dort ayri SEKIL AILESI, tek dil.
let KARPUZ_MOD_AKTIF = false;

const ENGEL_DOKU = [
  engelDoku('#1c1a17', '#f2c53d'),   // sol  - sari/siyah
  engelDoku('#1c1a17', '#e8563f'),   // orta - mercan/siyah
  engelDoku('#1c1a17', '#3fc2c9'),   // sag  - turkuaz/siyah
];

// ------------------------------------------------ ENGEL TASIYICILARI
// Kullanici (4 Eyl 2026): engeller "havada duran duz renkli dikdortgen"
// gibi okunuyor. Sebep: uc engelin de govdesi AYNI kutunun olceklenmis hali

// ================= BAL IPLIKLERI (17 Eyl 2026, MEK-004 ritim ogesi) =================
// Yolun iki yaninda her VURUS araliginda bir iplik; OLCU basi (her dorduncu)
// uzun, digerleri kisa. Hepsi ayni olcu fazinda yukselir, ortasi incelir ve
// OLCU BASINDA koparak coker - saha olcu olcu nefes aliyor. MEK-001 zemin
// cubugu, MEK-002 tavan golgesi, MEK-003 zemin kabarmasi DEGIL: dikey,
// kisa omurlu, sivinin kendisi.
// Fotograf yok: geometri Lathe, parlaklik canvas matcap (bal yuzeyiyle ayni aile).
let balIplikKok = null, balIplikIM = null, balDamlaIM = null, balIplikVeri = [];
const BAL_IPLIK_KAP = 280;
function balIplikKur(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(56, 50, 4, 64, 64, 64);
  r.addColorStop(0.00, '#fff4d2');
  r.addColorStop(0.18, '#ffd27a');
  r.addColorStop(0.55, '#e0922a');
  r.addColorStop(0.85, '#8a4608');
  r.addColorStop(1.00, '#5a2c04');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const mat = new THREE.MeshMatcapMaterial({ matcap: new THREE.CanvasTexture(c),
    transparent: true, opacity: 0.93, fog: true });
  const prof = [];
  for (let i = 0; i <= 16; i++) {
    const u = i / 16;
    prof.push(new THREE.Vector2(0.26 * Math.pow(1 - u, 2.2) + 0.045 * (1 - Math.pow(1 - u, 2)), u));
  }
  const iplikGeo = new THREE.LatheGeometry(prof, 12);
  const damlaGeo = new THREE.SphereGeometry(0.11, 10, 8);
  const ARA = OLCU * HIZ / 4;                      // bir vurus araligi (dunya birimi)
  const N = Math.ceil(BAL_IPLIK_KAP / ARA);
  balIplikKok = new THREE.Group();
  balIplikIM = new THREE.InstancedMesh(iplikGeo, mat, N * 2);
  balDamlaIM = new THREE.InstancedMesh(damlaGeo, mat, N * 2);
  balIplikIM.frustumCulled = false; balDamlaIM.frustumCulled = false;
  balIplikVeri = [];
  for (let k = 0; k < N; k++) {
    for (const yan of [-1, 1]) {
      const h = Math.sin((k + 1) * 12.9898 * (yan + 3)) * 43758.5453;
      const j = h - Math.floor(h);
      balIplikVeri.push({ z0: k * ARA, x: yan * (YOL_GEN / 2 + 1.85 + (j - 0.5) * 0.5), uzun: (k % 4) === 0, j });
    }
  }
  balIplikKok.add(balIplikIM); balIplikKok.add(balDamlaIM);
  balIplikKok.visible = false;
  scene.add(balIplikKok);
}
function balIplikGuncelle(t){
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  const taban = Z_VURUS + 20 - BAL_IPLIK_KAP;
  // faz: 0,80'de kopma -> olcu basina (vurus 1) denk gelsin diye +0,20 kaydirma
  const faz = ((t / OLCU) + 0.20) % 1;
  for (let i = 0; i < balIplikVeri.length; i++) {
    const o = balIplikVeri[i];
    const z = taban + ((o.z0 + t * HIZ) % BAL_IPLIK_KAP);
    const boyMax = o.uzun ? 2.3 : 1.15;
    let boy, gen, dy = -99;
    if (faz < 0.55)      { boy = boyMax * (0.25 + 0.75 * faz / 0.55); gen = 1.0; }
    else if (faz < 0.80) { boy = boyMax; gen = 1.0 - 0.45 * (faz - 0.55) / 0.25; }
    else                 { const k = (faz - 0.80) / 0.20; boy = boyMax * (0.35 * (1 - k) + 0.12); gen = 0.8;
                           dy = boyMax * (1 - k * k) ; }
    q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), 0.10 * Math.sin(o.j * 6.28 + t * 1.3));
    p.set(o.x, 0, z); sc.set(gen, boy, gen);
    m.compose(p, q, sc); balIplikIM.setMatrixAt(i, m);
    if (dy > -90) { p.set(o.x, dy, z); sc.set(1, 1.25, 1); }
    else { p.set(o.x + 0.02 * Math.sin(t), boy, z); sc.set(0.8 + 0.3 * gen, 0.9, 0.8 + 0.3 * gen); }
    q.identity(); m.compose(p, q, sc); balDamlaIM.setMatrixAt(i, m);
  }
  balIplikIM.instanceMatrix.needsUpdate = true;
  balDamlaIM.instanceMatrix.needsUpdate = true;
}

// Kural: ENGEL = HAREKETIN FIZIKSEL SEBEBI. Gecis yukseklikleri engel-defteri
// sabitleri - BICIM degisir (kimlik % 3), SAYI degismez.
//   zipla_a  -> alcak buz kaliplari, tepe 1,10          (ustunden zipla)
