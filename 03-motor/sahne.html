function buzEngel(g, d, tip, z, kimlik){
  buzHazirla(g, d);
  const YARI = YOL_GEN / 2;
  const v = ((kimlik | 0) % 3 + 3) % 3;
  let ik = 0, is = 0;
  const kutu = (x0, x1, y0, y1, zz, der) => {
    const m = d.bKutu[ik++]; if (!m) return;
    m.visible = true;
    m.scale.set(Math.abs(x1 - x0), Math.abs(y1 - y0), der);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, zz);
  };
  const sarkit = (x, yUst, yUc, zz, gen) => {
    const m = d.bSarkit[is++]; if (!m) return;
    m.visible = true;
    m.scale.set(gen, yUst - yUc, gen);
    m.position.set(x, yUst, zz);
  };
  const hs = (k) => { const h = Math.sin((k + 1) * 78.233 + v * 11.3) * 43758.5453; return h - Math.floor(h); };
  // On uyari: engelin 2,5 birim onunde, koridor genisliginde. Ilk surumde
  // YOL_GEN*1,5 ve z+6 idi - yakin planda koridoru kara bir uccene ceviriyordu.
  d.bGolge.visible = true;
  d.bGolge.scale.set(YOL_GEN * 1.05, 3.2, 1);
  d.bGolge.position.set(0, 0.07, z + 2.5);

  if (tip === 'zipla_a') {
    const x0 = -(YARI + 1.6), x1 = YARI + 1.6;
    if (v === 0) {
      let x = x0, k = 0;
      while (x < x1) { const w = 1.05 + 0.25 * hs(k); kutu(x + 0.04, Math.min(x1, x + w) - 0.04, 0, 1.10 - 0.14 * hs(k + 7), z, 0.95); x += w; k++; }
    } else if (v === 1) {
      let x = x0, k = 0;
      while (x < x1) { const w = 1.2; kutu(x + 0.04, Math.min(x1, x + w) - 0.04, 0, 1.10, z, 0.8);
                       kutu(x + 0.6, Math.min(x1, x + 0.6 + w) - 0.04, 0, 0.74, z + 1.25, 0.8); x += w; k++; }
    } else {
      kutu(x0, x1, 0, 0.78, z, 1.0);
      let x = x0 + 0.3, k = 0;
      while (x < x1 - 0.8) { kutu(x, x + 0.9, 0.78, 1.10 - 0.08 * hs(k), z - 0.1 + 0.2 * hs(k + 3), 0.7); x += 1.35; k++; }
    }
    return;
  }
  if (tip === 'egil') {
    // olc-engel-bal.js (17 Eyl): raf +-12 genislik / 0,55-0,95 kalinlikta
    // vurus aninda %31-33 kapliyordu (kural <%30). Raf +-8'e, kalinlik 0,40-0,62'ye.
    const RAF = (v === 1) ? 5.0 : 4.85;
    let x = -8, k = 0;
    while (x < 8) { const w = 1.0 + 0.6 * hs(k); kutu(x, Math.min(8, x + w + 0.05), RAF, RAF + 0.40 + 0.22 * hs(k + 5), z, 0.6); x += w; k++; }
    x = -7; k = 0;
    const sik = (v === 2) ? 0.55 : 0.75;
    while (x < 7 && is < d.bSarkit.length) {
      const gen = 0.28 + 0.26 * hs(k + 11);
      const uc = (Math.abs(x) < YARI + 0.4) ? 3.86 : 3.6 + 0.8 * hs(k + 23);
      sarkit(x, RAF + 0.02, uc, z - 0.02, gen);
      x += gen * (0.8 + sik * hs(k + 31)); k++;
    }
    return;
  }
  if (tip === 'yanadim_L' || tip === 'yanadim_R') {
    // yanadim_L: siluet SOLA gider -> ACIK taraf sol -> levha SAGDA.
    const yon = (tip === 'yanadim_L') ? 1 : -1;
    const a0 = yon > 0 ? 0.3 : -(YARI + 2.4), a1 = yon > 0 ? (YARI + 2.4) : -0.3;
    if (v === 0) {
      kutu(a0, a1, 0, 3.54, z, 0.44);
    } else if (v === 1) {
      kutu(a0, a1, 0, 3.54, z, 0.44);
      kutu(a0 + yon * 0.5, a1, 0, 3.10, z - 1.4, 0.44);
    } else {
      const orta = (a0 + a1) / 2;
      kutu(a0, orta, 0, 3.54, z, 0.44);
      kutu(orta, a1, 0, 3.20, z, 0.44);
    }
    return;
  }
  if (tip === 'it_c') {
    // Buz paneli koridoru bastan basa kapatir; yan sutunlar etrafindan
    // dolasmayi engeller -> tek yol ITMEK. Panelin ortasi (el hizasi) catlak.
    // KURAL (17 Eyl 2026 denetimi): panel YERDEN baslar. Ilk surumde 0,8'den
    // basliyordu - altindaki bosluk "egilerek gec" okunuyordu (iki hareketle
    // okunabilen engel = ihlal).
    // Ust sinir GOGUS hizasi (2,9): 3,7'lik panel vurus aninda kadrajin alt
    // yarisini tamamen kapatiyordu (kural <%30). 2,9 hala ziplanamaz yukseklik;
    // eller 2,55 civarinda panele degiyor.
    // olc-engel-bal.js (17 Eyl): 2,9 panel + 0,7 sutun %33-37 kapliyordu.
    // Panel 2,6 (el temasi ust kenarda, 2,55), sutunlar 0,35 genislik.
    const P1 = 2.6;
    kutu(-(YARI + 0.15), (YARI + 0.15), 0, P1, z, (v === 1) ? 0.45 : 0.30);
    kutu(-(YARI + 0.5), -(YARI + 0.15), 0, P1 + (v === 2 ? 0.5 : 0.2), z, 0.5);
    kutu((YARI + 0.15), (YARI + 0.5), 0, P1 + (v === 2 ? 0.5 : 0.2), z, 0.5);
    return;
  }
}

function engelDestekGuncelle(g, tip, z, gov, kimlik){
  const d = g.userData;
  for (const k in d){
    if (Array.isArray(d[k])) { for (const q of d[k]) q.visible = false; }
    else d[k].visible = false;
  }
  if (BAL_MOD_AKTIF) {
    if (!gov) return;
    buzEngel(g, d, tip, z, kimlik);
    return;
  }
  if (ELMA_MOD_AKTIF) {
    // ENG-003 GECIT (14 Eyl 2026). Dort cue, dort ACIKLIK: nesneyi degil
    // GECILECEK BOSLUGU okursun. Gecis yukseklikleri engel-defterindeki
    // sabitler - BICIM degisir, SAYI degismez.
    // Her cue'nun UC bicimi var; hangisinin cizilecegi notanin kimliginden
    // (combo) turuyor, yani ayni nota her karede ayni bicimi veriyor.
    if (!gov) return;
    const YARI = YOL_GEN / 2;                       // 3,5
    const v = ((kimlik | 0) % 3 + 3) % 3;           // 0 / 1 / 2
    d.gGolge.visible = true;
    d.gGolge.scale.set(YOL_GEN * 1.5, YOL_GEN * 1.5, 1);
    d.gGolge.position.set(0, 0.06, z + 6.0);
    const direk = (q, x, h) => {
      q.visible = true; q.scale.set(0.42, h, 0.42); q.position.set(x, h / 2, z);
    };
    const panel = (q, x, gen, yuk, der, zz) => {
      q.visible = true; q.scale.set(gen, yuk, der || 0.44);
      q.position.set(x, yuk / 2, zz === undefined ? z : zz);
      q.rotation.z = 0;
    };
    const kalas = (q, x0, y0, x1, y1, zz) => {
      const dx = x1 - x0, dy = y1 - y0, boy = Math.hypot(dx, dy);
      q.visible = true; q.scale.set(0.50, boy, 0.46);
      q.position.set((x0 + x1) / 2, (y0 + y1) / 2, zz === undefined ? z : zz);
      q.rotation.z = -Math.atan2(dx, dy);
    };

    if (tip === 'charleston') {
      // ALCAK ACIKLIK - tepe her bicimde 1,10; degisen NEREDE dolu oldugu.
      if (v === 0) {
        // 1) duz alcak kapi: koridoru bastan basa kapatir, ustu acik
        panel(d.gPanel, 0, YOL_GEN + 3.2, 1.10);
        direk(d.gDirekL, -(YARI + 0.9), 1.95);
        direk(d.gDirekR,  (YARI + 0.9), 1.95);
      } else if (v === 1) {
        // 2) cift kanat: ortada 1,30 bosluk - ayak ORTADAN savrulur
        const gen = YARI + 1.0;
        panel(d.gPanel, -(0.65 + gen / 2), gen, 1.10);
        panel(d.gCapL,   (0.65 + gen / 2), gen, 1.10);
        direk(d.gDirekL, -(YARI + 0.9), 1.95);
        direk(d.gDirekR,  (YARI + 0.9), 1.95);
      } else {
        // 3) kademeli: bir yari 1,10, oteki 0,72 - asimetrik siluet
        panel(d.gPanel, -(YARI / 2 + 0.9), YARI + 1.6, 1.10);
        panel(d.gCapR,   (YARI / 2 + 0.9), YARI + 1.6, 0.72);
        direk(d.gDirekL, -(YARI + 0.9), 1.95);
      }
      return;
    }

    if (tip === 'side_L' || tip === 'side_R') {
      // KAYIK ACIKLIK - derinlik 0,44 / tepe 3,54 her bicimde ayni.
      const yon = (tip === 'side_L') ? 1 : -1;      // kapali yan
      if (v === 0) {
        panel(d.gPanel, yon * (YARI / 2 + 0.3), YARI + 0.6, 3.54);
        direk(d.gDirekL, yon * (YOL_GEN / 2 + 0.9), 3.9);
      } else if (v === 1) {
        // 2) cerceve: yan panel + aciklikin ustunde kiris -> KAPI okumasi
        panel(d.gPanel, yon * (YARI / 2 + 0.3), YARI + 0.6, 3.54);
        d.gLento.visible = true;
        d.gLento.scale.set(YOL_GEN + 2.0, 0.46, 0.5);
        d.gLento.position.set(0, 3.54 + 0.23, z);
        d.gLento.rotation.z = 0;
        direk(d.gDirekL, -(YARI + 0.8), 3.7);
        direk(d.gDirekR,  (YARI + 0.8), 3.7);
      } else {
        // 3) cift panel: ayni yanda arka arkaya iki ince panel (derinlik)
        panel(d.gPanel, yon * (YARI / 2 + 0.3), YARI + 0.6, 3.54, 0.44, z);
        panel(d.gCapL,  yon * (YARI / 2 + 0.3), YARI + 0.2, 3.10, 0.44, z + 1.6);
        direk(d.gDirekL, yon * (YOL_GEN / 2 + 0.9), 3.9);
      }
      return;
    }

    if (tip === 'roof') {
      // ALCAK LENTO - alt yuz her bicimde 2,55; ust sinir 4,10.
      const lento = (q, alt, kal) => {
        q.visible = true; q.scale.set(YOL_GEN + 2.4, kal, 0.55);
        q.position.set(0, alt + kal / 2, z); q.rotation.z = 0;
      };
      if (v === 0) {
        lento(d.gLento, 2.55, 1.55);
      } else if (v === 1) {
        // 2) cift kiris: 2,55 ve 3,55 - kol iki kez itiyor gibi okunur
        lento(d.gLento, 2.55, 0.52);
        lento(d.gPanel, 3.55, 0.52);
      } else {
        // 3) sarkitli lento: kirisden asagi inen iki kisa kalas
        lento(d.gLento, 2.95, 1.15);
        kalas(d.gCapL, -1.55, 2.55, -1.55, 3.10);
        kalas(d.gCapR,  1.55, 2.55,  1.55, 3.10);
      }
      direk(d.gDirekL, -(YARI + 0.8), 3.3);
      direk(d.gDirekR,  (YARI + 0.8), 3.3);
      return;
    }

    if (tip === 'jacks') {
      // PAPYON ACIKLIK - bel her bicimde 2,20 (y = 2,60).
      const xd = YARI + 0.7, xi = 1.10, yBel = 2.60;
      if (v === 0) {
        kalas(d.gCapL, -xd, 0.0, -xi, yBel);
        kalas(d.gCapR,  xd, 0.0,  xi, yBel);
        kalas(d.gCap2L, -xi, yBel, -xd, 4.70);
        kalas(d.gCap2R,  xi, yBel,  xd, 4.70);
      } else if (v === 1) {
        // 2) esikli papyon: yerde alcak kalas - bacak da acilmak zorunda
        kalas(d.gCapL, -xd, 0.55, -xi, yBel);
        kalas(d.gCapR,  xd, 0.55,  xi, yBel);
        kalas(d.gCap2L, -xi, yBel, -xd, 4.40);
        kalas(d.gCap2R,  xi, yBel,  xd, 4.40);
        panel(d.gPanel, 0, YOL_GEN + 0.4, 0.55);
      } else {
        // 3) genis papyon: cevronlar daha yatik, ust aciklik daha genis
        kalas(d.gCapL, -xd, 0.0, -xi, yBel);
        kalas(d.gCapR,  xd, 0.0,  xi, yBel);
        kalas(d.gCap2L, -xi, yBel, -(xd + 0.5), 3.95);
        kalas(d.gCap2R,  xi, yBel,  (xd + 0.5), 3.95);
      }
      return;
    }
    return;
  }
  if (KARPUZ_MOD_AKTIF) {
    // Engelin govdesi (nota kutusu) bu modda GIZLI - engeli bu parcalar
    // kuruyor. Sebep: dort hareketin dordu de ayni kutunun olceklenmis hali
    // olamaz (4 Eyl dersi); burada dordu de bitkinin farkli bir parcasi.
    if (!gov) return;
    if (tip === 'hop' || tip === 'jump') {
      // YATAN KARPUZ SIRASI. Yolu bastan basa kapatiyor (yanindan gecilemez),
      // ama alcak: tepe 1,10 - kameranin (3,7) cok altinda, ust yuzu gorunuyor
      // ve "yerde duran hacim" okunuyor. Yuvarlaklik atlanabilirligi soyluyor.
      const r = 0.55, ad = 5, adim = (YOL_GEN - 0.6) / (ad - 1);
      for (let i = 0; i < ad; i++){
        const q = d.kTop[i];
        q.visible = true;
        const ol = r * (i % 2 ? 0.92 : 1.0);       // sira tekduze olmasin
        q.scale.set(ol * 1.12, ol, ol * 1.12);
        q.position.set(-(YOL_GEN - 0.6) / 2 + i * adim, ol, z);
        q.rotation.y = i * 1.1;                    // deterministik cesitleme
      }
      return;
    }
    if (tip === 'duck') {
      // ASMA DALI. Yaricap 0,44 -> alt yuz 3,86 (~1,44 m): kamera 3,7'de
      // oldugu icin altindan gecmek EGILMEYI zorunlu kiliyor. Bu sayi
      // 4 Eyl 2026'da olculerek bulundu, degistirilmiyor.
      d.kDal.visible = true;
      d.kDal.scale.set(0.44, YOL_GEN + 2.6, 0.44);
      d.kDal.position.set(0, 4.30, z);
      // Karpuzlar dalin USTUNDE oturuyor: altina asilsalardi gecis
      // yuksekligini dusurur ve engelin sozunu bozarlardi.
      const yerler = [[-2.15, 0.95], [2.05, 0.82]];
      for (let i = 0; i < 2; i++){
        const [x, r] = yerler[i];
        const q = d.kDalTop[i];
        q.visible = true;
        q.scale.set(r, r * 0.88, r);
        q.position.set(x, 4.30 + 0.44 + r * 0.80, z);
      }
      // Filizler: dali yukaridaki asmaya baglayan iki ince sap. Dal
      // boslukta asili kalmasin - 4 Eyl dersi ("onu tutan sey gorunmuyor").
      for (let i = 0; i < 2; i++){
        const x = i ? 3.5 : -3.5, boy = 7.0;
        const q = d.kFiliz[i];
        q.visible = true;
        q.scale.set(0.10, boy, 0.10);
        q.position.set(x, 4.30 + boy / 2, z);
      }
      return;
    }
    if (tip === 'wave_L' || tip === 'wave_R' || tip === 'reach_L' || tip === 'reach_R') {
      // YAPRAK PERDESI. Omuz/kol hizasinda (2,6-4,0) sarkiyor, yolu
      // kapatmiyor: hedef seridin uzerinde duruyor, kola deger ama govdeyi
      // durdurmaz. Adim engelinden (dilim) bicimi ve yuksekligiyle ayriliyor.
      // HAR-002'de bu engel reach_L/R'ye bagli: uzanma hareketinin fiziksel
      // sebebi yapragi ARALAMAK.
      const cx = gov.cx;
      d.kAski.visible = true;
      d.kAski.scale.set(0.12, 2.6, 0.12);
      d.kAski.position.set(cx, 4.12, z);
      for (let i = 0; i < 3; i++){
        const q = d.kYaprak[i];
        q.visible = true;
        q.scale.set(1.30, 1.55, 1);
        q.position.set(cx + (i - 1) * 0.86, 3.32 - (i % 2) * 0.14, z);
        q.rotation.z = (i - 1) * 0.22;
      }
      return;
    }
    if (tip === 'shimmy') {
      // DARALAN GECIT: iki yandan yolu daraltan karpuz yigini, ortada omuz
      // genisligi kadar bosluk. Hareketin fiziksel sebebi aradan omuz
      // sikistirarak gecmek - bu yuzden bosluk DAR (2,2 birim ~ 0,8 m) ama
      // kapali degil; kapali olsaydi dodge engeli olurdu.
      // Yiginlar gogus hizasina kadar: tepe 2,6 - kameranin (3,7) altinda,
      // yani uzerinden bakiliyor ve "yandan sikistiran kutle" okunuyor.
      const BOSLUK = 1.10;                    // yarim bosluk
      const dizi = [[0.95, 0.95], [1.25, 1.55], [0.85, 2.15]];
      for (let i = 0; i < 3; i++) {
        const [r, ofs] = dizi[i];
        for (const yon of [-1, 1]) {
          const q = d.kTop[i * 2 + (yon > 0 ? 1 : 0)];
          if (!q) continue;
          q.visible = true;
          q.scale.set(r * 1.10, r, r * 1.10);
          q.position.set(yon * (BOSLUK + ofs), r * 0.92, z + (i - 1) * 0.55);
          q.rotation.y = i * 1.7 + (yon > 0 ? 0.8 : 0);
        }
      }
      return;
    }
    // DODGE / yana adim: DIKINE DIKILMIS DEV DILIM.
    // Genislik gov.w'den geliyor - o genislik hedef seridi ACIK birakan
    // bosluktan hesaplaniyor ve DEGISTIRILMIYOR (buyutmek boslugu kapatir,
    // yon okunmaz olur; 3 Eyl 2026'da bir kez yasandi).
    // Derinlik 0,44 ve tepe 3,54: 4 Eyl olcumu - daha derin olursa genis ust
    // yuzu kameradan gorunuyor ve engel "yere serilmis rampa" gibi okunuyor.
    const TEPE = 3.54, DER = 0.44;
    d.kDilim.visible = true;
    d.kDilim.scale.set(gov.w, TEPE, DER);
    d.kDilim.position.set(gov.cx, TEPE / 2, z);
    // Kesik yuz kameraya bakiyor: dilimin ne oldugu bu yuzden okunuyor.
    // Karenin tek doygun mekan-disi yuzeyi burasi.
    d.kEt.visible = true;
    d.kEt.scale.set(gov.w * 0.97, TEPE * 0.95, 1);
    d.kEt.position.set(gov.cx, TEPE / 2, z + DER / 2 + 0.02);
    return;
  }
  if (DENIZ_MOD_AKTIF) {
    // Deniz: tasiyici VAR ama gar dili degil. Engel boslukta asili durmuyor -
    // referansta her engelin fiziksel bir sebebi var (madde 5).
    if (!gov) return;
    if (tip === 'duck') {
      // SARKAC: kiris iki ince halattan sarkiyor. Halatlar guvertenin
      // disina, bordurun otesine baglaniyor - nota koridorunu kapatmasin.
      d.kutuk.visible = true;
      // Tam yol genisligini koruyor ama silindirin kalinligi dusuruldu:
      // onceki 0.86 capi yakina geldiginde tum ekranin duvari oluyordu.
      d.kutuk.scale.set(0.40, gov.w * 0.90, 0.40);
      d.kutuk.position.set(gov.cx, gov.y, z);
      // Halatlar ilk surumde 0,10 kalinlikta ve DESTEK_KOYU rengindeydi;
      // koyu gokte hic okunmuyordu, ayrica 8,2'ye kadar cikip kadrajin
      // disina tasiyordu. Kalinlastirildi, kisaltildi, acik renge alindi.
      const yUst = 6.4, boy = Math.max(0.6, yUst - gov.y);
      for (const [p, x] of [[d.halatL, gov.cx - gov.w/2 + 0.20],
                            [d.halatR, gov.cx + gov.w/2 - 0.20]]) {
        p.visible = true;
        p.material = DESTEK_MAT;
        p.scale.set(0.16, boy, 0.16);
        p.position.set(x, gov.y + boy/2, z);
      }
    } else if (tip === 'hop') {
      // BARIYER KOLU: guverte hizasinda uzanan kol, tek ayakta oturuyor.
      // Ayak guvertenin KENARINDA, bordurun hemen icinde.
      const yon = gov.cx >= 0 ? 1 : -1;
      d.kolAyak.visible = true;
      d.kolAyak.scale.set(0.46, gov.y + gov.h/2 + 0.6, 0.46);
      d.kolAyak.position.set(yon * (YOL_GEN/2 - 0.45),
                             (gov.y + gov.h/2 + 0.6) / 2, z);
    } else if (tip === 'dodge_L' || tip === 'dodge_R') {
      // VARIL: guvertenin uzerinde duran dikey silindir. Kacilacak sey
      // havada suzulen bir levha degil, YERDE duran bir hacim.
      d.varil.visible = true;
      d.varil.scale.set(1.35, 1.9, 1.35);
      d.varil.position.set(gov.cx, 0.95, z);
    }
    return;
  }
  if (SEHIR_MOD_AKTIF) {
    if (!gov) return;
    const KX = 5.95, TAV = 9.2, GEN = 12.6;
    // CESIT: nota nesnesinin kimliginden turiyor. Deterministik - ayni
    // kare her render'da ayni cikiyor.
    const ces = g.id % 4;
    const yayici = () => {
      for (const [q, x] of [[d.yayiciL, -KX + 0.34], [d.yayiciR, KX - 0.34]]) {
        q.visible = true;
        q.scale.set(0.34, 0.34, 0.34);
        q.position.set(x, gov.y, z);
      }
    };
    const kapi = () => {                            // v0: tarama kapisi
      for (const [q, x] of [[d.kenarL, -KX], [d.kenarR, KX]]) {
        q.visible = true;
        q.scale.set(0.34, TAV, 0.62);
        q.position.set(x, TAV / 2, z);
      }
      d.neonBar.visible = true;
      d.neonBar.scale.set(GEN, 0.46, 0.66);
      d.neonBar.position.set(0, TAV - 0.25, z);
      d.onBar.visible = true;
      d.onBar.scale.set(GEN, 0.20, 0.66);
      d.onBar.position.set(0, 0.10, z);
    };
    const halka = () => {                           // v1: halka kapi
      d.halka.visible = true;
      d.halka.scale.set(6.5, 4.6, 6.5);
      d.halka.position.set(0, TAV / 2 - 0.4, z);
    };
    if (ces === 0) {
      kapi();
    } else if (ces === 1) {
      halka();
    } else if (ces === 2) {
      // Cue'ya gore kati oge: pano / plaka / kol
      if (tip === 'duck') {
        d.pano.visible = true;                      // tavandan inen ekran
        d.pano.scale.set(gov.w * 0.82, gov.h * 0.9, 0.12);
        d.pano.position.set(gov.cx, gov.y, z + 0.2);
        const yUst = TAV, boy = yUst - (gov.y + gov.h / 2);
        for (const [q, x] of [[d.askiL, gov.cx - gov.w * 0.3],
                              [d.askiR, gov.cx + gov.w * 0.3]]) {
          q.visible = true;
          q.scale.set(0.09, Math.max(0.2, boy), 0.09);
          q.position.set(x, gov.y + gov.h / 2 + boy / 2, z);
        }
      } else if (tip === 'hop' || tip === 'jump') {
        d.plaka.visible = true;                     // asfalttan kalkan plaka
        d.plaka.scale.set(gov.w * 0.9, Math.max(0.6, gov.h * 1.05), 0.12);
        d.plaka.position.set(gov.cx, gov.y, z + 0.2);
      } else {
        // Yon engeli: duvardan uzanan kol. Kapali tarafin duvarindan
        // geliyor - hangi duvardan girdigi gidilmeyecek tarafi soyluyor.
        const yon = gov.cx >= 0 ? 1 : -1;
        const uzunluk = Math.max(1.2, KX - Math.abs(gov.cx) + gov.w / 2);
        d.kol.visible = true;
        d.kol.scale.set(uzunluk, 0.42, 0.5);
        d.kol.position.set(yon * (KX - uzunluk / 2), TAV * 0.42, z);
      }
      kapi();
    } else {
      kapi(); halka();                              // v3: kapi + halka
    }
    yayici();
    return;
  }
  if (GOK_MOD_AKTIF && !SEHIR_MOD_AKTIF) {
    // Referansta engelin tasiyici yapisi YOK: kutuk de blok da boslukta
    // duruyor. Aski, direk, kaide, ust ray - hepsi gar dilinin parcasi.
    if (tip === 'duck' && gov) {
      d.kutuk.visible = true;
      d.kutuk.scale.set(0.92, gov.w * 0.86, 0.92);
      d.kutuk.position.set(gov.cx, gov.y, z);
    }
    return;
  }
  if (tip === 'duck'){
    // Kiris artik tavandan sarkiyor: iki dikey aski + ust kiris.
    const yTepe = 7.35;
    const yUst  = gov.y + gov.h / 2;
    const boy   = yTepe - yUst;
    const xA    = gov.w / 2 - 0.34;

      p.visible = true;
      p.scale.set(0.26, boy, 0.26);
      p.position.set(x, yUst + boy / 2, z);
    }
    d.tepe.visible = true;
    d.tepe.scale.set(gov.w + 0.7, 0.40, 0.50);
    d.tepe.position.set(gov.cx, yTepe + 0.20, z);
  } else if (tip === 'wave_L' || tip === 'wave_R'){
    // Yan bar TAVANDAN sarkiyor. Yerden direk cikarsa yolu kapatiyor gibi
    // okunur; oysa bu engelin sozu "serit degistirme, sadece uzan".
    const yTepe = 7.35;
    const yUst  = gov.y + gov.h / 2;
    const boy   = yTepe - yUst;
    for (const [p, x] of [[d.askiL, gov.cx - gov.w/2 + 0.30],
                          [d.askiR, gov.cx + gov.w/2 - 0.30]]){
      p.visible = true;

      p.position.set(x, yUst + boy / 2, z);
    }
    d.tepe.visible = true;
    d.tepe.scale.set(gov.w + 0.5, 0.30, 0.44);

function hareketKartDoku(tip, renk){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const kutu = (x,y,w,h,r) => { g.beginPath(); g.roundRect(x,y,w,h,r); g.fill(); };
  g.shadowColor = renk; g.shadowBlur = 30;
  g.fillStyle = 'rgba(255,255,255,0.95)';
  kutu(12, 12, 232, 232, 34);          // beyaz cerceve
  g.shadowBlur = 0;
  g.fillStyle = renk;
  kutu(22, 22, 212, 212, 27);          // doygun govde

  g.fillStyle = 'rgba(8,4,22,0.94)';
  g.strokeStyle = 'rgba(8,4,22,0.94)';
  g.save(); g.translate(128, 140);
  insanSimge(g, tip, 1.30, 17);
  g.restore();
  return new THREE.CanvasTexture(c);
}

// ONEMLI: 'Without Skin' dosyalarda SADECE iskelet var, cizilecek gÃ¶vde yok.
// Bu yuzden tek bir 'With Skin' dosya (siluet-govde.fbx) gÃ¶vdeyi saglar,
// digerlerinin animasyonlari ayni iskelet uzerinde calisir - butun Mixamo
// klipleri ayni kemik adlarini kullaniyor.
// idle DAHIL tum animasyonlar ayri klip dosyalarindan gelir.
// Govde dosyasinin kendi animasyonuna GUVENME - Mixamo bazen bos klip veriyor
// (Remy'de tam bu oldu: duration 0, hic track yok -> siluet T-pozunda kaldi).
const KLIP_ADLARI = ['idle','idle-breathing','step-left','step-right','jump',
                     'duck','dodge-right','punch','arms-up','jacks',
                     // dans ve isinma repertuari - koreografide cesitlilik icin
                     'jump-standing','side-to-side','twist-dance','charleston',
                     'running-man','kick-step','shimmy','raise-roof',
                     'arm-wave','arm-stretch','neck-roll',
                     // HAR-004 adaylari (16 Eyl 2026, MEK-004 BAL). Kural: ENGEL =
                     // HAREKETIN FIZIKSEL SEBEBI. alcak buz -> zipla, sacak -> egil,
                     // yarim levha -> acik tarafa, buz paneli -> iki elle it.
                     'standing-jump','box-jump','jump-up','ducking',
                     'long-left-side-step','push-start','pushing','push-pose'];
const klipler = {};
let siluet = null, mixer = null, kokKemik = null, kokBaslangic = null;

const govde = await yukle('siluet-govde');
if (govde) {
  // Siluet artik SAHNENIN ICINDE degil, sag taraftaki KUTUNUN icinde.
  // Kendi sahnesi ve kamerasi var; ayri render edilip 2B olarak panele
  // cizilecek. Boylece kontur (dis hat) verilebiliyor - duz siyah govde
  // kol/bacak birlesimlerinde tek kutle olup "eksik eklem" gibi goruunuyordu.
  govde.scale.setScalar(0.0125);
  govde.position.set(0, 0, 0);
  govde.rotation.y = 0;

  // maske icin BEYAZ - kontur ve dolgu 2B tarafta olusturulacak
  govde.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) {
      o.material = new THREE.MeshBasicMaterial({ color: '#ffffff', fog:false });
      o.frustumCulled = false;
    }
  });

  sahneSiluet.add(govde);
  siluet = govde;
  mixer = new THREE.AnimationMixer(govde);
  // kalca kemigi: klip oynatildiktan sonra yatay konumu buraya geri cekilir
  govde.traverse(o => { if (o.isBone && /hips/i.test(o.name) && !kokKemik) kokKemik = o; });
  if (kokKemik) kokBaslangic = kokKemik.position.clone();

  for (const ad of KLIP_ADLARI) {
    const o = await yukle(ad);
    const k = o && o.animations[0];
    if (k && k.tracks.length > 0) klipler[ad] = k;   // bos klipleri ele
  }
  // REMY HIZALAMASI (16 Eyl 2026). HAR-004 klipleri Mixamo'da Remy karakteriyle
  // indirildi; kalca (Hips) yuksekligi eski kutuphanenin karakterinden farkli.
  // Olculdu: siluet kutusunda figurun basi USTTEN TASIYORDU ve IoU doluluklari
  // %4-5'e dusuyordu (olcum yaniltici). Klibin ilk karesindeki kalca Y'si
  // idle'in ilk karesine hizalaniyor; ziplamanin GORELI yuksekligi aynen kaliyor.
  if (klipler['idle']) {
    const iz0 = klipler['idle'].tracks.find(t => /Hips\.position$/.test(t.name));
    for (const ad of ['standing-jump','box-jump','jump-up','ducking','long-left-side-step','push-start','pushing','push-pose']) {
      const k = klipler[ad]; if (!k || !iz0) continue;
      const iz = k.tracks.find(t => /Hips\.position$/.test(t.name)); if (!iz) continue;
      const dy = iz.values[1] - iz0.values[1];
      for (let j = 1; j < iz.values.length; j += 3) iz.values[j] -= dy;
    }
  }
  // PUSH-IT (16 Eyl 2026, ENG-004 buz paneli -> iki elle it). Mixamo'da yerinde
  // iki elle itme KLIBI yok; "Pushing With Both Hands" tek karelik POZ. Hareket
  // bu pozdan kuruluyor: idle'in ilk karesi -> itme pozu -> tutus -> idle.
  // Ara kareler smoothstep agirlikla slerp - kollar gercek bir itme gibi
  // hizlanip yavaslar, sert gecis yok. Veri tamamen Mixamo'dan, uydurma aci yok.
  if (klipler['push-pose'] && klipler['idle']) {
    const I = klipler['idle'], P = klipler['push-pose'];
    const T = [0.00, 0.14, 0.28, 0.42, 0.80, 1.18, 1.32, 1.46, 1.60];
    const W = [0.00, 0.16, 0.62, 1.00, 1.00, 1.00, 0.62, 0.16, 0.00];
    const izler = [];
    const qa = new THREE.Quaternion(), qb = new THREE.Quaternion(), qo = new THREE.Quaternion();
    for (const tp of P.tracks) {
      const ti = I.tracks.find(t => t.name === tp.name);
      if (!ti) continue;
      const n = tp.getValueSize();
      const va = ti.values.slice(0, n), vb = tp.values.slice(0, n);
      const deger = [];
      const quat = /quaternion/.test(tp.name);
      for (const w of W) {
        if (quat) {
          qa.fromArray(va); qb.fromArray(vb);
          qo.slerpQuaternions(qa, qb, w);
          deger.push(qo.x, qo.y, qo.z, qo.w);
        } else {
          for (let j = 0; j < n; j++) deger.push(va[j] + (vb[j] - va[j]) * w);
        }
      }
      const Tur = quat ? THREE.QuaternionKeyframeTrack : THREE.VectorKeyframeTrack;
      izler.push(new Tur(tp.name, T, deger));
    }
    klipler['push-it'] = new THREE.AnimationClip('push-it', 1.60, izler);
  }
}

// klipleri hedef sureye esnetip aksiyon olarak hazirla
const aksiyon = {};
// Hedef sureler tam sayi vurusa oturur -> hareket her zaman ritimde biter.
// Bu "keskinlik" hissini veren sey: yarim vurusta biten hareket sunepe durur.
// CUE'YA BAGLI klipler: hedef sure MUZIKAL olarak sabit. Bunlar bir vurusa
// tepki veriyor, o yuzden bir/iki vurusta bitmek zorundalar. Hepsinin dogal
// suresi zaten hedefe yakin (timeScale 0.63-1.25).
const HEDEF_SABIT = { 'idle':OLCU, 'idle-breathing':OLCU*2,
                      'step-left':VURUS*2, 'step-right':VURUS*2,
                      'jacks':VURUS*2, 'jump':OLCU, 'duck':OLCU,
                      'dodge-right':OLCU, 'punch':OLCU, 'arms-up':OLCU };
// EGZERSIZ klipleri (charleston, running-man, shimmy...) blok boyunca dongude
// oynuyor, bir vurusa tepki vermiyor. Onlarin hedefi klibin KENDI suresinden
// turetiliyor: en yakin tam olcu.
//
// Onceki halde bu 11 klibin hedefi elle tahmin edilmisti ve dogal sureleri
// olculmemisti. Sonuc felaketti: charleston 20,9 sn'lik bir klipti ve 2 sn'ye
// sikistiriliyordu - 10,5 kat hiz. shimmy 12 kat. Hicbir hareket anlasilmiyordu.
// Artik hesaplaniyor; timeScale 0,8-1,2 bandinda kaliyor.
const HEDEF_SURE = {};
function hedefSureHesapla(ad, sure){
  if (HEDEF_SABIT[ad] !== undefined) return HEDEF_SABIT[ad];
  return Math.max(1, Math.round(sure / OLCU)) * OLCU;
}
if (mixer) {
  for (const [ad, klip] of Object.entries(klipler)) {
    const hedef = hedefSureHesapla(ad, klip.duration);
    HEDEF_SURE[ad] = hedef;
    const a = mixer.clipAction(klip);
    a.setLoop(THREE.LoopRepeat, Infinity);
    a.timeScale = klip.duration / hedef;
    aksiyon[ad] = { a, klip, hedef };
  }
  // DONGUYE GORE YENIDEN HIZALAMA. n.bas yukarida hesaplandi ama orada klip
  // sureleri henuz bilinmiyordu (klipler async yukleniyor). TEPE_FAZI degeri
  // KLIBIN TAMAMINA gore yazilmis; dongu icindeki karsiligi farkli.
  // Ornek: charleston tepe 0,30 -> 6,27 sn; dongu 2,61 sn oldugu icin
  // dongu ici karsiligi (6,27 mod 2,61)/2,61 = 0,40.
  for (const n of NOTALAR) {
    const A = aksiyon[n.klip];
    const dongu = KLIP_DONGU[n.klip];
    if (!A || !dongu || !n.pencere) continue;
    const dur = A.klip.duration;
    const tekrar = Math.max(1, Math.round(n.pencere / dongu));
    const payTam = (TEPE_FAZI[n.klip] !== undefined) ? TEPE_FAZI[n.klip] : ONALMA_PAY;
    let payDongu = ((payTam * dur) % dongu) / dongu;
    if (CUE_DONGU_FAZ[n.tip] !== undefined) payDongu = CUE_DONGU_FAZ[n.tip];
    // Pencerede 'tekrar' adet dongu var; tepe bunlardan hangisine denk
    // gelirse [0,25-0,76] bandina giren ilki secilir.
    let pay = null;
    for (let k = 0; k < tekrar; k++) {
      const c = (payDongu + k) / tekrar;
      if (c >= 0.25 && c <= 0.76) { pay = c; break; }
    }
    if (pay === null) pay = Math.min(0.76, Math.max(0.25, payDongu / tekrar));
    n.bas = n.t - pay * n.pencere;
    n.tekrar = tekrar;
  }
}
